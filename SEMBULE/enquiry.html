<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#04592A"><meta name="description" content="Tell Sembule Media about your event or production."><title>Plan your production | Sembule Media</title><link rel="icon" href="./assets/brand/mark.png"><link rel="stylesheet" href="./styles.css"><script type="module" src="./public-enquiry.js"></script></head><body class="public-page"><main class="enquiry-shell"><header><a href="./enquiry.html"><img src="./assets/brand/logo.png" alt="Sembule Media"></a><p>PLAN WITH CLARITY. CREATE WITH CONFIDENCE.</p></header><section class="enquiry-intro"><p class="eyebrow">TELL US WHAT YOU ARE PLANNING</p><h1>Let’s shape your production.</h1><p>Share the essentials below. The Sembule Media team will contact you to confirm availability, scope and next steps.</p></section><form id="public-enquiry-form" class="public-form"><label>Full name<input name="name" required maxlength="160" autocomplete="name"></label><label>Phone number<input name="phone" required maxlength="80" autocomplete="tel"></label><label>Email address <small>Optional</small><input name="email" type="email" maxlength="320" autocomplete="email"></label><label>Service<select name="service" required><option value="">Choose a service</option><option>Livestream</option><option>Sound / PA</option><option>Podcast</option><option>Photography</option><option>Videography</option><option>Documentary</option><option>65-inch TV display hire</option><option>Other</option></select></label><label>Event date <small>Optional</small><input name="event_date" type="date"></label><label>Venue <small>Optional</small><input name="venue" maxlength="240"></label><label>Expected audience <small>Optional</small><input name="audience_size" type="number" min="1" max="1000000"></label><label>Budget guidance <small>Optional and private</small><input name="budget" maxlength="1000" placeholder="For example, UGX 2,000,000"></label><label class="span-2">What do you need?<textarea name="message" rows="5" required maxlength="5000" placeholder="Tell us about the event, coverage, equipment or delivery you need."></textarea></label><label class="website-field" aria-hidden="true">Website<input name="honeypot" tabindex="-1" autocomplete="off"></label><div class="span-2 public-submit"><button class="button primary" type="submit">Send enquiry</button><p id="enquiry-status" role="status"></p></div></form><footer><span>Sembule Media Ltd</span><span>We will confirm availability after reviewing your enquiry.</span></footer></main></body></html>
