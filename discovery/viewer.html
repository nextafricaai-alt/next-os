<main id="main"><section class="login"><span class="eyebrow">NEXT team access</span><h1>Welcome back.</h1><p class="muted">Sign in to review discovery submissions and download client documents.</p><form id="login"><label for="email">Email address</label><input type="email" id="email" autocomplete="username" required><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required><button type="submit" style="width:100%;margin-top:24px" id="login-button">Sign in →</button></form><p id="login-error" class="error" role="alert"></p><p class="muted">Access is limited to approved NEXT accounts. Ask your project administrator if you need an account or password reset.</p></section></main><div class="print-area" id="print-area"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let session=null,page=0,current=null,rows=[],fileRecords=[],expiryTimer=null,loadVersion=0;
const loginHTML=$('#main').innerHTML;
const configured=()=>/^https:\/\/[a-z0-9.-]+$/.test(CONFIG.supabaseUrl)&&!CONFIG.supabaseAnonKey.includes('[');
async function api(path,options={}){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),30000);try{const r=await fetch(CONFIG.supabaseUrl+path,{...options,headers:{apikey:CONFIG.supabaseAnonKey,...((session?.access_token||CONFIG.supabaseAnonKey.startsWith('eyJ'))?{Authorization:'Bearer '+(session?.access_token||CONFIG.supabaseAnonKey)}:{}),...options.headers},signal:controller.signal});if(!r.ok){if(r.status===401&&session){await logout(false);throw Error('Your session expired. Please sign in again.');}throw Error(r.status===403?'Your account is not allowed to access this information.':'The request could not be completed. Please check your details or connection.');}return r;}finally{clearTimeout(timeout);}}
async function logout(remote=true){const token=session?.access_token;session=null;current=null;rows=[];fileRecords=[];loadVersion++;clearTimeout(expiryTimer);$('#print-area').innerHTML='';$('#logout').hidden=true;$('#main').innerHTML=loginHTML;if(remote&&token&&configured()){try{await fetch(CONFIG.supabaseUrl+'/auth/v1/logout',{method:'POST',headers:{apikey:CONFIG.supabaseAnonKey,Authorization:'Bearer '+token}});}catch(e){/* In-memory credentials have already been removed. */}}}
function shell(){$('#logout').hidden=false;$('#main').innerHTML=`<div class="bar"><div><span class="eyebrow">Listen first. Build better.</span><h1>Client discovery.</h1><p class="muted">Private answers, ready for the next conversation.</p></div><button class="secondary" id="refresh">Refresh inbox</button></div><div class="layout"><aside class="inbox"><div class="inbox-title"><strong>Latest submissions</strong><div class="muted">30 per page · newest first</div></div><div id="list"></div><div class="pager"><button class="secondary" id="previous">← Newer</button><button class="secondary" id="next">Older →</button></div></aside><section class="detail" id="detail"><div class="empty">Choose a submission to see its answers.</div></section></div><p id="message" role="status"></p><p class="muted">For privacy, this viewer signs out after 20 minutes. Downloads remain on your device.</p>`;}
function say(s){const el=$('#message')||$('#login-error');if(el)el.textContent=s;}
async function load(){const version=++loadVersion;try{say('Loading submissions…');const r=await api('/rest/v1/discovery_submissions?select=id,created_at,client_company,contact_name,contact_email,status&order=created_at.desc&limit=30&offset='+page*30);const data=await r.json();if(version!==loadVersion||!session)return;rows=data;$('#list').innerHTML=rows.length?rows.map(r=>`<button class="submission" data-id="${esc(r.id)}" ${current?.id===r.id?'aria-current="true"':''}><strong>${esc(r.client_company)}</strong>${esc(r.contact_name)}<small>${esc(new Date(r.created_at).toLocaleString('en-GB'))} · ${esc(r.status)}</small></button>`).join(''):'<p class="muted" style="padding:18px">No submissions on this page.</p>';$('#previous').disabled=page===0;$('#next').disabled=rows.length<30;say('');}catch(e){say(e.message);}}
function valueHTML(a){if(a.type==='file'&&Array.isArray(a.value)){return a.value.length?a.value.map(f=>{const index=fileRecords.push(f)-1;return `<button class="file" data-file="${index}">↓ ${esc(f.name)} <small>(${(Number(f.size||0)/1024/1024).toFixed(1)} MB)</small></button>`;}).join(''):'No file added';}if(a.value===null||a.value===''||Array.isArray(a.value)&&!a.value.length)return '<span class="muted">To discuss on the call</span>';if(typeof a.value==='boolean')return a.value?'Agreed':'Not agreed';if(Array.isArray(a.value)){if(a.type==='rows')return a.value.map(r=>`<div class="row">${Object.entries(r||{}).map(([k,v])=>`<strong>${esc(k)}:</strong> ${esc(typeof v==='object'?JSON.stringify(v):v)}`).join('<br>')}</div>`).join('');return a.value.map((v,i)=>(a.type==='rank'?(i+1)+'. ':'')+esc(v)).join(a.type==='rank'?'<br>':' · ');}return esc(typeof a.value==='object'?JSON.stringify(a.value,null,2):a.value);}
function detailHTML(r){fileRecords=[];const ss=Array.isArray(r.answers?.sections)?r.answers.sections:[];return `<div class="meta"><span class="eyebrow">${esc(r.status)} · ${esc(new Date(r.created_at).toLocaleDateString('en-GB'))}</span><h2>${esc(r.client_company)}</h2><p>${esc(r.contact_name)} · ${esc(r.contact_email)}</p><p>${esc(r.contact_phone)}</p><p style="font-size:11px;margin-top:18px">Reference: ${esc(r.id)}</p></div><div class="bar" style="margin-top:20px"><button class="secondary" id="print">Print / save PDF</button><button class="secondary" id="export">Download answers</button></div>${ss.map(s=>`<section class="section"><h3>${esc(s.title)}</h3><dl>${(Array.isArray(s.answers)?s.answers:[]).map(a=>`<div class="answer"><dt>${esc(a.label)}</dt><dd>${valueHTML(a)}</dd></div>`).join('')}</dl></section>`).join('')}`;}
async function select(id){const version=++loadVersion;try{say('Opening submission…');const r=await api('/rest/v1/discovery_submissions?id=eq.'+encodeURIComponent(id)+'&select=*&limit=1');const data=await r.json();if(version!==loadVersion||!session)return;if(!data.length)throw Error('This submission is no longer available.');current=data[0];$('#detail').innerHTML=detailHTML(current);document.querySelectorAll('[data-id]').forEach(n=>n.setAttribute('aria-current',String(n.dataset.id===id)));say('');}catch(e){say(e.message);}}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name.replace(/[\/\\]/g,'_');a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('submit',async e=>{if(e.target.id!=='login')return;e.preventDefault();const err=$('#login-error');if(!configured()){err.textContent='Finish the Supabase setup in this file before signing in.';return;}$('#login-button').disabled=true;err.textContent='Signing in…';try{const r=await api('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});session=await r.json();$('#password').value='';const check=await api('/rest/v1/discovery_admins?select=user_id&user_id=eq.'+encodeURIComponent(session.user.id));const admins=await check.json();if(!admins.length){await logout();throw Error('This account has not been approved for the NEXT discovery inbox.');}expiryTimer=setTimeout(()=>logout(),Math.min(20*60*1000,Math.max(1000,(session.expires_in-30)*1000)));page=0;shell();await load();}catch(e){if(session)await logout();$('#login-error').textContent=e.message;$('#login-button').disabled=false;}});
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;if(t.id==='logout')return logout();if(t.id==='refresh')return load();if(t.id==='next'){page++;return load();}if(t.id==='previous'){page=Math.max(0,page-1);return load();}if(t.dataset.id)return select(t.dataset.id);if(t.id==='print'&&current){$('#print-area').innerHTML=$('#detail').innerHTML;$('#print-area').querySelector('.bar')?.remove();window.print();}if(t.id==='export'&&current)downloadBlob(new Blob([JSON.stringify(current,null,2)],{type:'application/json'}),'NEXT-'+current.id+'.json');if(t.dataset.file&&current||t.dataset.file==='0'&&current){const f=fileRecords[Number(t.dataset.file)];if(!f||typeof f.path!=='string'||!f.path.startsWith(current.id+'/')||!/^[-a-f0-9]{36}\/[-a-f0-9]{36}\.(png|jpe?g|webp|gif|svg|pdf|docx?|xlsx?|csv)$/i.test(f.path)){say('This file path is not valid. Check it in Supabase Storage.');return;}t.disabled=true;try{say('Downloading '+f.name+'…');const r=await api('/storage/v1/object/authenticated/discovery-uploads/'+f.path);const blob=await r.blob();if(!session)return;downloadBlob(blob,f.name);say('Download started.');}catch(e){say(e.message);}finally{t.disabled=false;}}});
</script></body></html>
