                fontSize: 10.5, fontFamily: T.mono, fontWeight: 600, letterSpacing: '0.05em',
              }}>
                <div></div>
                <div></div>
                <div>CHILD · GUARDIAN</div>
                <div>STREAM</div>
                <div>ATTENDANCE · WK</div>
                <div>FEES</div>
                <div style={{ textAlign: 'right' }}>LAST SEEN</div>
                <div style={{ textAlign: 'right' }}>ID</div>
                <div></div>
              </div>
              <div style={{ flex: 1, overflow: 'auto' }}>
                {rows.map((s, i) => (
                  <StudentRow key={s.id} s={s} idx={i} selected={s.id === selectedId}
                    onClick={(st) => { setSelectedId(st.id); setDrawerOpen(true); }} />
                ))}
                <div style={{ padding: '20px 22px', fontSize: 11.5, color: T.ink3, fontFamily: T.mono, textAlign: 'center' }}>
                  Showing {rows.length} of {(D.students || []).length}
                </div>
              </div>
              {/* bulk action bar */}
              <div style={{
                padding: '12px 22px', borderTop: '1px solid ' + T.border, background: T.surface,
                display: 'flex', alignItems: 'center', gap: 12,
              }}>
                <Pill tone="brand">1 selected</Pill>
                <div style={{ display: 'flex', gap: 6 }}>
                  <button style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, padding: '6px 12px', borderRadius: 7, fontSize: 12, cursor: 'pointer' }}>Send WhatsApp</button>
                  <button style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, padding: '6px 12px', borderRadius: 7, fontSize: 12, cursor: 'pointer' }}>Generate report</button>
                  <button onClick={() => window.peakExportRoster && window.peakExportRoster()} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, padding: '6px 12px', borderRadius: 7, fontSize: 12, cursor: 'pointer' }}>Export CSV</button>
                </div>
                <div style={{ flex: 1 }} />
                <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono }}>{rows.filter(s => s.flag === 'risk').length} at-risk in current view</div>
              </div>
            </div>
            {drawerOpen && <Drawer s={selected} onClose={() => setDrawerOpen(false)} onOpenProfile={onOpenProfile} />}
          </div>
        </main>
      </div>
    );
  }

  return { Students };
})();

window.PD_Students = PD_Students;

  </script>
  <script type="text/babel" data-src="src/v4-profile.jsx">
/* src/v4-profile.jsx */
/* global React, PEAK, V4 */
// Peak Dark · Student profile deep dive
// Student profile — loads the real child by id.

const PD_Profile = (function () {
  const T = window.V4.T;
  const D = window.PEAK;
  const { useState } = React;

  function Rail({ active, onNav }) {
    const items = [
      { k: 'dash', glyph: '◫' }, { k: 'today', glyph: '◉' },
      { k: 'stud', glyph: '☰' }, { k: 'attn', glyph: '◐' },
      { k: 'fees', glyph: '⌗' }, { k: 'comm', glyph: '◊' }, { k: 'teach', glyph: '◇' },
    ];
    return (
      <aside style={{
        width: 72, background: T.bg, borderRight: '1px solid ' + T.border,
        display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '14px 0', flexShrink: 0,
      }}>
        <div style={{ width: 40, height: 40, borderRadius: 10, background: '#fff', display: 'grid', placeItems: 'center', marginBottom: 18 }}>
          <img src="/prototypes/schools/peak-primary/assets/peak-logo.png" alt="" style={{ width: 34, height: 34, objectFit: 'contain' }} />
        </div>
        {items.map(n => {
          const a = active === n.k;
          return (
            <button key={n.k} onClick={() => onNav && onNav(n.k)} style={{
              width: 48, height: 44, borderRadius: 10, border: 'none',
              background: a ? T.surface2 : 'transparent', color: a ? T.red : T.ink3,
              fontSize: 18, cursor: 'pointer', marginBottom: 4, position: 'relative',
              display: 'grid', placeItems: 'center',
            }}>
              {a && <span style={{ position: 'absolute', left: -8, top: 10, bottom: 10, width: 3, background: T.red, borderRadius: 999 }} />}
              {n.glyph}
            </button>
          );
        })}
        <div style={{ flex: 1 }} />
        <div style={{ width: 32, height: 32, borderRadius: 999, background: T.gold, color: T.bg, display: 'grid', placeItems: 'center', fontSize: 11, fontWeight: 700 }}>SM</div>
      </aside>
    );
  }

  function Pill({ children, tone }) {
    const map = {
      good: { bg: T.goodSft, fg: T.good },
      warn: { bg: T.warnSft, fg: T.warn },
      bad:  { bg: T.redSft,  fg: T.redInk },
      brand:{ bg: 'rgba(58,79,156,0.30)', fg: '#a8b4e8' },
      neutral: { bg: T.surface2, fg: T.ink2 },
    }[tone];
    return <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11, fontWeight: 600,
      padding: '3px 9px', borderRadius: 999, background: map.bg, color: map.fg,
      fontFamily: T.mono, letterSpacing: '0.02em',
    }}>{children}</span>;
  }

  function Card({ children, title, eyebrow, action, pad = 20 }) {
    return (
      <div style={{ background: T.surface, border: '1px solid ' + T.border, borderRadius: 12, padding: pad }}>
        {(title || eyebrow) && (
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 14 }}>
            <div>
              {eyebrow && <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', fontWeight: 600, marginBottom: 4 }}>{eyebrow}</div>}
              {title && <div style={{ fontSize: 14, color: T.ink, fontWeight: 600 }}>{title}</div>}
            </div>
            {action}
          </div>
        )}
        {children}
      </div>
    );
  }

  function ProfileNotes({ studentId }) {
    const [notes, setNotes] = React.useState(null);
    React.useEffect(() => {
      const sb = window.NextSession && window.NextSession.sb;
      if (!sb || studentId == null) { setNotes([]); return; }
      let live = true;
      sb.from('student_health_records').select('id, category, severity, description, recorded_at, follow_up_needed, resolved_at').eq('student_id', studentId).order('recorded_at', { ascending: false }).limit(50).then(function (r) { if (live) setNotes((r && r.data) || []); }).catch(function () { if (live) setNotes([]); });
      return function () { live = false; };
    }, [studentId]);
    const catColor = function (c) { return ({ illness: T.red, injury: T.gold, wellbeing: T.blue, behavior: T.green, behaviour: T.green }[c] || T.ink3); };
    const fmt = function (d) { try { return new Date(d).toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' \u00b7 ' + new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
    return (
      <Card eyebrow="NOTES & LOGS" title="Teacher notes" action={<Pill tone="brand">{notes ? notes.length : '\u2026'}</Pill>}>
        {notes === null ? <div style={{ color: T.ink3, fontSize: 12.5 }}>Loading\u2026</div> :
          notes.length === 0 ? <div style={{ color: T.ink3, fontSize: 12.5, lineHeight: 1.5 }}>No notes logged for this student yet. When a teacher logs a wellbeing, behaviour or health note, it appears here automatically.</div> : (
            <div style={{ display: 'grid', gap: 10, maxHeight: 300, overflow: 'auto' }}>
              {notes.map(function (h, i) { return (
                <div key={h.id || i} style={{ borderLeft: '3px solid ' + catColor(h.category), background: T.bg, borderRadius: 8, padding: '10px 12px', opacity: h.resolved_at ? 0.6 : 1 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8 }}>
                    <span style={{ fontSize: 10, fontFamily: T.mono, color: catColor(h.category), textTransform: 'uppercase', fontWeight: 700 }}>{h.category}{h.severity ? (' \u00b7 ' + h.severity) : ''}</span>
                    <span style={{ fontSize: 10, color: T.ink4, fontFamily: T.mono }}>{fmt(h.recorded_at)}</span>
                  </div>
                  <div style={{ fontSize: 12.5, color: T.ink2, marginTop: 5, lineHeight: 1.45 }}>{h.description}</div>
                  {(h.follow_up_needed && !h.resolved_at) ? <div style={{ fontSize: 10.5, color: T.gold, marginTop: 4 }}>\u2691 follow-up needed</div> : (h.resolved_at ? <div style={{ fontSize: 10.5, color: T.good, marginTop: 4 }}>\u2713 resolved</div> : null)}
                </div>
              ); })}
            </div>
          )}
      </Card>
    );
  }

  // ── More actions: transfer class/stream, change combination (A-level), edit ──
  function StudentActionsMenu({ stu, onUpdated }) {
    const [open, setOpen] = React.useState(false);
    const [modal, setModal] = React.useState(null);   // 'transfer' | 'combo' | 'edit'
    const [busy, setBusy] = React.useState(false);
    const cfg = window.SCHOOL_CONFIG || {};
    const classes = cfg.classes || [];
    const combos = cfg.combinations || [];
    const vocab = cfg.vocab || {};
    const unit = (vocab.unit || 'Class');
    const isALevel = combos.length > 0 && /s5|s6|year|senior\s*5|senior\s*6/i.test(stu.stream || '');
    const sb = window.NextSession && window.NextSession.sb;
    const [val, setVal] = React.useState({ stream: stu.stream || '', combination: stu.combination || '', name: stu.name || '', guardian: stu.guardian || '', phone: stu.guardianPhone || '' });
    React.useEffect(() => { setVal({ stream: stu.stream || '', combination: stu.combination || '', name: stu.name || '', guardian: stu.guardian || '', phone: stu.guardianPhone || '' }); }, [stu.id]);

    const apply = async (dbFields, localApply, label) => {
      if (!sb || stu.id == null) { window.peakToast && window.peakToast('Not connected to the database', 'info', 'Sign in to the school to make changes.'); return; }
      setBusy(true);
      try {
        const r = await sb.from('students').update(dbFields).eq('id', stu.id);
        if (r && r.error) throw r.error;
        localApply();
        if (window.peakStore && window.peakStore.notify) { try { window.peakStore.notify(); } catch (e) {} }
        window.peakToast && window.peakToast(label, 'success', stu.name);
        setModal(null); setOpen(false);
        if (onUpdated) onUpdated();
      } catch (e) { window.peakToast && window.peakToast('Could not update', 'info', String((e && e.message) || e)); }
      setBusy(false);
    };

    const ov = { position: 'fixed', inset: 0, zIndex: 9200, background: 'rgba(5,8,22,0.72)', backdropFilter: 'blur(6px)', display: 'grid', placeItems: 'center', padding: 20 };
    const card = { width: '100%', maxWidth: 440, background: T.surface, border: '1px solid ' + T.border, borderRadius: 16, padding: 22, color: T.ink, fontFamily: T.font };
    const inp = { width: '100%', background: T.bg, border: '1px solid ' + T.border, borderRadius: 9, padding: '10px 12px', fontSize: 13, color: T.ink, fontFamily: T.font, outline: 'none', boxSizing: 'border-box' };
    const lbl = { fontSize: 11, color: T.ink3, fontFamily: T.mono, marginBottom: 5 };
    const item = (label, sub, fn) => <button onClick={fn} style={{ display: 'block', width: '100%', textAlign: 'left', background: 'transparent', border: 'none', borderBottom: '1px solid ' + T.border, padding: '11px 14px', cursor: 'pointer', color: T.ink }}><div style={{ fontSize: 13, fontWeight: 600 }}>{label}</div><div style={{ fontSize: 11, color: T.ink3, marginTop: 2 }}>{sub}</div></button>;

    return (
      <div style={{ position: 'relative', display: 'inline-block' }}>
        <button onClick={() => setOpen(v => !v)} style={{ background: 'transparent', color: T.ink3, border: 'none', padding: '9px 12px', fontSize: 16, cursor: 'pointer' }}>{'\u22EF'}</button>
        {open && (
          <div style={{ position: 'absolute', right: 0, top: '100%', marginTop: 4, width: 250, background: T.surface, border: '1px solid ' + T.border, borderRadius: 12, boxShadow: '0 14px 34px rgba(0,0,0,0.5)', zIndex: 50, overflow: 'hidden' }}>
            {item('Transfer ' + unit.toLowerCase(), 'Move to another ' + unit.toLowerCase() + ' / stream', () => { setVal(v => ({ ...v, stream: stu.stream || (classes[0] || '') })); setModal('transfer'); })}
            {isALevel && item('Change combination', 'A-Level subject combination', () => { setVal(v => ({ ...v, combination: stu.combination || '' })); setModal('combo'); })}
            {item('Edit details', 'Name, guardian, phone', () => { setVal({ stream: stu.stream || '', combination: stu.combination || '', name: stu.name || '', guardian: stu.guardian || '', phone: stu.guardianPhone || '' }); setModal('edit'); })}
            <button onClick={() => setOpen(false)} style={{ display: 'block', width: '100%', textAlign: 'left', background: 'transparent', border: 'none', padding: '10px 14px', cursor: 'pointer', color: T.ink3, fontSize: 12.5 }}>Cancel</button>
          </div>
        )}

        {modal === 'transfer' && (
          <div style={ov} onClick={() => setModal(null)}>
            <div style={card} onClick={e => e.stopPropagation()}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 4 }}>Transfer {stu.name}</div>
              <div style={{ fontSize: 12.5, color: T.ink3, marginBottom: 16 }}>Currently in <b>{stu.stream || '—'}</b>. Choose the new {unit.toLowerCase()}.</div>
              <div style={lbl}>{unit.toUpperCase()} / STREAM</div>
              <select style={inp} value={val.stream} onChange={e => setVal(v => ({ ...v, stream: e.target.value }))}>
                {(classes.length ? classes : [stu.stream]).map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 18 }}>
                <button onClick={() => setModal(null)} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 9, padding: '9px 16px', fontSize: 13, cursor: 'pointer' }}>Cancel</button>
                <button onClick={() => apply({ stream: val.stream }, () => { stu.stream = val.stream; }, 'Transferred to ' + val.stream)} disabled={busy || val.stream === stu.stream} style={{ background: T.red, color: '#fff', border: 'none', borderRadius: 9, padding: '9px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>{busy ? 'Saving…' : 'Transfer'}</button>
              </div>
            </div>
          </div>
        )}

        {modal === 'combo' && (
          <div style={ov} onClick={() => setModal(null)}>
            <div style={card} onClick={e => e.stopPropagation()}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 4 }}>Change combination</div>
              <div style={{ fontSize: 12.5, color: T.ink3, marginBottom: 16 }}>{stu.name} · {stu.stream}. Current: <b>{stu.combination || '— none —'}</b></div>
              <div style={lbl}>A-LEVEL COMBINATION</div>
              <select style={inp} value={val.combination} onChange={e => setVal(v => ({ ...v, combination: e.target.value }))}>
                <option value="">— none —</option>
                {combos.map(c => <option key={c.name} value={c.name}>{c.name}{(c.subjects && c.subjects.length) ? (' · ' + c.subjects.join('/')) : ''}</option>)}
              </select>
              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 18 }}>
                <button onClick={() => setModal(null)} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 9, padding: '9px 16px', fontSize: 13, cursor: 'pointer' }}>Cancel</button>
                <button onClick={() => apply({ combination: val.combination || null }, () => { stu.combination = val.combination; }, 'Combination set to ' + (val.combination || 'none'))} disabled={busy} style={{ background: T.red, color: '#fff', border: 'none', borderRadius: 9, padding: '9px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>{busy ? 'Saving…' : 'Save'}</button>
              </div>
            </div>
          </div>
        )}

        {modal === 'edit' && (
          <div style={ov} onClick={() => setModal(null)}>
            <div style={card} onClick={e => e.stopPropagation()}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 16 }}>Edit {stu.name}</div>
              <div style={{ display: 'grid', gap: 12 }}>
                <label><div style={lbl}>FULL NAME</div><input style={inp} value={val.name} onChange={e => setVal(v => ({ ...v, name: e.target.value }))} /></label>
                <label><div style={lbl}>GUARDIAN NAME</div><input style={inp} value={val.guardian} onChange={e => setVal(v => ({ ...v, guardian: e.target.value }))} /></label>
                <label><div style={lbl}>GUARDIAN PHONE</div><input style={inp} value={val.phone} onChange={e => setVal(v => ({ ...v, phone: e.target.value }))} placeholder="+256 7..." /></label>
              </div>
              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 18 }}>
                <button onClick={() => setModal(null)} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 9, padding: '9px 16px', fontSize: 13, cursor: 'pointer' }}>Cancel</button>
                <button onClick={() => apply({ name: val.name.trim(), guardian_name: val.guardian.trim(), guardian_phone: val.phone.replace(/[^0-9+]/g, '') }, () => { stu.name = val.name.trim(); stu.guardian = val.guardian.trim(); stu.guardianPhone = val.phone.trim(); }, 'Details updated')} disabled={busy || !val.name.trim()} style={{ background: T.red, color: '#fff', border: 'none', borderRadius: 9, padding: '9px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>{busy ? 'Saving…' : 'Save changes'}</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  function Profile({ embed = false, onNav, onBack, studentId } = {}) {
    const [tab, setTab] = useState('Overview');
    const [, _forceP] = React.useReducer(n => n + 1, 0);
    const tabs = ['Overview','Attendance','Academics','Behaviour','Fees','Comms'];

    // The REAL child this profile is for (looked up by id) — never the demo.
    const _all = (window.__TEACHER_STUDENTS && window.__TEACHER_STUDENTS.length) ? window.__TEACHER_STUDENTS : ((window.PEAK && window.PEAK.students) || []);
    const stu = _all.find(x => String(x.id) === String(studentId)) || {};
    const stuName = stu.name || 'Student';
    const stuStream = stu.stream || '';
    const stuGuardian = stu.guardian || '—';
    const stuPhone = stu.guardianPhone || '';
    const stuInitials = (stuName.match(/\b[A-Za-z]/g) || ['S']).slice(0, 2).join('').toUpperCase();
    const stuBalance = Number(stu.balance) || 0;
    const stuAttWk = (stu.attendanceWk == null) ? null : stu.attendanceWk;
    const stuLastSeen = stu.lastSeen || '—';
    const isRisk = stu.flag === 'risk';
    const isTop = stu.flag === 'top';

    return (
      <div style={{
        width: embed ? '100%' : 1440, height: embed ? '100%' : 900,
        display: 'flex', background: T.bg, color: T.ink,
        fontFamily: T.font, fontSize: 13, overflow: 'hidden',
      }}>
        {!embed && <Rail active="stud" onNav={onNav} />}

        <main style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
          {/* breadcrumb */}
          <div style={{ padding: '16px 32px 0', display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, color: T.ink3 }}>
            <span style={{ cursor: 'pointer' }} onClick={() => onBack ? onBack() : (onNav && onNav('stud'))}>Students</span>
            <span style={{ color: T.ink4 }}>›</span>
            <span style={{ cursor: 'pointer' }}>{stuStream}</span>
            <span style={{ color: T.ink4 }}>›</span>
            <span style={{ color: T.ink }}>{stuName}</span>
          </div>

          {/* hero header */}
          <div style={{
            padding: '20px 32px 22px',
            background: 'linear-gradient(135deg, ' + T.bg + ' 0%, rgba(226,58,82,0.06) 100%)',
            borderBottom: '1px solid ' + T.border,
          }}>
            <div style={{ display: 'flex', gap: 20, alignItems: 'center' }}>
              <div style={{
                width: 84, height: 84, borderRadius: 18, background: 'linear-gradient(135deg, ' + T.navyLite + ' 0%, ' + T.surface3 + ' 100%)',
                color: '#fff', display: 'grid', placeItems: 'center', fontSize: 26, fontWeight: 700, letterSpacing: '-0.02em',
                border: '1px solid ' + T.borderStr, flexShrink: 0,
              }}>{stuInitials}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, marginBottom: 6 }}>
                  <div style={{ fontSize: 30, fontWeight: 700, color: T.ink, letterSpacing: '-0.025em' }}>{stuName}</div>
                  {isRisk ? <Pill tone="bad">● AT-RISK</Pill> : isTop ? <Pill tone="good">● TOP</Pill> : null}
                  {stuStream ? <Pill tone="brand">{stuStream}</Pill> : null}
                </div>
                <div style={{ display: 'flex', gap: 18, fontSize: 12.5, color: T.ink3, fontFamily: T.mono, flexWrap: 'wrap' }}>
                  <span>ID #{stu.id != null ? stu.id : '—'}</span>
                  <span>Guardian: {stuGuardian}</span>
                  <span>{stuPhone || 'no phone on file'}</span>
                </div>
                <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
                  <button onClick={() => window.peakToast && window.peakToast('Reminder noted', 'success', 'Follow up with ' + stuGuardian + ' regarding ' + stuName.split(' ')[0] + '.')} style={{ background: T.red, color: '#fff', border: 'none', padding: '9px 16px', borderRadius: 9, fontSize: 12.5, fontWeight: 600, cursor: 'pointer' }}>Schedule director call</button>
                  <button onClick={() => window.peakWhatsApp((stuPhone || '').replace(/[^0-9]/g,''), 'Hello ' + stuGuardian + ', a message from ' + window.peakSchoolName() + ' regarding ' + stuName.split(' ')[0] + '.')} style={{ background: 'transparent', color: T.ink, border: '1px solid ' + T.borderStr, padding: '9px 16px', borderRadius: 9, fontSize: 12.5, fontWeight: 500, cursor: 'pointer' }}>WhatsApp guardian</button>
                  <button onClick={() => window.peakStudentReport && window.peakStudentReport(stu && stu.id != null ? stu : { name: stuName })} style={{ background: 'transparent', color: T.ink2, border: '1px solid ' + T.border, padding: '9px 14px', borderRadius: 9, fontSize: 12.5, cursor: 'pointer' }}>Generate report</button>
                  <StudentActionsMenu stu={stu} onUpdated={_forceP} />
                  {window.PEAK_MARKING && <PEAK_MARKING.CarePlan stu={stu} />}
                </div>
              </div>
              {/* right-side score stack */}
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 10, width: 260, flexShrink: 0 }}>
                {[
                  { l: 'Attend · wk', v: (stuAttWk == null ? '—' : stuAttWk + '%'), c: (stuAttWk == null ? T.ink3 : (stuAttWk >= 90 ? T.good : stuAttWk >= 70 ? T.warn : T.red)) },
                  { l: 'Standing', v: (isRisk ? 'At-risk' : isTop ? 'Top' : 'OK'), c: (isRisk ? T.red : isTop ? T.good : T.ink) },
                  { l: 'Fees balance', v: (stuBalance > 0 ? ('UGX ' + stuBalance.toLocaleString()) : 'Cleared'), c: (stuBalance > 0 ? T.red : T.good) },
                  { l: 'Last seen', v: stuLastSeen, c: T.ink },
                ].map(k => (

  }

  return { Profile };

                      <div style={{ width: 44, height: 44, borderRadius: 999, background: T.surface3, color: '#fff', display: 'grid', placeItems: 'center', fontSize: 13, fontWeight: 700 }}>BM</div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 14, fontWeight: 600 }}>Brian Mugisha</div>
                        <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono }}>P5 Vigilant · PK-004 · Mr. Robert Mugisha</div>
                      </div>
                      <span style={{ color: T.ink3, fontSize: 16 }}>↗</span>
                    </div>
                  </div>
                )}

                {/* ledger preview */}
                <div>
                  <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.05em', fontWeight: 600, marginBottom: 8 }}>LEDGER PREVIEW · TERM 2</div>
                  <div style={{ background: T.bg, border: '1px solid ' + T.border, borderRadius: 12, overflow: 'hidden' }}>
                    {[
                      { d: '08 Feb', desc: 'Term 1 final',         amt: 850_000, dir: '+', faded: true },
                      { d: '14 Mar', desc: 'Term 2 deposit · MTN', amt: 510_000, dir: '+' },
                      { d: 'Today',  desc: 'This payment · MTN',    amt: sel.amt, dir: '+', pending: true },
                    ].map((l, i) => (
                      <div key={i} style={{
                        display: 'grid', gridTemplateColumns: '60px 1fr auto', gap: 10,
                        padding: '10px 14px', borderBottom: i < 2 ? '1px solid ' + T.border : 'none',
                        opacity: l.faded ? 0.55 : 1, background: l.pending ? 'rgba(226,58,82,0.10)' : 'transparent',
                      }}>
                        <span style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono }}>{l.d}</span>
                        <span style={{ fontSize: 12, color: T.ink }}>{l.desc}{l.pending && <span style={{ marginLeft: 8, fontSize: 10, color: T.red, fontFamily: T.mono, fontWeight: 700 }}>PENDING</span>}</span>
                        <span style={{ fontSize: 12, color: l.pending ? T.red : T.good, fontFamily: T.mono, fontWeight: 600 }}>{l.dir}{D.fmtUGXshort(l.amt)}</span>
                      </div>
                    ))}
                    <div style={{
                      padding: '10px 14px', background: T.surface2, display: 'flex', justifyContent: 'space-between',
                      borderTop: '1px solid ' + T.border,
                    }}>
                      <span style={{ fontSize: 11.5, color: T.ink2, fontFamily: T.mono, fontWeight: 600 }}>Balance after</span>
                      <span style={{ fontSize: 13, color: T.ink, fontFamily: T.mono, fontWeight: 700 }}>UGX 0 due</span>
                    </div>
                  </div>
                </div>

                <div style={{ display: 'flex', gap: 8, marginTop: 6 }}>
                  <button onClick={() => {
                    const mMap = { MTN: 'mtn', Airtel: 'airtel', Stanbic: 'bank', Bank: 'bank', Cash: 'cash' };
                    const guess = (sel.match && sel.match !== 'unclear') ? (window.peakFindStudent && window.peakFindStudent(String(sel.match).split(',')[0])) : null;
                    setConfirmed(cur => new Set([...cur, sel.id]));
                    window.peakModal && window.peakModal.open(React.createElement(window.PEAK_FORMS.RecordPayment, { store: window.peakStore, defaultStudentId: guess ? guess.id : undefined, defaultAmount: sel.amt, defaultMethod: mMap[sel.ch] || 'mtn' }));
                  }} style={{ flex: 1, background: confirmed.has(sel.id) ? T.good : T.red, color: '#fff', border: 'none', padding: '10px 14px', borderRadius: 9, fontSize: 12.5, fontWeight: 600, cursor: 'pointer' }}>
                    {confirmed.has(sel.id) ? '✓ Posted' : 'Confirm & post →'}
                  </button>
                  <button onClick={() => { const mMap = { MTN: 'mtn', Airtel: 'airtel', Stanbic: 'bank', Bank: 'bank', Cash: 'cash' }; window.peakModal && window.peakModal.open(React.createElement(window.PEAK_FORMS.RecordPayment, { store: window.peakStore, defaultAmount: sel.amt, defaultMethod: mMap[sel.ch] || 'mtn' })); }} style={{ background: 'transparent', color: T.ink, border: '1px solid ' + T.borderStr, padding: '10px 14px', borderRadius: 9, fontSize: 12.5, cursor: 'pointer' }}>Match elsewhere</button>
                </div>
                <button onClick={() => window.peakToast && window.peakToast('Flagged for review', 'warn', 'Bursar notified · transaction held for verification.')} style={{ background: 'transparent', color: T.ink3, border: 'none', padding: '4px 0', fontSize: 11.5, cursor: 'pointer', textAlign: 'left' }}>
                  ↑ Flag as suspicious / refund
                </button>
              </div>
            </aside>
          </div>
        </main>
      </div>
    );
  }

  return { Fees };
})();

window.PD_Fees = PD_Fees;

  </script>
  <script type="text/babel" data-src="src/v4-broadcast.jsx">
/* src/v4-broadcast.jsx */
/* global React, PEAK, V4 */
// Peak Dark · Broadcast composer
// Director composes a parent message — AI helps with audience, drafting, translation, send timing.

const PD_Broadcast = (function () {
  const T = window.V4.T;
  const D = window.PEAK;
  const { useState } = React;

  function Rail({ active, onNav }) {
    const items = [
      { k: 'dash', glyph: '◫' }, { k: 'today', glyph: '◉' },
      { k: 'stud', glyph: '☰' }, { k: 'attn', glyph: '◐' },
      { k: 'fees', glyph: '⌗' }, { k: 'comm', glyph: '◊' }, { k: 'teach', glyph: '◇' },
    ];
    return (
      <aside style={{
        width: 72, background: T.bg, borderRight: '1px solid ' + T.border,
        display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '14px 0', flexShrink: 0,
      }}>
        <div style={{ width: 40, height: 40, borderRadius: 10, background: '#fff', display: 'grid', placeItems: 'center', marginBottom: 18 }}>
          <img src="/prototypes/schools/peak-primary/assets/peak-logo.png" alt="" style={{ width: 34, height: 34, objectFit: 'contain' }} />
        </div>
        {items.map(n => {
          const a = active === n.k;
          return (
            <button key={n.k} onClick={() => onNav && onNav(n.k)} style={{
              width: 48, height: 44, borderRadius: 10, border: 'none',
              background: a ? T.surface2 : 'transparent', color: a ? T.red : T.ink3,
              fontSize: 18, cursor: 'pointer', marginBottom: 4, position: 'relative',
              display: 'grid', placeItems: 'center',
            }}>
              {a && <span style={{ position: 'absolute', left: -8, top: 10, bottom: 10, width: 3, background: T.red, borderRadius: 999 }} />}
              {n.glyph}
            </button>
          );
        })}
        <div style={{ flex: 1 }} />
        <div style={{ width: 32, height: 32, borderRadius: 999, background: T.gold, color: T.bg, display: 'grid', placeItems: 'center', fontSize: 11, fontWeight: 700 }}>SM</div>
      </aside>
    );
  }

  function Pill({ children, tone }) {
    const map = {
      good: { bg: T.goodSft, fg: T.good },
      warn: { bg: T.warnSft, fg: T.warn },
      bad:  { bg: T.redSft,  fg: T.redInk },
      brand:{ bg: 'rgba(58,79,156,0.30)', fg: '#a8b4e8' },
      neutral: { bg: T.surface2, fg: T.ink2 },
    }[tone];
    return <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11, fontWeight: 600,
      padding: '3px 9px', borderRadius: 999, background: map.bg, color: map.fg,
      fontFamily: T.mono, letterSpacing: '0.02em',
    }}>{children}</span>;
  }

  function Toggle({ on, onChange, label }) {
    return (
      <button onClick={() => onChange(!on)} style={{
        display: 'flex', alignItems: 'center', gap: 10, padding: '8px 12px', borderRadius: 9,
        background: on ? 'rgba(226,58,82,0.10)' : T.surface, border: '1px solid ' + (on ? 'rgba(226,58,82,0.40)' : T.border),
        color: T.ink, fontSize: 12, cursor: 'pointer', fontFamily: T.font, fontWeight: 500,
      }}>
        <span style={{
          width: 28, height: 16, borderRadius: 999, background: on ? T.red : T.surface2,
          position: 'relative', flexShrink: 0, transition: 'background 0.15s',
        }}>
          <span style={{
            position: 'absolute', top: 2, left: on ? 14 : 2, width: 12, height: 12, borderRadius: 999,
            background: '#fff', transition: 'left 0.15s',
          }} />
        </span>
        {label}
      </button>
    );
  }

  function Broadcast({ embed = false, onNav } = {}) {
    const { useState, useMemo } = React;
    const school = (window.peakSchoolName && window.peakSchoolName()) || 'the school';
    const studs = (window.PEAK && window.PEAK.students) || [];
    const streams = Array.from(new Set(studs.map(s => s.stream).filter(Boolean))).sort();

    const [aud, setAud] = useState('overdue');
    const [stream, setStream] = useState(streams[0] || '');
    const [tpl, setTpl] = useState('overdue');
    const [edited, setEdited] = useState(null); // null = use template
    const [idx, setIdx] = useState(0);
    const [started, setStarted] = useState(false);
    const [logged, setLogged] = useState(false);
    const [lang, setLang] = useState('en'); // en | lg | both
    const [lgBase, setLgBase] = useState('');
    const [lgFor, setLgFor] = useState('');
    const [translating, setTranslating] = useState(false);

    const phoneOk = (s) => (String(s.guardianPhone || '').replace(/[^0-9]/g, '').length >= 9);

    const recipients = useMemo(() => {
      if (aud === 'overdue') return studs.filter(s => (Number(s.balance) || 0) > 0);
      if (aud === 'risk') return studs.filter(s => s.flag === 'risk' || (s.attendanceWk != null && s.attendanceWk < 70));
      if (aud === 'stream') return studs.filter(s => s.stream === stream);
      return studs.slice();
    }, [aud, stream, studs]);
    const reachable = recipients.filter(phoneOk);
    const noPhone = recipients.filter(s => !phoneOk(s));

    const AUDIENCES = [
      { k: 'overdue', l: 'Fees outstanding', sub: 'guardians whose child owes a balance' },
      { k: 'risk', l: 'At-risk learners', sub: 'low attendance or flagged' },
      { k: 'stream', l: 'One class', sub: 'pick a stream below' },
      { k: 'all', l: 'All guardians', sub: 'whole school' },
    ];
    const TEMPLATES = {
      overdue: 'Dear {{guardian}}, a gentle reminder that {{child}} ({{class}}) has a school-fees balance of UGX {{balance}}. Kindly clear it when you are able. Webale nnyo. — {{school}}',
      absent: 'Good morning {{guardian}}. {{child}} ({{class}}) has not been marked present today. Please let us know if all is well. — {{school}}',
      notice: 'Dear {{guardian}}, a notice from {{school}} regarding {{child}} ({{class}}): ',
      reports: 'Dear {{guardian}}, {{child}}’s ({{class}}) report is ready. Kindly visit the school to collect it. — {{school}}',
    };
    const baseMsg = (edited != null) ? edited : (TEMPLATES[tpl] || TEMPLATES.overdue);
    const fill = (s) => baseMsg
      .replace(/{{\s*guardian\s*}}/g, s.guardian || 'Parent')
      .replace(/{{\s*child\s*}}/g, (String(s.name || '').split(' ')[0]) || s.name || 'your child')
      .replace(/{{\s*class\s*}}/g, s.stream || '')
      .replace(/{{\s*balance\s*}}/g, (Number(s.balance) || 0).toLocaleString())
      .replace(/{{\s*school\s*}}/g, school);
    const fillLg = (s) => String(lgBase || '')
      .replace(/{{\s*guardian\s*}}/g, s.guardian || 'Parent')
      .replace(/{{\s*child\s*}}/g, (String(s.name || '').split(' ')[0]) || s.name || 'your child')
      .replace(/{{\s*class\s*}}/g, s.stream || '')
      .replace(/{{\s*balance\s*}}/g, (Number(s.balance) || 0).toLocaleString())
      .replace(/{{\s*school\s*}}/g, school);
    const lgReady = lgBase && lgFor === baseMsg;
    const finalMsg = (s) => {
      const en = fill(s);
      if (lang === 'en' || !lgReady) return en;
      const lg = fillLg(s);
      if (lang === 'lg') return lg;
      return en + '\n\n' + lg;
    };
    const translate = async () => {
      setTranslating(true);
      try {
        const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
        const r = await fetch(WK + '/translate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: baseMsg, lang: 'Luganda' }) }).then(r => r.json());
        if (r && r.text) { setLgBase(r.text); setLgFor(baseMsg); }
        else window.peakToast && window.peakToast('Could not translate', 'info', (r && r.error) || 'Try again in a moment.');
      } catch (e) { window.peakToast && window.peakToast('Translation failed', 'info', String(e && e.message || e)); }
      setTranslating(false);
    };

    const logBroadcast = (n) => {
      if (logged) return; setLogged(true);
      try {
        const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
        const prof = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile()) || {};
        fetch(WK + '/os-data/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'comm_log', tenant: prof.tenantId || '', record: { audience: aud, stream: aud === 'stream' ? stream : null, count: n, channel: 'whatsapp', message: baseMsg, by: (prof.fullName || prof.email || ''), at: new Date().toISOString() } }) }).catch(() => {});
      } catch (e) {}
    };
    const sendNext = () => {
      if (idx >= reachable.length) return;
      const s = reachable[idx];
      const ph = String(s.guardianPhone || '').replace(/[^0-9]/g, '');
      if (ph) window.peakWhatsApp(ph, finalMsg(s));
      if (idx === 0) logBroadcast(reachable.length);
      setStarted(true); setIdx(idx + 1);
    };
    const copyNumbers = () => {
      const nums = reachable.map(s => String(s.guardianPhone || '').replace(/[^0-9]/g, '')).filter(Boolean).join(', ');
      try { navigator.clipboard.writeText(nums); window.peakToast && window.peakToast('Numbers copied', 'success', reachable.length + ' guardian numbers · paste into a WhatsApp broadcast list'); } catch (e) { window.prompt('Copy these numbers:', nums); }
    };
    const resetRun = () => { setIdx(0); setStarted(false); setLogged(false); };

    const card = { background: T.surface, border: '1px solid ' + T.border, borderRadius: 12, padding: 18 };
    const done = started && idx >= reachable.length;
    const current = reachable[idx];

    return (
      <div style={{ width: embed ? '100%' : 1200, height: embed ? '100%' : 900, display: 'flex', flexDirection: 'column', background: T.bg, color: T.ink, fontFamily: T.font, fontSize: 13, overflow: 'auto' }}>
        <header style={{ padding: '22px 28px 16px', borderBottom: '1px solid ' + T.border }}>
          <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', fontWeight: 600, marginBottom: 8 }}>COMMUNICATIONS</div>
          <div style={{ fontSize: 24, fontWeight: 700, letterSpacing: '-0.02em' }}>Message guardians</div>
          <div style={{ fontSize: 13, color: T.ink3, marginTop: 4, maxWidth: 640 }}>Pick who to reach, write the message once, and send each guardian a personalised WhatsApp. Numbers come straight from your real student roster.</div>
        </header>

        <div style={{ padding: 24, display: 'grid', gridTemplateColumns: embed ? '1fr 1fr' : '1fr 1fr', gap: 18, alignItems: 'start' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <div style={card}>
              <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 10 }}>1 &middot; Who are you reaching?</div>
              <div style={{ display: 'grid', gap: 8 }}>
                {AUDIENCES.map(a => {
                  const on = aud === a.k;
                  return (
                    <button key={a.k} onClick={() => { setAud(a.k); resetRun(); }} style={{ textAlign: 'left', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10, padding: '10px 12px', borderRadius: 10, border: '1px solid ' + (on ? T.red : T.border), background: on ? 'rgba(226,58,82,0.08)' : 'transparent', color: T.ink, cursor: 'pointer' }}>
                      <span><span style={{ fontSize: 13, fontWeight: 600 }}>{a.l}</span><span style={{ display: 'block', fontSize: 11, color: T.ink3 }}>{a.sub}</span></span>
                      <span style={{ fontSize: 13, fontWeight: 700, color: on ? T.red : T.ink3, fontFamily: 'ui-monospace,monospace' }}>{a.k === 'stream' ? (studs.filter(s => s.stream === stream).length) : (a.k === 'overdue' ? studs.filter(s => (Number(s.balance) || 0) > 0).length : a.k === 'risk' ? studs.filter(s => s.flag === 'risk' || (s.attendanceWk != null && s.attendanceWk < 70)).length : studs.length)}</span>
                    </button>
                  );
                })}
                {aud === 'stream' && (
                  <select value={stream} onChange={e => { setStream(e.target.value); resetRun(); }} style={{ marginTop: 4, width: '100%', background: T.bg, border: '1px solid ' + T.border, borderRadius: 9, padding: '9px 11px', fontSize: 13, color: T.ink, outline: 'none' }}>
                    {streams.length === 0 ? <option value="">No classes yet</option> : streams.map(st => <option key={st} value={st}>{st} ({studs.filter(s => s.stream === st).length})</option>)}
                  </select>
                )}
              </div>
            </div>

            <div style={card}>
              <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 10 }}>2 &middot; The message</div>
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}>
                {[['overdue', 'Fee reminder'], ['absent', 'Absent today'], ['notice', 'Notice'], ['reports', 'Report ready']].map(o => (
                  <button key={o[0]} onClick={() => { setTpl(o[0]); setEdited(null); }} style={{ border: '1px solid ' + (tpl === o[0] && edited == null ? T.red : T.border), background: 'transparent', color: tpl === o[0] && edited == null ? T.red : T.ink2, borderRadius: 999, padding: '5px 11px', fontSize: 12, cursor: 'pointer' }}>{o[1]}</button>
                ))}
              </div>
              <textarea value={baseMsg} onChange={e => setEdited(e.target.value)} style={{ width: '100%', minHeight: 120, background: T.bg, border: '1px solid ' + T.border, borderRadius: 9, padding: 11, fontSize: 13, color: T.ink, fontFamily: T.font, outline: 'none', lineHeight: 1.5 }} />
              <div style={{ fontSize: 10.5, color: T.ink4, fontFamily: T.mono, marginTop: 6 }}>Variables: {'{{guardian}} {{child}} {{class}} {{balance}} {{school}}'} — filled per guardian.</div>
              <div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid ' + T.border }}>
                <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.04em', marginBottom: 7 }}>LANGUAGE</div>
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center' }}>
                  {[['en', 'English'], ['lg', 'Luganda'], ['both', 'Both']].map(o => (
                    <button key={o[0]} onClick={() => { setLang(o[0]); if (o[0] !== 'en' && lgFor !== baseMsg && !translating) translate(); }} style={{ border: '1px solid ' + (lang === o[0] ? T.red : T.border), background: 'transparent', color: lang === o[0] ? T.red : T.ink2, borderRadius: 999, padding: '5px 12px', fontSize: 12, cursor: 'pointer' }}>{o[1]}</button>
                  ))}
                  {lang !== 'en' && (translating
                    ? <span style={{ fontSize: 11.5, color: T.ink3 }}>Translating…</span>
                    : (lgFor === baseMsg
                      ? <span style={{ fontSize: 11.5, color: T.good }}>✓ Luganda ready</span>
                      : <button onClick={translate} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 8, padding: '5px 11px', fontSize: 11.5, cursor: 'pointer' }}>↻ Translate to Luganda</button>))}
                </div>
                {lang !== 'en' && lgReady && <div style={{ marginTop: 8, fontSize: 11.5, color: T.ink3, lineHeight: 1.5, background: T.bg, border: '1px solid ' + T.border, borderRadius: 8, padding: '8px 10px', whiteSpace: 'pre-wrap' }}>{lgBase}</div>}
                {lang !== 'en' && lgFor !== baseMsg && !translating && <div style={{ marginTop: 6, fontSize: 10.5, color: T.warn }}>You edited the message — re-translate to refresh the Luganda version.</div>}
              </div>
            </div>
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <div style={card}>
              <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 10 }}>3 &middot; Send</div>
              <div style={{ display: 'flex', gap: 16, marginBottom: 14, flexWrap: 'wrap' }}>
                <div><div style={{ fontSize: 9.5, color: T.ink4, fontFamily: T.mono }}>RECIPIENTS</div><div style={{ fontSize: 20, fontWeight: 700 }}>{recipients.length}</div></div>
                <div><div style={{ fontSize: 9.5, color: T.ink4, fontFamily: T.mono }}>REACHABLE ON WHATSAPP</div><div style={{ fontSize: 20, fontWeight: 700, color: T.good }}>{reachable.length}</div></div>
                <div><div style={{ fontSize: 9.5, color: T.ink4, fontFamily: T.mono }}>NO PHONE ON FILE</div><div style={{ fontSize: 20, fontWeight: 700, color: noPhone.length ? T.warn : T.ink3 }}>{noPhone.length}</div></div>
              </div>

              {reachable.length === 0 ? (
                <div style={{ fontSize: 12.5, color: T.ink3 }}>No guardians with a phone number in this group yet. Add guardian phones under Students, then come back.</div>
              ) : done ? (
                <div style={{ textAlign: 'center', padding: '8px 0' }}>
                  <div style={{ fontSize: 28 }}>{'✓'}</div>
                  <div style={{ fontSize: 14, fontWeight: 700, marginTop: 4 }}>All {reachable.length} opened in WhatsApp</div>
                  <div style={{ fontSize: 12, color: T.ink3, marginTop: 4 }}>Each guardian got a personalised message. Logged to your message history.</div>
                  <button onClick={resetRun} style={{ marginTop: 12, background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 9, padding: '8px 16px', fontSize: 12.5, cursor: 'pointer' }}>Start again</button>
                </div>
              ) : (
                <div>
                  <div style={{ fontSize: 12, color: T.ink3, marginBottom: 8 }}>WhatsApp opens one chat at a time. Tap below for each guardian {'—'} the message is pre-filled, just press send in WhatsApp.</div>
                  {current && (
                    <div style={{ background: T.bg, border: '1px solid ' + T.border, borderRadius: 10, padding: 12, marginBottom: 10 }}>
                      <div style={{ fontSize: 12.5, fontWeight: 600 }}>{current.guardian || 'Parent'} <span style={{ color: T.ink3, fontWeight: 400 }}>{'·'} guardian of {current.name} ({current.stream})</span></div>
                      <div style={{ fontSize: 11.5, color: T.ink2, marginTop: 6, lineHeight: 1.5, whiteSpace: 'pre-wrap' }}>{finalMsg(current)}</div>
                    </div>
                  )}
                  <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                    <button onClick={sendNext} style={{ background: '#00a884', color: '#fff', border: 'none', borderRadius: 9, padding: '10px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>Open WhatsApp → {current ? (current.guardian || current.name) : ''} ({idx + 1}/{reachable.length})</button>
                    {started && idx < reachable.length && <button onClick={() => setIdx(idx + 1)} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink3, borderRadius: 9, padding: '10px 14px', fontSize: 12.5, cursor: 'pointer' }}>Skip</button>}
                    <button onClick={copyNumbers} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 9, padding: '10px 14px', fontSize: 12.5, cursor: 'pointer' }}>Copy all numbers</button>
                  </div>

  const D = window.PEAK;

  // ─── Shared atoms ─────────────────────────────────────────────────────────
  function Pill({ children, tone = 'neutral' }) {
    const map = {
      neutral: { bg: T.surface2, fg: T.ink2 },
      good:    { bg: T.goodSft,  fg: T.good },
      warn:    { bg: T.warnSft,  fg: T.warn },
      bad:     { bg: T.redSft,   fg: T.redInk },
      brand:   { bg: 'rgba(58,79,156,0.30)', fg: '#a8b4e8' },
      gold:    { bg: 'rgba(232,200,122,0.18)', fg: T.gold },
    }[tone] || { bg: T.surface2, fg: T.ink2 };
    return (
      <span style={{
        display: 'inline-flex', alignItems: 'center', gap: 6,
        padding: '3px 9px', borderRadius: 999, fontSize: 11, fontWeight: 600,
        background: map.bg, color: map.fg, whiteSpace: 'nowrap', fontFamily: T.mono,
      }}>{children}</span>
    );
  }

  function PageHeader({ eyebrow, title, subtitle, actions }) {
    return (
      <header style={{
        padding: '22px 28px 18px', borderBottom: '1px solid ' + T.border,
        display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between',
        background: T.bg,
      }}>
        <div>
          <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', textTransform: 'uppercase', fontWeight: 600, marginBottom: 8 }}>{eyebrow}</div>
          <div style={{ fontSize: 26, fontWeight: 700, color: T.ink, letterSpacing: '-0.02em', lineHeight: 1.05 }}>{title}</div>
          {subtitle && <div style={{ fontSize: 13, color: T.ink2, marginTop: 6, maxWidth: 720 }}>{subtitle}</div>}
        </div>
        {actions && <div style={{ display: 'flex', gap: 10 }}>{actions}</div>}
      </header>
    );
  }

  function Card({ children, style, pad = 22, title, action }) {
    return (
      <div style={{
        background: T.surface, border: '1px solid ' + T.border, borderRadius: 14,
        padding: pad, position: 'relative', ...style,
      }}>
        {(title || action) && (
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 16 }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, color: T.ink, letterSpacing: '-0.005em' }}>{title}</div>
            {action}
          </div>
        )}
        {children}
      </div>
    );
  }

  function PrimaryBtn({ children, onClick }) {
    return <button onClick={onClick} style={{
      padding: '9px 16px', background: T.red, color: '#fff', border: 'none',
      borderRadius: 9, fontSize: 12.5, fontWeight: 600, cursor: 'pointer', fontFamily: T.font,
    }}>{children}</button>;
  }
  function GhostBtn({ children, onClick }) {
    return <button onClick={onClick} style={{
      padding: '8px 14px', background: 'transparent', color: T.ink2,
      border: '1px solid ' + T.borderStr, borderRadius: 9, fontSize: 12.5, fontWeight: 500, cursor: 'pointer', fontFamily: T.font,
    }}>{children}</button>;
  }

  // ═════════════════════════════════════════════════════════════════════════
  // ATTENDANCE · stream picker + register marking
  // ═════════════════════════════════════════════════════════════════════════
  function Attendance({ store }) {
    const [streamId, setStreamId] = useState('P5V');
    const streamRoster = useMemo(() => D.students.filter(s => s.stream === streamId), [streamId]);
    // local register state — initialized as everyone-present
    const [marks, setMarks] = useState(() => {
      const m = {};
      streamRoster.forEach(s => { m[s.id] = 'present'; });
      // pre-set the known risk students as absent
      if (streamId === 'P5V') { m[4] = 'absent'; } // Brian
      return m;
    });

    // re-sync marks when stream changes
    React.useEffect(() => {
      const m = {};
      D.students.filter(s => s.stream === streamId).forEach(s => { m[s.id] = 'present'; });
      if (streamId === 'P5V') m[4] = 'absent';
      setMarks(m);
    }, [streamId]);

    const counts = useMemo(() => {
      const c = { present: 0, absent: 0, late: 0 };
      Object.values(marks).forEach(v => { c[v] = (c[v] || 0) + 1; });
      return c;
    }, [marks]);

    const setMark = (id, status) => setMarks(cur => ({ ...cur, [id]: status }));

    const saveRegister = () => {
      const updates = Object.entries(marks).map(([id, status]) => ({ studentId: Number(id), status }));
      const presentCount = store.markAttendance(updates);
      window.peakToast('Register saved · ' + streamId, 'success',
        counts.present + ' present · ' + counts.absent + ' absent · ' + counts.late + ' late. Guardians of absentees notified.');
    };

    const markAllPresent = () => {
      const m = {};
      streamRoster.forEach(s => { m[s.id] = 'present'; });
      setMarks(m);
      window.peakToast('All marked present', 'info');
    };

    const streamLabel = D.streams.find(s => s.id === streamId)?.label || streamId;
    const totalInStream = streamRoster.length || 1;
    const presentPct = Math.round((counts.present / totalInStream) * 100);

    return (
      <div>
        <PageHeader
          eyebrow="Attendance · Thursday 14 May · 08:24"
          title="Daily register"
          subtitle="Mark attendance for each stream. Register closes 08:30. Guardians of absent students are auto-messaged."
          actions={
            <>
              <GhostBtn onClick={markAllPresent}>All present</GhostBtn>
              <PrimaryBtn onClick={saveRegister}>Save register</PrimaryBtn>
            </>
          }
        />

        {/* school-wide bar */}
        <div style={{ padding: '18px 28px 0' }}>
          <Card pad={18} style={{ marginBottom: 14 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
              <div>
                <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', fontWeight: 600 }}>SCHOOL-WIDE · TODAY</div>
                <div style={{ fontSize: 28, fontWeight: 700, color: T.ink, marginTop: 4, fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.02em' }}>
                  793 <span style={{ fontSize: 16, color: T.ink3, fontWeight: 600 }}>of 842 marked · 94.2%</span>
                </div>
              </div>
              <Pill tone="good">▲ +2.4 vs avg</Pill>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(14, 1fr)', gap: 4 }}>
              {D.streams.map(s => {
                const pct = D.streamAttendance[s.id] || 90;
                const isCur = s.id === streamId;
                const tone = pct >= 95 ? T.good : pct >= 88 ? T.warn : T.red;
                return (
                  <button key={s.id} onClick={() => setStreamId(s.id)} style={{
                    padding: '8px 4px', borderRadius: 8,
                    background: isCur ? T.surface3 : T.surface2,
                    border: '1px solid ' + (isCur ? T.navyLite : T.border),
                    color: T.ink, cursor: 'pointer', textAlign: 'center',
                    fontFamily: T.font,
                  }}>
                    <div style={{ fontSize: 10.5, fontFamily: T.mono, color: T.ink3, fontWeight: 600 }}>{s.id}</div>
                    <div style={{ fontSize: 16, fontWeight: 700, color: tone, marginTop: 2, fontVariantNumeric: 'tabular-nums' }}>{pct}%</div>
                  </button>
                );
              })}
            </div>
          </Card>
        </div>

        {/* register table */}
        <div style={{ padding: '0 28px 32px' }}>
          <Card pad={0}>
            <div style={{ padding: '18px 22px', borderBottom: '1px solid ' + T.border, display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12 }}>
              <div>
                <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', fontWeight: 600 }}>SELECTED STREAM</div>
                <div style={{ fontSize: 19, fontWeight: 700, color: T.ink, marginTop: 4 }}>{streamLabel}</div>
              </div>
              <div style={{ display: 'flex', gap: 10 }}>
                <Pill tone="good">{counts.present || 0} present</Pill>
                <Pill tone="bad">{counts.absent || 0} absent</Pill>
                <Pill tone="warn">{counts.late || 0} late</Pill>
                <Pill tone="brand">{presentPct}% of stream</Pill>
              </div>
            </div>
            {streamRoster.length === 0 ? (
              <div style={{ padding: '40px 24px', textAlign: 'center', color: T.ink3, fontSize: 13 }}>
                No students enrolled in {streamLabel} yet. Use <strong style={{ color: T.ink }}>Add student</strong> on the Students page.
              </div>
            ) : (
              <div>
                {streamRoster.map((s, i) => {
                  const mark = marks[s.id] || 'present';
                  return (
                    <div key={s.id} style={{
                      display: 'grid', gridTemplateColumns: '44px 1fr 1fr 320px',
                      gap: 12, alignItems: 'center',
                      padding: '12px 22px',
                      borderTop: i > 0 ? '1px solid ' + T.border : 'none',
                    }}>
                      <div style={{ fontFamily: T.mono, fontSize: 11, color: T.ink3 }}>#{(i + 1).toString().padStart(2, '0')}</div>
                      <div>
                        <div style={{ fontSize: 13.5, color: T.ink, fontWeight: 600 }}>{s.name}</div>
                        <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, marginTop: 2 }}>Last seen: {s.lastSeen}</div>
                      </div>
                      <div style={{ fontSize: 11.5, color: T.ink3 }}>{s.guardian}</div>
                      <div style={{ display: 'flex', gap: 6, justifyContent: 'flex-end' }}>
                        {[
                          { k: 'present', l: 'Present', c: T.good },
                          { k: 'late',    l: 'Late',    c: T.warn },
                          { k: 'absent',  l: 'Absent',  c: T.red },
                        ].map(opt => {
                          const sel = mark === opt.k;
                          return (
                            <button key={opt.k} onClick={() => setMark(s.id, opt.k)} style={{
                              padding: '8px 16px', borderRadius: 8, border: 'none',
                              background: sel ? opt.c : T.surface2,
                              color: sel ? '#fff' : T.ink2,
                              fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: T.font,
                              transition: 'background 0.12s',
                            }}>{opt.l}</button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </Card>
        </div>
      </div>
    );
  }

  // ═════════════════════════════════════════════════════════════════════════
  // TEACHERS · staff roster
  // ═════════════════════════════════════════════════════════════════════════
  function Teachers({ onAddTeacher }) {
    const [query, setQuery] = useState('');
    const [selectedId, setSelectedId] = useState(D.teachers[0].id);

    const filtered = useMemo(() => {
      if (!query) return D.teachers;
      const q = query.toLowerCase();
      return D.teachers.filter(t =>
        t.name.toLowerCase().includes(q) ||
        t.role.toLowerCase().includes(q) ||
        t.subjects.join(' ').toLowerCase().includes(q)
      );
    }, [query]);

    const selected = D.teachers.find(t => t.id === selectedId) || D.teachers[0];

    return (
      <div>
        <PageHeader
          eyebrow={`Staff · ${D.teachers.length} teachers`}
          title="Teachers"
          subtitle="Active staff, classes taught, and recent performance signals."
          actions={
            <>
              <input
                placeholder="Search by name, role, subject…"
                value={query} onChange={e => setQuery(e.target.value)}
                style={{
                  background: T.surface, border: '1px solid ' + T.border, borderRadius: 9,
                  padding: '8px 14px', fontSize: 12.5, color: T.ink, fontFamily: T.font, width: 260, outline: 'none',
                }}
              />
              <PrimaryBtn onClick={onAddTeacher}>+ Add teacher</PrimaryBtn>
            </>
          }
        />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 380px', gap: 14, padding: '18px 28px 32px' }}>
          {/* roster grid */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 12, alignContent: 'start' }}>
            {filtered.map(t => {
              const initials = t.name.replace(/^(Mrs?|Mr|Ms|Miss)\.?\s+/i, '').split(' ').map(p => p[0]).slice(0,2).join('');
              const isSel = t.id === selectedId;
              return (
                <button key={t.id} onClick={() => setSelectedId(t.id)} style={{
                  textAlign: 'left', cursor: 'pointer',
                  background: isSel ? T.surface2 : T.surface,
                  border: '1px solid ' + (isSel ? T.borderStr : T.border),
                  borderRadius: 12, padding: 16,
                  fontFamily: T.font, color: T.ink,
                  transition: 'background 0.12s, border-color 0.12s',
                }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12 }}>
                    <div style={{
                      width: 44, height: 44, borderRadius: 11,
                      background: 'oklch(0.58 0.09 ' + (40 + (t.id.charCodeAt(1) * 47) % 320) + ')',
                      color: '#fff', display: 'grid', placeItems: 'center',
                      fontSize: 14, fontWeight: 700, flexShrink: 0,
                    }}>{initials}</div>
                    <div style={{ minWidth: 0, flex: 1 }}>
                      <div style={{ fontSize: 14, fontWeight: 600, color: T.ink }}>{t.name}</div>
                      <div style={{ fontSize: 11.5, color: T.ink3, fontFamily: T.mono, marginTop: 2 }}>{t.role}</div>
                    </div>
                    {t.tone === 'top' && <Pill tone="gold">★</Pill>}
                  </div>
                  <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 12 }}>
                    {t.subjects.map(s => <Pill key={s} tone="brand">{s}</Pill>)}
                  </div>
                  <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
                    {t.streams.map(st => (
                      <span key={st} style={{ fontSize: 10.5, fontFamily: T.mono, color: T.ink3, background: T.bg, padding: '2px 7px', borderRadius: 5 }}>{st === 'all' ? 'whole school' : st}</span>
                    ))}
                  </div>
                </button>
              );
            })}
            {filtered.length === 0 && (
              <div style={{ gridColumn: '1 / -1', padding: '40px 0', textAlign: 'center', color: T.ink3, fontSize: 13 }}>
                No teachers match “{query}”
              </div>
            )}
          </div>

          {/* detail panel */}
          <div style={{ position: 'sticky', top: 18, alignSelf: 'start' }}>
            <Card pad={0}>
              <div style={{ padding: '20px 22px', borderBottom: '1px solid ' + T.border, display: 'flex', alignItems: 'center', gap: 14 }}>
                <div style={{
                  width: 52, height: 52, borderRadius: 13,
                  background: 'oklch(0.58 0.09 ' + (40 + (selected.id.charCodeAt(1) * 47) % 320) + ')',
                  color: '#fff', display: 'grid', placeItems: 'center', fontSize: 17, fontWeight: 700,
                }}>{selected.name.replace(/^(Mrs?|Mr|Ms|Miss)\.?\s+/i, '').split(' ').map(p => p[0]).slice(0,2).join('')}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, color: T.ink }}>{selected.name}</div>
                  <div style={{ fontSize: 12, color: T.ink3, marginTop: 2 }}>{selected.role}</div>
                </div>
              </div>
              <div style={{ padding: 22, display: 'flex', flexDirection: 'column', gap: 18 }}>
                <div>
                  <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.05em', fontWeight: 600, marginBottom: 6 }}>CONTACT</div>
                  <div style={{ fontSize: 12.5, color: T.ink, fontFamily: T.mono }}>{selected.phone}</div>
                  <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
                    <GhostBtn onClick={() => window.peakWhatsApp(selected.phone, 'Hello ' + (selected.name || '') + ',')}>WhatsApp</GhostBtn>
                    <GhostBtn onClick={() => window.peakCall(selected.phone)}>Call</GhostBtn>
                  </div>
                </div>
                <div>
                  <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.05em', fontWeight: 600, marginBottom: 6 }}>SUBJECTS</div>
                  <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                    {selected.subjects.map(s => <Pill key={s} tone="brand">{s}</Pill>)}
                  </div>
                </div>
                <div>
                  <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.05em', fontWeight: 600, marginBottom: 6 }}>STREAMS</div>
                  <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                    {selected.streams.map(st => <Pill key={st} tone="neutral">{st === 'all' ? 'whole school' : st}</Pill>)}
                  </div>
                </div>
                <div>
                  <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.05em', fontWeight: 600, marginBottom: 6 }}>WITH PEAK SINCE</div>
                  <div style={{ fontSize: 13, color: T.ink2 }}>{selected.joined}</div>
                </div>
                <div style={{
                  background: 'linear-gradient(150deg, ' + T.surface3 + ' 0%, ' + T.surface + ' 70%)',
                  border: '1px solid ' + T.borderStr, borderRadius: 11, padding: 14,
                }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                    <span style={{ width: 22, height: 22, borderRadius: 6, background: T.red, color: '#fff', display: 'grid', placeItems: 'center', fontFamily: T.mono, fontSize: 10, fontWeight: 700 }}>AI</span>
                    <span style={{ fontSize: 12, fontWeight: 600 }}>This week's note</span>
                  </div>
                  <div style={{ fontSize: 12.5, color: T.ink2, lineHeight: 1.55 }}>
                    {selected.tone === 'top'
                      ? selected.name.split(' ')[1] + ' has the highest quiz-completion rate this term. Strong consistency.'
                      : 'Lessons on schedule. Reports for term 2 progressing — assist available if needed.'}
                  </div>
                </div>
              </div>
            </Card>
          </div>
        </div>
      </div>
    );
  }

  // ═════════════════════════════════════════════════════════════════════════
  // TRANSPORT · live bus status
  // ═════════════════════════════════════════════════════════════════════════
  function Transport() {
    const [selectedId, setSelectedId] = useState(D.buses[0].id);
    const sel = D.buses.find(b => b.id === selectedId);

    const statusMap = {
      'on-route':  { tone: 'good',  label: 'On route'  },
      'delayed':   { tone: 'bad',   label: 'Delayed'   },
      'arriving':  { tone: 'warn',  label: 'Arriving'  },
      'departed':  { tone: 'brand', label: 'Departed'  },

                  fontFamily: T.font, color: T.ink,

                    background: T.surface3, color: '#fff',
                    padding: '10px 8px', borderRadius: 9,
