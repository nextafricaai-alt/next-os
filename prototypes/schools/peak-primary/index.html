                  <div>
                    <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.05em', fontWeight: 600 }}>ETA</div>
                    <div style={{ fontSize: 18, fontWeight: 700, color: T.gold, marginTop: 4 }}>{sel.eta}</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.05em', fontWeight: 600 }}>STATUS</div>
                    <div style={{ marginTop: 6 }}><Pill tone={statusMap[sel.status].tone}>{statusMap[sel.status].label}</Pill></div>
                  </div>
                </div>
                {sel.notes && (
                  <div style={{ background: T.warnSft, border: '1px solid ' + T.warn, borderRadius: 10, padding: 12, fontSize: 12, color: T.warn }}>
                    {sel.notes}
                  </div>
                )}
                <div style={{ display: 'flex', gap: 8 }}>
                  <GhostBtn onClick={() => window.peakCall(sel.phone || sel.driverPhone || '')}>Call driver</GhostBtn>
                  <PrimaryBtn onClick={() => window.peakBulkWhatsApp(window.peakAllGuardians('Transport update from ' + window.peakSchoolName() + ': your child\u2019s bus schedule has an update today. We will keep you posted.'), 'Route update')}>Notify route parents</PrimaryBtn>
                </div>
              </div>
            </Card>
          </div>
        </div>
      </div>
    );
  }

  // ═════════════════════════════════════════════════════════════════════════
  // LEARNING · subjects, assignments, completion
  // ═════════════════════════════════════════════════════════════════════════
  function Learning() {
    const [filter, setFilter] = useState('all'); // all | active | high
    const visible = useMemo(() => {
      if (filter === 'active') return D.subjects.filter(s => s.active > 0);
      if (filter === 'low')    return D.subjects.filter(s => s.complete < 80);
      return D.subjects;
    }, [filter]);

    return (
      <div>
        <PageHeader
          eyebrow="Learning · Term 2 · Week 6"
          title="Subjects & assignments"
          subtitle="Live homework completion, lesson plans, and AI-flagged topics that need attention."
          actions={
            <>
              <div style={{ display: 'flex', gap: 4, padding: 3, background: T.surface, border: '1px solid ' + T.border, borderRadius: 9 }}>
                {[
                  { k: 'all',    l: 'All' },
                  { k: 'active', l: 'Active' },
                  { k: 'low',    l: 'Needs attention' },
                ].map(o => (
                  <button key={o.k} onClick={() => setFilter(o.k)} style={{
                    border: 'none', background: filter === o.k ? T.red : 'transparent',
                    color: filter === o.k ? '#fff' : T.ink2,
                    padding: '6px 14px', borderRadius: 6,
                    fontSize: 12, fontWeight: 600, cursor: 'pointer',
                  }}>{o.l}</button>
                ))}
              </div>
              <PrimaryBtn onClick={() => window.peakModal && window.peakModal.open(React.createElement(window.PEAK_FORMS.NewAssignment))}>+ New assignment</PrimaryBtn>
            </>
          }
        />

        <div style={{ padding: '18px 28px 32px', display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(340px, 1fr))', gap: 14 }}>
          {visible.map(s => {
            const tone = s.color === 'red' ? T.red : s.color === 'warn' ? T.warn : s.color === 'gold' ? T.gold : T.good;
            const completionTone = s.complete >= 90 ? 'good' : s.complete >= 75 ? 'warn' : 'bad';
            return (
              <Card key={s.id} pad={18}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12 }}>
                  <div>
                    <div style={{ fontSize: 15, fontWeight: 700, color: T.ink, letterSpacing: '-0.005em' }}>{s.name}</div>
                    <div style={{ fontSize: 11.5, color: T.ink3, fontFamily: T.mono, marginTop: 3 }}>{s.stream === 'all' ? 'whole school' : s.stream} · {s.teacher}</div>
                  </div>
                  <Pill tone={completionTone}>{s.complete}% done</Pill>
                </div>
                <div style={{ height: 6, background: T.bg, borderRadius: 999, marginBottom: 14, overflow: 'hidden' }}>
                  <div style={{ height: '100%', width: s.complete + '%', background: tone, borderRadius: 999 }} />
                </div>
                <div style={{
                  background: T.surface2, borderRadius: 10, padding: 12, marginBottom: 12,
                  display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
                }}>
                  <div>
                    <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, fontWeight: 600 }}>CURRENT TOPIC</div>
                    <div style={{ fontSize: 13, color: T.ink, marginTop: 3 }}>{s.topic}</div>
                  </div>
                  <Pill tone="neutral">{s.active} active</Pill>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 11.5, color: T.ink3 }}>
                  <span>Next due: <span style={{ color: T.gold, fontWeight: 600 }}>{s.nextDue}</span></span>
                  <button onClick={() => window.peakToast('Lesson plan opened', 'info', s.name + ' · ' + s.teacher)} style={{
                    background: 'transparent', border: 'none', color: T.ink2, fontSize: 12,
                    cursor: 'pointer', fontFamily: T.font, fontWeight: 600,
                  }}>Open plan →</button>
                </div>
              </Card>
            );
          })}
        </div>
      </div>
    );
  }

  // ═════════════════════════════════════════════════════════════════════════
  // REPORTS · end-of-term reports
  // ═════════════════════════════════════════════════════════════════════════
  function Reports() {
    const statusMap = {
      pending:    { tone: 'neutral', label: 'Pending' },
      drafting:   { tone: 'warn',    label: 'Drafting' },
      review:     { tone: 'brand',   label: 'In review' },
      published:  { tone: 'gold',    label: 'Published' },
      sent:       { tone: 'good',    label: 'Sent to parents' },
    };

    const totals = D.reports.reduce((acc, r) => {
      acc.total     += r.total;
      acc.drafted   += r.drafted;
      acc.published += r.published;
      acc.sent      += r.sent;
      acc.aiAssist  += r.aiAssist;
      return acc;
    }, { total: 0, drafted: 0, published: 0, sent: 0, aiAssist: 0 });

    return (
      <div>
        <PageHeader
          eyebrow="Reports · Term 2 · End-of-term"
          title="Term 2 reports"
          subtitle="AI-assisted teacher comments. Reports auto-delivered to parents via WhatsApp once published."
          actions={
            <>
              <GhostBtn onClick={() => window.peakToast('Reports exported', 'success', 'PDF · ' + totals.published + ' reports compiled.')}>Export PDFs</GhostBtn>
              <PrimaryBtn onClick={() => window.peakToast('Bulk publish queued', 'success', totals.drafted + ' drafts ready · sending to ' + totals.drafted + ' guardians.')}>Publish drafts</PrimaryBtn>
            </>
          }
        />

        {/* progress strip */}
        <div style={{ padding: '18px 28px 0' }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10, marginBottom: 14 }}>
            {[
              { l: 'Total reports',    v: totals.total },
              { l: 'Drafted',          v: totals.drafted },
              { l: 'Published',        v: totals.published },
              { l: 'AI-assisted',      v: totals.aiAssist },
            ].map((k, i) => (
              <Card key={i} pad={16}>
                <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.06em', fontWeight: 600 }}>{k.l.toUpperCase()}</div>
                <div style={{ fontSize: 26, fontWeight: 700, color: T.ink, marginTop: 5, fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.02em' }}>{k.v}</div>
              </Card>
            ))}
          </div>
        </div>

        {/* reports table */}
        <div style={{ padding: '0 28px 32px' }}>
          <Card pad={0}>
            <div style={{
              display: 'grid', gridTemplateColumns: '90px 1fr 1.6fr 100px 100px 110px 120px',
              gap: 14, alignItems: 'center', padding: '14px 22px',
              borderBottom: '1px solid ' + T.border,
              fontSize: 10.5, color: T.ink3, fontFamily: T.mono, fontWeight: 600, letterSpacing: '0.04em',
            }}>
              <span>STREAM</span><span>TEACHER</span><span>STATUS · PROGRESS</span>
              <span style={{ textAlign: 'right' }}>DRAFTED</span>
              <span style={{ textAlign: 'right' }}>SENT</span>
              <span style={{ textAlign: 'right' }}>AI</span>
              <span style={{ textAlign: 'right' }}>DUE</span>
            </div>
            {D.reports.map((r, i) => {
              const st = statusMap[r.status] || statusMap.pending;
              const pct = r.total > 0 ? Math.round((r.drafted / r.total) * 100) : 0;
              return (
                <div key={r.id} style={{
                  display: 'grid', gridTemplateColumns: '90px 1fr 1.6fr 100px 100px 110px 120px',
                  gap: 14, alignItems: 'center', padding: '14px 22px',
                  borderTop: i > 0 ? '1px solid ' + T.border : 'none',
                  cursor: 'pointer', transition: 'background 0.12s',
                }}
                onMouseEnter={e => e.currentTarget.style.background = T.surface2}
                onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                onClick={() => window.peakToast('Opening report drafts', 'info', r.stream + ' · ' + r.teacher)}
                >
                  <div style={{ fontSize: 14, fontWeight: 700, color: T.ink, fontFamily: T.mono }}>{r.stream}</div>
                  <div style={{ fontSize: 12.5, color: T.ink2 }}>{r.teacher}</div>
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}>
                      <Pill tone={st.tone}>{st.label}</Pill>
                      <span style={{ fontSize: 11.5, color: T.ink3, fontFamily: T.mono }}>{r.drafted}/{r.total}</span>
                    </div>
                    <div style={{ height: 4, background: T.bg, borderRadius: 999, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: pct + '%', background: r.status === 'sent' ? T.good : r.status === 'published' ? T.gold : r.status === 'review' ? T.navyLite : r.status === 'drafting' ? T.warn : T.ink4, borderRadius: 999 }} />
                    </div>
                  </div>
                  <div style={{ textAlign: 'right', fontFamily: T.mono, fontSize: 12.5, color: T.ink }}>{r.drafted}</div>
                  <div style={{ textAlign: 'right', fontFamily: T.mono, fontSize: 12.5, color: r.sent > 0 ? T.good : T.ink3 }}>{r.sent || '–'}</div>
                  <div style={{ textAlign: 'right' }}>
                    <Pill tone={r.aiAssist > 0 ? 'gold' : 'neutral'}>{r.aiAssist > 0 ? 'AI ' + r.aiAssist : 'none'}</Pill>
                  </div>
                  <div style={{ textAlign: 'right', fontSize: 12, color: r.due === 'Today' ? T.red : r.due === 'Done' ? T.good : T.ink2, fontWeight: 600 }}>{r.due}</div>
                </div>
              );
            })}
          </Card>
        </div>
      </div>
    );
  }

  return { Attendance, Teachers, Transport, Learning, Reports };
})();

  </script>
  <script type="text/babel" data-src="src/peak-forms.jsx">
/* src/peak-forms.jsx */
/* global React, V4, PEAK */
// Peak Primary · Forms (modals)
// Add Student · Add Teacher · Record Payment

window.PEAK_FORMS = (function () {
  const { useState } = React;
  const T = window.V4.T;
  const D = window.PEAK;

  // ─── Shared form atoms ────────────────────────────────────────────────────
  function Field({ label, hint, error, children, span = 1 }) {
    return (
      <label style={{ display: 'flex', flexDirection: 'column', gap: 6, gridColumn: 'span ' + span }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <span style={{ fontSize: 11, fontWeight: 600, color: T.ink2, letterSpacing: '0.04em', textTransform: 'uppercase', fontFamily: T.mono }}>{label}</span>
          {hint && <span style={{ fontSize: 10.5, color: T.ink4, fontFamily: T.mono }}>{hint}</span>}
        </div>
        {children}
        {error && <span style={{ fontSize: 11, color: T.redInk, marginTop: 1 }}>{error}</span>}
      </label>
    );
  }

  const inputStyle = {
    background: T.bg, border: '1px solid ' + T.border, borderRadius: 9,
    padding: '10px 12px', fontSize: 13.5, color: T.ink, fontFamily: T.font,
    outline: 'none', width: '100%',
  };
  const inputFocusStyle = { border: '1px solid ' + T.navyLite, background: T.surface2 };

  function TextInput({ value, onChange, placeholder, type = 'text' }) {
    const [focus, setFocus] = useState(false);
    return (
      <input
        type={type}
        value={value}
        placeholder={placeholder}
        onChange={e => onChange(e.target.value)}
        onFocus={() => setFocus(true)}
        onBlur={() => setFocus(false)}
        style={{ ...inputStyle, ...(focus ? inputFocusStyle : null) }}
      />
    );
  }

  function Select({ value, onChange, options }) {
    return (
      <select value={value} onChange={e => onChange(e.target.value)} style={{
        ...inputStyle,
        appearance: 'none',
        backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M0 0L6 8L12 0' fill='%238a91b0'/></svg>\")",
        backgroundRepeat: 'no-repeat', backgroundPosition: 'right 12px center',
        paddingRight: 34,
      }}>
        {options.map(o => <option key={o.value || o} value={o.value || o} style={{ background: T.bg }}>{o.label || o}</option>)}
      </select>
    );
  }

  function PrimaryButton({ children, onClick, disabled }) {
    return (
      <button onClick={onClick} disabled={disabled} style={{
        padding: '11px 18px', background: disabled ? T.surface2 : T.red, color: '#fff',
        border: 'none', borderRadius: 9, fontSize: 13, fontWeight: 600,
        cursor: disabled ? 'not-allowed' : 'pointer', fontFamily: T.font,
        opacity: disabled ? 0.5 : 1, transition: 'opacity 0.12s',
      }}>{children}</button>
    );
  }

  function SecondaryButton({ children, onClick }) {
    return (
      <button onClick={onClick} style={{
        padding: '11px 18px', background: 'transparent', color: T.ink2,
        border: '1px solid ' + T.borderStr, borderRadius: 9, fontSize: 13, fontWeight: 500,
        cursor: 'pointer', fontFamily: T.font,
      }}>{children}</button>
    );
  }

  function ModalHeader({ eyebrow, title, subtitle }) {
    return (
      <div style={{ padding: '22px 26px 18px', borderBottom: '1px solid ' + T.border }}>
        <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', textTransform: 'uppercase', fontWeight: 600, marginBottom: 6 }}>{eyebrow}</div>
        <div style={{ fontSize: 22, fontWeight: 700, color: T.ink, letterSpacing: '-0.02em' }}>{title}</div>
        {subtitle && <div style={{ fontSize: 13, color: T.ink2, marginTop: 6 }}>{subtitle}</div>}
      </div>
    );
  }

  function ModalFooter({ children }) {
    return (
      <div style={{
        padding: '16px 26px', borderTop: '1px solid ' + T.border,
        display: 'flex', justifyContent: 'flex-end', gap: 10,
      }}>{children}</div>
    );
  }

  // ─── Add Student ──────────────────────────────────────────────────────────
  function AddStudent({ store }) {
    const _CL = (window.SCHOOL_CONFIG && window.SCHOOL_CONFIG.classes && window.SCHOOL_CONFIG.classes.length) ? window.SCHOOL_CONFIG.classes : D.streams.map(s => s.id);
    const _COMBOS = (window.SCHOOL_CONFIG && window.SCHOOL_CONFIG.combinations) || [];
    const [name, setName] = useState('');
    const [stream, setStream] = useState(_CL[0] || 'P1V');
    const [combination, setCombination] = useState('');
    const [guardian, setGuardian] = useState('');
    const [phone, setPhone] = useState('');
    const [dob, setDob] = useState('');
    const [feesStatus, setFeesStatus] = useState('paid');
    const [balance, setBalance] = useState('0');
    const [errors, setErrors] = useState({});

    const submit = () => {
      const errs = {};
      if (!name.trim()) errs.name = 'Name is required';
      if (!guardian.trim()) errs.guardian = 'Guardian name is required';
      if (!phone.trim()) errs.phone = 'Phone is required';
      if (Object.keys(errs).length) { setErrors(errs); return; }
      const bal = feesStatus === 'paid' ? 0 : Number(balance.replace(/[^0-9]/g, '')) || 0;
      store.addStudent({
        name: name.trim(),
        stream,
        combination: combination || null,
        guardian: guardian.trim(),
        phone: phone.trim(),
        fees: feesStatus,
        balance: bal,
        dob: dob || null,
      });
      window.peakToast(name.trim() + ' added to ' + stream, 'success', 'Guardian ' + guardian + ' will receive a welcome WhatsApp.');
      window.peakModal.close();
    };

    return (
      <div style={{ width: '100%' }}>
        <ModalHeader
          eyebrow="Add new student · Term 2"
          title="Enrol a new student"
          subtitle="Guardian gets an automatic welcome WhatsApp + parent-portal login."
        />
        <div style={{ padding: 26, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
          <Field label="Student name" error={errors.name} span={2}>
            <TextInput value={name} onChange={v => { setName(v); setErrors(e => ({ ...e, name: null })); }} placeholder="e.g. Esther Nakimuli" />
          </Field>
          <Field label="Class · stream" hint={(window.SCHOOL_CONFIG && window.SCHOOL_CONFIG.type === 'secondary') ? 'S1–S6' : 'P1–P7'}>
            <Select value={stream} onChange={setStream} options={_CL.map(c => ({ value: c, label: c }))} />
          </Field>
          {_COMBOS.length > 0 && (
            <Field label="Combination" hint="A-Level (S5/S6)">
              <Select value={combination} onChange={setCombination} options={[{ value: '', label: '— none / O-Level —' }].concat(_COMBOS.map(c => ({ value: c.name, label: c.name + ' · ' + (c.subjects || []).join('/') })))} />
            </Field>
          )}
          <Field label="Date of birth" hint="optional">
            <TextInput value={dob} onChange={setDob} placeholder="14 March 2019" />
          </Field>
          <Field label="Primary guardian" error={errors.guardian}>
            <TextInput value={guardian} onChange={v => { setGuardian(v); setErrors(e => ({ ...e, guardian: null })); }} placeholder="Mrs. Joyce Namutebi" />
          </Field>
          <Field label="WhatsApp phone" hint="+256 …" error={errors.phone}>
            <TextInput value={phone} onChange={v => { setPhone(v); setErrors(e => ({ ...e, phone: null })); }} placeholder="+256 772 416 902" />
          </Field>
          <Field label="Fees status">
            <Select value={feesStatus} onChange={setFeesStatus} options={[
              { value: 'paid',    label: 'Fully paid' },
              { value: 'partial', label: 'Partial payment' },
              { value: 'overdue', label: 'Outstanding · overdue' },
            ]} />
          </Field>
          {feesStatus !== 'paid' && (
            <Field label="Outstanding balance" hint="UGX">
              <TextInput value={balance} onChange={setBalance} placeholder="0" />
            </Field>
          )}
        </div>
        <div style={{
          padding: '0 26px 16px', display: 'flex', alignItems: 'center', gap: 10,
          fontSize: 12, color: T.ink3,
        }}>
          <span style={{ width: 22, height: 22, borderRadius: 6, background: T.redSft, color: T.redInk, display: 'grid', placeItems: 'center', fontFamily: T.mono, fontSize: 11, fontWeight: 700 }}>AI</span>
          <span>NEXT will auto-create a parent portal login and queue a welcome WhatsApp in English + Luganda.</span>
        </div>
        <ModalFooter>
          <SecondaryButton onClick={() => window.peakModal.close()}>Cancel</SecondaryButton>
          <PrimaryButton onClick={submit}>Enrol student →</PrimaryButton>
        </ModalFooter>
      </div>
    );
  }

  // ─── Add Teacher ──────────────────────────────────────────────────────────
  function AddTeacher({ store }) {
    const [name, setName] = useState('');
    const [role, setRole] = useState('');
    const [streams, setStreams] = useState(['P1V']);
    const [subjects, setSubjects] = useState('');
    const [phone, setPhone] = useState('');
    const [errors, setErrors] = useState({});

    const toggleStream = (id) => {
      setStreams(cur => cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id]);
    };

    const submit = () => {
      const errs = {};
      if (!name.trim()) errs.name = 'Name is required';
      if (!role.trim()) errs.role = 'Role is required';
      if (!phone.trim()) errs.phone = 'Phone is required';
      if (Object.keys(errs).length) { setErrors(errs); return; }
      const subj = subjects.split(',').map(s => s.trim()).filter(Boolean);
      store.addTeacher({
        name: name.trim(),
        role: role.trim(),
        subjects: subj.length ? subj : ['General'],
        streams,
        phone: phone.trim(),
      });
      window.peakToast(name.trim() + ' added to staff', 'success', 'Teacher dashboard login will be sent to ' + phone);
      window.peakModal.close();
    };

    return (
      <div style={{ width: '100%' }}>
        <ModalHeader
          eyebrow="Add new teacher · staff"
          title="Add a teacher"
          subtitle="Teacher will get login access to the classroom dashboard."
        />
        <div style={{ padding: 26, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
          <Field label="Full name" error={errors.name} span={2}>
            <TextInput value={name} onChange={v => { setName(v); setErrors(e => ({ ...e, name: null })); }} placeholder="Mrs. Sarah Namugga" />
          </Field>
          <Field label="Role · title" error={errors.role}>
            <TextInput value={role} onChange={v => { setRole(v); setErrors(e => ({ ...e, role: null })); }} placeholder="P5 Vigilant teacher" />
          </Field>
          <Field label="WhatsApp phone" error={errors.phone}>
            <TextInput value={phone} onChange={v => { setPhone(v); setErrors(e => ({ ...e, phone: null })); }} placeholder="+256 772 416 902" />
          </Field>
          <Field label="Subjects taught" hint="comma-separated" span={2}>
            <TextInput value={subjects} onChange={setSubjects} placeholder="Mathematics, Science" />
          </Field>
          <Field label="Streams" hint="select all that apply" span={2}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, padding: '4px 0' }}>
              {D.streams.map(s => {
                const sel = streams.includes(s.id);
                return (
                  <button key={s.id} type="button" onClick={() => toggleStream(s.id)} style={{
                    padding: '6px 11px', borderRadius: 999,
                    border: '1px solid ' + (sel ? T.red : T.border),
                    background: sel ? T.redSft : 'transparent',
                    color: sel ? T.redInk : T.ink2,
                    fontSize: 11.5, fontWeight: 600, cursor: 'pointer', fontFamily: T.mono,
                  }}>{s.id}</button>
                );
              })}
            </div>
          </Field>
        </div>
        <ModalFooter>
          <SecondaryButton onClick={() => window.peakModal.close()}>Cancel</SecondaryButton>
          <PrimaryButton onClick={submit}>Add teacher →</PrimaryButton>
        </ModalFooter>
      </div>
    );
  }

  // ─── Record Payment ───────────────────────────────────────────────────────
  function RecordPayment({ store, defaultStudentId, defaultAmount, defaultMethod }) {
    const owing = D.students.filter(s => s.balance > 0);
    const [studentId, setStudentId] = useState(defaultStudentId || (owing[0] && owing[0].id) || (D.students[0] && D.students[0].id));
    const [amount, setAmount] = useState(defaultAmount ? String(defaultAmount) : '');
    const [method, setMethod] = useState(defaultMethod || 'mtn');
    const [ref, setRef] = useState('');
    const [phone, setPhone] = useState('');
    const student = D.students.find(s => s.id === Number(studentId));
    const balance = student ? student.balance : 0;

    const submit = async () => {
      const amt = Number(amount.replace(/[^0-9]/g, ''));
      if (!amt || amt <= 0) { window.peakToast('Enter a payment amount', 'error'); return; }
      store.recordPayment({ studentId: Number(studentId), amount: amt, method, ref });
      const newBal = Math.max(0, balance - amt);
      try {
        const rec = await window.NextReceipts.issue({
          studentName: student ? student.name : null,
          guardianName: student ? student.guardian : null,

  function ImportStudents() {
    const prof = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile) ? window.PEAK_ROLE.getProfile() : { tenantId: 'peak-primary' };
    const tenantId = prof.tenantId || 'peak-primary';
    const [raw, setRaw] = useState('');
    const [parsed, setParsed] = useState(null); // { headers, rows }
    const [map, setMap] = useState({ name: -1, stream: -1, guardian: -1, phone: -1 });
    const [busy, setBusy] = useState(false);
    const [result, setResult] = useState(null);

    function splitLine(line, delim) {
      const out = []; let cur = '', q = false;
      for (let i = 0; i < line.length; i++) { const c = line[i];
        if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
        else if (c === delim && !q) { out.push(cur); cur = ''; }
        else cur += c;
      }
      out.push(cur); return out.map(x => x.trim());
    }
    function guess(headers, keys) {
      for (let i = 0; i < headers.length; i++) { const h = (headers[i] || '').toLowerCase(); for (let k = 0; k < keys.length; k++) if (h.indexOf(keys[k]) >= 0) return i; }
      return -1;
    }
    function doParse(text) {
      const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(l => l.trim() !== '');
      if (!lines.length) { setParsed(null); return; }
      const delim = (lines[0].split('\t').length > lines[0].split(',').length) ? '\t' : ',';
      const all = lines.map(l => splitLine(l, delim));
      const headers = all[0], rows = all.slice(1);
      setParsed({ headers, rows });
      setMap({
        name: guess(headers, ['name', 'student', 'pupil', 'learner', 'full']),
        stream: guess(headers, ['stream', 'class', 'grade', 'level', 'form']),
        guardian: guess(headers, ['guardian', 'parent', 'mother', 'father', 'next of kin', 'contact name']),
        phone: guess(headers, ['phone', 'tel', 'mobile', 'whatsapp', 'msisdn', 'number', 'contact']),
      });
      setResult(null);
    }
    function onFile(e) { const fl = e.target.files && e.target.files[0]; if (!fl) return; const rd = new FileReader(); rd.onload = () => { setRaw(rd.result || ''); doParse(rd.result || ''); }; rd.readAsText(fl); }

    const students = parsed ? parsed.rows.map(r => ({
      name: map.name >= 0 ? (r[map.name] || '') : '',
      stream: map.stream >= 0 ? (r[map.stream] || '') : '',
      guardian_name: map.guardian >= 0 ? (r[map.guardian] || '') : '',
      guardian_phone: map.phone >= 0 ? (r[map.phone] || '') : '',

    const colOpts = parsed ? [{ value: '-1', label: '— none —' }].concat(parsed.headers.map((h, i) => ({ value: String(i), label: h || ('Column ' + (i + 1)) }))) : [];
    const setCol = (k, v) => setMap(m => Object.assign({}, m, { [k]: parseInt(v, 10) }));

    const doImport = () => {
      if (!students.length) return;
      setBusy(true); setResult(null);
      const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
      fetch(WK + '/students/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tenant_id: tenantId, students }) })
        .then(r => r.json()).then(res => {
          setBusy(false);
          if (res.error) { setResult({ err: res.error }); return; }
          if (window.peakStore && window.peakStore.loadStudents) window.peakStore.loadStudents(tenantId);
          window.peakToast((res.imported || 0) + ' students imported', 'success', (res.skipped ? res.skipped + ' duplicates skipped. ' : '') + 'They are live in the roster now.');
          window.peakModal.close();

    return (
      <div style={{ width: '100%' }}>
        <ModalHeader eyebrow="Bulk import · students" title="Import students from a file" subtitle="Upload a CSV (in Excel: File → Save As → CSV) or paste rows. Nia maps the columns — you confirm." />
        <div style={{ padding: 24 }}>

              <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, margin: '6px 0' }}>OR PASTE ROWS</div>
              <textarea value={raw} onChange={e => { setRaw(e.target.value); doParse(e.target.value); }} placeholder={'Name, Class, Guardian, Phone\nMirembe Nakato, P4V, Mrs. Sarah Nakato, +256772000111'} rows={6} style={{ width: '100%', background: T.bg, border: '1px solid ' + T.border, borderRadius: 9, padding: 12, fontSize: 12.5, color: T.ink, fontFamily: T.mono, outline: 'none' }} />
            </div>
          )}
          {parsed && (
            <div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16 }}>
                <Field label="Name column"><Select value={String(map.name)} onChange={v => setCol('name', v)} options={colOpts} /></Field>
                <Field label="Class / stream column"><Select value={String(map.stream)} onChange={v => setCol('stream', v)} options={colOpts} /></Field>

              </div>
              <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, marginBottom: 6 }}>PREVIEW · {students.length} students ready</div>
              <div style={{ border: '1px solid ' + T.border, borderRadius: 10, overflow: 'hidden', maxHeight: 240, overflowY: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12.5 }}>
                  <thead><tr style={{ background: T.surface }}>{['Name', 'Stream', 'Guardian', 'Phone'].map(h => <th key={h} style={{ textAlign: 'left', padding: '8px 10px', color: T.ink3, fontFamily: T.mono, fontSize: 10.5, textTransform: 'uppercase' }}>{h}</th>)}</tr></thead>

                        <td style={{ padding: '7px 10px', color: T.ink2 }}>{s.guardian_phone || '—'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {students.length > 10 && <div style={{ fontSize: 11, color: T.ink3, marginTop: 6 }}>…and {students.length - 10} more.</div>}
              <div style={{ marginTop: 8 }}><span onClick={() => { setParsed(null); setRaw(''); }} style={{ fontSize: 12, color: T.ink3, cursor: 'pointer', textDecoration: 'underline' }}>Start over / use a different file</span></div>
            </div>
          )}
          {result && result.err && <div style={{ marginTop: 12, fontSize: 12.5, color: T.redInk }}>Import failed: {result.err}</div>}
        </div>
        <div style={{ padding: '0 24px 14px', display: 'flex', alignItems: 'center', gap: 10, fontSize: 12, color: T.ink3 }}>
          <span style={{ width: 22, height: 22, borderRadius: 6, background: T.redSft, color: T.redInk, display: 'grid', placeItems: 'center', fontFamily: T.mono, fontSize: 11, fontWeight: 700 }}>AI</span>
          <span>Duplicates (same name + stream) are skipped automatically. Students go straight into this school's roster.</span>
        </div>

          <SecondaryButton onClick={() => window.peakModal.close()}>Cancel</SecondaryButton>
          <PrimaryButton onClick={doImport} disabled={busy || !students.length}>{busy ? 'Importing…' : (students.length ? ('Import ' + students.length + ' students →') : 'Import students →')}</PrimaryButton>
        </ModalFooter>
      </div>
    );
  }

  <script type="text/babel">

  function firstName(n) { return (n || 'Student').split(' ')[0]; }

  function headRemark(rec, exam) {

  }

  const LEVELS = {
    primary: { label: 'Primary (PLE)', subjects: ['English', 'Mathematics', 'Science', 'Social Studies'], coreCount: 4, aggCount: 4 },

  };
  const SCHEME = [[80,'D1',1],[70,'D2',2],[65,'C3',3],[60,'C4',4],[55,'C5',5],[50,'C6',6],[45,'P7',7],[40,'P8',8],[0,'F9',9]];

      return { per, alevelPoints: total, aggregate: null, division: null };

    const pool = (level === 'olevel') ? subs : core;
    const take = (LEVELS[level] || LEVELS.primary).aggCount;
    const pts = pool.map(sub => per[sub] ? per[sub].points : 9).sort((a, b) => a - b).slice(0, take);

  function gradeAll(students, marksMap, exam, balances) {
    const level = exam.level || 'primary';
    const recs = students.map(s => { const m = marksMap[s.id] || {}; if (!Object.keys(m).filter(k => m[k] !== '' && m[k] != null).length) return null; return Object.assign({ student: s, balance: (balances && balances[s.id]) || 0 }, computeStudent(m, exam)); }).filter(Boolean);
    const better = (a, b) => level === 'alevel' ? (b.alevelPoints - a.alevelPoints) : (a.aggregate - b.aggregate);
    const grade = st => { const m = (st || '').match(/^[A-Za-z]+\d+/); return m ? m[0] : (st || '?'); };
    const byStream = {}, byGrade = {};
    recs.forEach(r => { (byStream[r.student.stream] = byStream[r.student.stream] || []).push(r); (byGrade[grade(r.student.stream)] = byGrade[grade(r.student.stream)] || []).push(r); });
    Object.keys(byStream).forEach(k => { const l = byStream[k].slice().sort(better); l.forEach((r, i) => r.streamRank = (i + 1) + '/' + l.length); });
    Object.keys(byGrade).forEach(k => { const l = byGrade[k].slice().sort(better); l.forEach((r, i) => r.classRank = (i + 1) + '/' + l.length); });
    return recs.sort(better);
  }

  function Exams() {

                  </select>
                </label>
                <label style={{ gridColumn: 'span 2' }}><div style={{ fontSize: 11, color: T.ink2, marginBottom: 6, fontFamily: T.mono }}>SUBJECTS (comma-separated · first {(LEVELS[form.level] || {}).coreCount} form the aggregate)</div><textarea style={Object.assign({}, inp, { height: 70, fontFamily: T.mono, fontSize: 12 })} value={form.subjectsText} onChange={e => setForm(f => ({ ...f, subjectsText: e.target.value }))} /></label>
              </div>
              <div style={{ marginTop: 16, display: 'flex', gap: 8 }}>
                <button style={btn(false)} onClick={() => setView('list')}>Cancel</button>
                <button style={btn(true)} onClick={createExam} disabled={busy}>{busy ? 'Creating…' : 'Create exam →'}</button>
              </div>
            </div>
          )}

          {view === 'entry' && exam && (
            <div>
              <div style={{ display: 'flex', gap: 10, alignItems: 'center', marginBottom: 14 }}>
                <span style={{ fontSize: 12, color: T.ink3 }}>Stream:</span>
                <select style={Object.assign({}, inp, { width: 'auto' })} value={streamFilter} onChange={e => setStreamFilter(e.target.value)}>
                  <option value="All">All streams</option>{streams.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
                <span style={{ fontSize: 12, color: T.ink3 }}>{shownStudents.length} students · {subs.length} subjects</span>
              </div>
              <div style={{ border: '1px solid ' + T.border, borderRadius: 10, overflow: 'auto', maxHeight: '62vh' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12.5 }}>
                  <thead><tr style={{ background: T.surface, position: 'sticky', top: 0 }}>
                    <th style={{ textAlign: 'left', padding: '9px 10px', color: T.ink3, fontFamily: T.mono, fontSize: 10.5, position: 'sticky', left: 0, background: T.surface }}>STUDENT</th>
                    <th style={{ textAlign: 'left', padding: '9px 10px', color: T.ink3, fontFamily: T.mono, fontSize: 10.5 }}>STREAM</th>
                    {subs.map(sub => <th key={sub} style={{ padding: '9px 8px', color: T.ink3, fontFamily: T.mono, fontSize: 10, minWidth: 64 }}>{sub}</th>)}
                  </tr></thead>
                  <tbody>
                    {shownStudents.map(s => (
                      <tr key={s.id} style={{ borderTop: '1px solid ' + T.border }}>
                        <td style={{ padding: '6px 10px', color: T.ink, whiteSpace: 'nowrap', position: 'sticky', left: 0, background: T.bg }}>{s.name}</td>
                        <td style={{ padding: '6px 10px', color: T.ink2 }}>{s.stream}</td>
                        {subs.map(sub => (
                          <td key={sub} style={{ padding: '3px 4px' }}>
                            <input value={(marks[s.id] && marks[s.id][sub] != null) ? marks[s.id][sub] : ''} onChange={e => setMark(s.id, sub, e.target.value)} inputMode="numeric" style={{ width: 50, textAlign: 'center', background: T.bg, border: '1px solid ' + T.border, borderRadius: 6, padding: '6px 4px', color: T.ink, fontSize: 12.5, outline: 'none' }} />
                          </td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {view === 'results' && recs && (
            <div>
              <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
                <button style={btn(false)} onClick={() => recs.filter(r => r.balance <= 0).forEach(r => makeReport(r, Object.assign({}, exam, { subjects: subjectsOf(exam) })))}>Download all clear reports</button>
                <button style={btn(false)} onClick={() => recs.filter(r => r.balance > 0).forEach(r => draftHeld(r, exam))}>Draft all held-fee messages</button>
              </div>
              <div style={{ border: '1px solid ' + T.border, borderRadius: 10, overflow: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12.5 }}>
                  <thead><tr style={{ background: T.surface }}>
                    {['Pos', 'Student', 'Stream', exam.level === 'alevel' ? 'Points' : 'Aggregate', exam.level === 'alevel' ? '' : 'Division', 'Stream rank', 'Class rank', 'Report'].map((h, i) => <th key={i} style={{ textAlign: 'left', padding: '9px 10px', color: T.ink3, fontFamily: T.mono, fontSize: 10.5 }}>{h}</th>)}
                  </tr></thead>
                  <tbody>
                    {recs.map((r, i) => (
                      <tr key={r.student.id} style={{ borderTop: '1px solid ' + T.border }}>
                        <td style={{ padding: '8px 10px', color: T.ink3 }}>{i + 1}</td>
                        <td style={{ padding: '8px 10px', color: T.ink, fontWeight: 600 }}>{r.student.name}</td>
                        <td style={{ padding: '8px 10px', color: T.ink2 }}>{r.student.stream}</td>
                        <td style={{ padding: '8px 10px', color: T.ink }}>{exam.level === 'alevel' ? r.alevelPoints : r.aggregate}</td>
                        <td style={{ padding: '8px 10px', color: T.ink }}>{exam.level === 'alevel' ? '' : ('Div ' + (r.division || '—'))}</td>
                        <td style={{ padding: '8px 10px', color: T.ink2 }}>{r.streamRank}</td>
                        <td style={{ padding: '8px 10px', color: T.ink2 }}>{r.classRank}</td>
                        <td style={{ padding: '6px 10px' }}>
                          {r.balance > 0
                            ? <button onClick={() => draftHeld(r, exam)} style={{ border: '1px solid ' + T.redInk, background: T.redSft, color: T.redInk, padding: '6px 10px', borderRadius: 7, fontSize: 11.5, cursor: 'pointer' }} title={'Held — owes UGX ' + Math.round(r.balance).toLocaleString()}>Held · message parent</button>
                            : <button onClick={() => makeReport(r, Object.assign({}, exam, { subjects: subjectsOf(exam) }))} style={{ border: 'none', background: T.red, color: '#fff', padding: '6px 12px', borderRadius: 7, fontSize: 11.5, cursor: 'pointer' }}>Report PDF</button>}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div style={{ marginTop: 12, fontSize: 12, color: T.ink3, display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ width: 22, height: 22, borderRadius: 6, background: T.redSft, color: T.redInk, display: 'grid', placeItems: 'center', fontFamily: T.mono, fontSize: 11, fontWeight: 700 }}>AI</span>
                <span>Students with an outstanding balance are auto-held — their report won't generate until fees clear. Nia drafts the parent message for you.</span>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  return { Exams };
})();
  </script>

  <script type="text/babel" data-src="src/peak-marking.jsx">
/* PEAK_MARKING — Nia scans a photographed exam, marks it (UNEB), teacher confirms, saves to the learner; plus a holistic care plan on the profile. */
window.PEAK_MARKING = (function () {
  const { useState, useEffect, useCallback } = React;
  const T = window.V4.T;
  const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
  function prof() { return (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile()) || { tenantId: 'peak-primary' }; }
  function tenant() { return prof().tenantId || 'peak-primary'; }
  function osGet(kind) { return fetch(WK + '/os-data?kind=' + kind + '&tenant=' + encodeURIComponent(tenant())).then(r => r.json()).then(d => (d && d.records) || []).catch(() => []); }
  function osSave(kind, record, id) { return fetch(WK + '/os-data/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(id ? { kind, tenant: tenant(), record, id } : { kind, tenant: tenant(), record }) }).then(r => r.json()).catch(e => ({ error: String(e && e.message || e) })); }
  const card = { background: T.surface, border: '1px solid ' + T.border, borderRadius: 12, padding: 18 };
  const fileToDataUrl = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const norm = (x) => String(x || '').toLowerCase().trim();

  function Mark() {
    const cfg = window.SCHOOL_CONFIG || {};
    const level = cfg.type || 'primary';
    const subjects = (cfg.subjects && cfg.subjects.length) ? cfg.subjects : ['English', 'Mathematics', 'Science', 'Social Studies'];
    const classes = (cfg.classes && cfg.classes.length) ? cfg.classes : [];
    const [img, setImg] = useState('');
    const [meta, setMeta] = useState({ subject: subjects[0] || '', klass: classes[0] || '', examName: '', guide: '' });
    const [busy, setBusy] = useState(false);
    const [marking, setMarking] = useState(null);
    const [err, setErr] = useState('');
    const [students, setStudents] = useState([]);
    const [matchId, setMatchId] = useState('');
    const [saved, setSaved] = useState(false);
    const [recent, setRecent] = useState([]);

    const loadRecent = useCallback(() => osGet('marked_exam').then(rs => setRecent(rs.map(x => Object.assign({ _id: x.id }, x.payload)).sort((a, b) => String(b.markedAt || '').localeCompare(String(a.markedAt || ''))).slice(0, 12))), []);
    useEffect(() => { setStudents((window.PEAK && window.PEAK.students) || []); loadRecent(); }, [loadRecent]);

    const pick = async (file) => { if (!file) return; try { const url = await fileToDataUrl(file); setImg(url); setMarking(null); setSaved(false); setErr(''); } catch (e) { setErr('Could not read that image.'); } };
    const run = () => {
      if (!img) { setErr('Take or choose a photo of the script first.'); return; }
      setBusy(true); setErr(''); setSaved(false);
      fetch(WK + '/exam/scan-mark', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: img, subject: meta.subject, class: meta.klass, level: level, examName: meta.examName, markGuide: meta.guide }) })
        .then(r => r.json()).then(d => {
          setBusy(false);
          if (d.error) { setErr(d.error); return; }
          setMarking(d.marking);
          const nm = norm(d.marking.studentName); const first = nm.split(' ')[0];
          const hit = first ? students.find(s => norm(s.name).indexOf(first) >= 0) : null;
          if (hit) setMatchId(hit.id);
        }).catch(e => { setBusy(false); setErr(String(e.message || e)); });
    };
    const setQMark = (i, v) => setMarking(m => { const pq = (m.perQuestion || []).slice(); pq[i] = Object.assign({}, pq[i], { marks: Number(String(v).replace(/[^0-9.]/g, '')) || 0 }); const total = pq.reduce((a, q) => a + (Number(q.marks) || 0), 0); const max = pq.reduce((a, q) => a + (Number(q.max) || 0), 0); return Object.assign({}, m, { perQuestion: pq, total: total, max: max, percent: max ? Math.round(total / max * 100) : 0 }); });
    const save = () => {
      if (!marking) return;
      if (!matchId) { setErr('Pick which learner this paper belongs to before saving.'); return; }
      const stu = students.find(s => s.id === matchId) || {};
      setBusy(true); setErr('');
      const rec = { studentId: matchId, studentName: stu.name || marking.studentName, stream: stu.stream || meta.klass, subject: marking.subject || meta.subject, examName: meta.examName, total: marking.total, max: marking.max, percent: marking.percent, grade: marking.grade, perQuestion: marking.perQuestion, feedback: marking.feedback, reasoningNotes: marking.reasoningNotes, source: 'nia-scan', markedAt: new Date().toISOString(), by: (prof().fullName || prof().email || '') };
      osSave('marked_exam', rec).then(() => { setBusy(false); setSaved(true); loadRecent(); window.peakToast && window.peakToast('Saved to ' + (stu.name || 'learner'), 'success', (marking.subject || '') + ' · ' + marking.percent + '%'); }).catch(() => { setBusy(false); setErr('Could not save.'); });
    };

    const lbl = { fontSize: 10, color: T.ink4, fontFamily: T.mono, marginBottom: 4 };
    const inp = { width: '100%', background: T.bg, border: '1px solid ' + T.border, borderRadius: 8, padding: '8px 10px', fontSize: 13, color: T.ink, outline: 'none' };
    const conf = marking && marking.confidence;

    return (
      <div style={{ height: '100%', overflow: 'auto', background: T.bg, color: T.ink, fontFamily: T.font, fontSize: 13, padding: '26px 28px 60px' }}>
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', fontWeight: 600, marginBottom: 8 }}>AI MARKING · NIA</div>
          <div style={{ fontSize: 26, fontWeight: 700, letterSpacing: '-0.02em' }}>Scan &amp; mark an exam</div>
          <div style={{ fontSize: 14, color: T.ink3, marginTop: 6, maxWidth: 680 }}>Photograph a learner's script. Nia reads the name and answers, marks it the UNEB way, and proposes the marks — you check and confirm before it saves to the child's profile.</div>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.2fr', gap: 16, alignItems: 'start' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div style={card}>
              <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 10 }}>1 · The script</div>
              <label style={{ display: 'block', border: '1px dashed ' + T.border, borderRadius: 10, padding: img ? 0 : '28px 12px', textAlign: 'center', cursor: 'pointer', overflow: 'hidden' }}>
                {img ? <img src={img} alt="script" style={{ width: '100%', display: 'block', maxHeight: 280, objectFit: 'contain', background: '#000' }} /> : <span style={{ fontSize: 13, color: T.ink3 }}>📷 Tap to take a photo or choose an image of the script</span>}
                <input type="file" accept="image/*" capture="environment" onChange={e => pick(e.target.files && e.target.files[0])} style={{ display: 'none' }} />
              </label>
              {img && <button onClick={() => { setImg(''); setMarking(null); }} style={{ marginTop: 8, background: 'transparent', border: '1px solid ' + T.border, color: T.ink3, borderRadius: 8, padding: '6px 12px', fontSize: 12, cursor: 'pointer' }}>Clear photo</button>}
            </div>
            <div style={card}>
              <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 10 }}>2 · Context</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                <label><div style={lbl}>SUBJECT</div><select style={inp} value={meta.subject} onChange={e => setMeta({ ...meta, subject: e.target.value })}>{subjects.map(s => <option key={s} value={s}>{s}</option>)}</select></label>
                <label><div style={lbl}>CLASS</div>{classes.length ? <select style={inp} value={meta.klass} onChange={e => setMeta({ ...meta, klass: e.target.value })}>{classes.map(c => <option key={c} value={c}>{c}</option>)}</select> : <input style={inp} value={meta.klass} onChange={e => setMeta({ ...meta, klass: e.target.value })} placeholder="P5" />}</label>
              </div>
              <label style={{ display: 'block', marginTop: 10 }}><div style={lbl}>EXAM NAME</div><input style={inp} value={meta.examName} onChange={e => setMeta({ ...meta, examName: e.target.value })} placeholder="e.g. Term 2 Mid-term" /></label>
              <label style={{ display: 'block', marginTop: 10 }}><div style={lbl}>MARKING GUIDE <span style={{ color: T.ink4 }}>· optional, improves accuracy</span></div><textarea style={{ ...inp, minHeight: 60 }} value={meta.guide} onChange={e => setMeta({ ...meta, guide: e.target.value })} placeholder="Paste the marking scheme / correct answers if you have them." /></label>
              <button onClick={run} disabled={busy || !img} style={{ marginTop: 12, width: '100%', background: T.red, color: '#fff', border: 'none', borderRadius: 9, padding: '11px', fontSize: 13.5, fontWeight: 700, cursor: (busy || !img) ? 'not-allowed' : 'pointer' }}>{busy ? 'Nia is marking…' : '✦ Mark with Nia'}</button>
              {err && <div style={{ marginTop: 10, fontSize: 12, color: T.warn }}>{err}</div>}
            </div>
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            {!marking ? (
              <div style={{ ...card, color: T.ink3, fontSize: 13 }}>Nia's proposed marking will appear here. Nothing saves to a learner until you confirm it.</div>
            ) : (
              <div style={card}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 10 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 700 }}>3 · Nia's proposed marking</div>
                  {conf && <span style={{ fontSize: 10, fontFamily: T.mono, fontWeight: 700, color: conf === 'high' ? T.good : conf === 'low' ? T.warn : T.gold, border: '1px solid ' + (conf === 'high' ? T.good : conf === 'low' ? T.warn : T.gold), borderRadius: 999, padding: '2px 8px' }}>{String(conf).toUpperCase()} CONFIDENCE</span>}
                </div>
                {conf === 'low' && <div style={{ fontSize: 11.5, color: T.warn, marginTop: 6 }}>Nia found this hard to read — re-take the photo in better light, or check every mark below.</div>}
                <div style={{ display: 'flex', alignItems: 'center', gap: 14, margin: '12px 0' }}>
                  <div style={{ fontSize: 30, fontWeight: 800, color: marking.percent >= 80 ? T.good : marking.percent >= 50 ? T.gold : T.warn }}>{marking.percent}%</div>
                  <div><div style={{ fontSize: 13, fontWeight: 700 }}>{marking.total}/{marking.max} · {marking.grade || ''}</div><div style={{ fontSize: 11.5, color: T.ink3 }}>{marking.subject}{meta.examName ? ' · ' + meta.examName : ''}</div></div>
                </div>
                <div style={{ maxHeight: 240, overflow: 'auto', border: '1px solid ' + T.border, borderRadius: 9 }}>
                  {(marking.perQuestion || []).map((q, i) => (
                    <div key={i} style={{ display: 'grid', gridTemplateColumns: '34px 1fr 76px', gap: 8, alignItems: 'center', padding: '8px 10px', borderBottom: i < marking.perQuestion.length - 1 ? '1px solid ' + T.border : 'none' }}>
                      <span style={{ fontSize: 11, fontFamily: T.mono, color: T.ink3 }}>Q{q.q}</span>
                      <div style={{ minWidth: 0 }}><div style={{ fontSize: 12, color: T.ink, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{q.given || '—'}</div>{q.note && <div style={{ fontSize: 10.5, color: T.ink4 }}>{q.note}</div>}</div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 3, justifyContent: 'flex-end' }}><input value={q.marks} onChange={e => setQMark(i, e.target.value)} style={{ width: 38, background: T.bg, border: '1px solid ' + T.border, borderRadius: 6, padding: '5px', fontSize: 12, color: T.ink, textAlign: 'center', outline: 'none' }} /><span style={{ fontSize: 11, color: T.ink4 }}>/{q.max}</span></div>
                    </div>
                  ))}
                </div>
                {marking.feedback && <div style={{ marginTop: 10, fontSize: 12, color: T.ink2, lineHeight: 1.5 }}><b style={{ color: T.ink }}>Feedback:</b> {marking.feedback}</div>}
                {marking.reasoningNotes && <div style={{ marginTop: 6, fontSize: 11.5, color: T.ink3, lineHeight: 1.5 }}><b>How they reason:</b> {marking.reasoningNotes}</div>}

                <div style={{ marginTop: 14, paddingTop: 14, borderTop: '1px solid ' + T.border }}>
                  <div style={lbl}>WHICH LEARNER IS THIS? {marking.studentName ? <span style={{ color: T.ink3 }}>· Nia read "{marking.studentName}"</span> : ''}</div>
                  <select style={inp} value={matchId} onChange={e => setMatchId(e.target.value)}>
                    <option value="">— choose the learner —</option>
                    {students.map(s => <option key={s.id} value={s.id}>{s.name}{s.stream ? ' · ' + s.stream : ''}</option>)}
                  </select>
                  <button onClick={save} disabled={busy || saved} style={{ marginTop: 12, width: '100%', background: saved ? T.good : (T.green || '#00c389'), color: '#062b18', border: 'none', borderRadius: 9, padding: '11px', fontSize: 13.5, fontWeight: 700, cursor: (busy || saved) ? 'default' : 'pointer' }}>{saved ? '✓ Saved to learner' : (busy ? 'Saving…' : 'Confirm & save to learner')}</button>
                </div>
              </div>
            )}
            {recent.length > 0 && (
              <div style={card}>
                <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 10 }}>Recently marked</div>
                {recent.map((r, i) => (
                  <div key={i} style={{ display: 'flex', justifyContent: 'space-between', gap: 10, padding: '7px 0', borderTop: i ? '1px solid ' + T.border : 'none', fontSize: 12.5 }}>
                    <span style={{ color: T.ink, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.studentName} <span style={{ color: T.ink4 }}>· {r.subject}</span></span>
                    <span style={{ fontFamily: T.mono, color: (r.percent >= 50 ? T.good : T.warn) }}>{r.percent}%</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  // ───────── Holistic care plan (used on the student profile) ─────────
  function CarePlan({ stu }) {
    const [plan, setPlan] = useState(null);
    const [exams, setExams] = useState([]);
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState('');
    const sid = stu && stu.id;
    const load = useCallback(() => {
      if (!sid) return;
      osGet('marked_exam').then(rs => setExams(rs.map(x => x.payload).filter(p => p.studentId === sid)));
      osGet('care_plan').then(rs => { const mine = rs.map(x => Object.assign({ _id: x.id }, x.payload)).filter(p => p.studentId === sid).sort((a, b) => String(b.at || '').localeCompare(String(a.at || ''))); if (mine[0]) setPlan(mine[0]); });
    }, [sid]);
    useEffect(load, [load]);

    const generate = () => {
      setBusy(true); setErr('');
      const learner = {
        name: stu.name, stream: stu.stream,
        exams: exams.map(e => ({ subject: e.subject, examName: e.examName, percent: e.percent, total: e.total, max: e.max, grade: e.grade, reasoningNotes: e.reasoningNotes })),
        attendancePct: (stu.attendanceWk != null ? stu.attendanceWk : null),
        feesBalance: (stu.balance != null ? stu.balance : null),
        behaviour: stu.notes ? [].concat(stu.notes).map(n => (typeof n === 'string' ? n : (n.text || ''))).filter(Boolean) : [],
        family: stu.family || stu.background || ''
      };
      fetch(WK + '/exam/care-plan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ learner }) })
        .then(r => r.json()).then(d => {
          setBusy(false);
          if (d.error) { setErr(d.error); return; }
          const rec = { studentId: sid, studentName: stu.name, plan: d.plan, examsCount: exams.length, at: new Date().toISOString() };
          osSave('care_plan', rec).then(() => { setPlan(rec); });
        }).catch(e => { setBusy(false); setErr(String(e.message || e)); });
    };

    const p = plan && plan.plan;
    const sect = (title, items, color) => (Array.isArray(items) && items.length) ? (
      <div style={{ marginTop: 12 }}>
        <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.04em', marginBottom: 6 }}>{title}</div>
        {items.map((it, i) => <div key={i} style={{ fontSize: 12.5, color: T.ink2, lineHeight: 1.5, paddingLeft: 14, position: 'relative', marginBottom: 4 }}><span style={{ position: 'absolute', left: 0, color: color || T.ink4 }}>•</span>{it}</div>)}
      </div>
    ) : null;

    return (
      <div style={{ ...card, marginTop: 14 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
          <div style={{ fontSize: 13.5, fontWeight: 700 }}>Nia's care plan</div>
          <button onClick={generate} disabled={busy} style={{ background: 'transparent', border: '1px solid ' + (T.green || '#00c389'), color: (T.green || '#00c389'), borderRadius: 8, padding: '7px 13px', fontSize: 12, fontWeight: 700, cursor: busy ? 'wait' : 'pointer' }}>{busy ? 'Nia is thinking…' : (plan ? '↻ Refresh plan' : '✦ Generate care plan')}</button>
        </div>

          </div>
        )}
      </div>
    );
  }

  return { Mark, CarePlan };
})();

      if (!q.trim()) return; const question = q.trim(); setQ(''); setMsgs(m => m.concat([{ role: 'me', text: question }])); setBusy(true);

      <Shell eyebrow="ADD-ON · AI STUDENT TUTOR" title="Ask Nia to teach">

          <div style={{ minHeight: 120, maxHeight: 360, overflow: 'auto', marginBottom: 12 }}>
            {msgs.length === 0 ? <div style={{ color: T.ink4, fontSize: 13 }}>Ask anything — "Explain how to add fractions", "What is photosynthesis for P6?", "Help me with a UACE Physics question on projectiles".</div>
              : msgs.map((m, i) => <div key={i} style={{ margin: '8px 0', textAlign: m.role === 'me' ? 'right' : 'left' }}><span style={{ display: 'inline-block', maxWidth: '85%', background: m.role === 'me' ? T.red : T.bg, color: m.role === 'me' ? '#fff' : T.ink, border: '1px solid ' + T.border, borderRadius: 12, padding: '9px 12px', fontSize: 13, lineHeight: 1.6, whiteSpace: 'pre-wrap', textAlign: 'left' }}>{m.text}</span></div>)}
            {busy && <div style={{ color: T.ink4, fontSize: 12 }}>Nia is thinking…</div>}
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <input value={q} onChange={e => setQ(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') send(); }} placeholder="Type a question…" style={{ flex: 1, background: T.bg, border: '1px solid ' + T.border, borderRadius: 9, padding: '10px 12px', fontSize: 13, color: T.ink, outline: 'none' }} />
            <button onClick={send} disabled={busy} style={{ background: T.red, color: '#fff', border: 'none', borderRadius: 9, padding: '10px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>Ask</button>
          </div>
        </div>
      </Shell>
    );
  }

  function Activate({ addonKey }) {

      <Shell eyebrow={'ADD-ON · ' + a.name.toUpperCase()} title={a.name}>

          </div>
          <button onClick={() => { const ph = '256700000000'; window.open('https://wa.me/' + ph + '?text=' + encodeURIComponent('Hello NEXT, please help us set up ' + a.name + ' for ' + ((window.__BRAND_NAME) || 'our school') + '.'), '_blank'); }} style={{ marginTop: 14, background: T.red, color: '#fff', border: 'none', borderRadius: 9, padding: '10px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>Request setup →</button>
        </div>
      </Shell>
    );
  }

  function GateLaunch() {
    const url = '/gate.html?s=' + encodeURIComponent(tenant());
    return (
      <Shell eyebrow="ADD-ON · GATE ATTENDANCE KIOSK" title="Gate Attendance Kiosk">
        <div style={{ ...card, maxWidth: 640 }}>
          <div style={{ fontSize: 38 }}>⊡</div>
          <div style={{ fontSize: 14, color: T.ink2, marginTop: 10, lineHeight: 1.6 }}>A separate full-screen app for a tablet at your gate. A learner faces it → Nia recognises them, logs their arrival, and shows their fees and greeting. If the face isn't recognised, scan their ID/QR card; if all else fails, look them up by name.</div>
          <div style={{ marginTop: 14, padding: 12, background: T.bg, border: '1px solid ' + T.border, borderRadius: 9, fontSize: 12.5, color: T.ink3, lineHeight: 1.6 }}>
            <b style={{ color: T.ink }}>Set up once:</b> open it on the school tablet, tap <b>Enrol faces</b>, and capture each learner's face (stores a signature, not the photo). After that the gate recognises them automatically.<br /><br />
            <b style={{ color: T.ink }}>Fingerprint</b> needs a USB/Bluetooth scanner + bridge — face &amp; ID work on any tablet today.
          </div>
          <div style={{ display: 'flex', gap: 10, marginTop: 14, flexWrap: 'wrap' }}>
            <a href={url} target="_blank" rel="noopener" style={{ background: T.red, color: '#fff', border: 'none', borderRadius: 9, padding: '11px 20px', fontSize: 13.5, fontWeight: 700, cursor: 'pointer', textDecoration: 'none' }}>Open the Gate kiosk →</a>
            <button onClick={() => { try { navigator.clipboard.writeText(location.origin + url); window.peakToast && window.peakToast('Kiosk link copied', 'success', 'Open it on the school tablet & add to home screen.'); } catch (e) {} }} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 9, padding: '11px 16px', fontSize: 13, cursor: 'pointer' }}>Copy tablet link</button>
          </div>
          <div style={{ fontSize: 11, color: T.ink4, marginTop: 10 }}>On the tablet, open the link in Chrome → menu → "Add to Home screen" to install it as its own kiosk app.</div>
        </div>
      </Shell>
    );
  }
  function Addon({ addonKey }) {
    if (addonKey === 'library') return <Library />;
    if (addonKey === 'predictive') return <Predictive />;
    if (addonKey === 'ai_tutor') return <AITutor />;
    if (addonKey === 'biometric') return (
      <Shell eyebrow="ADD-ON · GATE ATTENDANCE KIOSK" title="Gate Attendance Kiosk">
        <div style={{ ...card, maxWidth: 560 }}>
          <div style={{ fontSize: 38 }}>🧪</div>
          <div style={{ fontSize: 14, color: T.ink2, marginTop: 10, lineHeight: 1.6 }}>Face-recognition + ID/QR gate check-in on a school tablet. NEXT is testing this now — once it's proven, we'll switch it on for your school. You'll be among the first to know.</div>
        </div>
      </Shell>
    );
    return <Activate addonKey={addonKey} />;
  }

  return { TIERS, ADDONS, loadPackage, currentTier, entitled, requiredTierFor, addonAvailable, gate, Locked, Plan, Addon, tierObj };
})();
