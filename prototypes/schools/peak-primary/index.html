  <script type="text/babel" data-src="src/peak-events.jsx">
/* PEAK_EVENTS — termly events with coordinators; reads term dates, auto-anchors term start/end, feeds Nia + the calendar. */
window.PEAK_EVENTS = (function () {
  const { useState, useEffect, useCallback } = React;
  const T = window.V4.T;
  const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
  function prof() { return (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile()) || { tenantId: 'peak-primary' }; }
  function tenant() { return prof().tenantId || 'peak-primary'; }
  function osGet(kind) { return fetch(WK + '/os-data?kind=' + kind + '&tenant=' + encodeURIComponent(tenant())).then(r => r.json()).then(d => (d && d.records) || []).catch(() => []); }
  function osSave(kind, record, id) { return fetch(WK + '/os-data/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(id ? { kind, tenant: tenant(), record, id } : { kind, tenant: tenant(), record }) }).then(r => r.json()).catch(e => ({ error: String(e && e.message || e) })); }
  function osDel(id) { return fetch(WK + '/os-data/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) }).then(r => r.json()).catch(() => ({})); }
  const card = { background: T.surface, border: '1px solid ' + T.border, borderRadius: 12, padding: 18 };
  const TYPES = [['event', 'Event'], ['exam', 'Exam'], ['holiday', 'Holiday'], ['meeting', 'Meeting / PTA'], ['sports', 'Sports'], ['trip', 'Trip / visit'], ['term', 'Term marker']];
  const typeColor = (t) => t === 'holiday' ? T.warn : t === 'exam' ? T.red : t === 'term' ? (T.green || '#00c389') : t === 'sports' ? T.gold : (T.navyLite || '#7c8cff');
  const fmtDate = (d) => { try { return new Date(d + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }); } catch (e) { return d; } }

  function Events() {
    const [list, setList] = useState([]);
    const [teachers, setTeachers] = useState([]);
    const [term, setTerm] = useState({ start: '', end: '' });
    const [form, setForm] = useState({ title: '', date: '', type: 'event', coordinator: '', coordinatorEmail: '', notes: '' });
    const [busy, setBusy] = useState(false);

    const load = useCallback(() => {
      osGet('school_event').then(rs => { const ev = rs.map(x => Object.assign({ _id: x.id }, x.payload)).sort((a, b) => String(a.date).localeCompare(String(b.date))); setList(ev); try { window.__SCHOOL_EVENTS = ev.slice(0, 30); } catch (e) {} });
      osGet('term_config').then(rs => { if (rs[0]) { setTerm(rs[0].payload || { start: '', end: '' }); try { window.__TERM = rs[0].payload; } catch (e) {} } });
      fetch(WK + '/teachers?tenant=' + encodeURIComponent(tenant())).then(r => r.json()).then(d => setTeachers((d && d.teachers) || [])).catch(() => {});
    }, []);
    useEffect(load, [load]);

    const add = () => {
      if (!form.title.trim() || !form.date) { window.peakToast && window.peakToast('Title and date needed', 'info'); return; }
      setBusy(true);
      const t = teachers.find(x => String(x.id) === String(form.coordinator));
      const rec = { title: form.title.trim(), date: form.date, type: form.type, coordinator: t ? t.full_name : '', coordinatorEmail: t ? (t.email || '') : '', notes: form.notes.trim(), at: new Date().toISOString() };
      osSave('school_event', rec).then(() => { setBusy(false); setForm({ title: '', date: '', type: form.type, coordinator: '', coordinatorEmail: '', notes: '' }); load(); window.peakToast && window.peakToast('Event added', 'success', rec.title + ' · ' + fmtDate(rec.date)); }).catch(() => setBusy(false));
    };
    const del = (e) => { if (!window.confirm('Remove "' + e.title + '"?')) return; osDel(e._id).then(load); };
    const notify = async (e) => {
      if (!e.coordinatorEmail) { window.peakToast && window.peakToast('No coordinator email', 'info', 'Pick a coordinator with a login to notify them.'); return; }
      try { const sb = window.NextSession && window.NextSession.sb; const tok = sb ? ((await sb.auth.getSession()).data.session || {}).access_token : ''; const res = await window.NX_PUSH.notify({ tenant: tenant(), emails: [e.coordinatorEmail], title: 'You are coordinating: ' + e.title, body: fmtDate(e.date) + (e.notes ? ' — ' + e.notes : ''), url: window.location.pathname, tag: 'event-' + (e._id || Date.now()) }, tok);
        if (res && res.sent > 0) window.peakToast && window.peakToast('Coordinator notified', 'success', e.coordinator + ' · on their phone'); else window.peakToast && window.peakToast('No phone yet', 'info', (e.coordinator || '') + " hasn't enabled phone alerts."); } catch (x) { window.peakToast && window.peakToast('Could not notify', 'info', String(x && x.message || x)); }
    };
    const anchorTerm = () => {
      if (!term.start && !term.end) { window.peakToast && window.peakToast('Set term dates first', 'info', 'Learning → set term start & end.'); return; }
      const have = {}; list.forEach(e => { if (e.type === 'term') have[e.date] = true; });
      const adds = [];
      if (term.start && !have[term.start]) adds.push({ title: 'Term begins', date: term.start, type: 'term', coordinator: '', coordinatorEmail: '', notes: 'Start of term', at: new Date().toISOString() });
      if (term.end && !have[term.end]) adds.push({ title: 'Term ends', date: term.end, type: 'term', coordinator: '', coordinatorEmail: '', notes: 'End of term', at: new Date().toISOString() });
      if (!adds.length) { window.peakToast && window.peakToast('Already on the calendar', 'info'); return; }
      setBusy(true); Promise.all(adds.map(a => osSave('school_event', a))).then(() => { setBusy(false); load(); window.peakToast && window.peakToast('Term added to calendar', 'success', adds.map(a => a.title).join(' · ')); });
    };

    const inp = { width: '100%', background: T.bg, border: '1px solid ' + T.border, borderRadius: 8, padding: '9px 11px', fontSize: 13, color: T.ink, outline: 'none' };
    const lbl = { fontSize: 10, color: T.ink4, fontFamily: T.mono, marginBottom: 4 };
    const today = new Date().toISOString().slice(0, 10);
    const upcoming = list.filter(e => String(e.date) >= today);
    const past = list.filter(e => String(e.date) < today);
    const weeks = (term.start && term.end) ? Math.max(1, Math.round((new Date(term.end) - new Date(term.start)) / 6048e5)) : null;

    return (
      <div style={{ height: '100%', overflow: 'auto', background: T.bg, color: T.ink, fontFamily: T.font, fontSize: 13, padding: '26px 28px 60px' }}>
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', fontWeight: 600, marginBottom: 8 }}>SCHOOL EVENTS &amp; CALENDAR</div>
          <div style={{ fontSize: 26, fontWeight: 700 }}>Termly events</div>
          <div style={{ fontSize: 14, color: T.ink3, marginTop: 6, maxWidth: 680 }}>Add this term's events and who coordinates each. Nia knows your term dates, puts everything on the calendar, and keeps the coordinators in the loop.</div>
        </div>

        <div style={{ ...card, marginBottom: 16, display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 14, flexWrap: 'wrap' }}>
          <div>
            <div style={{ fontSize: 10.5, color: T.ink4, fontFamily: T.mono }}>THIS TERM</div>
            <div style={{ fontSize: 15, fontWeight: 700, marginTop: 4 }}>{term.start && term.end ? (fmtDate(term.start) + '  →  ' + fmtDate(term.end)) : 'Term dates not set'}{weeks ? <span style={{ fontSize: 12, color: T.ink3, fontWeight: 400 }}>  ·  {weeks} weeks</span> : null}</div>
            {!term.start && <div style={{ fontSize: 12, color: T.ink4, marginTop: 4 }}>Set them in Learning → term dates, and Nia anchors the calendar.</div>}
          </div>
          <button onClick={anchorTerm} disabled={busy} style={{ background: 'transparent', border: '1px solid ' + (T.green || '#00c389'), color: (T.green || '#00c389'), borderRadius: 9, padding: '9px 15px', fontSize: 12.5, fontWeight: 700, cursor: 'pointer' }}>＋ Put term start &amp; end on calendar</button>
        </div>

        <div style={{ ...card, marginBottom: 16 }}>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12 }}>Add an event</div>
          <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr', gap: 10 }}>
            <label><div style={lbl}>EVENT</div><input style={inp} value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} placeholder="e.g. Sports Day · PTA meeting · Mid-term exams" /></label>
            <label><div style={lbl}>DATE</div><input style={inp} type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} /></label>
            <label><div style={lbl}>TYPE</div><select style={inp} value={form.type} onChange={e => setForm({ ...form, type: e.target.value })}>{TYPES.map(t => <option key={t[0]} value={t[0]}>{t[1]}</option>)}</select></label>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 10, marginTop: 10 }}>
            <label><div style={lbl}>COORDINATOR (responsible)</div><select style={inp} value={form.coordinator} onChange={e => setForm({ ...form, coordinator: e.target.value })}><option value="">— assign later —</option>{teachers.map(t => <option key={t.id} value={t.id}>{t.full_name}</option>)}</select></label>
            <label><div style={lbl}>NOTE <span style={{ color: T.ink4 }}>· optional</span></div><input style={inp} value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} placeholder="Venue, time, what's needed…" /></label>
          </div>
          <button onClick={add} disabled={busy} style={{ marginTop: 12, background: T.red, color: '#fff', border: 'none', borderRadius: 9, padding: '10px 20px', fontSize: 13.5, fontWeight: 700, cursor: 'pointer' }}>{busy ? 'Saving…' : '+ Add event'}</button>
        </div>

        <div style={card}>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12 }}>Upcoming <span style={{ color: T.ink3, fontWeight: 400 }}>· {upcoming.length}</span></div>
          {upcoming.length === 0 ? <div style={{ color: T.ink4, fontSize: 13 }}>No upcoming events yet. Add one above, or put the term markers on the calendar.</div> : upcoming.map((e, i) => (
            <div key={e._id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 0', borderTop: i ? '1px solid ' + T.border : 'none', flexWrap: 'wrap' }}>
              <div style={{ width: 4, alignSelf: 'stretch', minHeight: 34, borderRadius: 999, background: typeColor(e.type) }} />
              <div style={{ minWidth: 90 }}><div style={{ fontSize: 12, fontWeight: 700, color: typeColor(e.type) }}>{fmtDate(e.date)}</div></div>
              <div style={{ flex: 1, minWidth: 160 }}><div style={{ fontSize: 13.5, fontWeight: 600 }}>{e.title}</div><div style={{ fontSize: 11.5, color: T.ink3 }}>{e.coordinator ? ('Coordinated by ' + e.coordinator) : 'No coordinator yet'}{e.notes ? ' · ' + e.notes : ''}</div></div>
              <div style={{ display: 'flex', gap: 6 }}>
                {e.coordinatorEmail && <button onClick={() => notify(e)} title="Notify the coordinator" style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 7, padding: '5px 10px', fontSize: 11, cursor: 'pointer' }}>🔔 Notify</button>}
                <button onClick={() => del(e)} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink4, borderRadius: 7, width: 26, height: 26, cursor: 'pointer' }}>×</button>
              </div>
            </div>
          ))}
          {past.length > 0 && <div style={{ marginTop: 14, paddingTop: 12, borderTop: '1px solid ' + T.border, fontSize: 11.5, color: T.ink4 }}>{past.length} past event{past.length === 1 ? '' : 's'} this year.</div>}
        </div>
      </div>
    );
  }
  return { Events, typeColor };
})();
  </script>

  <script>
  window.peakExportCSV = function (filename, headers, rows) {
    try {
      var esc = function (v) { v = (v == null ? '' : String(v)); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
      var csv = [headers.map(esc).join(',')].concat(rows.map(function (r) { return r.map(esc).join(','); })).join('\n');
      var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) {}
  };
  window.peakRoster = function () { return (window.PEAK && window.PEAK.students) || []; };
  window.peakCleanPhone = function (p) { p = (p || '').replace(/[^0-9]/g, ''); if (!p) return ''; if (p.charAt(0) === '0') p = '256' + p.slice(1); return p; };
  window.peakWhatsApp = function (phone, message) { var p = window.peakCleanPhone(phone); if (!p) { window.peakToast && window.peakToast('No phone on file', 'info', 'Add a guardian/contact number first.'); return; } window.open('https://wa.me/' + p + (message ? ('?text=' + encodeURIComponent(message)) : ''), '_blank'); };
  window.peakCall = function (phone) { var p = (phone || '').replace(/\s+/g, ''); if (!p) { window.peakToast && window.peakToast('No phone on file', 'info'); return; } window.open('tel:' + p, '_self'); };
  window.peakSchoolName = function () { return (window.__BRAND_NAME) || 'the school'; };
  window.peakShareSchool = function () {
    var t = ''; try { var p = JSON.parse(localStorage.getItem('nextos.profile') || 'null'); t = (p && p.tenantId) || localStorage.getItem('nextos.lastTenant') || ''; } catch (e) {}
    if (!t) { try { t = new URLSearchParams(location.search).get('s') || (location.pathname.match(/\/(?:s|school)\/([A-Za-z0-9_-]+)/) || [])[1] || ''; } catch (e) {} }
    var url = location.origin + '/s/' + encodeURIComponent(t);
    var nm = window.peakSchoolName();
    var data = { title: nm, text: 'Sign in to ' + nm + ' on NEXT OS', url: url };
    if (navigator.share) { navigator.share(data).catch(function () {}); }
    else { try { navigator.clipboard.writeText(url); window.peakToast && window.peakToast('Link copied', 'success', url); } catch (e) { prompt('Copy this link:', url); } }
  };
  window.peakBulkWhatsApp = function (items, label) {
    items = (items || []).filter(function (x) { return x.to && x.text; });
    if (!items.length) { window.peakToast && window.peakToast('No recipients with phone numbers', 'info'); return; }
    window.peakToast && window.peakToast('Sending ' + items.length + ' WhatsApp messages...', 'info', label || '');
    fetch('https://nextos-sentinel.nextafricaai.workers.dev/whatsapp/bulk', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: items }) })
      .then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.error && /not configured/i.test(d.error)) { window.peakToast && window.peakToast('WhatsApp Business API not connected', 'info', 'Add WHATSAPP_TOKEN + WHATSAPP_PHONE_ID to the worker (WHATSAPP-SETUP.md), then this sends for real.'); return; }
        var sent = (d && d.sent) || 0, failed = (d && d.failed) || 0;
        window.peakToast && window.peakToast(sent + ' sent' + (failed ? (' - ' + failed + ' failed') : ''), failed ? 'info' : 'success', label || '');
      }).catch(function (e) { window.peakToast && window.peakToast('Send failed', 'info', String(e.message || e)); });
  };
  window.peakPhoneFor = function (x) { return x.guardianPhone || ('0702341' + ((x.id * 17) % 1000)); };
  window.peakOverdueRecipients = function () { return window.peakRoster().filter(function (x) { return (x.balance || 0) > 0 || x.fees === 'overdue' || x.fees === 'partial'; }).map(function (x) { return { to: window.peakPhoneFor(x), text: 'Dear ' + (x.guardian || 'Parent') + ', a gentle reminder from ' + window.peakSchoolName() + ' regarding ' + x.name + "'s school fees" + (x.balance ? (' (balance UGX ' + Number(x.balance).toLocaleString() + ')') : '') + '. Kindly clear it at your earliest convenience. Thank you.' }; }); };

      const payType = f.payType || 'instant';
      const desc = (f.description || '') + (payee ? ((f.description ? ' · ' : '') + 'Paid to ' + payee) : '');
      setBusy(true);
      fetch(WK + '/finance/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tenant_id: tenant(), txn: { kind: f.kind, category: f.category, description: desc, amount: amt, method: f.method, occurred_at: f.date, created_by: me() } }) })
        .then(r => r.json()).then(res => {
          if (res.error) { setBusy(false); window.peakToast && window.peakToast('Could not save', 'info', res.error); return; }
          if (!isExpense) { setBusy(false); setForm(null); reload(); window.peakToast && window.peakToast('Income recorded', 'success', fmt(amt) + ' · ' + (CAT_LABEL[f.category] || f.category)); return; }
          // Expense → create a stored voucher (receipt for instant, statement entry for long-term)
          const receiptNo = _vchNo();
          const voucher = { receiptNo: receiptNo, payee: payee || (CAT_LABEL[f.category] || f.category), payeeEmail: (f.payeeEmail || '').toLowerCase(), category: f.category, purpose: f.description || (CAT_LABEL[f.category] || f.category), amount: amt, method: f.method || 'cash', date: f.date, payType: payType, status: payType === 'instant' ? 'paid' : 'pending', issuedBy: me(), kindLabel: f.category === 'salaries' ? 'Salary Payment Receipt' : 'Payment Receipt', createdAt: new Date().toISOString() };
          fetch(WK + '/os-data/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'pay_voucher', tenant: tenant(), record: voucher }) })
            .then(r => r.json()).then(() => {
              setBusy(false); setForm(null); reload();
              if (payType === 'instant') { payReceiptPdf(voucher); window.peakToast && window.peakToast('Paid · receipt generated', 'success', payee + ' · ' + fmt(amt)); }
              else { window.peakToast && window.peakToast('Recorded to bank statement', 'success', payee + ' · ' + fmt(amt) + ' · pending'); }
            }).catch(() => { setBusy(false); setForm(null); reload(); });
        }).catch(() => setBusy(false));
    };
    const markVoucherPaid = (v) => {
      const rec = Object.assign({}, v, { status: 'paid', paidAt: new Date().toISOString(), payType: 'instant' }); delete rec._id;
      fetch(WK + '/os-data/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'pay_voucher', tenant: tenant(), record: rec, id: v._id }) })
        .then(r => r.json()).then(() => { payReceiptPdf(rec); reload(); window.peakToast && window.peakToast('Marked paid · receipt generated', 'success', v.payee); }).catch(() => {});
    };
    const ym = new Date().toISOString().slice(0, 7);
    const monthLabel = new Date().toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    const savePay = (rec, id) => fetch(WK + '/os-data/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(id ? { kind: 'staff_pay', tenant: tenant(), record: rec, id: id } : { kind: 'staff_pay', tenant: tenant(), record: rec }) }).then(r => r.json());
    const setMonthly = (st, amount) => {
      const amt = Number(String(amount).replace(/[^0-9]/g, '')) || 0;
      const existing = staffPay.map[st.key];
      const rec = { key: st.key, name: st.name, role: st.role, type: st.type, email: st.email || '', monthly: amt, allowance: (existing && existing.allowance) || st.allowance || 0 };
      savePay(rec, existing && existing._id).then(() => reload());
    };
    const setAllowance = (st, amount) => {
      const amt = Number(String(amount).replace(/[^0-9]/g, '')) || 0;
      const existing = staffPay.map[st.key];
      const rec = { key: st.key, name: st.name, role: st.role, type: st.type, email: st.email || '', monthly: (existing && existing.monthly) || st.monthly || 0, allowance: amt };
      savePay(rec, existing && existing._id).then(() => reload());
    };
    const addSupport = (name, role, monthly) => {
      if (!name.trim()) { window.peakToast && window.peakToast('Enter a name', 'info'); return; }
      const rec = { key: 'sup-' + Date.now(), name: name.trim(), role: role.trim() || 'Support staff', type: 'support', email: '', monthly: Number(String(monthly).replace(/[^0-9]/g, '')) || 0 };
      savePay(rec).then(() => reload());
    };
    const payStaff = (st) => {
      const due = (st.monthly || 0) + (st.allowance || 0);
      setForm({ kind: 'expense', category: 'salaries', payeeName: st.name, payeeEmail: st.email || '', amount: String(due), date: new Date().toISOString().slice(0, 10), payType: 'instant', description: monthLabel + ' pay' + (st.allowance ? ' (salary ' + fmt(st.monthly || 0) + ' + allowance ' + fmt(st.allowance) + ')' : '') });
    };
    const paidThisMonth = (name) => vouchers.some(v => (v.payee || '').toLowerCase() === (name || '').toLowerCase() && String(v.date || '').slice(0, 7) === ym);
    const payrollList = (function () {
      const teaching = (teachers || []).map(t => ({ key: (t.email || t.full_name), name: t.full_name || t.email, email: t.email || '', role: ((t.subjects && t.subjects.length) ? ('Teacher · ' + t.subjects.join('/')) : 'Teacher'), type: 'teaching' }));
      const support = (staffPay.recs || []).filter(r => r.type === 'support').map(r => ({ key: r.key, name: r.name, email: '', role: r.role || 'Support staff', type: 'support' }));
      return teaching.concat(support).map(st => { const p = staffPay.map[st.key]; return Object.assign({}, st, { monthly: (p && p.monthly) || 0, allowance: (p && p.allowance) || 0, paid: paidThisMonth(st.name) }); });
    })();
    const payrollTotal = payrollList.reduce((a, s) => a + (s.monthly || 0), 0);
    const allowanceTotal = payrollList.reduce((a, s) => a + (s.allowance || 0), 0);
    const wageBill = payrollTotal + allowanceTotal;
    const paidTotal = payrollList.filter(s => s.paid).reduce((a, s) => a + (s.monthly || 0) + (s.allowance || 0), 0);
    const needSalary = payrollList.filter(s => !s.monthly).length;
    const unpaidCount = payrollList.filter(s => s.monthly > 0 && !s.paid).length;
    // ── Total outflow = full monthly wage bill (all salaries + allowances, teaching + non-teaching) + operating spend (meals & other operations). ──
    const totalOut = wageBill + operatingOut;
    const net = totalIn - totalOut;
    const saveAsset = (f) => {
      if (!f.name) { window.peakToast && window.peakToast('Enter a name', 'info'); return; } setBusy(true);
      fetch(WK + '/assets/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tenant_id: tenant(), asset: { name: f.name, category: f.category, value: Number(String(f.value).replace(/[^0-9]/g, '')) || 0, condition: f.condition, acquired: f.acquired, notes: f.notes } }) })
        .then(r => r.json()).then(res => { setBusy(false); if (res.error) { window.peakToast && window.peakToast('Could not save', 'info', res.error); return; } setForm(null); reload(); window.peakToast && window.peakToast('Asset added', 'success', f.name); }).catch(() => setBusy(false));
    };

    const SummaryCard = (label, val, color) => (
      <div style={{ ...card, padding: 16 }}>
        <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.05em', fontWeight: 600 }}>{label.toUpperCase()}</div>
        <div style={{ fontSize: 21, fontWeight: 700, color: color || T.ink, marginTop: 6, fontVariantNumeric: 'tabular-nums' }}>{fmt(val)}</div>
      </div>
    );

    return (
      <div style={{ height: '100%', overflow: 'auto', background: T.bg, color: T.ink, fontFamily: T.font, fontSize: 13 }}>
        <header style={{ padding: '22px 28px 16px', borderBottom: '1px solid ' + T.border, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
          <div>
            <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', fontWeight: 600, marginBottom: 8 }}>FINANCE · HEAD TEACHER & BURSAR ONLY</div>
            <div style={{ fontSize: 24, fontWeight: 700, letterSpacing: '-0.02em' }}>Money</div>
            <div style={{ fontSize: 13, color: T.ink3, marginTop: 4 }}>Cash in and out, expenses, surplus and assets — the full financial picture.</div>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button style={btn(false)} onClick={() => setForm({ kind: 'income', category: 'donation', date: new Date().toISOString().slice(0, 10) })}>+ Income</button>
            <button style={btn(true)} onClick={() => setForm({ kind: 'expense', category: 'maintenance', date: new Date().toISOString().slice(0, 10) })}>+ Expense</button>
          </div>
        </header>

        <div style={{ padding: 24 }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 12, marginBottom: 18 }}>
            {SummaryCard('Total inflow', totalIn, T.good)}
            <div style={{ ...card, padding: 16 }} title="Salaries + allowances for all staff, plus meals and other operating spend">
              <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.05em', fontWeight: 600 }}>TOTAL OUTFLOW</div>
              <div style={{ fontSize: 21, fontWeight: 700, color: T.redInk, marginTop: 6, fontVariantNumeric: 'tabular-nums' }}>{fmt(totalOut)}</div>
              <div style={{ fontSize: 10, color: T.ink4, fontFamily: T.mono, marginTop: 6, lineHeight: 1.5 }}>Salaries {fmt(payrollTotal)} · Allowances {fmt(allowanceTotal)}<br/>Operations {fmt(operatingOut)}</div>
            </div>
            {SummaryCard('Net surplus', net, net >= 0 ? T.good : T.redInk)}
            {SummaryCard('Assets value', assetsValue, T.ink)}
          </div>

          <div style={{ display: 'flex', gap: 6, marginBottom: 16 }}>
            {[['flow', 'Cash flow'], ['expenses', 'Expenses'], ['payroll', 'Payroll'], ['vouchers', 'Receipts & statement'], ['assets', 'Assets']].map(o => (
              <button key={o[0]} onClick={() => setTab(o[0])} style={{ border: 'none', background: tab === o[0] ? T.surface2 : 'transparent', color: tab === o[0] ? T.ink : T.ink3, padding: '8px 16px', borderRadius: 8, fontSize: 12.5, fontWeight: 600, cursor: 'pointer' }}>{o[1]}</button>
            ))}
          </div>

          {tab === 'flow' && (
            <div style={card}>
              <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, marginBottom: 10 }}>FEES COLLECTED (from fee system): <span style={{ color: T.good }}>{fmt(feesCollected)}</span> · then your manual entries below</div>
              {txns.length === 0 ? <div style={{ color: T.ink4, fontSize: 13, padding: '8px 0' }}>No transactions yet. Add income or an expense above.</div> : (
                <div style={{ border: '1px solid ' + T.border, borderRadius: 10, overflow: 'hidden' }}>
                  {txns.slice(0, 40).map((t, i) => (
                    <div key={t.id || i} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 14px', borderBottom: i < Math.min(txns.length, 40) - 1 ? '1px solid ' + T.border : 'none' }}>
                      <span style={{ width: 8, height: 8, borderRadius: '50%', background: t.kind === 'income' ? T.good : T.redInk, flexShrink: 0 }} />
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 13, color: T.ink }}>{CAT_LABEL[t.category] || t.category}{t.description ? <span style={{ color: T.ink3 }}> · {t.description}</span> : null}</div>
                        <div style={{ fontSize: 11, color: T.ink4, fontFamily: T.mono }}>{t.occurred_at}{t.method ? (' · ' + t.method) : ''}{t.created_by ? (' · ' + t.created_by) : ''}</div>
                      </div>
                      <div style={{ fontSize: 14, fontWeight: 700, color: t.kind === 'income' ? T.good : T.redInk, fontVariantNumeric: 'tabular-nums' }}>{t.kind === 'income' ? '+' : '−'}{fmt(t.amount)}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {tab === 'expenses' && (
            <div style={card}>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 14 }}>Expenses by category · {fmt(totalOut)} total</div>
              {catRows.length === 0 ? <div style={{ color: T.ink4, fontSize: 13 }}>No expenses recorded yet.</div> : catRows.map(c => (
                <div key={c.k} style={{ marginBottom: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, marginBottom: 5 }}>
                    <span style={{ color: T.ink2 }}>{CAT_LABEL[c.k] || c.k}</span>
                    <span style={{ color: T.ink, fontWeight: 600 }}>{fmt(c.v)}</span>
                  </div>
                  <div style={{ height: 8, background: T.surface2, borderRadius: 4, overflow: 'hidden' }}>
                    <div style={{ height: '100%', width: Math.round(c.v / maxCat * 100) + '%', background: T.redInk, borderRadius: 4 }} />
                  </div>
                </div>
              ))}
            </div>
          )}

          {tab === 'vouchers' && (() => {
            const instant = vouchers.filter(v => v.payType !== 'longterm' && v.status === 'paid');
            const pending = vouchers.filter(v => v.payType === 'longterm' || v.status === 'pending');
            const Row = (v, withAction) => (
              <div key={v._id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 14px', borderBottom: '1px solid ' + T.border }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, color: T.ink, fontWeight: 600 }}>{v.payee} <span style={{ color: T.ink3, fontWeight: 400 }}>· {CAT_LABEL[v.category] || v.category}</span></div>
                  <div style={{ fontSize: 11, color: T.ink4, fontFamily: T.mono }}>{v.receiptNo} · {v.date}{v.method ? (' · ' + v.method) : ''}{v.purpose ? (' · ' + v.purpose) : ''}</div>
                </div>
                <div style={{ fontSize: 14, fontWeight: 700, color: T.redInk, fontVariantNumeric: 'tabular-nums' }}>{fmt(v.amount)}</div>
                {withAction === 'download' ? <button onClick={() => payReceiptPdf(v)} style={{ ...btn(false), padding: '6px 11px', fontSize: 11.5 }}>Receipt</button> : null}
                {withAction === 'pay' ? <button onClick={() => markVoucherPaid(v)} style={{ ...btn(true), padding: '6px 11px', fontSize: 11.5 }}>Mark paid</button> : null}
              </div>
            );
            return (
              <div style={{ display: 'grid', gap: 16 }}>
                <div style={card}>
                  <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>Receipts · instant payments</div>
                  <div style={{ fontSize: 11.5, color: T.ink3, marginBottom: 12 }}>Money already paid out. Each has a downloadable receipt.</div>
                  {instant.length === 0 ? <div style={{ color: T.ink4, fontSize: 13 }}>No instant payments yet.</div> : <div style={{ border: '1px solid ' + T.border, borderRadius: 10, overflow: 'hidden' }}>{instant.map(v => Row(v, 'download'))}</div>}
                </div>
                <div style={card}>
                  <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>Bank statement · long-term & pending</div>
                  <div style={{ fontSize: 11.5, color: T.ink3, marginBottom: 12 }}>Scheduled or deferred payments. Mark paid when the bank clears it — a receipt is generated.</div>
                  {pending.length === 0 ? <div style={{ color: T.ink4, fontSize: 13 }}>Nothing pending.</div> : <div style={{ border: '1px solid ' + T.border, borderRadius: 10, overflow: 'hidden' }}>{pending.map(v => Row(v, 'pay'))}</div>}
                </div>
              </div>
            );
          })()}

          {tab === 'payroll' && (
            <div style={{ display: 'grid', gap: 16 }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 12 }}>
                {SummaryCard('Wage bill / month', wageBill, T.ink)}
                {SummaryCard('Paid · ' + monthLabel, paidTotal, T.good)}
                {SummaryCard('Still to pay', wageBill - paidTotal, (wageBill - paidTotal) > 0 ? T.redInk : T.good)}
              </div>

              {(needSalary > 0 || unpaidCount > 0) && (
                <div style={{ ...card, display: 'flex', gap: 12, alignItems: 'flex-start', borderColor: T.warn }}>
                  <span style={{ width: 26, height: 26, borderRadius: 7, background: T.red, color: '#fff', display: 'grid', placeItems: 'center', fontFamily: 'ui-monospace,monospace', fontSize: 11, fontWeight: 700, flexShrink: 0 }}>AI</span>
                  <div style={{ fontSize: 12.5, color: T.ink2, lineHeight: 1.55 }}>
                    {needSalary > 0 ? <div><b style={{ color: T.ink }}>{needSalary} staff have no salary set.</b> Set their monthly pay below so payroll and the budget reflect the real wage bill.</div> : null}
                    {unpaidCount > 0 ? <div style={{ marginTop: needSalary > 0 ? 6 : 0 }}><b style={{ color: T.ink }}>{unpaidCount} staff are unpaid for {monthLabel}.</b> Tap Pay to record it — it deducts from finances and issues a receipt.</div> : null}
                    {(teachers || []).length === 0 ? <div style={{ marginTop: 6 }}>No teachers are in the system yet — import your teaching staff first so they appear on payroll.</div> : null}
                  </div>
                </div>
              )}

              <div style={card}>
                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>Staff payments · {monthLabel}</div>
                <div style={{ fontSize: 11.5, color: T.ink3, marginBottom: 12 }}>Teaching and non-teaching staff. Set each monthly pay or allowance; paying records the expense and a receipt.</div>
                {payrollList.length === 0 ? <div style={{ color: T.ink4, fontSize: 13 }}>No staff yet. Import teachers, or add support staff below.</div> : (
                  <div style={{ border: '1px solid ' + T.border, borderRadius: 10, overflow: 'hidden' }}>
                    {payrollList.map((st, i) => (
                      <div key={st.key} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 14px', borderBottom: i < payrollList.length - 1 ? '1px solid ' + T.border : 'none', flexWrap: 'wrap' }}>
                        <div style={{ flex: 1, minWidth: 160 }}>
                          <div style={{ fontSize: 13, color: T.ink, fontWeight: 600 }}>{st.name} {st.type === 'support' ? <span style={{ fontSize: 9.5, color: T.ink3, border: '1px solid ' + T.border, borderRadius: 5, padding: '1px 6px', marginLeft: 6 }}>NON-TEACHING</span> : null}</div>
                          <div style={{ fontSize: 11, color: T.ink3 }}>{st.role}</div>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 10, flexWrap: 'wrap' }}>
                          <label style={{ display: 'block' }}><div style={{ fontSize: 9, color: T.ink4, fontFamily: 'ui-monospace,monospace', marginBottom: 2 }}>SALARY</div>
                            <input defaultValue={st.monthly || ''} placeholder="monthly" onBlur={e => { const v = Number(String(e.target.value).replace(/[^0-9]/g, '')) || 0; if (v !== st.monthly) setMonthly(st, v); }} style={{ width: 100, background: T.bg, border: '1px solid ' + T.border, borderRadius: 8, padding: '7px 9px', fontSize: 12.5, color: T.ink, fontFamily: 'ui-monospace,monospace', outline: 'none' }} /></label>
                          <label style={{ display: 'block' }}><div style={{ fontSize: 9, color: T.ink4, fontFamily: 'ui-monospace,monospace', marginBottom: 2 }}>ALLOWANCE</div>
                            <input defaultValue={st.allowance || ''} placeholder="allowance" onBlur={e => { const v = Number(String(e.target.value).replace(/[^0-9]/g, '')) || 0; if (v !== st.allowance) setAllowance(st, v); }} style={{ width: 100, background: T.bg, border: '1px solid ' + T.border, borderRadius: 8, padding: '7px 9px', fontSize: 12.5, color: T.ink, fontFamily: 'ui-monospace,monospace', outline: 'none' }} /></label>
                        </div>
                        {st.paid
                          ? <span style={{ fontSize: 11.5, color: T.good, fontFamily: 'ui-monospace,monospace', minWidth: 96, textAlign: 'right' }}>✓ Paid {fmt((st.monthly||0)+(st.allowance||0))}</span>
                          : <button onClick={() => payStaff(st)} disabled={!((st.monthly||0)+(st.allowance||0))} style={{ background: ((st.monthly||0)+(st.allowance||0)) ? T.red : 'transparent', color: ((st.monthly||0)+(st.allowance||0)) ? '#fff' : T.ink4, border: ((st.monthly||0)+(st.allowance||0)) ? 'none' : '1px solid ' + T.border, borderRadius: 8, padding: '7px 14px', fontSize: 12, fontWeight: 600, cursor: ((st.monthly||0)+(st.allowance||0)) ? 'pointer' : 'not-allowed', minWidth: 96 }}>Pay {fmt((st.monthly||0)+(st.allowance||0))}</button>}
                      </div>
                    ))}
                  </div>
                )}
                <div style={{ marginTop: 14, paddingTop: 14, borderTop: '1px solid ' + T.border }}>
                  <div style={{ fontSize: 11.5, color: T.ink3, fontFamily: 'ui-monospace,monospace', marginBottom: 8 }}>ADD NON-TEACHING STAFF (cook, guard, driver, cleaner…)</div>
                  {(function () {
                    return <SupportAdder onAdd={addSupport} T={T} card={card} />;
                  })()}
                </div>
              </div>
            </div>
          )}

          {tab === 'assets' && (
            <div style={card}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
                <div style={{ fontSize: 13, fontWeight: 700 }}>School assets · {fmt(assetsValue)} total</div>
                <button style={btn(false)} onClick={() => setForm({ asset: true, category: 'equipment', condition: 'good' })}>+ Add asset</button>
              </div>
              {assets.length === 0 ? <div style={{ color: T.ink4, fontSize: 13 }}>No assets registered yet.</div> : (
                <div style={{ border: '1px solid ' + T.border, borderRadius: 10, overflow: 'hidden' }}>
                  {assets.map((a, i) => (
                    <div key={a.id || i} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 14px', borderBottom: i < assets.length - 1 ? '1px solid ' + T.border : 'none' }}>
                      <div style={{ flex: 1 }}><div style={{ fontSize: 13, color: T.ink, fontWeight: 600 }}>{a.name}</div><div style={{ fontSize: 11, color: T.ink4, fontFamily: T.mono }}>{a.category}{a.condition ? (' · ' + a.condition) : ''}</div></div>
                      <div style={{ fontSize: 14, fontWeight: 700, color: T.ink, fontVariantNumeric: 'tabular-nums' }}>{fmt(a.value)}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>

        {form && !form.asset && (
          <FModal title={(form.kind === 'income' ? 'Record income' : 'Record expense')} onClose={() => setForm(null)}>
            <div style={{ padding: 22, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
              <label style={{ gridColumn: 'span 2' }}><div style={{ fontSize: 11, color: T.ink2, marginBottom: 5, fontFamily: T.mono }}>CATEGORY</div>
                <select style={inp} value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}>{(form.kind === 'income' ? INC_CATS : EXP_CATS).map(c => <option key={c} value={c}>{CAT_LABEL[c] || c}</option>)}</select></label>
              <label><div style={{ fontSize: 11, color: T.ink2, marginBottom: 5, fontFamily: T.mono }}>AMOUNT (UGX)</div><input style={inp} value={form.amount || ''} onChange={e => setForm({ ...form, amount: e.target.value })} placeholder="250,000" /></label>
              <label><div style={{ fontSize: 11, color: T.ink2, marginBottom: 5, fontFamily: T.mono }}>DATE</div><input style={inp} type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} /></label>
              <label><div style={{ fontSize: 11, color: T.ink2, marginBottom: 5, fontFamily: T.mono }}>METHOD</div><select style={inp} value={form.method || 'cash'} onChange={e => setForm({ ...form, method: e.target.value })}>{['cash', 'bank', 'mtn', 'airtel', 'cheque'].map(m => <option key={m} value={m}>{m}</option>)}</select></label>
              {form.kind === 'expense' && form.category === 'salaries' && (
                <label style={{ gridColumn: 'span 2' }}><div style={{ fontSize: 11, color: T.ink2, marginBottom: 5, fontFamily: T.mono }}>PAID TO · TEACHER</div>
                  <select style={inp} value={form.payeeEmail || form.payeeName || ''} onChange={e => { const v = e.target.value; const t = teachers.find(x => (x.email || x.full_name) === v); setForm({ ...form, payeeEmail: (t && t.email) || '', payeeName: (t && t.full_name) || v }); }}>
                    <option value="">— choose teacher —</option>
                    {teachers.map((t, i) => <option key={i} value={t.email || t.full_name}>{t.full_name}{t.email ? (' · ' + t.email) : ''}</option>)}
                  </select></label>
              )}
              {form.kind === 'expense' && form.category !== 'salaries' && (
                <label style={{ gridColumn: 'span 2' }}><div style={{ fontSize: 11, color: T.ink2, marginBottom: 5, fontFamily: T.mono }}>PAID TO (optional)</div><input style={inp} value={form.payeeName || ''} onChange={e => setForm({ ...form, payeeName: e.target.value })} placeholder="e.g. Kampala Hardware Ltd" /></label>
              )}
              {form.kind === 'expense' && (
                <div style={{ gridColumn: 'span 2' }}><div style={{ fontSize: 11, color: T.ink2, marginBottom: 6, fontFamily: T.mono }}>PAYMENT TYPE</div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    {[['instant', 'Instant payment', 'Generates a receipt'], ['longterm', 'Long-term', 'Goes to bank statement (pending)']].map(([v, t, sub]) => {
                      const on = (form.payType || 'instant') === v;
                      return <button key={v} onClick={() => setForm({ ...form, payType: v })} style={{ flex: 1, textAlign: 'left', border: '1px solid ' + (on ? T.red : T.border), background: on ? 'rgba(220,40,40,0.06)' : 'transparent', color: T.ink, borderRadius: 9, padding: '9px 11px', cursor: 'pointer' }}><div style={{ fontSize: 12.5, fontWeight: 600 }}>{t}</div><div style={{ fontSize: 10.5, color: T.ink3 }}>{sub}</div></button>;
                    })}
                  </div>
                </div>
              )}
              <label style={{ gridColumn: 'span 2' }}><div style={{ fontSize: 11, color: T.ink2, marginBottom: 5, fontFamily: T.mono }}>{form.kind === 'expense' ? 'PURPOSE / NOTE' : 'DESCRIPTION'}</div><input style={inp} value={form.description || ''} onChange={e => setForm({ ...form, description: e.target.value })} placeholder={form.kind === 'expense' && form.category === 'salaries' ? 'e.g. June salary' : 'e.g. Repair of P3 roof'} /></label>
            </div>
            <div style={{ padding: '0 22px 18px', display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
              <button style={btn(false)} onClick={() => setForm(null)}>Cancel</button>
              <button style={btn(true)} onClick={() => saveTxn(form)} disabled={busy}>{busy ? 'Saving...' : 'Record'}</button>
            </div>
          </FModal>
        )}
        {form && form.asset && (
          <FModal title="Add asset" onClose={() => setForm(null)}>
            <div style={{ padding: 22, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
              <label style={{ gridColumn: 'span 2' }}><div style={{ fontSize: 11, color: T.ink2, marginBottom: 5, fontFamily: T.mono }}>NAME</div><input style={inp} value={form.name || ''} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="e.g. School bus UAR 218V" /></label>
              <label><div style={{ fontSize: 11, color: T.ink2, marginBottom: 5, fontFamily: T.mono }}>CATEGORY</div><select style={inp} value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}>{ASSET_CATS.map(c => <option key={c} value={c}>{c}</option>)}</select></label>
              <label><div style={{ fontSize: 11, color: T.ink2, marginBottom: 5, fontFamily: T.mono }}>VALUE (UGX)</div><input style={inp} value={form.value || ''} onChange={e => setForm({ ...form, value: e.target.value })} placeholder="45,000,000" /></label>
              <label><div style={{ fontSize: 11, color: T.ink2, marginBottom: 5, fontFamily: T.mono }}>CONDITION</div><select style={inp} value={form.condition} onChange={e => setForm({ ...form, condition: e.target.value })}>{['good', 'fair', 'poor'].map(c => <option key={c} value={c}>{c}</option>)}</select></label>
              <label><div style={{ fontSize: 11, color: T.ink2, marginBottom: 5, fontFamily: T.mono }}>ACQUIRED</div><input style={inp} type="date" value={form.acquired || ''} onChange={e => setForm({ ...form, acquired: e.target.value })} /></label>
            </div>
            <div style={{ padding: '0 22px 18px', display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
              <button style={btn(false)} onClick={() => setForm(null)}>Cancel</button>
              <button style={btn(true)} onClick={() => saveAsset(form)} disabled={busy}>{busy ? 'Saving...' : 'Add asset'}</button>
            </div>
          </FModal>
        )}
      </div>
    );
  }
  return { Finance };
})();
  </script>

  <script type="text/babel" data-src="src/peak-learning.jsx">
/* PEAK_LEARNING — Nia turns each class+subject syllabus into period-sized lesson plans paced to the term, teachers tick coverage, carry-over + out-of-order supported. */
window.PEAK_LEARNING = (function () {
  const { useState, useEffect, useCallback, useMemo } = React;
  const T = window.V4.T;
  const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
  const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
  const norm = (x) => String(x || '').toLowerCase().trim();
  function prof() { return (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile()) || { tenantId: 'peak-primary' }; }
  function tenant() { return prof().tenantId || 'peak-primary'; }
  function osGet(kind) { return fetch(WK + '/os-data?kind=' + kind + '&tenant=' + encodeURIComponent(tenant())).then(r => r.json()).then(d => (d && d.records) || []).catch(() => []); }
  function osSave(kind, record, id) { return fetch(WK + '/os-data/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(id ? { kind, tenant: tenant(), record, id } : { kind, tenant: tenant(), record }) }).then(r => r.json()).catch(e => ({ error: String(e && e.message || e) })); }
  const card = { background: T.surface, border: '1px solid ' + T.border, borderRadius: 12, padding: 18 };
  const planKey = (cls, subj) => norm(cls) + '|' + norm(subj);

  function teachingWeeks(term) {
    if (term && term.start && term.end) { const a = new Date(term.start), b = new Date(term.end); const days = Math.max(1, Math.round((b - a) / 86400000)); return Math.max(1, Math.round(days / 7)); }
    return 13;
  }
  function analyzeTimetable(grid) {
    const out = { classes: [], perWeek: {}, teacher: {}, subjectsByClass: {} };
    if (!grid) return out;
    Object.keys(grid).forEach(cls => {
      out.classes.push(cls); const subjSet = {};
      DAYS.forEach(d => { ((grid[cls] && grid[cls][d]) || []).forEach(cell => { if (cell && cell.subject) { const k = planKey(cls, cell.subject); out.perWeek[k] = (out.perWeek[k] || 0) + 1; subjSet[cell.subject] = true; if (cell.teacher && !out.teacher[k]) out.teacher[k] = { email: cell.teacherEmail || '', name: cell.teacher }; } }); });
      out.subjectsByClass[cls] = Object.keys(subjSet);
    });
    return out;
  }
  const coverageOf = (plan) => { const ls = (plan && plan.lessons) || []; const done = ls.filter(l => l.done).length; return { done, total: ls.length, pct: ls.length ? Math.round(done / ls.length * 100) : 0 }; };
  function LessonTags({ L }) {
    const tag = (txt, bg, fg) => <span style={{ fontSize: 8.5, fontFamily: T.mono, fontWeight: 700, letterSpacing: '0.04em', background: bg, color: fg, borderRadius: 5, padding: '1px 6px', marginLeft: 6, verticalAlign: 'middle' }}>{txt}</span>;
    return <>{L.kind === 'practical' ? tag('PRACTICAL', 'rgba(46,160,67,0.18)', T.good) : null}{L.paper ? tag(String(L.paper).toUpperCase(), 'rgba(58,79,156,0.22)', '#a8b4e8') : null}</>;
  }
  function Bar({ pct, color }) { return <div style={{ height: 7, background: T.border, borderRadius: 999, overflow: 'hidden' }}><div style={{ width: (pct || 0) + '%', height: '100%', background: color || T.good, transition: 'width .3s' }} /></div>; }
  function Gauge({ pct, size, label }) {
    pct = Math.max(0, Math.min(100, Math.round(pct || 0)));
    size = size || 78; const r = (size / 2) - 7; const circ = 2 * Math.PI * r; const off = circ * (1 - pct / 100);
    const col = pct >= 80 ? T.good : pct >= 40 ? (T.gold || '#d8a200') : (pct > 0 ? T.warn : T.ink4);
    return (
      <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
        <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={T.border} strokeWidth="7" />
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={col} strokeWidth="7" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={off} style={{ transition: 'stroke-dashoffset .5s' }} />
        </svg>
        <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', textAlign: 'center' }}>
          <div><div style={{ fontSize: size * 0.26, fontWeight: 800, color: T.ink, lineHeight: 1 }}>{pct}%</div>{label && <div style={{ fontSize: size * 0.11, color: T.ink3, fontFamily: T.mono, marginTop: 2, letterSpacing: '0.04em' }}>{label}</div>}</div>
        </div>
      </div>
    );
  }

  // ───────────────────────── HEAD CONSOLE ─────────────────────────
  function HeadLearning() {
    const [tt, setTt] = useState(null);
    const [term, setTerm] = useState({ start: '', end: '' });
    const [termId, setTermId] = useState(null);
    const [plans, setPlans] = useState({}); // key -> {_id, ...record}
    const [busyKey, setBusyKey] = useState('');
    const [open, setOpen] = useState('');
    const [msg, setMsg] = useState('');

    const loadAll = useCallback(() => {
      osGet('timetable').then(rs => { const p = rs[0] && rs[0].payload; setTt(p || { grid: {}, periods: [] }); });
      osGet('term_config').then(rs => { if (rs[0]) { setTermId(rs[0].id); setTerm(rs[0].payload || { start: '', end: '' }); } });
      osGet('syllabus_plan').then(rs => { const m = {}; rs.forEach(x => { const p = x.payload || {}; if (p.class && p.subject) m[planKey(p.class, p.subject)] = Object.assign({ _id: x.id }, p); }); setPlans(m); });
    }, []);
    useEffect(loadAll, [loadAll]);

    const ana = useMemo(() => analyzeTimetable(tt && tt.grid), [tt]);
    const weeks = teachingWeeks(term);
    const level = (window.SCHOOL_CONFIG && window.SCHOOL_CONFIG.type) || 'primary';

    const saveTerm = () => { osSave('term_config', { start: term.start, end: term.end }, termId).then(r => { if (r && r.record && r.record.id) setTermId(r.record.id); window.peakToast && window.peakToast('Term saved', 'success', weeks + ' teaching weeks'); }); };

    const generate = async (cls, subj) => {
      const k = planKey(cls, subj); setBusyKey(k); setMsg('');
      const perWk = ana.perWeek[k] || 0;
      const lessons = Math.max(6, perWk * weeks);
      try {
        const res = await fetch(WK + '/syllabus/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ class: cls, subject: subj, lessons: lessons, level: level }) }).then(r => r.json());
        if (!res || res.error || !res.lessons) { setBusyKey(''); window.peakToast && window.peakToast('Could not generate', 'info', (res && res.error) || 'Try again.'); return; }
        const tch = ana.teacher[k] || {};
        const existing = plans[k];
        const rec = { class: cls, subject: subj, teacherEmail: tch.email || '', teacherName: tch.name || '', perWeek: perWk, weeks: weeks, totalLessons: res.lessons.length, lessons: res.lessons, generatedAt: new Date().toISOString() };
        const r2 = await osSave('syllabus_plan', rec, existing && existing._id);
        setBusyKey(''); loadAll();
        window.peakToast && window.peakToast('Nia built the scheme of work', 'success', cls + ' ' + subj + ' · ' + res.lessons.length + ' lessons');
      } catch (e) { setBusyKey(''); window.peakToast && window.peakToast('Generation failed', 'info', String(e && e.message || e)); }
    };

    const rows = [];
    ana.classes.forEach(cls => (ana.subjectsByClass[cls] || []).forEach(subj => rows.push({ cls, subj, k: planKey(cls, subj) })));
    const overallDone = Object.values(plans).reduce((a, p) => a + coverageOf(p).done, 0);
    const overallTotal = Object.values(plans).reduce((a, p) => a + coverageOf(p).total, 0);

    return (
      <div style={{ height: '100%', overflow: 'auto', background: T.bg, color: T.ink, fontFamily: T.font, fontSize: 13, padding: '26px 30px 60px' }}>
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', fontWeight: 600, marginBottom: 8 }}>LEARNING · SYLLABUS COVERAGE</div>
          <div style={{ fontSize: 26, fontWeight: 700, letterSpacing: '-0.02em' }}>Schemes of work &amp; coverage</div>
          <div style={{ fontSize: 14, color: T.ink3, marginTop: 6, maxWidth: 680 }}>Nia breaks each class's syllabus into period-sized lessons, paced across the term so it finishes on time. Teachers tick each lesson as taught — coverage updates here automatically.</div>
        </div>

        <div style={{ ...card, marginBottom: 16, display: 'flex', gap: 16, alignItems: 'flex-end', flexWrap: 'wrap' }}>
          <div><div style={{ fontSize: 10, color: T.ink4, fontFamily: T.mono, marginBottom: 4 }}>TERM STARTS</div><input type="date" value={term.start} onChange={e => setTerm({ ...term, start: e.target.value })} style={{ background: T.bg, border: '1px solid ' + T.border, borderRadius: 8, padding: '8px 10px', color: T.ink, fontSize: 13, outline: 'none' }} /></div>
          <div><div style={{ fontSize: 10, color: T.ink4, fontFamily: T.mono, marginBottom: 4 }}>TERM ENDS</div><input type="date" value={term.end} onChange={e => setTerm({ ...term, end: e.target.value })} style={{ background: T.bg, border: '1px solid ' + T.border, borderRadius: 8, padding: '8px 10px', color: T.ink, fontSize: 13, outline: 'none' }} /></div>
          <button onClick={saveTerm} style={{ background: T.red, color: '#fff', border: 'none', borderRadius: 9, padding: '9px 16px', fontSize: 12.5, fontWeight: 700, cursor: 'pointer' }}>Save term</button>
          <div style={{ fontSize: 12, color: T.ink3 }}>{term.start && term.end ? weeks + ' teaching weeks' : 'No dates set — Nia assumes a standard 13-week term'}</div>
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 10 }}><span style={{ fontSize: 10, color: T.ink4, fontFamily: T.mono }}>SCHOOL<br/>COVERAGE</span><Gauge pct={overallTotal ? (overallDone / overallTotal * 100) : 0} size={72} /></div>
        </div>

        {rows.length === 0 ? <div style={{ ...card, color: T.ink3 }}>No timetable yet. Build the class timetable first (Timetable → Auto-generate) so Nia knows each class's subjects and how many periods they get a week.</div> : (
          <div style={{ ...card, padding: 0, overflow: 'hidden' }}>
            {rows.map((r, i) => {
              const p = plans[r.k]; const cov = coverageOf(p); const perWk = ana.perWeek[r.k] || 0; const tch = ana.teacher[r.k] || {}; const target = Math.max(6, perWk * weeks);
              const isOpen = open === r.k;
              return (
                <div key={r.k} style={{ borderBottom: i < rows.length - 1 ? '1px solid ' + T.border : 'none' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '12px 16px', flexWrap: 'wrap' }}>
                    <div style={{ minWidth: 160, flex: 1 }}>
                      <div style={{ fontSize: 13.5, fontWeight: 600 }}>{r.cls} · {r.subj}</div>
                      <div style={{ fontSize: 11, color: T.ink3 }}>{tch.name || 'No teacher assigned'} · {perWk} period{perWk === 1 ? '' : 's'}/week</div>
                    </div>
                    <div style={{ width: 180 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}><Gauge pct={p ? cov.pct : 0} size={48} /><div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono }}>{p ? (cov.done + '/' + cov.total + ' lessons') : ('not generated\u00b7 ~' + target + ' lessons')}</div></div>
                    </div>
                    <button onClick={() => generate(r.cls, r.subj)} disabled={busyKey === r.k} style={{ background: p ? 'transparent' : T.red, color: p ? T.ink2 : '#fff', border: p ? '1px solid ' + T.border : 'none', borderRadius: 8, padding: '8px 13px', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>{busyKey === r.k ? 'Nia is planning…' : (p ? 'Regenerate' : 'Generate with Nia')}</button>
                    {p && <button onClick={() => setOpen(isOpen ? '' : r.k)} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink3, borderRadius: 8, padding: '8px 12px', fontSize: 12, cursor: 'pointer' }}>{isOpen ? 'Hide' : 'View'}</button>}
                  </div>
                  {isOpen && p && (
                    <div style={{ padding: '0 16px 16px', maxHeight: 320, overflow: 'auto' }}>
                      {(p.lessons || []).map((L, j) => (
                        <div key={j} style={{ display: 'flex', gap: 10, padding: '7px 0', borderTop: '1px solid ' + T.border, opacity: L.done ? 0.6 : 1 }}>
                          <span style={{ fontSize: 11, color: L.done ? T.good : T.ink4, fontFamily: T.mono, minWidth: 26 }}>{L.done ? '✓' : (j + 1)}</span>
                          <div><div style={{ fontSize: 12.5, fontWeight: 600, textDecoration: L.done ? 'line-through' : 'none' }}>{L.title}<LessonTags L={L} /></div><div style={{ fontSize: 11, color: T.ink3 }}>{L.topic}{L.objective ? ' — ' + L.objective : ''}</div></div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  // ───────────────────────── TEACHER VIEW ─────────────────────────
  function TeacherLessonPlan({ email }) {
    const myEmail = norm(email || (prof().email) || '');
    const [plans, setPlans] = useState([]);
    const [loading, setLoading] = useState(true);
    const [adding, setAdding] = useState('');
    const [newTopic, setNewTopic] = useState('');

    const load = useCallback(() => { osGet('syllabus_plan').then(rs => { const mine = rs.map(x => Object.assign({ _id: x.id }, x.payload)).filter(p => p.lessons && (!myEmail || norm(p.teacherEmail) === myEmail)); setPlans(mine); setLoading(false); }); }, [myEmail]);
    useEffect(load, [load]);

    const persist = (plan) => { const rec = Object.assign({}, plan); delete rec._id; osSave('syllabus_plan', rec, plan._id).then(() => load()); };
    const toggle = (plan, idx) => { const ls = plan.lessons.slice(); const cur = ls[idx]; ls[idx] = Object.assign({}, cur, { done: !cur.done, doneAt: !cur.done ? new Date().toISOString() : null }); persist(Object.assign({}, plan, { lessons: ls })); };
    const addTaught = (plan) => { if (!newTopic.trim()) return; const ls = plan.lessons.slice(); ls.push({ seq: ls.length + 1, topic: 'Added by teacher', title: newTopic.trim(), objective: '', done: true, doneAt: new Date().toISOString() }); persist(Object.assign({}, plan, { lessons: ls, totalLessons: ls.length })); setAdding(''); setNewTopic(''); };

    if (loading) return <div style={{ padding: 30, color: T.ink3 }}>Loading your lesson plans…</div>;
    if (!plans.length) return (
      <div style={{ ...card, margin: 24 }}>
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 6 }}>No lesson plans yet</div>
        <div style={{ fontSize: 13, color: T.ink3 }}>Once your head generates the scheme of work for your class & subject in Learning, Nia's lesson-by-lesson plan appears here for you to tick off as you teach.</div>
      </div>
    );

    return (
      <div style={{ display: 'grid', gap: 16 }}>
        {plans.map((plan) => {
          const cov = coverageOf(plan); const curIdx = plan.lessons.findIndex(l => !l.done); const current = curIdx >= 0 ? plan.lessons[curIdx] : null;
          return (
            <div key={plan._id} style={card}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 14, flexWrap: 'wrap', marginBottom: 4 }}>
                <div><div style={{ fontSize: 16, fontWeight: 700 }}>{plan.class} · {plan.subject}</div><div style={{ fontSize: 12, color: T.ink3, fontFamily: T.mono, marginTop: 2 }}>{cov.done}/{cov.total} lessons taught</div></div>
                <Gauge pct={cov.pct} size={84} label="COVERED" />
              </div>
              {current ? (
                <div style={{ marginTop: 14, background: 'rgba(226,58,82,0.06)', border: '1px solid ' + T.red, borderRadius: 10, padding: 14 }}>
                  <div style={{ fontSize: 10, color: T.red, fontFamily: T.mono, fontWeight: 700, letterSpacing: '0.05em', marginBottom: 4 }}>TODAY'S LESSON · #{curIdx + 1}</div>
                  <div style={{ fontSize: 14, fontWeight: 700 }}>{current.title}<LessonTags L={current} /></div>
                  <div style={{ fontSize: 12, color: T.ink2, marginTop: 3 }}>{current.topic}{current.objective ? ' — ' + current.objective : ''}</div>
                  <div style={{ display: 'flex', gap: 8, marginTop: 12, alignItems: 'center', flexWrap: 'wrap' }}>
                    <button onClick={() => toggle(plan, curIdx)} style={{ background: T.green || '#00c389', color: '#062b18', border: 'none', borderRadius: 9, padding: '9px 16px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>✓ Mark taught</button>
                    <span style={{ fontSize: 11.5, color: T.ink3 }}>Nia: tick this once you've taught it — the next lesson unlocks only when this is done.</span>
                  </div>
                </div>
              ) : <div style={{ marginTop: 14, color: T.good, fontSize: 13, fontWeight: 600 }}>✓ Syllabus fully covered for this class. Well done.</div>}

              <details style={{ marginTop: 14 }}>
                <summary style={{ cursor: 'pointer', fontSize: 12.5, color: T.ink2 }}>Full scheme of work ({cov.total} lessons) · tick any you've taught</summary>
                <div style={{ marginTop: 10, maxHeight: 300, overflow: 'auto' }}>
                  {plan.lessons.map((L, j) => (
                    <label key={j} style={{ display: 'flex', gap: 10, padding: '7px 0', borderTop: '1px solid ' + T.border, cursor: 'pointer', alignItems: 'flex-start' }}>
                      <input type="checkbox" checked={!!L.done} onChange={() => toggle(plan, j)} style={{ marginTop: 3 }} />
                      <div><div style={{ fontSize: 12.5, fontWeight: 600, textDecoration: L.done ? 'line-through' : 'none', color: L.done ? T.ink3 : T.ink }}>{j + 1}. {L.title}<LessonTags L={L} /></div><div style={{ fontSize: 11, color: T.ink3 }}>{L.topic}{L.objective ? ' — ' + L.objective : ''}</div></div>
                    </label>
                  ))}
                </div>
                {adding === plan._id ? (
                  <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
                    <input autoFocus value={newTopic} onChange={e => setNewTopic(e.target.value)} placeholder="Topic you taught out of order…" style={{ flex: 1, background: T.bg, border: '1px solid ' + T.border, borderRadius: 8, padding: '8px 10px', fontSize: 12.5, color: T.ink, outline: 'none' }} />
