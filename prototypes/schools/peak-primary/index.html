        {actions && <div style={{ display: 'flex', gap: 10 }}>{actions}</div>}
      </header>
    );
  }

  function Card({ children, style, pad = 22, title, action }) {
    return (
      <div style={{
        background: T.surface, border: '1px solid ' + T.border, borderRadius: 14,
        padding: pad, position: 'relative', ...style,
      }}>
        {(title || action) && (
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 16 }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, color: T.ink, letterSpacing: '-0.005em' }}>{title}</div>
            {action}
          </div>
        )}
        {children}
      </div>
    );
  }

  function PrimaryBtn({ children, onClick }) {
    return <button onClick={onClick} style={{
      padding: '9px 16px', background: T.red, color: '#fff', border: 'none',
      borderRadius: 9, fontSize: 12.5, fontWeight: 600, cursor: 'pointer', fontFamily: T.font,
    }}>{children}</button>;
  }
  function GhostBtn({ children, onClick }) {
    return <button onClick={onClick} style={{
      padding: '8px 14px', background: 'transparent', color: T.ink2,
      border: '1px solid ' + T.borderStr, borderRadius: 9, fontSize: 12.5, fontWeight: 500, cursor: 'pointer', fontFamily: T.font,
    }}>{children}</button>;
  }

  // ═════════════════════════════════════════════════════════════════════════
  // ATTENDANCE · stream picker + register marking
  // ═════════════════════════════════════════════════════════════════════════
  function Attendance({ store }) {
    const [streamId, setStreamId] = useState('P5V');
    const streamRoster = useMemo(() => D.students.filter(s => s.stream === streamId), [streamId]);
    // local register state — initialized as everyone-present
    const [marks, setMarks] = useState(() => {
      const m = {};
      streamRoster.forEach(s => { m[s.id] = 'present'; });
      // pre-set the known risk students as absent
      if (streamId === 'P5V') { m[4] = 'absent'; } // Brian
      return m;
    });

    // re-sync marks when stream changes
    React.useEffect(() => {
      const m = {};
      D.students.filter(s => s.stream === streamId).forEach(s => { m[s.id] = 'present'; });
      if (streamId === 'P5V') m[4] = 'absent';
      setMarks(m);
    }, [streamId]);

    const counts = useMemo(() => {
      const c = { present: 0, absent: 0, late: 0 };
      Object.values(marks).forEach(v => { c[v] = (c[v] || 0) + 1; });
      return c;
    }, [marks]);

    const setMark = (id, status) => setMarks(cur => ({ ...cur, [id]: status }));

    const saveRegister = () => {
      const updates = Object.entries(marks).map(([id, status]) => ({ studentId: Number(id), status }));
      const presentCount = store.markAttendance(updates);
      window.peakToast('Register saved · ' + streamId, 'success',
        counts.present + ' present · ' + counts.absent + ' absent · ' + counts.late + ' late. Guardians of absentees notified.');
    };

    const markAllPresent = () => {
      const m = {};
      streamRoster.forEach(s => { m[s.id] = 'present'; });
      setMarks(m);
      window.peakToast('All marked present', 'info');
    };

    const streamLabel = D.streams.find(s => s.id === streamId)?.label || streamId;
    const totalInStream = streamRoster.length || 1;
    const presentPct = Math.round((counts.present / totalInStream) * 100);

    return (
      <div>
        <PageHeader
          eyebrow="Attendance · Thursday 14 May · 08:24"
          title="Daily register"
          subtitle="Mark attendance for each stream. Register closes 08:30. Guardians of absent students are auto-messaged."
          actions={
            <>
              <GhostBtn onClick={markAllPresent}>All present</GhostBtn>
              <PrimaryBtn onClick={saveRegister}>Save register</PrimaryBtn>
            </>
          }
        />

        {/* school-wide bar */}
        <div style={{ padding: '18px 28px 0' }}>
          <Card pad={18} style={{ marginBottom: 14 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
              <div>
                <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', fontWeight: 600 }}>SCHOOL-WIDE · TODAY</div>
                <div style={{ fontSize: 28, fontWeight: 700, color: T.ink, marginTop: 4, fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.02em' }}>
                  793 <span style={{ fontSize: 16, color: T.ink3, fontWeight: 600 }}>of 842 marked · 94.2%</span>
                </div>
              </div>
              <Pill tone="good">▲ +2.4 vs avg</Pill>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(14, 1fr)', gap: 4 }}>
              {D.streams.map(s => {
                const pct = D.streamAttendance[s.id] || 90;
                const isCur = s.id === streamId;
                const tone = pct >= 95 ? T.good : pct >= 88 ? T.warn : T.red;
                return (
                  <button key={s.id} onClick={() => setStreamId(s.id)} style={{
                    padding: '8px 4px', borderRadius: 8,
                    background: isCur ? T.surface3 : T.surface2,
                    border: '1px solid ' + (isCur ? T.navyLite : T.border),
                    color: T.ink, cursor: 'pointer', textAlign: 'center',
                    fontFamily: T.font,
                  }}>
                    <div style={{ fontSize: 10.5, fontFamily: T.mono, color: T.ink3, fontWeight: 600 }}>{s.id}</div>
                    <div style={{ fontSize: 16, fontWeight: 700, color: tone, marginTop: 2, fontVariantNumeric: 'tabular-nums' }}>{pct}%</div>
                  </button>
                );
              })}
            </div>
          </Card>
        </div>

        {/* register table */}
        <div style={{ padding: '0 28px 32px' }}>
          <Card pad={0}>
            <div style={{ padding: '18px 22px', borderBottom: '1px solid ' + T.border, display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12 }}>
              <div>
                <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', fontWeight: 600 }}>SELECTED STREAM</div>
                <div style={{ fontSize: 19, fontWeight: 700, color: T.ink, marginTop: 4 }}>{streamLabel}</div>
              </div>
              <div style={{ display: 'flex', gap: 10 }}>
                <Pill tone="good">{counts.present || 0} present</Pill>
                <Pill tone="bad">{counts.absent || 0} absent</Pill>
                <Pill tone="warn">{counts.late || 0} late</Pill>
                <Pill tone="brand">{presentPct}% of stream</Pill>
              </div>
            </div>
            {streamRoster.length === 0 ? (
              <div style={{ padding: '40px 24px', textAlign: 'center', color: T.ink3, fontSize: 13 }}>
                No students enrolled in {streamLabel} yet. Use <strong style={{ color: T.ink }}>Add student</strong> on the Students page.
              </div>
            ) : (
              <div>
                {streamRoster.map((s, i) => {
                  const mark = marks[s.id] || 'present';
                  return (
                    <div key={s.id} style={{
                      display: 'grid', gridTemplateColumns: '44px 1fr 1fr 320px',
                      gap: 12, alignItems: 'center',
                      padding: '12px 22px',
                      borderTop: i > 0 ? '1px solid ' + T.border : 'none',
                    }}>
                      <div style={{ fontFamily: T.mono, fontSize: 11, color: T.ink3 }}>#{(i + 1).toString().padStart(2, '0')}</div>
                      <div>
                        <div style={{ fontSize: 13.5, color: T.ink, fontWeight: 600 }}>{s.name}</div>
                        <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, marginTop: 2 }}>Last seen: {s.lastSeen}</div>
                      </div>
                      <div style={{ fontSize: 11.5, color: T.ink3 }}>{s.guardian}</div>
                      <div style={{ display: 'flex', gap: 6, justifyContent: 'flex-end' }}>
                        {[
                          { k: 'present', l: 'Present', c: T.good },
                          { k: 'late',    l: 'Late',    c: T.warn },
                          { k: 'absent',  l: 'Absent',  c: T.red },
                        ].map(opt => {
                          const sel = mark === opt.k;
                          return (
                            <button key={opt.k} onClick={() => setMark(s.id, opt.k)} style={{
                              padding: '8px 16px', borderRadius: 8, border: 'none',
                              background: sel ? opt.c : T.surface2,
                              color: sel ? '#fff' : T.ink2,
                              fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: T.font,
                              transition: 'background 0.12s',
                            }}>{opt.l}</button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </Card>
        </div>
      </div>
    );
  }

  // ═════════════════════════════════════════════════════════════════════════

                style={{
                  background: T.surface, border: '1px solid ' + T.border, borderRadius: 9,

            {filtered.map(t => {
              const initials = t.name.replace(/^(Mrs?|Mr|Ms|Miss)\.?\s+/i, '').split(' ').map(p => p[0]).slice(0,2).join('');
              const isSel = t.id === selectedId;
              return (
                <button key={t.id} onClick={() => setSelectedId(t.id)} style={{
                  textAlign: 'left', cursor: 'pointer',
                  background: isSel ? T.surface2 : T.surface,
                  border: '1px solid ' + (isSel ? T.borderStr : T.border),
                  borderRadius: 12, padding: 16,
                  fontFamily: T.font, color: T.ink,
                  transition: 'background 0.12s, border-color 0.12s',
                }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12 }}>
                    <div style={{
                      width: 44, height: 44, borderRadius: 11,

                    {t.tone === 'top' && <Pill tone="gold">★</Pill>}

                      <span key={st} style={{ fontSize: 10.5, fontFamily: T.mono, color: T.ink3, background: T.bg, padding: '2px 7px', borderRadius: 5 }}>{st === 'all' ? 'whole school' : st}</span>

            {filtered.length === 0 && (
              <div style={{ gridColumn: '1 / -1', padding: '40px 0', textAlign: 'center', color: T.ink3, fontSize: 13 }}>

                  width: 52, height: 52, borderRadius: 13,
                  background: 'oklch(0.58 0.09 ' + (40 + (selected.id.charCodeAt(1) * 47) % 320) + ')',
                  color: '#fff', display: 'grid', placeItems: 'center', fontSize: 17, fontWeight: 700,

                    <span style={{ width: 22, height: 22, borderRadius: 6, background: T.red, color: '#fff', display: 'grid', placeItems: 'center', fontFamily: T.mono, fontSize: 10, fontWeight: 700 }}>AI</span>
                    <span style={{ fontSize: 12, fontWeight: 600 }}>This week's note</span>

                  <div style={{ fontSize: 12.5, color: T.ink2, lineHeight: 1.55 }}>
                    {selected.tone === 'top'
                      ? selected.name.split(' ')[1] + ' has the highest quiz-completion rate this term. Strong consistency.'

                  </div>
                </div>
              </div>
            </Card>
          </div>
        </div>
      </div>
    );
  }

  function Transport() {

    const statusMap = {
      'on-route':  { tone: 'good',  label: 'On route'  },
      'delayed':   { tone: 'bad',   label: 'Delayed'   },

                'repeating-linear-gradient(45deg, ' + T.surface2 + ' 0px, ' + T.surface2 + ' 8px, ' + T.bg + ' 8px, ' + T.bg + ' 16px)',

                <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', color: T.ink3, fontFamily: T.mono, fontSize: 11, letterSpacing: '0.06em' }}>
                  [ LIVE GPS MAP · {sel.route.toUpperCase()} ]
                </div>
                {/* fake route dots */}
                {[20, 35, 50, 62, 75, 88].slice(0, sel.stops).map((p, i) => (
                  <div key={i} style={{
                    position: 'absolute', left: p + '%', top: (40 + Math.sin(i * 1.4) * 25) + '%',
                    width: 12, height: 12, borderRadius: 999,
                    background: i === 1 ? T.red : T.surface, border: '2px solid ' + (i === 1 ? '#fff' : T.borderStr),
                    transform: 'translate(-50%,-50%)',
                  }} />
                ))}
              </div>

              <div style={{ padding: 22, display: 'flex', flexDirection: 'column', gap: 14 }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                  <div>
                    <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.05em', fontWeight: 600 }}>STUDENTS</div>
                    <div style={{ fontSize: 20, fontWeight: 700, color: T.ink, marginTop: 4, fontVariantNumeric: 'tabular-nums' }}>{sel.students}</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.05em', fontWeight: 600 }}>STOPS</div>
                    <div style={{ fontSize: 20, fontWeight: 700, color: T.ink, marginTop: 4, fontVariantNumeric: 'tabular-nums' }}>{sel.stops}</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.05em', fontWeight: 600 }}>ETA</div>
                    <div style={{ fontSize: 18, fontWeight: 700, color: T.gold, marginTop: 4 }}>{sel.eta}</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.05em', fontWeight: 600 }}>STATUS</div>
                    <div style={{ marginTop: 6 }}><Pill tone={statusMap[sel.status].tone}>{statusMap[sel.status].label}</Pill></div>

                  <GhostBtn onClick={() => window.peakCall(sel.phone || sel.driverPhone || '')}>Call driver</GhostBtn>

                </div>
              </div>
            </Card>
          </div>
        </div>

  // ═════════════════════════════════════════════════════════════════════════
  // LEARNING · subjects, assignments, completion
  // ═════════════════════════════════════════════════════════════════════════
  function Learning() {
    const [filter, setFilter] = useState('all'); // all | active | high
    const visible = useMemo(() => {
      if (filter === 'active') return D.subjects.filter(s => s.active > 0);
      if (filter === 'low')    return D.subjects.filter(s => s.complete < 80);
      return D.subjects;
    }, [filter]);

    return (
      <div>
        <PageHeader
          eyebrow="Learning · Term 2 · Week 6"
          title="Subjects & assignments"
          subtitle="Live homework completion, lesson plans, and AI-flagged topics that need attention."
          actions={
            <>
              <div style={{ display: 'flex', gap: 4, padding: 3, background: T.surface, border: '1px solid ' + T.border, borderRadius: 9 }}>
                {[
                  { k: 'all',    l: 'All' },
                  { k: 'active', l: 'Active' },
                  { k: 'low',    l: 'Needs attention' },
                ].map(o => (
                  <button key={o.k} onClick={() => setFilter(o.k)} style={{
                    border: 'none', background: filter === o.k ? T.red : 'transparent',
                    color: filter === o.k ? '#fff' : T.ink2,
                    padding: '6px 14px', borderRadius: 6,
                    fontSize: 12, fontWeight: 600, cursor: 'pointer',
                  }}>{o.l}</button>
                ))}
              </div>
              <PrimaryBtn onClick={() => window.peakModal && window.peakModal.open(React.createElement(window.PEAK_FORMS.NewAssignment))}>+ New assignment</PrimaryBtn>
            </>
          }
        />

        <div style={{ padding: '18px 28px 32px', display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(340px, 1fr))', gap: 14 }}>
          {visible.map(s => {
            const tone = s.color === 'red' ? T.red : s.color === 'warn' ? T.warn : s.color === 'gold' ? T.gold : T.good;
            const completionTone = s.complete >= 90 ? 'good' : s.complete >= 75 ? 'warn' : 'bad';
            return (
              <Card key={s.id} pad={18}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12 }}>
                  <div>
                    <div style={{ fontSize: 15, fontWeight: 700, color: T.ink, letterSpacing: '-0.005em' }}>{s.name}</div>
                    <div style={{ fontSize: 11.5, color: T.ink3, fontFamily: T.mono, marginTop: 3 }}>{s.stream === 'all' ? 'whole school' : s.stream} · {s.teacher}</div>
                  </div>
                  <Pill tone={completionTone}>{s.complete}% done</Pill>
                </div>
                <div style={{ height: 6, background: T.bg, borderRadius: 999, marginBottom: 14, overflow: 'hidden' }}>
                  <div style={{ height: '100%', width: s.complete + '%', background: tone, borderRadius: 999 }} />
                </div>
                <div style={{
                  background: T.surface2, borderRadius: 10, padding: 12, marginBottom: 12,
                  display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
                }}>
                  <div>
                    <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, fontWeight: 600 }}>CURRENT TOPIC</div>
                    <div style={{ fontSize: 13, color: T.ink, marginTop: 3 }}>{s.topic}</div>
                  </div>
                  <Pill tone="neutral">{s.active} active</Pill>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 11.5, color: T.ink3 }}>
                  <span>Next due: <span style={{ color: T.gold, fontWeight: 600 }}>{s.nextDue}</span></span>
                  <button onClick={() => window.peakToast('Lesson plan opened', 'info', s.name + ' · ' + s.teacher)} style={{
                    background: 'transparent', border: 'none', color: T.ink2, fontSize: 12,
                    cursor: 'pointer', fontFamily: T.font, fontWeight: 600,
                  }}>Open plan →</button>
                </div>
              </Card>
            );
          })}
        </div>
      </div>
    );
  }

  // ═════════════════════════════════════════════════════════════════════════
  // REPORTS · end-of-term reports
  // ═════════════════════════════════════════════════════════════════════════
  function Reports() {
    const statusMap = {
      pending:    { tone: 'neutral', label: 'Pending' },
      drafting:   { tone: 'warn',    label: 'Drafting' },
      review:     { tone: 'brand',   label: 'In review' },
      published:  { tone: 'gold',    label: 'Published' },
      sent:       { tone: 'good',    label: 'Sent to parents' },
    };

    const totals = D.reports.reduce((acc, r) => {
      acc.total     += r.total;
      acc.drafted   += r.drafted;
      acc.published += r.published;
      acc.sent      += r.sent;
      acc.aiAssist  += r.aiAssist;
      return acc;
    }, { total: 0, drafted: 0, published: 0, sent: 0, aiAssist: 0 });

    return (
      <div>
        <PageHeader
          eyebrow="Reports · Term 2 · End-of-term"
          title="Term 2 reports"
          subtitle="AI-assisted teacher comments. Reports auto-delivered to parents via WhatsApp once published."
          actions={
            <>
              <GhostBtn onClick={() => window.peakToast('Reports exported', 'success', 'PDF · ' + totals.published + ' reports compiled.')}>Export PDFs</GhostBtn>
              <PrimaryBtn onClick={() => window.peakToast('Bulk publish queued', 'success', totals.drafted + ' drafts ready · sending to ' + totals.drafted + ' guardians.')}>Publish drafts</PrimaryBtn>
            </>
          }
        />

        {/* progress strip */}
        <div style={{ padding: '18px 28px 0' }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10, marginBottom: 14 }}>
            {[
              { l: 'Total reports',    v: totals.total },
              { l: 'Drafted',          v: totals.drafted },
              { l: 'Published',        v: totals.published },
              { l: 'AI-assisted',      v: totals.aiAssist },
            ].map((k, i) => (
              <Card key={i} pad={16}>
                <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.06em', fontWeight: 600 }}>{k.l.toUpperCase()}</div>
                <div style={{ fontSize: 26, fontWeight: 700, color: T.ink, marginTop: 5, fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.02em' }}>{k.v}</div>
              </Card>
            ))}
          </div>
        </div>

        {/* reports table */}
        <div style={{ padding: '0 28px 32px' }}>
          <Card pad={0}>
            <div style={{
              display: 'grid', gridTemplateColumns: '90px 1fr 1.6fr 100px 100px 110px 120px',
              gap: 14, alignItems: 'center', padding: '14px 22px',
              borderBottom: '1px solid ' + T.border,
              fontSize: 10.5, color: T.ink3, fontFamily: T.mono, fontWeight: 600, letterSpacing: '0.04em',
            }}>
              <span>STREAM</span><span>TEACHER</span><span>STATUS · PROGRESS</span>
              <span style={{ textAlign: 'right' }}>DRAFTED</span>
              <span style={{ textAlign: 'right' }}>SENT</span>
              <span style={{ textAlign: 'right' }}>AI</span>
              <span style={{ textAlign: 'right' }}>DUE</span>
            </div>
            {D.reports.map((r, i) => {
              const st = statusMap[r.status] || statusMap.pending;
              const pct = r.total > 0 ? Math.round((r.drafted / r.total) * 100) : 0;
              return (
                <div key={r.id} style={{
                  display: 'grid', gridTemplateColumns: '90px 1fr 1.6fr 100px 100px 110px 120px',
                  gap: 14, alignItems: 'center', padding: '14px 22px',
                  borderTop: i > 0 ? '1px solid ' + T.border : 'none',
                  cursor: 'pointer', transition: 'background 0.12s',
                }}
                onMouseEnter={e => e.currentTarget.style.background = T.surface2}
                onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                onClick={() => window.peakToast('Opening report drafts', 'info', r.stream + ' · ' + r.teacher)}
                >
                  <div style={{ fontSize: 14, fontWeight: 700, color: T.ink, fontFamily: T.mono }}>{r.stream}</div>
                  <div style={{ fontSize: 12.5, color: T.ink2 }}>{r.teacher}</div>
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}>
                      <Pill tone={st.tone}>{st.label}</Pill>
                      <span style={{ fontSize: 11.5, color: T.ink3, fontFamily: T.mono }}>{r.drafted}/{r.total}</span>
                    </div>
                    <div style={{ height: 4, background: T.bg, borderRadius: 999, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: pct + '%', background: r.status === 'sent' ? T.good : r.status === 'published' ? T.gold : r.status === 'review' ? T.navyLite : r.status === 'drafting' ? T.warn : T.ink4, borderRadius: 999 }} />
                    </div>
                  </div>
                  <div style={{ textAlign: 'right', fontFamily: T.mono, fontSize: 12.5, color: T.ink }}>{r.drafted}</div>
                  <div style={{ textAlign: 'right', fontFamily: T.mono, fontSize: 12.5, color: r.sent > 0 ? T.good : T.ink3 }}>{r.sent || '–'}</div>
                  <div style={{ textAlign: 'right' }}>
                    <Pill tone={r.aiAssist > 0 ? 'gold' : 'neutral'}>{r.aiAssist > 0 ? 'AI ' + r.aiAssist : 'none'}</Pill>
                  </div>
                  <div style={{ textAlign: 'right', fontSize: 12, color: r.due === 'Today' ? T.red : r.due === 'Done' ? T.good : T.ink2, fontWeight: 600 }}>{r.due}</div>
                </div>
              );
            })}
          </Card>
        </div>
      </div>
    );
  }

  return { Attendance, Teachers, Transport, Learning, Reports };
})();

  </script>
  <script type="text/babel" data-src="src/peak-forms.jsx">
/* src/peak-forms.jsx */
/* global React, V4, PEAK */
// Peak Primary · Forms (modals)
// Add Student · Add Teacher · Record Payment

window.PEAK_FORMS = (function () {
  const { useState } = React;
  const T = window.V4.T;
  const D = window.PEAK;

  // ─── Shared form atoms ────────────────────────────────────────────────────
  function Field({ label, hint, error, children, span = 1 }) {
    return (
      <label style={{ display: 'flex', flexDirection: 'column', gap: 6, gridColumn: 'span ' + span }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <span style={{ fontSize: 11, fontWeight: 600, color: T.ink2, letterSpacing: '0.04em', textTransform: 'uppercase', fontFamily: T.mono }}>{label}</span>
          {hint && <span style={{ fontSize: 10.5, color: T.ink4, fontFamily: T.mono }}>{hint}</span>}
        </div>
        {children}
        {error && <span style={{ fontSize: 11, color: T.redInk, marginTop: 1 }}>{error}</span>}
      </label>
    );
  }

  const inputStyle = {
    background: T.bg, border: '1px solid ' + T.border, borderRadius: 9,
    padding: '10px 12px', fontSize: 13.5, color: T.ink, fontFamily: T.font,
    outline: 'none', width: '100%',
  };
  const inputFocusStyle = { border: '1px solid ' + T.navyLite, background: T.surface2 };

  function TextInput({ value, onChange, placeholder, type = 'text' }) {
    const [focus, setFocus] = useState(false);
    return (
      <input
        type={type}
        value={value}
        placeholder={placeholder}
        onChange={e => onChange(e.target.value)}
        onFocus={() => setFocus(true)}
        onBlur={() => setFocus(false)}
        style={{ ...inputStyle, ...(focus ? inputFocusStyle : null) }}
      />
    );
  }

  function Select({ value, onChange, options }) {
    return (
      <select value={value} onChange={e => onChange(e.target.value)} style={{
        ...inputStyle,
        appearance: 'none',
        backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M0 0L6 8L12 0' fill='%238a91b0'/></svg>\")",
        backgroundRepeat: 'no-repeat', backgroundPosition: 'right 12px center',
        paddingRight: 34,
      }}>
        {options.map(o => <option key={o.value || o} value={o.value || o} style={{ background: T.bg }}>{o.label || o}</option>)}
      </select>
    );
  }

  function PrimaryButton({ children, onClick, disabled }) {
    return (
      <button onClick={onClick} disabled={disabled} style={{
        padding: '11px 18px', background: disabled ? T.surface2 : T.red, color: '#fff',
        border: 'none', borderRadius: 9, fontSize: 13, fontWeight: 600,
        cursor: disabled ? 'not-allowed' : 'pointer', fontFamily: T.font,
        opacity: disabled ? 0.5 : 1, transition: 'opacity 0.12s',
      }}>{children}</button>
    );
  }

  function SecondaryButton({ children, onClick }) {
    return (
      <button onClick={onClick} style={{
        padding: '11px 18px', background: 'transparent', color: T.ink2,
        border: '1px solid ' + T.borderStr, borderRadius: 9, fontSize: 13, fontWeight: 500,
        cursor: 'pointer', fontFamily: T.font,
      }}>{children}</button>
    );
  }

  function ModalHeader({ eyebrow, title, subtitle }) {
    return (
      <div style={{ padding: '22px 26px 18px', borderBottom: '1px solid ' + T.border }}>
        <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', textTransform: 'uppercase', fontWeight: 600, marginBottom: 6 }}>{eyebrow}</div>
        <div style={{ fontSize: 22, fontWeight: 700, color: T.ink, letterSpacing: '-0.02em' }}>{title}</div>
        {subtitle && <div style={{ fontSize: 13, color: T.ink2, marginTop: 6 }}>{subtitle}</div>}
      </div>
    );
  }

  function ModalFooter({ children }) {
    return (
      <div style={{
        padding: '16px 26px', borderTop: '1px solid ' + T.border,
        display: 'flex', justifyContent: 'flex-end', gap: 10,
      }}>{children}</div>
    );
  }

  // ─── Add Student ──────────────────────────────────────────────────────────
  function AddStudent({ store }) {
    const [name, setName] = useState('');
    const [stream, setStream] = useState('P1V');
    const [guardian, setGuardian] = useState('');
    const [phone, setPhone] = useState('');
    const [dob, setDob] = useState('');
    const [feesStatus, setFeesStatus] = useState('paid');
    const [balance, setBalance] = useState('0');
    const [errors, setErrors] = useState({});

    const submit = () => {
      const errs = {};
      if (!name.trim()) errs.name = 'Name is required';
      if (!guardian.trim()) errs.guardian = 'Guardian name is required';
      if (!phone.trim()) errs.phone = 'Phone is required';
      if (Object.keys(errs).length) { setErrors(errs); return; }
      const bal = feesStatus === 'paid' ? 0 : Number(balance.replace(/[^0-9]/g, '')) || 0;
      store.addStudent({
        name: name.trim(),
        stream,
        guardian: guardian.trim(),
        phone: phone.trim(),
        fees: feesStatus,
        balance: bal,
        dob: dob || null,
      });
      window.peakToast(name.trim() + ' added to ' + stream, 'success', 'Guardian ' + guardian + ' will receive a welcome WhatsApp.');
      window.peakModal.close();
    };

    return (
      <div style={{ width: '100%' }}>
        <ModalHeader
          eyebrow="Add new student · Term 2"
          title="Enrol a new student"
          subtitle="Guardian gets an automatic welcome WhatsApp + parent-portal login."
        />
        <div style={{ padding: 26, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
          <Field label="Student name" error={errors.name} span={2}>
            <TextInput value={name} onChange={v => { setName(v); setErrors(e => ({ ...e, name: null })); }} placeholder="e.g. Esther Nakimuli" />
          </Field>
          <Field label="Class · stream" hint="14 streams · P1–P7">
            <Select value={stream} onChange={setStream} options={D.streams.map(s => ({ value: s.id, label: s.label }))} />
          </Field>
          <Field label="Date of birth" hint="optional">
            <TextInput value={dob} onChange={setDob} placeholder="14 March 2019" />
          </Field>
          <Field label="Primary guardian" error={errors.guardian}>
            <TextInput value={guardian} onChange={v => { setGuardian(v); setErrors(e => ({ ...e, guardian: null })); }} placeholder="Mrs. Joyce Namutebi" />
          </Field>
          <Field label="WhatsApp phone" hint="+256 …" error={errors.phone}>
            <TextInput value={phone} onChange={v => { setPhone(v); setErrors(e => ({ ...e, phone: null })); }} placeholder="+256 772 416 902" />
          </Field>
          <Field label="Fees status">
            <Select value={feesStatus} onChange={setFeesStatus} options={[
              { value: 'paid',    label: 'Fully paid' },
              { value: 'partial', label: 'Partial payment' },
              { value: 'overdue', label: 'Outstanding · overdue' },
            ]} />
          </Field>
          {feesStatus !== 'paid' && (
            <Field label="Outstanding balance" hint="UGX">
              <TextInput value={balance} onChange={setBalance} placeholder="0" />
            </Field>
          )}
        </div>
        <div style={{
          padding: '0 26px 16px', display: 'flex', alignItems: 'center', gap: 10,
          fontSize: 12, color: T.ink3,
        }}>
          <span style={{ width: 22, height: 22, borderRadius: 6, background: T.redSft, color: T.redInk, display: 'grid', placeItems: 'center', fontFamily: T.mono, fontSize: 11, fontWeight: 700 }}>AI</span>
          <span>NEXT will auto-create a parent portal login and queue a welcome WhatsApp in English + Luganda.</span>
        </div>
        <ModalFooter>
          <SecondaryButton onClick={() => window.peakModal.close()}>Cancel</SecondaryButton>
          <PrimaryButton onClick={submit}>Enrol student →</PrimaryButton>
        </ModalFooter>
      </div>
    );
  }

  // ─── Add Teacher ──────────────────────────────────────────────────────────
  function AddTeacher({ store }) {
    const [name, setName] = useState('');
    const [role, setRole] = useState('');
    const [streams, setStreams] = useState(['P1V']);
    const [subjects, setSubjects] = useState('');
    const [phone, setPhone] = useState('');
    const [errors, setErrors] = useState({});

    const toggleStream = (id) => {
      setStreams(cur => cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id]);
    };

    const submit = () => {
      const errs = {};
      if (!name.trim()) errs.name = 'Name is required';
      if (!role.trim()) errs.role = 'Role is required';
      if (!phone.trim()) errs.phone = 'Phone is required';
      if (Object.keys(errs).length) { setErrors(errs); return; }
      const subj = subjects.split(',').map(s => s.trim()).filter(Boolean);
      store.addTeacher({
        name: name.trim(),
        role: role.trim(),
        subjects: subj.length ? subj : ['General'],
        streams,
        phone: phone.trim(),
      });
      window.peakToast(name.trim() + ' added to staff', 'success', 'Teacher dashboard login will be sent to ' + phone);
      window.peakModal.close();
    };

    return (
      <div style={{ width: '100%' }}>
        <ModalHeader
          eyebrow="Add new teacher · staff"
          title="Add a teacher"
          subtitle="Teacher will get login access to the classroom dashboard."
        />
        <div style={{ padding: 26, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
          <Field label="Full name" error={errors.name} span={2}>
            <TextInput value={name} onChange={v => { setName(v); setErrors(e => ({ ...e, name: null })); }} placeholder="Mrs. Sarah Namugga" />
          </Field>
          <Field label="Role · title" error={errors.role}>
            <TextInput value={role} onChange={v => { setRole(v); setErrors(e => ({ ...e, role: null })); }} placeholder="P5 Vigilant teacher" />
          </Field>
          <Field label="WhatsApp phone" error={errors.phone}>
            <TextInput value={phone} onChange={v => { setPhone(v); setErrors(e => ({ ...e, phone: null })); }} placeholder="+256 772 416 902" />
          </Field>
          <Field label="Subjects taught" hint="comma-separated" span={2}>
            <TextInput value={subjects} onChange={setSubjects} placeholder="Mathematics, Science" />
          </Field>
          <Field label="Streams" hint="select all that apply" span={2}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, padding: '4px 0' }}>
              {D.streams.map(s => {
                const sel = streams.includes(s.id);
                return (
                  <button key={s.id} type="button" onClick={() => toggleStream(s.id)} style={{
                    padding: '6px 11px', borderRadius: 999,
                    border: '1px solid ' + (sel ? T.red : T.border),
                    background: sel ? T.redSft : 'transparent',
                    color: sel ? T.redInk : T.ink2,
                    fontSize: 11.5, fontWeight: 600, cursor: 'pointer', fontFamily: T.mono,
                  }}>{s.id}</button>
                );
              })}
            </div>
          </Field>
        </div>
        <ModalFooter>
          <SecondaryButton onClick={() => window.peakModal.close()}>Cancel</SecondaryButton>
          <PrimaryButton onClick={submit}>Add teacher →</PrimaryButton>
        </ModalFooter>
      </div>
    );
  }

  // ─── Record Payment ───────────────────────────────────────────────────────
  function RecordPayment({ store, defaultStudentId }) {
    const owing = D.students.filter(s => s.balance > 0);
    const [studentId, setStudentId] = useState(defaultStudentId || (owing[0] && owing[0].id) || D.students[0].id);
    const [amount, setAmount] = useState('');
    const [method, setMethod] = useState('mtn');
    const [ref, setRef] = useState('');
    const [phone, setPhone] = useState('');
    const student = D.students.find(s => s.id === Number(studentId));
    const balance = student ? student.balance : 0;

    const submit = async () => {
      const amt = Number(amount.replace(/[^0-9]/g, ''));
      if (!amt || amt <= 0) { window.peakToast('Enter a payment amount', 'error'); return; }
      store.recordPayment({ studentId: Number(studentId), amount: amt, method, ref });
      const newBal = Math.max(0, balance - amt);

  <script type="text/babel">
/* PEAK_EXAMS — exam marks entry, Ugandan grading, ranks, reports, fee-gate */
window.PEAK_EXAMS = (function () {

    doc.setFont(undefined, 'normal');
    y += 14; doc.setFontSize(10); doc.setFont(undefined, 'bold'); doc.text("Class Teacher's comment:", 14, y); doc.setFont(undefined, 'normal'); y += 6;
    const tc = doc.splitTextToSize(teacherComment(rec, exam), W - 28); doc.text(tc, 14, y); y += tc.length * 5 + 6;
    doc.setFont(undefined, 'bold'); doc.text("Head Teacher's remark:", 14, y); doc.setFont(undefined, 'normal'); y += 6;
    const hr = doc.splitTextToSize(headRemark(rec, exam), W - 28); doc.text(hr, 14, y); y += hr.length * 5 + 16;
    doc.setDrawColor(120); doc.line(14, y, 70, y); doc.line(120, y, 176, y); doc.setFontSize(9); doc.text('Class Teacher', 14, y + 5); doc.text('Head Teacher', 120, y + 5);
    try { const AC = TPL.accent || [180, 30, 30]; const cx = 95, cy = y + 30, r = 16; doc.setDrawColor(AC[0], AC[1], AC[2]); doc.setLineWidth(0.8); doc.circle(cx, cy, r); doc.circle(cx, cy, r - 2.5); doc.setTextColor((TPL.accent||[180,30,30])[0], (TPL.accent||[180,30,30])[1], (TPL.accent||[180,30,30])[2]); doc.setFontSize(6.5); doc.text(brand.toUpperCase().slice(0, 24), cx, cy - 3, { align: 'center' }); doc.setFont(undefined, 'bold'); doc.setFontSize(7.5); doc.text('OFFICIAL', cx, cy + 1.5, { align: 'center' }); doc.setFont(undefined, 'normal'); doc.setFontSize(5.5); doc.text(new Date().toLocaleDateString(), cx, cy + 5.5, { align: 'center' }); doc.setTextColor(0, 0, 0); doc.setLineWidth(0.2); } catch (e) {}
    doc.setFontSize(9); doc.setTextColor(120); doc.text('Generated by NEXT OS \u00b7 Nia \u00b7 ' + new Date().toLocaleDateString(), 14, 288); doc.setTextColor(0, 0, 0);
    doc.save((stu.name || 'report').replace(/\s+/g, '_') + '_report.pdf');
  }
  function heldMessage(rec, exam) { const s = rec.student; return 'Dear ' + (s.guardian || 'Parent') + ', ' + s.name + "'s " + (exam.term || 'term') + ' report is ready but is being held pending an outstanding balance of UGX ' + Math.round(rec.balance).toLocaleString() + '. Kindly clear the balance so we can release the report. Thank you. — ' + ((window.__BRAND_NAME) || 'School'); }

              </div>
              <div style={{ marginTop: 16, display: 'flex', gap: 8 }}>
                <button style={btn(false)} onClick={() => setView('list')}>Cancel</button>

                      <tr key={s.id} style={{ borderTop: '1px solid ' + T.border }}>

                        <td style={{ padding: '8px 10px', color: T.ink2 }}>{r.streamRank}</td>
                        <td style={{ padding: '8px 10px', color: T.ink2 }}>{r.classRank}</td>

                            : <button onClick={() => makeReport(r, Object.assign({}, exam, { subjects: subjectsOf(exam) }))} style={{ border: 'none', background: T.red, color: '#fff', padding: '6px 12px', borderRadius: 7, fontSize: 11.5, cursor: 'pointer' }}>Report PDF</button>}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div style={{ marginTop: 12, fontSize: 12, color: T.ink3, display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ width: 22, height: 22, borderRadius: 6, background: T.redSft, color: T.redInk, display: 'grid', placeItems: 'center', fontFamily: T.mono, fontSize: 11, fontWeight: 700 }}>AI</span>
                <span>Students with an outstanding balance are auto-held — their report won't generate until fees clear. Nia drafts the parent message for you.</span>

          )}
        </div>
      </div>
    );
  }

  return { Exams };
})();

  <script>
  window.peakExportCSV = function (filename, headers, rows) {
    try {
      var esc = function (v) { v = (v == null ? '' : String(v)); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
      var csv = [headers.map(esc).join(',')].concat(rows.map(function (r) { return r.map(esc).join(','); })).join('\n');
      var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) {}
  };
  window.peakRoster = function () { return (window.PEAK && window.PEAK.students) || []; };
  window.peakCleanPhone = function (p) { p = (p || '').replace(/[^0-9]/g, ''); if (!p) return ''; if (p.charAt(0) === '0') p = '256' + p.slice(1); return p; };
  window.peakWhatsApp = function (phone, message) { var p = window.peakCleanPhone(phone); if (!p) { window.peakToast && window.peakToast('No phone on file', 'info', 'Add a guardian/contact number first.'); return; } window.open('https://wa.me/' + p + (message ? ('?text=' + encodeURIComponent(message)) : ''), '_blank'); };
  window.peakCall = function (phone) { var p = (phone || '').replace(/\s+/g, ''); if (!p) { window.peakToast && window.peakToast('No phone on file', 'info'); return; } window.open('tel:' + p, '_self'); };
  window.peakSchoolName = function () { return (window.__BRAND_NAME) || 'the school'; };
  window.peakBulkWhatsApp = function (items, label) {
    items = (items || []).filter(function (x) { return x.to && x.text; });
    if (!items.length) { window.peakToast && window.peakToast('No recipients with phone numbers', 'info'); return; }
    window.peakToast && window.peakToast('Sending ' + items.length + ' WhatsApp messages...', 'info', label || '');
    fetch('https://nextos-sentinel.nextafricaai.workers.dev/whatsapp/bulk', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: items }) })
      .then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.error && /not configured/i.test(d.error)) { window.peakToast && window.peakToast('WhatsApp Business API not connected', 'info', 'Add WHATSAPP_TOKEN + WHATSAPP_PHONE_ID to the worker (WHATSAPP-SETUP.md), then this sends for real.'); return; }
        var sent = (d && d.sent) || 0, failed = (d && d.failed) || 0;
        window.peakToast && window.peakToast(sent + ' sent' + (failed ? (' - ' + failed + ' failed') : ''), failed ? 'info' : 'success', label || '');
      }).catch(function (e) { window.peakToast && window.peakToast('Send failed', 'info', String(e.message || e)); });
  };
  window.peakPhoneFor = function (x) { return x.guardianPhone || ('0702341' + ((x.id * 17) % 1000)); };

(function () {
  const { useState, useEffect, useRef, useReducer } = React;

    const listeners = new Set();

      subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
      // mutations

        const id = (D.students[D.students.length - 1].id || 0) + 1;
        D.students.unshift({
          id, lastSeen: 'just added', flag: null, attendanceWk: 100,
          balance: s.fees === 'paid' ? 0 : s.balance || 0,
          ...s,
        });

        notify();
        return id;
      },

        const id = 't' + (D.teachers.length + 1);

        D.kpis.teachers = (D.kpis.teachers || 0) + 1;

        return id;

        // p: { studentId, amount, method, ref }

        D.kpis.feesCollectedTerm = (D.kpis.feesCollectedTerm || 0) + (p.amount || 0);
        notify();
      },
      markAttendance(updates) {
        // updates: [{ studentId, status: 'present'|'absent'|'late' }]
        let present = 0;
        updates.forEach(u => {
          const s = D.students.find(x => x.id === u.studentId);
          if (!s) return;
          if (u.status === 'present') { s.lastSeen = 'just marked'; present++; }
          if (u.status === 'absent')  { s.lastSeen = 'absent'; }
          if (u.status === 'late')    { s.lastSeen = 'late'; }
        });
        notify();
        return present;
      },
      applyLiveKpis(v) {
        if (!v) return;
        const k = D.kpis;
        k.students = v.students || 0;
        if (v.teachers) k.teachers = v.teachers;

      ['POST /api/agent/signals',    'module emits { module, health, latency_ms, last_run, hint } — NEXT agent ingests'],
      ['GET  /api/agent/manifest',   'returns the live next.manifest.json above for the requesting school_id'],
      ['POST /api/agent/adapt',      '{ action, target, params } — toggle_module, retune_sync, swap_curriculum, rotate_channel'],
      ['POST /api/agent/provision',  'spin up a new school tenant from school_config payload'],
      ['GET  /api/agent/audit',      'tail of audit_events for compliance + self-healing diagnostics'],
    ];

    const deploySteps = [
      'NEXT agent fetches next.manifest.json + school_config from registry.',
      'Agent renders per-school build (modules toggled, curriculum + language injected, channels keyed).',
      'Artifact pushed to edge target (Cloudflare Pages / static bucket / on-prem PWA cache).',
      'Healthcheck + first signals heartbeat must pass within 60s or agent auto-rolls back.',
      'Continuous loop: agent_signals → adaptation_endpoint → re-emit manifest patch → hot-reload.',
    ];

    const envVars = [
      ['NEXT_SCHOOL_ID',         'tenant identifier issued by NEXT registry'],
      ['NEXT_AGENT_URL',         'base URL of the NEXT autonomous agent'],
      ['NEXT_AGENT_TOKEN',       'signed JWT — module → agent calls'],
      ['WHATSAPP_API_TOKEN',     'Meta Cloud API or local BSP credential'],
      ['SMS_GATEWAY_URL',        'Africa\u2019s Talking / local gateway endpoint'],
      ['DB_URL',                 'Postgres connection (RLS keyed on school_id)'],
      ['STORAGE_BUCKET',         'evidence uploads (lesson photos, signed PDFs)'],
    ];

    return (
      <div style={{ padding: '28px 32px 80px', maxWidth: 1180, margin: '0 auto', fontFamily: T.font }}>
        {/* Hero */}
        <div style={{ ...card, background: 'linear-gradient(135deg, ' + T.surface3 + ' 0%, #2b3b85 60%, ' + T.surface + ' 100%)', borderColor: T.borderStr, padding: 28 }}>
          <div style={{ fontFamily: T.mono, fontSize: 11, color: T.gold, letterSpacing: '0.14em' }}>NEXT · SCHOOL OS · DEPLOYABLE PROTOTYPE v0.1</div>
          <h1 style={{ fontSize: 30, fontWeight: 700, letterSpacing: '-0.02em', margin: '10px 0 8px', color: T.ink }}>
            A deployable school OS prototype — ready for the NEXT autonomous agent to ship per school.
          </h1>
          <p style={{ ...p, fontSize: 15, color: T.ink2, maxWidth: 760 }}>
            Single-file, mobile-first prototype for Ugandan primary schools and adaptable across African and
            international curricula. Ships with a manifest, agent contract, signal schema and deploy steps so the
            NEXT agent can provision, adapt and self-heal each tenant without a redeploy.
          </p>
          <div style={{ display: 'flex', gap: 8, marginTop: 14, flexWrap: 'wrap' }}>
            <span style={{ fontFamily: T.mono, fontSize: 10.5, color: T.good || '#3ecf8e', border: '1px solid ' + (T.good || '#3ecf8e'), padding: '3px 9px', borderRadius: 999 }}>● READY-TO-DEPLOY</span>
            <span style={{ fontFamily: T.mono, fontSize: 10.5, color: T.gold, border: '1px solid ' + T.gold, padding: '3px 9px', borderRadius: 999 }}>NEXT-AGENT COMPATIBLE</span>
            <span style={{ fontFamily: T.mono, fontSize: 10.5, color: T.ink2, border: '1px solid ' + T.border, padding: '3px 9px', borderRadius: 999 }}>OFFLINE-TOLERANT · PWA-READY</span>
          </div>

          <div style={{ display: 'flex', gap: 8, marginTop: 18, flexWrap: 'wrap' }}>
            {pillars.map((pl, i) => (
              <button key={pl.k} onClick={() => onNav(pl.screen)} style={{
                background: 'rgba(255,255,255,0.04)', border: '1px solid ' + T.border, color: T.ink,
                padding: '8px 13px', borderRadius: 999, fontSize: 12, cursor: 'pointer', fontFamily: T.mono, letterSpacing: '0.04em',
              }}>
                <span style={{ color: pillarColors[i], marginRight: 8 }}>●</span>{pl.title.split(' & ')[0]} → open
              </button>
            ))}
          </div>
        </div>

        {/* Four pillars */}
        <div style={card}>
          <div style={h2}>The four equally urgent problem areas</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 14 }}>
            {pillars.map((pl, i) => (
              <div key={pl.k} style={{ background: T.surface2, border: '1px solid ' + T.border, borderRadius: 12, padding: 18 }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
                  <div style={{ fontSize: 14.5, fontWeight: 700, color: T.ink }}>{pl.title}</div>
                  <span style={{ fontFamily: T.mono, fontSize: 10.5, color: pillarColors[i], border: '1px solid ' + pillarColors[i], padding: '2px 7px', borderRadius: 999 }}>{pl.prio}</span>
                </div>
                <div style={{ ...p, fontSize: 12.5, color: T.ink3, marginBottom: 10 }}>{pl.why}</div>

                  marginTop: 12, background: 'transparent', border: '1px solid ' + T.borderStr, color: T.ink,
                  padding: '7px 12px', borderRadius: 8, fontSize: 12, cursor: 'pointer', fontFamily: T.mono,
                }}>Open live module →</button>
              </div>
            ))}

        </div>

        {/* How modules interconnect */}
        <div style={card}>
          <div style={h2}>How the four modules interconnect</div>
          <pre style={{
            margin: 0, padding: 16, background: T.surface2, border: '1px solid ' + T.border, borderRadius: 10,
            color: T.ink2, fontFamily: T.mono, fontSize: 12, lineHeight: 1.55, overflowX: 'auto',
          }}>{
`              ┌──────────────────────────┐
              │     NEXT AGENT LAYER     │  ← per-school adaptation, signals, self-healing
              └─────────────┬────────────┘
                            │  agent_signals · config manifest
   ┌────────────────┬───────┴────────┬────────────────┐
   ▼                ▼                ▼                ▼
 ATTENDANCE  ↔  SYLLABUS / LEARNING ↔ STAFF / RESOURCES ↔ PARENT COMMS
   │                │                │                │
   └─── at-risk ────┼── coverage ────┼── cover/booking ┘
                    │
                shared core: students · guardians · audit · auth · messages`
          }</pre>
          <ul style={{ margin: '14px 0 0', paddingLeft: 18 }}>
            {flows.map((f, i) => <li key={i} style={li}>{f}</li>)}
          </ul>
        </div>

        {/* Database */}
        <div style={card}>
          <div style={h2}>Recommended database schema (core entities)</div>
          <div style={{ border: '1px solid ' + T.border, borderRadius: 10, overflow: 'hidden' }}>
            {schema.map((row, i) => (
              <div key={row[0]} style={{
                display: 'grid', gridTemplateColumns: '180px 1fr', gap: 16,
                padding: '10px 14px', background: i % 2 ? T.surface2 : 'transparent',
                borderTop: i ? '1px solid ' + T.border : 'none',
              }}>
                <div style={{ fontFamily: T.mono, fontSize: 12, color: T.gold }}>{row[0]}</div>
                <div style={{ fontFamily: T.mono, fontSize: 12, color: T.ink2 }}>{row[1]}</div>
              </div>
            ))}
          </div>
          <p style={{ ...p, marginTop: 12, fontSize: 12.5, color: T.ink3 }}>
            Row-level security keyed on <code style={{ color: T.gold }}>school_id</code> + role; PII columns
            (phone, address, medical) field-masked unless the requesting role passes a justification check
            written to <code style={{ color: T.gold }}>audit_events</code>.

        </div>

        {/* Roles */}
        <div style={card}>
          <div style={h2}>Role-based access</div>
          <div style={{ border: '1px solid ' + T.border, borderRadius: 10, overflow: 'hidden' }}>
            {roles.map((r, i) => (
              <div key={r[0]} style={{
                display: 'grid', gridTemplateColumns: '200px 1fr', gap: 16,
                padding: '10px 14px', background: i % 2 ? T.surface2 : 'transparent',
                borderTop: i ? '1px solid ' + T.border : 'none',
              }}>
                <div style={{ fontSize: 13, color: T.ink, fontWeight: 600 }}>{r[0]}</div>
                <div style={{ fontSize: 12.5, color: T.ink2 }}>{r[1]}</div>
              </div>
            ))}
          </div>
        </div>

        {/* NEXT OS integration */}
        <div style={card}>
          <div style={h2}>Integration points with NEXT OS</div>
          <ul style={{ margin: 0, paddingLeft: 18 }}>
            {nextOsHooks.map((h, i) => <li key={i} style={li}>{h}</li>)}
          </ul>
        </div>

        {/* Design principles */}
        <div style={card}>
          <div style={h2}>System design principles</div>
          <ul style={{ margin: 0, paddingLeft: 18 }}>
            {principles.map((pr, i) => <li key={i} style={li}>{pr}</li>)}
          </ul>
        </div>

        {/* Deployment manifest */}
        <div style={card}>
          <div style={h2}>Deployment manifest · next.manifest.json</div>
          <p style={{ ...p, fontSize: 12.5, color: T.ink3 }}>
            Drop this manifest beside the prototype. The NEXT agent reads it to discover modules, capabilities,
            and adaptation endpoints — no manual wiring per school.
          </p>
          <pre style={{
            margin: 0, padding: 16, background: T.surface2, border: '1px solid ' + T.border, borderRadius: 10,
            color: T.ink2, fontFamily: T.mono, fontSize: 11.5, lineHeight: 1.5, overflowX: 'auto', maxHeight: 420,
          }}>{manifest}</pre>
        </div>

        {/* Agent contract */}
        <div style={card}>
          <div style={h2}>NEXT agent contract · HTTP surface</div>
          <div style={{ border: '1px solid ' + T.border, borderRadius: 10, overflow: 'hidden' }}>
            {agentContract.map((row, i) => (
              <div key={row[0]} style={{
                display: 'grid', gridTemplateColumns: '260px 1fr', gap: 16,
                padding: '10px 14px', background: i % 2 ? T.surface2 : 'transparent',
                borderTop: i ? '1px solid ' + T.border : 'none',
              }}>
                <div style={{ fontFamily: T.mono, fontSize: 12, color: T.gold }}>{row[0]}</div>
                <div style={{ fontFamily: T.mono, fontSize: 12, color: T.ink2 }}>{row[1]}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Deploy steps */}
        <div style={card}>
          <div style={h2}>Deploy steps · agent-driven rollout</div>
          <ol style={{ margin: 0, paddingLeft: 20 }}>
            {deploySteps.map((s, i) => <li key={i} style={li}>{s}</li>)}
          </ol>
        </div>

        {/* Env vars */}
        <div style={card}>
          <div style={h2}>Runtime environment · provisioned by agent</div>
          <div style={{ border: '1px solid ' + T.border, borderRadius: 10, overflow: 'hidden' }}>
            {envVars.map((row, i) => (
              <div key={row[0]} style={{
                display: 'grid', gridTemplateColumns: '220px 1fr', gap: 16,
                padding: '10px 14px', background: i % 2 ? T.surface2 : 'transparent',
                borderTop: i ? '1px solid ' + T.border : 'none',
              }}>
                <div style={{ fontFamily: T.mono, fontSize: 12, color: T.gold }}>{row[0]}</div>
                <div style={{ fontFamily: T.mono, fontSize: 12.5, color: T.ink2 }}>{row[1]}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Roadmap */}

        <div style={card}>
          <div style={h2}>Prioritised implementation roadmap</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 14 }}>
            {roadmap.map((ph, i) => (
              <div key={ph.phase} style={{ background: T.surface2, border: '1px solid ' + T.border, borderRadius: 12, padding: 16 }}>
                <div style={{ fontFamily: T.mono, fontSize: 11, color: pillarColors[i % 4], letterSpacing: '0.08em', marginBottom: 8 }}>{ph.phase.toUpperCase()}</div>
                <ul style={{ margin: 0, paddingLeft: 18 }}>
                  {ph.items.map((it, j) => <li key={j} style={li}>{it}</li>)}
                </ul>
              </div>
            ))}
          </div>
        </div>

        <div style={{ ...card, background: 'transparent', borderStyle: 'dashed', textAlign: 'center' }}>
          <div style={{ fontFamily: T.mono, fontSize: 11, color: T.ink3, letterSpacing: '0.1em' }}>
            HAND-OFF · this spec screen doubles as the dev brief — every left-nav module below is its live counterpart.
          </div>
        </div>
      </div>
    );
  }

  // ─── Desktop shell · sidebar + routed screen ──────────────────────────────
  function DesktopShell() {
    useStoreVersion();
    const [narrow, setNarrow] = useState(typeof window !== 'undefined' && window.innerWidth < 820);
    const [navOpen, setNavOpen] = useState(false);
    useEffect(() => {
      const onR = () => setNarrow(window.innerWidth < 820);
      window.addEventListener('resize', onR);
      return () => window.removeEventListener('resize', onR);
    }, []);
    const initialRoute = (window.PEAK_ROLE && window.PEAK_ROLE.defaultRouteForRole()) || 'today';
    const [route, setRoute] = useState(initialRoute);
    const [profileStudentId, setProfileStudentId] = useState(4);

    const navigate = (k) => setRoute(k);
    const openProfile = (s) => { if (s) setProfileStudentId(s.id); setRoute('profile'); };
    const openNewStudent  = () => window.peakModal.open(<PEAK_FORMS.AddStudent  store={Store} />);
    const openNewTeacher  = () => window.peakModal.open(<PEAK_FORMS.AddTeacher  store={Store} />);
    const openRecordPay   = () => window.peakModal.open(<PEAK_FORMS.RecordPayment store={Store} />);

    // Expose globals for screens that need them
    window.peakNav = navigate;
    window.peakOpenProfile = openProfile;
    window.peakNewStudent  = openNewStudent;
    window.peakNewTeacher  = openNewTeacher;

    let Screen;
    if      (route === 'spec')    Screen = <SpecScreen onNav={navigate} />;
    else if (route === 'today')   Screen = <PD_Today.Today      embed onNav={navigate} />;
    else if (route === 'dash')    Screen = <V4.Dashboard         embed onNav={navigate} />;
    else if (route === 'stud')    Screen = <PD_Students.Students embed onNav={navigate} onOpenProfile={openProfile} onAddStudent={openNewStudent} />;
    else if (route === 'profile') Screen = <PD_Profile.Profile   embed onNav={navigate} onBack={() => setRoute('stud')} studentId={profileStudentId} />;
    else if (route === 'fees')    Screen = <PD_Fees.Fees         embed onNav={navigate} onRecordPayment={openRecordPay} />;
    else if (route === 'comm')    Screen = <PD_Broadcast.Broadcast embed onNav={navigate} />;
    else if (route === 'attn')    Screen = <PEAK_SCREENS.Attendance onNav={navigate} store={Store} />;
    else if (route === 'teach')   Screen = <PEAK_SCREENS.Teachers   onNav={navigate} onAddTeacher={openNewTeacher} />;
    else if (route === 'trans')   Screen = <PEAK_SCREENS.Transport  onNav={navigate} />;
    else if (route === 'learn')   Screen = <PEAK_SCREENS.Learning   onNav={navigate} />;
    else if (route === 'rep')     Screen = <PEAK_SCREENS.Reports    onNav={navigate} />;
    else if (route === 'exam')    Screen = (window.PEAK_EXAMS ? <PEAK_EXAMS.Exams onNav={navigate} /> : null);
    else if (route === 'staff' && typeof window.HeadStaffPanel === 'function') {
      const HeadStaffPanel = window.HeadStaffPanel;
      Screen = <HeadStaffPanel onNav={navigate} />;
    }
    else if (route === 'timetable' && typeof window.HeadTimetablePanel === 'function') {
      const HeadTimetablePanel = window.HeadTimetablePanel;
      Screen = <HeadTimetablePanel onNav={navigate} />;
    }

    return (
      <div style={{ display: 'flex', height: '100vh', background: T.bg, color: T.ink, fontFamily: T.font, overflow: 'hidden' }}>
        {!narrow && <Sidebar route={route} onNav={navigate} />}
        {narrow && navOpen && (
          <React.Fragment>
            <div onClick={() => setNavOpen(false)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', zIndex: 290 }} />
            <div style={{ position: 'fixed', left: 0, top: 0, bottom: 0, zIndex: 300, boxShadow: '0 0 50px rgba(0,0,0,0.6)' }}>
              <Sidebar route={route} onNav={(k) => { navigate(k); setNavOpen(false); }} />
            </div>
          </React.Fragment>
        )}
        <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
          {narrow && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 14px', borderBottom: '1px solid ' + T.border, background: T.bg, flexShrink: 0 }}>
              <button onClick={() => setNavOpen(true)} aria-label="Menu" style={{ background: 'transparent', border: '1px solid ' + T.border, borderRadius: 9, color: T.ink, width: 40, height: 40, fontSize: 19, lineHeight: 1, cursor: 'pointer', flexShrink: 0 }}>{'\u2630'}</button>
              <div style={{ fontSize: 15, fontWeight: 700, color: T.ink, letterSpacing: '-0.01em', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{(typeof window !== 'undefined' && window.__BRAND_NAME) || 'Peak Primary'}</div>
            </div>
          )}
          <div style={{ flex: 1, minWidth: 0, overflow: 'auto' }}>{Screen}</div>
        </div>
      </div>
    );
  }

  // ─── Root · responsive + role-aware ───────────────────────────────────────
  function App() {
    // Role gate. Teachers get their own shell; parents get the dedicated phone
    // app; Head / Admin / Bursar get the full dashboard, now fully responsive
    // (collapsing sidebar drawer + reflowing grids) down to phone width.
    const role = (window.PEAK_ROLE && window.PEAK_ROLE.getRole()) || 'head';

    if (role === 'teacher' && typeof window.TeacherShell === 'function') {
      const TeacherShell = window.TeacherShell;
      return (
        <>
          <TeacherShell />
          <ToastStack />
          <ModalLayer />
        </>
      );
    }

    const Shell = role === 'parent' ? MobileShell : DesktopShell;
    return (
      <>
        <Shell />
        <ToastStack />
        <ModalLayer />
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();

  </script>
  <script>
  /* Broken school-logo fallback -> branded initials icon (handles missing assets/peak-logo.png) */
  (function(){
    function brandIcon(){
      var nm=(window.__BRAND_NAME)||'NEXT'; var col=(window.__ACCENT)||'#00FC8F';
      var init=((''+nm).match(/[A-Za-z0-9]/g)||['N']).slice(0,2).join('').toUpperCase();
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" rx="14" fill="'+col+'"/><text x="50%" y="55%" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#0a1029" text-anchor="middle" dominant-baseline="central">'+init+'</text></svg>';
      return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
    }
    window.addEventListener('error', function(e){
      var t=e.target;
      if(t && t.tagName==='IMG' && /peak-logo/.test(t.getAttribute('src')||'') && !t.dataset.nxFallback){
        t.dataset.nxFallback='1'; t.src=brandIcon();
      }
    }, true);
  })();

  /* Dashboard colour control — change the school's accent; saves to the tenant + reloads */
  (function(){
    function init(){
      var sess = window.NextSession || null;
      var prof = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile()) || (sess && sess.profile) || null;
      if(!document.body){ return setTimeout(init,300); }
      if(!prof || !prof.tenantId){ return setTimeout(init,500); }
      if(document.getElementById('nx-theme-ctrl')) return;
      var cur=(window.__ACCENT)||'#00FC8F';
      var mob = window.matchMedia('(max-width:640px)').matches;
      var wrap=document.createElement('div'); wrap.id='nx-theme-ctrl';
      wrap.style.cssText='position:fixed;right:14px;z-index:99999;bottom:'+(mob?86:16)+'px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-family:Inter,system-ui,sans-serif';
      var panel=document.createElement('div');
      panel.style.cssText='display:none;align-items:center;gap:8px;background:#141e3c;border:1px solid #212d56;border-radius:30px;padding:8px 12px;font-size:12px;color:#aab2d5;box-shadow:0 8px 24px rgba(0,0,0,.45)';
      var lbl=document.createElement('span'); lbl.textContent='Dashboard colour';
      var inp=document.createElement('input'); inp.type='color'; inp.value=cur;
      inp.style.cssText='width:30px;height:30px;border:none;background:none;cursor:pointer;padding:0;border-radius:6px';
      var sv=document.createElement('button'); sv.textContent='Apply'; sv.disabled=true;
      sv.style.cssText='background:'+cur+';color:#04210f;border:none;border-radius:20px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:12px;opacity:.5';
      panel.appendChild(lbl); panel.appendChild(inp); panel.appendChild(sv);
      var tog=document.createElement('button'); tog.type='button'; tog.setAttribute('aria-label','Dashboard colour');
      tog.style.cssText='width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:'+cur+';cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1';
      tog.textContent='🎨';
      tog.addEventListener('click',function(){ panel.style.display=(panel.style.display==='flex')?'none':'flex'; });
      var chosen=cur;
      inp.addEventListener('input',function(){ chosen=inp.value; sv.disabled=false; sv.style.opacity='1'; sv.style.background=chosen; tog.style.background=chosen; });
      sv.addEventListener('click',async function(){
        if(sv.disabled) return; sv.textContent='Saving…'; sv.disabled=true;
        try{
          var b={}; try{ b=JSON.parse(localStorage.getItem('nextos.brand')||'{}'); }catch(e){}
          b.color=chosen; if(!b.name && window.__BRAND_NAME) b.name=window.__BRAND_NAME;
          localStorage.setItem('nextos.brand', JSON.stringify(b));
          if(sess && sess.sb && prof.tenantId){ await sess.sb.from('tenants').update({ primary_color: chosen }).eq('id', prof.tenantId); }
        }catch(e){}
        location.reload();
      });
      wrap.appendChild(panel); wrap.appendChild(tog);
      document.body.appendChild(wrap);
    }
    if(document.readyState!=='loading') init(); else document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
