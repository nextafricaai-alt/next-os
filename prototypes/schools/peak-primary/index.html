            <div style={{ lineHeight: 1.2 }}>
              <div style={{ fontSize: 13, fontWeight: 600 }}>{profile.fullName}</div>
              <div style={{ fontSize: 10.5, color: T.ink3 }}>Teacher</div>
            </div>
            {window.PushBell ? React.createElement(window.PushBell, { compact: true }) : null}
            <button onClick={signOut} style={{ background: 'transparent', border: '1px solid ' + T.borderStr, color: T.ink2, padding: '7px 14px', borderRadius: 8, cursor: 'pointer', fontSize: 12, fontFamily: T.font }}>Sign out</button>
          </div>
        </header>

        <main style={{ padding: '32px 32px 60px', maxWidth: 1400, margin: '0 auto' }}>
          <div style={{ marginBottom: 24 }}>
            <h1 style={{ fontSize: 36, fontWeight: 400, margin: 0, fontFamily: T.serif, letterSpacing: '-0.01em' }}>
              {greeting}, {profile.fullName ? profile.fullName.split(' ')[0] : 'Teacher'}
            </h1>
            <p style={{ margin: '8px 0 0', color: T.ink3, fontSize: 14 }}>{"Here's your day at " + ((typeof window!=='undefined'&&window.__BRAND_NAME)||'Peak Primary') + "."}</p>
          </div>

          {data.loading ? (
            <div style={{ padding: 60, textAlign: 'center', color: T.ink3, fontFamily: T.mono, fontSize: 12, letterSpacing: 0.8 }}>LOADING YOUR DASHBOARD…</div>
          ) : data.error ? (
            <div style={{ padding: 24, background: 'rgba(255,71,87,0.08)', border: '1px solid rgba(255,71,87,0.25)', borderRadius: 12, color: '#FF8a92' }}>{data.error}</div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(380px, 1fr))', gap: 20 }}>
              <CheckInCard teacher={data.teacher} checkin={data.checkin} onCheckedIn={onCheckedIn} onCheckedOut={onCheckedOut} profile={profile} />
              <MyTasksCard profile={profile} />
              <MyLessonsCard profile={profile} />
              <NiaCoachCard
                data={{ teacher: data.teacher, assignments: data.assignments, rollCalls: data.rollCalls || [], checkin: data.checkin, healthRecords: data.healthRecords || [] }}
                onTakeRollCall={setRollCallStream}
                onLogHealth={setHealthStudent}
                onScrollToCheckin={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
              />
              <TodaysClassesCard assignments={data.assignments} rollCalls={data.rollCalls || []} onTakeRollCall={setRollCallStream} />
              <LessonsCard lessons={data.lessons} />
              {window.PEAK_LEARNING ? <PEAK_LEARNING.TeacherLessonPlan email={(profile && profile.email) || ''} /> : <SyllabusCard syllabus={data.syllabus} />}
              <StudentsCard assignments={data.assignments} onLogHealth={setHealthStudent} healthRecords={data.healthRecords || []} />
              <LoggedNotesCard healthRecords={data.healthRecords || []} students={data.students || []} onLog={setHealthStudent} />
              <PayslipCard payroll={data.payroll} />
            </div>
          )}
        </main>

        {/* Nia's live check-in nudge — only on weekdays, if not yet checked in */}
        {!data.loading && !data.error && data.teacher && !data.checkin &&
         new Date().getDay() !== 0 && new Date().getDay() !== 6 &&
         new Date().getHours() < 17 && (
          <NiaCheckinPopup
            teacher={data.teacher}
            profile={profile}
            onCheckedIn={onCheckedIn}
          />
        )}

        {rollCallStream && data.teacher && (
          <RollCallModal
            stream={rollCallStream}
            teacher={data.teacher}
            assignments={data.assignments}
            existingRollCalls={(data.rollCalls || []).filter(rc => rc.stream === rollCallStream)}
            onClose={() => setRollCallStream(null)}
            onSaved={onRollCallSaved}
            profile={profile}
          />
        )}

        {healthStudent && data.teacher && (
          <HealthLogModal
            student={healthStudent}
            teacher={data.teacher}
            onClose={() => setHealthStudent(null)}
            onSaved={() => { tinyToast('Note saved.', 'success'); refresh(); }}
            profile={profile}
          />
        )}
      </div>
    );
  }

  function MyTasksCard({ profile }) {
    const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
    const email = ((profile && profile.email) || '').toLowerCase();
    const tenantId = (profile && profile.tenantId) || 'peak-primary';
    const [tasks, setTasks] = useState(null);
    const [busyId, setBusyId] = useState(null);
    const load = useCallback(() => {
      fetch(WK + '/os-data?kind=staff_task&tenant=' + encodeURIComponent(tenantId)).then(r => r.json()).then(d => {
        const rows = ((d && d.records) || []).map(x => Object.assign({ _id: x.id }, x.payload));
        const mine = rows.filter(t => (t.emails || []).map(e => String(e).toLowerCase()).indexOf(email) >= 0).sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
        setTasks(mine);
      }).catch(() => setTasks([]));
    }, [email, tenantId]);
    useEffect(() => { load(); }, [load]);
    const markDone = (t) => {
      setBusyId(t._id);
      const done = Object.assign({}, t.done || {}); done[email] = true;
      const rec = Object.assign({}, t); delete rec._id; rec.done = done;
      fetch(WK + '/os-data/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'staff_task', tenant: tenantId, record: rec, id: t._id }) })
        .then(r => r.json()).then(() => { setBusyId(null); load(); }).catch(() => setBusyId(null));
    };
    const open = (tasks || []).filter(t => !(t.done || {})[email]);
    const doneList = (tasks || []).filter(t => (t.done || {})[email]);
    return (
      <div style={{ background: T.surface, border: '1px solid ' + T.border, borderRadius: 14, padding: 22 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <div style={{ fontSize: 12, fontFamily: T.mono, letterSpacing: 0.8, color: T.ink3 }}>MY TASKS</div>
          {open.length > 0 && <div style={{ background: T.red, color: '#fff', borderRadius: 999, padding: '2px 9px', fontSize: 11.5, fontWeight: 700 }}>{open.length} to do</div>}
        </div>
        {tasks === null ? <div style={{ color: T.ink3, fontSize: 12.5 }}>Loading…</div> :
          (open.length === 0 && doneList.length === 0) ? <div style={{ color: T.ink3, fontSize: 13 }}>No tasks assigned to you. The head teacher's tasks will show up here.</div> : (
            <div style={{ display: 'grid', gap: 10 }}>
              {open.map((t, i) => (
                <div key={i} style={{ border: '1px solid ' + T.border, borderRadius: 10, padding: '12px 14px' }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: T.ink }}>{t.title}</div>
                  {t.details && <div style={{ fontSize: 12.5, color: T.ink2, marginTop: 4 }}>{t.details}</div>}
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 10 }}>
                    <div style={{ fontSize: 11.5, color: T.ink3 }}>{t.due ? 'Due ' + t.due : 'No due date'}</div>
                    <button onClick={() => markDone(t)} disabled={busyId === t._id} style={{ background: T.good, color: '#04210f', border: 'none', borderRadius: 8, padding: '6px 13px', fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>{busyId === t._id ? '…' : 'Mark done'}</button>
                  </div>
                </div>
              ))}
              {doneList.map((t, i) => (
                <div key={'d' + i} style={{ border: '1px solid ' + T.border, borderRadius: 10, padding: '10px 14px', opacity: 0.6 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: T.ink2, textDecoration: 'line-through' }}>{t.title}</div>
                  <div style={{ fontSize: 11, color: T.good, marginTop: 2 }}>✓ Done</div>
                </div>
              ))}
            </div>
          )}
      </div>
    );
  }

  function MyLessonsCard({ profile }) {
    const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
    const email = ((profile && profile.email) || '').toLowerCase();
    const tenantId = (profile && profile.tenantId) || 'peak-primary';
    const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const [tt, setTt] = useState(null);   // {periods, grid}
    const [showWeek, setShowWeek] = useState(false);
    const [plan, setPlan] = useState(null); // lesson object being planned
    const load = useCallback(() => {
      fetch(WK + '/os-data?kind=timetable&tenant=' + encodeURIComponent(tenantId)).then(r => r.json()).then(d => {
        const rec = ((d && d.records) || [])[0]; if (rec && rec.payload) setTt(rec.payload); else setTt({ periods: [], grid: {} });
      }).catch(() => setTt({ periods: [], grid: {} }));
    }, [email, tenantId]);
    useEffect(() => { load(); const iv = setInterval(load, 60000); const onVis = () => { if (!document.hidden) load(); }; document.addEventListener('visibilitychange', onVis); window.addEventListener('focus', load); return () => { clearInterval(iv); document.removeEventListener('visibilitychange', onVis); window.removeEventListener('focus', load); }; }, [load]);

    // build this teacher's lessons per weekday from the grid
    const mine = {}; ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].forEach(d => mine[d] = []);
    if (tt && tt.grid) {
      Object.keys(tt.grid).forEach(cls => {
        ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].forEach(d => {
          (tt.grid[cls][d] || []).forEach((cell, pi) => {
            if (cell && !cell.brk && cell.subject && (cell.teacherEmail || '').toLowerCase() === email) {
              const p = (tt.periods || [])[pi] || {};
              mine[d].push({ cls, subject: cell.subject, pi, label: p.l, start: p.s, end: p.e });
            }
          });
        });
      });
      ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].forEach(d => mine[d].sort((a, b) => (a.pi - b.pi)));
    }
    const todayName = DAYS[new Date().getDay()];
    const todayKey = (todayName === 'Sat' || todayName === 'Sun') ? 'Mon' : todayName;
    const todays = mine[todayKey] || [];
    const totalWeek = Object.values(mine).reduce((a, arr) => a + arr.length, 0);

    const lessonRow = (L, withDay) => (
      <div key={(withDay || '') + L.cls + L.pi} style={{ display: 'flex', alignItems: 'center', gap: 10, border: '1px solid ' + T.border, borderRadius: 10, padding: '9px 12px' }}>
        <div style={{ width: 46, flexShrink: 0 }}>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: T.ink }}>{L.label}</div>
          <div style={{ fontSize: 9.5, color: T.ink4, fontFamily: T.mono }}>{L.start}</div>
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 13.5, fontWeight: 600, color: T.ink }}>{L.subject}</div>
          <div style={{ fontSize: 11.5, color: T.ink3 }}>{(withDay ? withDay + ' · ' : '') + L.cls}</div>
        </div>
        <button onClick={() => setPlan(L)} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 8, padding: '6px 11px', fontSize: 11.5, cursor: 'pointer', flexShrink: 0 }}>Lesson plan</button>
      </div>
    );

    return (
      <div style={{ background: T.surface, border: '1px solid ' + T.border, borderRadius: 14, padding: 22 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <div style={{ fontSize: 12, fontFamily: T.mono, letterSpacing: 0.8, color: T.ink3 }}>MY LESSONS · {todayName.toUpperCase()}</div>
          {totalWeek > 0 && <button onClick={() => setShowWeek(w => !w)} style={{ background: 'transparent', border: 'none', color: T.red, fontSize: 11.5, cursor: 'pointer' }}>{showWeek ? 'Today only' : 'Full week (' + totalWeek + ')'}</button>}
        </div>
        {tt === null ? <div style={{ color: T.ink3, fontSize: 12.5 }}>Loading your timetable…</div> :
          totalWeek === 0 ? <div style={{ color: T.ink3, fontSize: 13, lineHeight: 1.5 }}>No lessons assigned to you yet. Once the head teacher builds the timetable, your classes appear here automatically.</div> :
          showWeek ? (
            <div style={{ display: 'grid', gap: 10 }}>
              {['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].map(d => (mine[d].length ? <div key={d}><div style={{ fontSize: 10.5, fontFamily: T.mono, color: T.ink4, margin: '4px 0 6px' }}>{d.toUpperCase()}</div><div style={{ display: 'grid', gap: 8 }}>{mine[d].map(L => lessonRow(L))}</div></div> : null))}
            </div>
          ) : (
            todays.length ? <div style={{ display: 'grid', gap: 8 }}>{todays.map(L => lessonRow(L))}</div> : <div style={{ color: T.ink3, fontSize: 13 }}>No lessons for you today. Enjoy the breather.</div>
          )}
        {plan && <LessonPlanModal lesson={plan} profile={profile} onClose={() => setPlan(null)} />}
      </div>
    );
  }

  function LessonPlanModal({ lesson, profile, onClose }) {
    const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
    const email = ((profile && profile.email) || '').toLowerCase();
    const tenantId = (profile && profile.tenantId) || 'peak-primary';
    const key = email + '|' + lesson.cls + '|' + lesson.subject;
    const [f, setF] = useState({ topic: '', objectives: '', activities: '', materials: '', notes: '' });
    const [recId, setRecId] = useState(null);
    const [busy, setBusy] = useState(false);
    const [loaded, setLoaded] = useState(false);
    useEffect(() => {
      fetch(WK + '/os-data?kind=lesson_plan&tenant=' + encodeURIComponent(tenantId)).then(r => r.json()).then(d => {
        const rec = ((d && d.records) || []).find(x => (x.payload && x.payload.key) === key);
        if (rec) { setRecId(rec.id); setF(Object.assign({ topic: '', objectives: '', activities: '', materials: '', notes: '' }, rec.payload)); }
        setLoaded(true);
      }).catch(() => setLoaded(true));
    }, []);
    const set = (k, v) => setF(o => Object.assign({}, o, { [k]: v }));
    const inp = { width: '100%', background: T.bg, border: '1px solid ' + T.border, borderRadius: 9, padding: '10px 12px', fontSize: 13, color: T.ink, fontFamily: T.font, outline: 'none', boxSizing: 'border-box' };
    const lbl = { fontSize: 11, color: T.ink3, fontFamily: T.mono, marginBottom: 5 };
    const save = () => {
      setBusy(true);
      const rec = { key, teacherEmail: email, cls: lesson.cls, subject: lesson.subject, topic: f.topic, objectives: f.objectives, activities: f.activities, materials: f.materials, notes: f.notes, updatedAt: new Date().toISOString() };
      fetch(WK + '/os-data/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(recId ? { kind: 'lesson_plan', tenant: tenantId, record: rec, id: recId } : { kind: 'lesson_plan', tenant: tenantId, record: rec }) })
        .then(r => r.json()).then(() => { setBusy(false); window.tinyToast ? window.tinyToast('Lesson plan saved', 'success') : null; onClose(); }).catch(() => setBusy(false));
    };
    return (
      <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 9000, background: 'rgba(5,8,22,0.72)', backdropFilter: 'blur(6px)', display: 'grid', placeItems: 'center', padding: 20 }}>
        <div onClick={e => e.stopPropagation()} style={{ width: '100%', maxWidth: 480, background: T.surface, border: '1px solid ' + T.border, borderRadius: 16, padding: 22, maxHeight: '92vh', overflow: 'auto', color: T.ink, fontFamily: T.font }}>
          <div style={{ fontSize: 16, fontWeight: 700 }}>{lesson.subject} · {lesson.cls}</div>
          <div style={{ fontSize: 12, color: T.ink3, marginBottom: 16 }}>Lesson plan</div>
          {!loaded ? <div style={{ color: T.ink3, fontSize: 12.5 }}>Loading…</div> : (
            <div style={{ display: 'grid', gap: 12 }}>
              <label><div style={lbl}>TOPIC</div><input style={inp} value={f.topic} onChange={e => set('topic', e.target.value)} placeholder="e.g. Fractions — part-whole" /></label>
              <label><div style={lbl}>OBJECTIVES</div><textarea style={{ ...inp, minHeight: 60 }} value={f.objectives} onChange={e => set('objectives', e.target.value)} placeholder="By the end, learners can…" /></label>
              <label><div style={lbl}>ACTIVITIES</div><textarea style={{ ...inp, minHeight: 70 }} value={f.activities} onChange={e => set('activities', e.target.value)} placeholder="Intro, main activity, group work, practice…" /></label>
              <label><div style={lbl}>MATERIALS</div><input style={inp} value={f.materials} onChange={e => set('materials', e.target.value)} placeholder="Chalkboard, worksheets, counters…" /></label>
              <label><div style={lbl}>NOTES</div><textarea style={{ ...inp, minHeight: 50 }} value={f.notes} onChange={e => set('notes', e.target.value)} placeholder="Anything else" /></label>
            </div>
          )}
          <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 18 }}>
            <button onClick={onClose} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 9, padding: '9px 16px', fontSize: 13, cursor: 'pointer' }}>Close</button>
            <button onClick={save} disabled={busy} style={{ background: T.red, color: '#fff', border: 'none', borderRadius: 9, padding: '9px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>{busy ? 'Saving…' : 'Save plan'}</button>
          </div>
        </div>
      </div>
    );
  }

  function LoggedNotesCard({ healthRecords, students, onLog }) {
    const nameOf = (id) => { const st = (students || []).find(x => String(x.id) === String(id)); return st ? st.name : ('Student #' + id); };
    const catColor = (c) => ({ illness: T.red, injury: T.gold, wellbeing: T.blue, behavior: T.green, behaviour: T.green }[c] || T.ink3);
    const recs = (healthRecords || []).slice().sort((a, b) => String(b.recorded_at || '').localeCompare(String(a.recorded_at || '')));
    const fmt = (d) => { try { return new Date(d).toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' · ' + new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
    return (
      <div style={{ background: T.surface, border: '1px solid ' + T.border, borderRadius: 14, padding: 22 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <div style={{ fontSize: 12, fontFamily: T.mono, letterSpacing: 0.8, color: T.ink3 }}>NOTES I'VE LOGGED</div>
          <span style={{ fontSize: 11, color: T.ink3 }}>{recs.length}</span>
        </div>
        {recs.length === 0 ? <div style={{ color: T.ink3, fontSize: 13, lineHeight: 1.5 }}>No notes yet. Log a wellbeing, behaviour or health note from a student — it appears here and in their profile for the head teacher.</div> : (
          <div style={{ display: 'grid', gap: 10, maxHeight: 360, overflow: 'auto' }}>
            {recs.slice(0, 30).map((h, i) => (
              <div key={h.id || i} style={{ border: '1px solid ' + T.border, borderRadius: 10, padding: '10px 12px', opacity: h.resolved_at ? 0.6 : 1 }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: T.ink }}>{nameOf(h.student_id)}</div>
                  <span style={{ fontSize: 9.5, fontFamily: T.mono, color: catColor(h.category), border: '1px solid ' + catColor(h.category), borderRadius: 5, padding: '1px 6px', textTransform: 'uppercase' }}>{h.category}{h.severity ? (' · ' + h.severity) : ''}</span>
                </div>
                <div style={{ fontSize: 12.5, color: T.ink2, marginTop: 5, lineHeight: 1.45 }}>{h.description}</div>
                <div style={{ fontSize: 10.5, color: T.ink4, marginTop: 5, fontFamily: T.mono }}>{fmt(h.recorded_at)}{h.resolved_at ? ' · resolved' : (h.follow_up_needed ? ' · follow-up' : '')}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  window.TeacherShell = TeacherShell;
})();

  </script>
  <script type="text/babel" data-src="head-staff-panel.jsx">
/* head-staff-panel.jsx
   Sarah's view of her staff today.

   Pulls live from Supabase:
     - teachers (everyone on payroll)
     - teacher_checkins (today's check-ins + check-outs)
     - student_roll_call (which classes had roll taken today)
     - student_health_records (recent health notes)

   Status pills:
     ● GREEN  — checked in, still on campus
     ● AMBER  — checked in then out (left for the day)
     ● GRAY   — hasn't checked in today

   Exposed as window.HeadStaffPanel. Loaded inline in index.html.
*/
(function () {
  const { useState, useEffect, useMemo, useCallback } = React;

  const T = {
    bg:       (typeof window!=='undefined'&&window.__BG)||'#0a1029',
    surface:  (typeof window!=='undefined'&&window.__SURFACE)||'#141e3c',
    surface2: (typeof window!=='undefined'&&window.__SURFACE2)||'#1a2548',
    surface3: (typeof window!=='undefined'&&window.__SURFACE3)||'#212d56',
    border:   'rgba(255,255,255,0.06)',
    borderStr:'rgba(255,255,255,0.10)',
    ink:      '#f5f6fa',
    ink2:     'rgba(245,246,250,0.85)',
    ink3:     'rgba(245,246,250,0.55)',
    ink4:     'rgba(245,246,250,0.40)',
    red:      '#FF4757',
    green:    (typeof window!=='undefined'&&window.__ACCENT)||'#00FC8F',
    gold:     '#FFB400',
    blue:     '#3B82F6',
    font:     "'Inter', -apple-system, system-ui, sans-serif",
    mono:     "'JetBrains Mono', ui-monospace, monospace",
    serif:    "'Instrument Serif', serif",
  };

  const isoDate = () => new Date().toISOString().slice(0, 10);
  const fmtTime = (iso) => iso
    ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : '—';
  const fmtDuration = (a, b) => {
    if (!a) return '';
    const end = b ? new Date(b) : new Date();
    const ms = end - new Date(a);
    if (ms <= 0) return '';
    const mins = Math.floor(ms / 60000);
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  };

  async function loadStaffData(tenantId) {
    const sb = window.NextSession?.sb;
    if (!sb) return { error: 'No session' };

    const today = isoDate();

    // Teachers
    const { data: teachers } = await sb
      .from('teachers')
      .select('id, full_name, email, subjects, status')
      .eq('tenant_id', tenantId)
      .order('full_name', { ascending: true });

    // Today's check-ins (latest per teacher)
    const { data: checkins } = await sb
      .from('teacher_checkins')
      .select('id, teacher_id, checked_in_at, checked_out_at, method')
      .eq('tenant_id', tenantId)
      .gte('checked_in_at', today + 'T00:00:00')
      .order('checked_in_at', { ascending: false });

    // Today's roll call records (count per teacher)
    const { data: rollCalls } = await sb
      .from('student_roll_call')
      .select('id, teacher_id, stream, status')
      .eq('tenant_id', tenantId)
      .eq('roll_date', today);

    // Recent health records (last 7 days, per teacher_id)
    const sevenDaysAgo = new Date(Date.now() - 7 * 86400000).toISOString();
    const { data: healthRecs } = await sb
      .from('student_health_records')
      .select('id, recorded_by_teacher_id, recorded_at, follow_up_needed, resolved_at')
      .eq('tenant_id', tenantId)
      .gte('recorded_at', sevenDaysAgo);

    return {
      teachers: teachers || [],
      checkins: checkins || [],
      rollCalls: rollCalls || [],
      healthRecs: healthRecs || [],
    };
  }

  function StaffStatusPill({ status }) {
    const styles = {
      in:   { bg: 'rgba(0,252,143,0.14)',  fg: T.green, dot: T.green, label: 'ON CAMPUS' },
      out:  { bg: 'rgba(255,180,0,0.14)',  fg: T.gold,  dot: T.gold,  label: 'LEFT FOR THE DAY' },
      absent:{ bg: 'rgba(255,255,255,0.06)', fg: T.ink3, dot: T.ink3,  label: 'NOT CHECKED IN' },
    }[status];
    return (
      <span style={{
        display: 'inline-flex', alignItems: 'center', gap: 6,
        background: styles.bg, color: styles.fg,
        padding: '4px 10px', borderRadius: 999,
        fontSize: 10.5, fontFamily: T.mono, fontWeight: 700, letterSpacing: 0.6,
      }}>
        <span style={{
          width: 7, height: 7, borderRadius: 999, background: styles.dot,
          boxShadow: status === 'in' ? '0 0 8px ' + T.green : 'none',
        }} />
        {styles.label}
      </span>
    );
  }

  function HeadStaffPanel({ onNav }) {
    const profile = window.PEAK_ROLE ? window.PEAK_ROLE.getProfile() : { tenantId: 'peak-primary' };
    const [data, setData] = useState({ loading: true });

    const refresh = useCallback(async () => {
      setData(d => ({ ...d, loading: true }));
      const r = await loadStaffData(profile.tenantId);
      setData(Object.assign({}, r, { loading: false }));
    }, [profile.tenantId]);

    useEffect(() => {
      refresh();
      const id = setInterval(refresh, 30000); // poll every 30s — live feel
      return () => clearInterval(id);
    }, [refresh]);

    const enriched = useMemo(() => {
      if (!data.teachers) return [];
      const checkinsByTeacher = {};
      (data.checkins || []).forEach(c => {
        // Keep the most recent per teacher (already ordered desc)
        if (!checkinsByTeacher[c.teacher_id]) checkinsByTeacher[c.teacher_id] = c;
      });
      const rollByTeacher = {};
      (data.rollCalls || []).forEach(r => {
        if (!rollByTeacher[r.teacher_id]) rollByTeacher[r.teacher_id] = new Set();
        rollByTeacher[r.teacher_id].add(r.stream);
      });
      const healthByTeacher = {};
      (data.healthRecs || []).forEach(h => {
        if (!h.recorded_by_teacher_id) return;
        healthByTeacher[h.recorded_by_teacher_id] = (healthByTeacher[h.recorded_by_teacher_id] || 0) + 1;
      });
      return data.teachers.map(t => {
        const c = checkinsByTeacher[t.id];
        const status = !c ? 'absent' : (c.checked_out_at ? 'out' : 'in');
        return {
          ...t,
          status,
          checkin: c,
          streamsRolled: rollByTeacher[t.id] ? Array.from(rollByTeacher[t.id]) : [],
          healthCount: healthByTeacher[t.id] || 0,
        };
      });
    }, [data]);

    const stats = useMemo(() => {
      const total = enriched.length;
      const inNow = enriched.filter(e => e.status === 'in').length;
      const left = enriched.filter(e => e.status === 'out').length;
      const absent = enriched.filter(e => e.status === 'absent').length;
      return { total, inNow, left, absent };
    }, [enriched]);

    return (
      <div style={{
        minHeight: '100vh', background: T.bg, color: T.ink,
        fontFamily: T.font, padding: '32px 36px 60px',
      }}>
        {/* Header */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24, gap: 12, flexWrap: 'wrap' }}>
          <div>
            <div style={{ fontSize: 10.5, fontFamily: T.mono, letterSpacing: 1.5, color: T.ink3 }}>
              STAFF TODAY · {new Date().toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' })}
            </div>
            <h1 style={{
              fontSize: 32, fontWeight: 400, margin: '6px 0 0',
              fontFamily: T.serif, letterSpacing: '-0.01em',
            }}>Who's on campus right now</h1>
          </div>
          <button onClick={refresh} disabled={data.loading} style={{
            background: 'transparent', color: T.ink2,
            border: '1px solid ' + T.borderStr,
            padding: '8px 16px', borderRadius: 8,
            fontSize: 12, cursor: data.loading ? 'wait' : 'pointer', fontFamily: T.font,
          }}>{data.loading ? 'Refreshing…' : '↻ Refresh'}</button>
        </div>

        {/* Stat cards */}
        <div style={{
          display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))',
          gap: 14, marginBottom: 24,
        }}>
          {[
            { label: 'TOTAL TEACHERS', value: stats.total, color: T.ink },
            { label: 'ON CAMPUS NOW',  value: stats.inNow, color: T.green, glow: true },
            { label: 'LEFT FOR DAY',   value: stats.left,  color: T.gold },
            { label: 'NOT CHECKED IN', value: stats.absent,color: T.red },
          ].map((s, i) => (
            <div key={i} style={{
              background: T.surface,
              border: '1px solid ' + T.border,
              borderRadius: 12, padding: 18,
              position: 'relative',
            }}>
              <div style={{ fontSize: 10, fontFamily: T.mono, letterSpacing: 1.5, color: T.ink3, marginBottom: 6 }}>{s.label}</div>
              <div style={{
                fontSize: 34, fontWeight: 700, color: s.color, fontFamily: T.serif,
                textShadow: s.glow ? '0 0 24px rgba(0,252,143,0.4)' : 'none',
              }}>{s.value}</div>
            </div>
          ))}
        </div>

        {/* Staff list */}
        <div style={{
          background: T.surface, border: '1px solid ' + T.border,
          borderRadius: 14, overflow: 'hidden',
        }}>
          <div style={{
            padding: '14px 22px', borderBottom: '1px solid ' + T.border,
            display: 'flex', alignItems: 'center', gap: 10,
            fontSize: 11, fontFamily: T.mono, color: T.ink3, letterSpacing: 1.2,
          }}>
            STAFF DIRECTORY · {enriched.length} TEACHER{enriched.length === 1 ? '' : 'S'}
            <span style={{
              marginLeft: 'auto', fontSize: 10, color: T.ink4,
              display: 'flex', alignItems: 'center', gap: 6,
            }}>
              <span style={{
                width: 6, height: 6, borderRadius: 999, background: T.green,
                animation: 'pulse 2s infinite',
              }} />
              LIVE · UPDATES EVERY 30s
            </span>
          </div>

          {data.loading && enriched.length === 0 ? (
            <div style={{ padding: 48, textAlign: 'center', color: T.ink3, fontFamily: T.mono, fontSize: 11 }}>
              LOADING STAFF…
            </div>
          ) : enriched.length === 0 ? (
            <div style={{ padding: 48, textAlign: 'center', color: T.ink4, fontStyle: 'italic' }}>
              No teachers found for your tenant.
            </div>
          ) : enriched.map(t => (
            <div key={t.id} style={{
              padding: '16px 22px',
              borderBottom: '1px solid ' + T.border,
              display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap',
              background: t.status === 'in' ? 'rgba(0,252,143,0.025)' : 'transparent',
            }}>
              {/* Avatar */}
              <div style={{
                width: 42, height: 42, borderRadius: 999,
                background: t.status === 'in' ? T.green : t.status === 'out' ? T.gold : T.surface3,
                color: t.status === 'in' || t.status === 'out' ? T.bg : T.ink3,
                display: 'grid', placeItems: 'center',
                fontSize: 13, fontWeight: 700, flexShrink: 0,
                boxShadow: t.status === 'in' ? '0 0 16px rgba(0,252,143,0.4)' : 'none',
              }}>{t.full_name.split(' ').map(n => n[0]).join('').slice(0, 2)}</div>

              {/* Name + subjects */}
              <div style={{ flex: 1, minWidth: 200 }}>
                <div style={{ fontSize: 15, fontWeight: 600, color: T.ink, marginBottom: 4 }}>{t.full_name}</div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 11, color: T.ink3, fontFamily: T.mono, flexWrap: 'wrap' }}>
                  <StaffStatusPill status={t.status} />
                  {t.subjects && t.subjects.length > 0 && (
                    <span style={{ letterSpacing: 0.4 }}>{t.subjects.join(' · ')}</span>
                  )}
                </div>
              </div>

              {/* Activity stats */}
              <div style={{ display: 'flex', gap: 18, fontSize: 11, color: T.ink3, fontFamily: T.mono }}>
                {t.checkin && (
                  <div>
                    <div style={{ color: T.ink4, fontSize: 9.5, letterSpacing: 0.8 }}>CHECK IN</div>
                    <div style={{ color: t.status === 'in' ? T.green : T.ink2, fontWeight: 700 }}>{fmtTime(t.checkin.checked_in_at)}</div>
                  </div>
                )}
                {t.checkin && t.checkin.checked_out_at && (
                  <div>
                    <div style={{ color: T.ink4, fontSize: 9.5, letterSpacing: 0.8 }}>CHECK OUT</div>
                    <div style={{ color: T.gold, fontWeight: 700 }}>{fmtTime(t.checkin.checked_out_at)}</div>
                  </div>
                )}
                {t.checkin && (
                  <div>
                    <div style={{ color: T.ink4, fontSize: 9.5, letterSpacing: 0.8 }}>{t.status === 'in' ? 'SO FAR' : 'TIME'}</div>
                    <div style={{ color: T.ink2, fontWeight: 700 }}>
                      {fmtDuration(t.checkin.checked_in_at, t.checkin.checked_out_at) || '—'}
                    </div>
                  </div>
                )}
                <div>
                  <div style={{ color: T.ink4, fontSize: 9.5, letterSpacing: 0.8 }}>ROLL CALLS</div>
                  <div style={{ color: t.streamsRolled.length > 0 ? T.green : T.ink3, fontWeight: 700 }}>
                    {t.streamsRolled.length > 0 ? t.streamsRolled.join(', ') : '—'}
                  </div>
                </div>
                <div>
                  <div style={{ color: T.ink4, fontSize: 9.5, letterSpacing: 0.8 }}>HEALTH (7d)</div>
                  <div style={{ color: t.healthCount > 0 ? T.blue : T.ink3, fontWeight: 700 }}>
                    {t.healthCount > 0 ? t.healthCount + ' notes' : '—'}
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>

        <style>{`
          @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
          }
        `}</style>
      </div>
    );
  }

  window.HeadStaffPanel = HeadStaffPanel;
})();

  </script>
  <script type="text/babel" data-src="head-timetable-panel.jsx">
/* head-timetable-panel.jsx
   Sarah's digital timetable — color-coded by live activity.

   Pulls today's slots + cross-references with teacher_checkins and
   student_roll_call. Each cell gets a status:

     GREEN  — slot has happened or is happening, roll call taken
     ORANGE — slot is now or next, teacher checked in, roll not yet taken
     RED    — slot is past/now, teacher not checked in or roll not taken
     GRAY   — unassigned slot (no teacher), or out-of-school time

   Polls every 30s for live updates.

   Exposed as window.HeadTimetablePanel.
*/
(function () {
  const { useState, useEffect, useMemo, useCallback } = React;

  const T = {
    bg:       (typeof window!=='undefined'&&window.__BG)||'#0a1029',
    surface:  (typeof window!=='undefined'&&window.__SURFACE)||'#141e3c',
    surface2: (typeof window!=='undefined'&&window.__SURFACE2)||'#1a2548',
    surface3: (typeof window!=='undefined'&&window.__SURFACE3)||'#212d56',
    border:   'rgba(255,255,255,0.06)',
    borderStr:'rgba(255,255,255,0.10)',
    ink:      '#f5f6fa',
    ink2:     'rgba(245,246,250,0.85)',
    ink3:     'rgba(245,246,250,0.55)',
    ink4:     'rgba(245,246,250,0.40)',
    red:      '#FF4757',
    green:    (typeof window!=='undefined'&&window.__ACCENT)||'#00FC8F',
    gold:     '#FFB400',
    blue:     '#3B82F6',
    font:     "'Inter', -apple-system, system-ui, sans-serif",
    mono:     "'JetBrains Mono', ui-monospace, monospace",
    serif:    "'Instrument Serif', serif",
  };

  const isoDate = () => new Date().toISOString().slice(0, 10);
  // Postgres day_of_week: 1=Mon, 7=Sun. JS getDay: 0=Sun, 6=Sat. Map.
  const todayDow = () => {
    const js = new Date().getDay();
    return js === 0 ? 7 : js;
  };
  const fmtTime = (t) => {
    // t is "HH:MM:SS" string
    if (!t) return '';
    return t.slice(0, 5);
  };
  function getTimetableStreams() { var c = (window.SCHOOL_CONFIG && window.SCHOOL_CONFIG.classes) || []; return (c && c.length) ? c : ['P1V','P1P','P2V','P2P','P3V','P3P','P4V','P4P','P5V','P5P','P6V','P6P','P7V','P7P']; }
  const STREAMS = getTimetableStreams();

  async function loadTimetable(tenantId) {
    const sb = window.NextSession?.sb;
    if (!sb) return { error: 'No session' };
    const today = isoDate();
    const dow = todayDow();

    // Today's slots, joined with teacher name
    const { data: slots } = await sb
      .from('timetable_slots')
      .select('id, period, start_time, end_time, stream, subject, teacher_id, label')
      .eq('tenant_id', tenantId)
      .eq('day_of_week', dow)
      .order('period', { ascending: true });

    const { data: teachers } = await sb
      .from('teachers')
      .select('id, full_name')
      .eq('tenant_id', tenantId);

    // Today's check-ins (latest per teacher)
    const { data: checkins } = await sb
      .from('teacher_checkins')
      .select('teacher_id, checked_in_at, checked_out_at')
      .eq('tenant_id', tenantId)
      .gte('checked_in_at', today + 'T00:00:00');

    // Today's roll call records
    const { data: rollCalls } = await sb
      .from('student_roll_call')
      .select('teacher_id, stream')
      .eq('tenant_id', tenantId)
      .eq('roll_date', today);

    return {
      slots: slots || [],
      teachers: teachers || [],
      checkins: checkins || [],
      rollCalls: rollCalls || [],
    };
  }

  // Compute slot status given current time + activity
  function computeSlotStatus(slot, ctx) {
    const { now, checkinByTeacher, rollDoneFor } = ctx;

    // Unassigned slot → gray
    if (!slot.teacher_id) return { status: 'free', label: 'UNASSIGNED' };

    // Parse slot times into today's date for comparison
    const [sh, sm] = slot.start_time.split(':').map(Number);
    const [eh, em] = slot.end_time.split(':').map(Number);
    const start = new Date(now); start.setHours(sh, sm, 0, 0);
    const end   = new Date(now); end.setHours(eh, em, 0, 0);

    const teacherIn = checkinByTeacher[slot.teacher_id];
    const rollKey = slot.teacher_id + '|' + slot.stream;
    const rollTaken = rollDoneFor[rollKey];

    const isCurrent  = now >= start && now < end;
    const isPast     = now >= end;
    const isFuture   = now < start;

    if (rollTaken) {
      // Roll has been taken — green regardless of time
      return { status: 'green', label: isCurrent ? 'IN SESSION' : 'DONE' };
    }

    if (isFuture) {
      // Pending — assigned class scheduled later today
      return { status: 'orange', label: 'PENDING' };
    }

    if (isCurrent) {
      if (!teacherIn) return { status: 'red', label: 'TEACHER NOT IN' };
      // Teacher checked in, but no roll yet
      return { status: 'orange', label: 'NO ROLL YET' };
    }

    // Past
    if (!teacherIn)  return { status: 'red', label: 'MISSED · NO TEACHER' };
    return { status: 'red', label: 'MISSED · NO ROLL' };
  }

  const STATUS_TOKENS = {
    green:  { bg: 'rgba(0,252,143,0.16)',  border: 'rgba(0,252,143,0.4)',  fg: '#00FC8F', glow: '0 0 12px rgba(0,252,143,0.25)' },
    orange: { bg: 'rgba(255,180,0,0.16)',  border: 'rgba(255,180,0,0.4)',  fg: '#FFB400', glow: 'none' },
    red:    { bg: 'rgba(255,71,87,0.16)',  border: 'rgba(255,71,87,0.4)',  fg: '#FF4757', glow: '0 0 12px rgba(255,71,87,0.2)' },
    free:   { bg: 'rgba(255,255,255,0.02)', border: 'rgba(255,255,255,0.06)', fg: 'rgba(245,246,250,0.30)', glow: 'none' },
    gray:   { bg: 'rgba(59,130,246,0.08)', border: 'rgba(59,130,246,0.20)', fg: 'rgba(245,246,250,0.55)', glow: 'none' },
  };

  function HeadTimetablePanel() {
    const profile = window.PEAK_ROLE ? window.PEAK_ROLE.getProfile() : { tenantId: 'peak-primary' };
    const [data, setData] = useState({ loading: true });
    const [now, setNow] = useState(new Date());

    const refresh = useCallback(async () => {
      setData(d => ({ ...d, loading: true }));
      const r = await loadTimetable(profile.tenantId);
      setData(Object.assign({}, r, { loading: false }));
    }, [profile.tenantId]);

    useEffect(() => {
      refresh();
      const dataPoll = setInterval(refresh, 30000); // live data every 30s
      const clockTick = setInterval(() => setNow(new Date()), 60000); // tick minute
      return () => { clearInterval(dataPoll); clearInterval(clockTick); };
    }, [refresh]);

    // Build context for status compute
    const ctx = useMemo(() => {
      const checkinByTeacher = {};
      (data.checkins || []).forEach(c => {
        // Teacher is "in" if checked in AND not checked out
        if (!checkinByTeacher[c.teacher_id] || !c.checked_out_at) {
          checkinByTeacher[c.teacher_id] = !c.checked_out_at;
        }
      });
      const rollDoneFor = {};
      (data.rollCalls || []).forEach(r => {
        rollDoneFor[r.teacher_id + '|' + r.stream] = true;
      });
      const teacherById = {};
      (data.teachers || []).forEach(t => { teacherById[t.id] = t.full_name; });
      return { now, checkinByTeacher, rollDoneFor, teacherById };
    }, [data, now]);

    // Build matrix: periods (rows) × streams (cols)
    const matrix = useMemo(() => {
      const byPeriod = {};
      (data.slots || []).forEach(s => {
        if (!byPeriod[s.period]) byPeriod[s.period] = { period: s.period, start_time: s.start_time, end_time: s.end_time, slots: {} };
        byPeriod[s.period].slots[s.stream] = s;
      });
      return Object.values(byPeriod).sort((a, b) => a.period - b.period);
    }, [data]);

    // Stats across all of today's slots
    const stats = useMemo(() => {
      const c = { green: 0, orange: 0, red: 0, free: 0, gray: 0 };
      (data.slots || []).forEach(s => {
        const st = computeSlotStatus(s, ctx);
        c[st.status] = (c[st.status] || 0) + 1;
      });
      return c;
    }, [data, ctx]);

    return (
      <div style={{
        minHeight: '100vh', background: T.bg, color: T.ink,
        fontFamily: T.font, padding: '32px 36px 60px',
      }}>
        {/* Header */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24, gap: 12, flexWrap: 'wrap' }}>
          <div>
            <div style={{ fontSize: 10.5, fontFamily: T.mono, letterSpacing: 1.5, color: T.ink3 }}>
              TIMETABLE · {now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' })} · {now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
            </div>
            <h1 style={{
              fontSize: 32, fontWeight: 400, margin: '6px 0 0',
              fontFamily: T.serif, letterSpacing: '-0.01em',
            }}>Today's classes — live</h1>
          </div>
          <button onClick={refresh} disabled={data.loading} style={{
            background: 'transparent', color: T.ink2,
            border: '1px solid ' + T.borderStr,
            padding: '8px 16px', borderRadius: 8,
            fontSize: 12, cursor: data.loading ? 'wait' : 'pointer', fontFamily: T.font,
          }}>{data.loading ? 'Refreshing…' : '↻ Refresh'}</button>
        </div>

        {/* Legend + stats */}
        <div style={{
          display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))',
          gap: 12, marginBottom: 24,
        }}>
          {[
            { key: 'green',  label: 'IN SESSION / DONE', count: stats.green },
            { key: 'orange', label: 'PENDING / IN PROGRESS', count: stats.orange },
            { key: 'red',    label: 'NEEDS ATTENTION',   count: stats.red },
            { key: 'free',   label: 'OPEN SLOTS',        count: stats.free },
          ].map(s => {
            const tk = STATUS_TOKENS[s.key];
            return (
              <div key={s.key} style={{
                background: tk.bg, border: '1px solid ' + tk.border,
                borderRadius: 12, padding: 14,
                display: 'flex', alignItems: 'center', gap: 12,
              }}>
                <div style={{
                  width: 10, height: 10, borderRadius: 999, background: tk.fg,
                  boxShadow: tk.glow,
                }} />
                <div>
                  <div style={{ fontSize: 9.5, fontFamily: T.mono, letterSpacing: 1, color: T.ink3 }}>{s.label}</div>
                  <div style={{ fontSize: 22, fontWeight: 700, color: tk.fg, fontFamily: T.serif }}>{s.count}</div>
                </div>
              </div>
            );
          })}
        </div>

        {/* The grid */}
        {data.loading && matrix.length === 0 ? (
          <div style={{ padding: 48, textAlign: 'center', color: T.ink3, fontFamily: T.mono, fontSize: 11 }}>
            LOADING TIMETABLE…
          </div>
        ) : matrix.length === 0 ? (
          <div style={{
            padding: 48, textAlign: 'center', color: T.ink4, fontStyle: 'italic',
            background: T.surface, border: '1px solid ' + T.border, borderRadius: 12,
          }}>
            No timetable seeded yet. Run the timetable schema SQL to populate today's slots.
          </div>
        ) : (
          <div style={{
            background: T.surface, border: '1px solid ' + T.border,
            borderRadius: 12, overflow: 'auto',
          }}>
            <table style={{
              width: '100%', borderCollapse: 'separate', borderSpacing: 0,
              minWidth: 1100,
            }}>
              <thead>
                <tr>
                  <th style={{
                    position: 'sticky', left: 0, zIndex: 2,
                    padding: '14px 12px', background: T.surface2,
                    fontSize: 10, fontFamily: T.mono, letterSpacing: 1.2,
                    color: T.ink3, textAlign: 'left', width: 110,
                    borderBottom: '1px solid ' + T.border,
                  }}>PERIOD</th>
                  {getTimetableStreams().map(s => (
                    <th key={s} style={{
                      padding: '14px 6px', background: T.surface2,
                      fontSize: 10.5, fontFamily: T.mono, letterSpacing: 1,
                      color: T.ink3, fontWeight: 700,
                      borderBottom: '1px solid ' + T.border,
                      borderLeft: '1px solid ' + T.border,
                      minWidth: 64,
                    }}>{s}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {matrix.map(row => {
                  // Is this period current?
                  const [sh, sm] = row.start_time.split(':').map(Number);
                  const [eh, em] = row.end_time.split(':').map(Number);
                  const start = new Date(now); start.setHours(sh, sm, 0, 0);
                  const end   = new Date(now); end.setHours(eh, em, 0, 0);
                  const isCurrent = now >= start && now < end;
                  return (
                    <tr key={row.period}>
                      <td style={{
                        position: 'sticky', left: 0, zIndex: 1,
                        padding: '10px 12px', background: isCurrent ? 'rgba(0,252,143,0.06)' : T.surface,
                        borderBottom: '1px solid ' + T.border,
                        fontSize: 12,
                      }}>
                        <div style={{ fontWeight: 700, color: isCurrent ? T.green : T.ink }}>
                          P{row.period}

  // ─── Global search (real: students, teachers, screens) ─────────────────────
  function GlobalSearch() {
    const [q, setQ] = React.useState('');
    const [open, setOpen] = React.useState(false);
    const term = q.trim().toLowerCase();
    const SCREENS = [['dash', 'Dashboard'], ['stud', 'Students'], ['attn', 'Attendance'], ['fees', 'Fees'], ['comm', 'Communications'], ['teach', 'Teachers'], ['trans', 'Transport'], ['learn', 'Learning'], ['rep', 'Reports'], ['finance', 'Finance'], ['timetable', 'Timetable'], ['today', 'Today']];
    let results = [];
    if (term) {
      const DD = window.PEAK || {};
      const feeKw = /owe|owing|overdue|balance|arrear|fees|debt|unpaid|outstanding/.test(term);
      (DD.students || []).forEach(st => { if ((st.name + ' ' + (st.guardian || '') + ' ' + (st.stream || '')).toLowerCase().indexOf(term) >= 0) results.push({ type: 'Student', label: st.name, sub: (st.stream || '') + (st.guardian ? (' · ' + st.guardian) : ''), run: () => window.peakOpenProfile && window.peakOpenProfile(st) }); });
      (DD.teachers || []).forEach(t => { if ((t.name + ' ' + ((t.subjects || []).join(' ')) + ' ' + (t.role || '')).toLowerCase().indexOf(term) >= 0) results.push({ type: 'Teacher', label: t.name, sub: ((t.subjects || []).join(', ')) || t.role || 'Teacher', run: () => window.peakNav && window.peakNav('teach') }); });
      // Fees — a named student's balance, or fee keywords list everyone owing
      (DD.students || []).forEach(st => { const bal = Number(st.balance) || 0; const named = (st.name || '').toLowerCase().indexOf(term) >= 0; if ((feeKw && bal > 0) || (named && bal > 0)) results.push({ type: 'Fee', label: st.name + ' — UGX ' + bal.toLocaleString() + ' due', sub: (st.stream || '') + ' · open Fees', run: () => window.peakNav && window.peakNav('fees') }); });
      // Messages — parent threads by parent, child or last message
      (DD.threads || []).forEach(th => { if ((th.name + ' ' + (th.child || '') + ' ' + (th.last || '')).toLowerCase().indexOf(term) >= 0) results.push({ type: 'Message', label: th.name, sub: (th.child ? (th.child + ' · ') : '') + (th.last || ''), run: () => window.peakNav && window.peakNav('comm') }); });
      SCREENS.forEach(([k, l]) => { if (l.toLowerCase().indexOf(term) >= 0) results.push({ type: 'Open', label: l, sub: 'Go to ' + l, run: () => window.peakNav && window.peakNav(k) }); });
      // de-dup identical labels, cap
      const seen = {}; results = results.filter(r => { const key = r.type + '|' + r.label; if (seen[key]) return false; seen[key] = 1; return true; }).slice(0, 12);
    }
    const go = (r) => { setOpen(false); setQ(''); try { r.run(); } catch (e) {} };
    return (
      <div style={{ position: 'relative', width: 340 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 14px', borderRadius: 10, background: T.surface, border: '1px solid ' + T.border }}>
          <span style={{ color: T.ink3, fontSize: 14 }}>{'\u2315'}</span>
          <input value={q} placeholder="Search students, teachers, fees, messages…" onChange={e => { setQ(e.target.value); setOpen(true); }} onFocus={() => setOpen(true)} onBlur={() => setTimeout(() => setOpen(false), 160)} onKeyDown={e => { if (e.key === 'Enter' && results[0]) go(results[0]); if (e.key === 'Escape') setOpen(false); }} style={{ border: 'none', outline: 'none', background: 'transparent', flex: 1, fontSize: 13, color: T.ink, fontFamily: T.font }} />
          <span style={{ fontSize: 10, color: T.ink3, fontFamily: T.mono, border: '1px solid ' + T.border, borderRadius: 5, padding: '2px 6px' }}>{'\u2318K'}</span>
        </div>
        {open && term ? (
          <div style={{ position: 'absolute', top: 'calc(100% + 6px)', left: 0, right: 0, background: T.surface, border: '1px solid ' + T.border, borderRadius: 10, boxShadow: '0 12px 30px rgba(0,0,0,0.4)', zIndex: 300, overflow: 'hidden', maxHeight: 360, overflowY: 'auto' }}>
            {results.length === 0 ? <div style={{ padding: '12px 14px', color: T.ink3, fontSize: 12.5 }}>No matches for “{q}”.</div> :
              results.map((r, i) => (
                <div key={i} onMouseDown={() => go(r)} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 14px', cursor: 'pointer', borderTop: i ? '1px solid ' + T.border : 'none' }}>
                  <span style={{ fontSize: 9.5, fontFamily: T.mono, color: T.ink3, border: '1px solid ' + T.border, borderRadius: 5, padding: '2px 6px', minWidth: 54, textAlign: 'center' }}>{r.type}</span>
                  <div style={{ minWidth: 0 }}><div style={{ fontSize: 13, color: T.ink, fontWeight: 600 }}>{r.label}</div><div style={{ fontSize: 11, color: T.ink3 }}>{r.sub}</div></div>
                </div>
              ))}
          </div>
        ) : null}
      </div>
    );
  }

  function _liveSignals() {

    const noPhone = studs.filter(s => !s.guardianPhone);
    const absent = Number(k.absentToday) || 0;
    const nav = (scr) => { if (window.peakNav) window.peakNav(scr); };
    const askNia = (q) => { if (window.PEAK_ASKNEXT) window.PEAK_ASKNEXT.open(q); };
    return { studs, overdue, overdueTotal, atRisk, noPhone, absent, nav, askNia, hasData: studs.length > 0 };

  // ─── AI assistant card ────────────────────────────────────────────────────
  // Live "who is in school vs who is teaching right now" — Nia spots idle staff + uncovered classes.
  function StaffNowCard() {
    const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
    const tn = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile().tenantId) || 'peak-primary';
    const [tt, setTt] = React.useState(null);
    const [staff, setStaff] = React.useState(null);
    const [teachers, setTeachers] = React.useState([]);
    const [, force] = React.useReducer(n => n + 1, 0);
    React.useEffect(() => {
      const load = () => {
        fetch(WK + '/os-data?kind=timetable&tenant=' + encodeURIComponent(tn)).then(r => r.json()).then(d => { const rec = ((d && d.records) || [])[0]; setTt((rec && rec.payload) || { periods: [], grid: {} }); }).catch(() => setTt({ periods: [], grid: {} }));
        fetch(WK + '/staff-status?tenant=' + encodeURIComponent(tn)).then(r => r.json()).then(d => setStaff((d && d.staff) || [])).catch(() => setStaff([]));
        fetch(WK + '/teachers?tenant=' + encodeURIComponent(tn)).then(r => r.ok ? r.json() : null).then(d => setTeachers((d && d.teachers) || [])).catch(() => {});
        // Fire a live no-show check (server dedups one alert per period) so the head gets pushed even before the cron runs.
        fetch(WK + '/attendance-watch?tenant=' + encodeURIComponent(tn)).catch(() => {});
      };
      load(); const iv = setInterval(() => force(), 60000); const lv = setInterval(load, 300000); return () => { clearInterval(iv); clearInterval(lv); };
    }, []);
    if (tt === null || staff === null) return null;
    const DN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; const day = DN[new Date().getDay()];
    const toM = (h) => { const m = String(h || '').match(/(\d{1,2}):(\d{2})/); return m ? (parseInt(m[1], 10) * 60 + parseInt(m[2], 10)) : null; };
    const nowM = (new Date()).getHours() * 60 + (new Date()).getMinutes();
    const periods = (tt && tt.periods) || [];
    let curIdx = -1, curPeriod = null;
    periods.forEach((p, i) => { const a = toM(p.s), b = toM(p.e); if (a != null && b != null && nowM >= a && nowM < b) { curIdx = i; curPeriod = p; } });
    const presentNames = new Set((staff || []).filter(s => /in at/i.test(s.status || '') && !/checked out/i.test(s.status || '')).map(s => (s.name || '').toLowerCase()));
    let uncovered = [], idle = [], teachingNow = 0;
    const weekday = day !== 'Sat' && day !== 'Sun';
    if (curIdx >= 0 && tt && tt.grid && weekday) {
      const teachingEmails = new Set();
      Object.keys(tt.grid).forEach(cls => { const cell = ((tt.grid[cls] || {})[day] || [])[curIdx]; if (cell && cell.subject && cell.teacherEmail) {
        teachingEmails.add((cell.teacherEmail || '').toLowerCase());
        const tName = ((teachers || []).find(t => (t.email || '').toLowerCase() === (cell.teacherEmail || '').toLowerCase()) || {}).full_name || '';
        const present = tName && presentNames.has(tName.toLowerCase());
        if (!present) uncovered.push({ cls: cls, subject: cell.subject, teacher: tName || cell.teacherEmail });
      } });
      (teachers || []).forEach(t => { const nm = (t.full_name || '').toLowerCase(); const em = (t.email || '').toLowerCase(); if (presentNames.has(nm)) { if (teachingEmails.has(em)) teachingNow++; else idle.push(t.full_name); } });
    }
    const hasTT = periods.length > 0 && Object.keys((tt && tt.grid) || {}).length > 0;
    return (
      <Card pad={0} style={{ marginTop: 14 }}>
        <div style={{ padding: 18 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
            <span style={{ width: 26, height: 26, borderRadius: 7, background: T.red, color: '#fff', display: 'grid', placeItems: 'center', fontFamily: T.mono, fontSize: 10.5, fontWeight: 700 }}>AI</span>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13.5, fontWeight: 600 }}>Staff right now {curPeriod ? <span style={{ color: T.ink3, fontWeight: 400 }}>· Period {curPeriod.l} ({curPeriod.s}–{curPeriod.e})</span> : null}</div>
              <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono }}>live · check-ins vs timetable</div>
            </div>
          </div>
          {!hasTT ? (
            <div style={{ fontSize: 12.5, color: T.ink3, lineHeight: 1.5 }}>Build the timetable (Timetable → Generate) so Nia can tell who should be teaching each period.</div>
          ) : !weekday ? (
            <div style={{ fontSize: 12.5, color: T.ink3 }}>Weekend — no lessons scheduled.</div>
          ) : curIdx < 0 ? (
            <div style={{ fontSize: 12.5, color: T.ink3 }}>No lesson period in session right now (break or before/after school).</div>
          ) : (
            <div style={{ display: 'grid', gap: 10 }}>
              <div style={{ display: 'flex', gap: 16, fontSize: 12, color: T.ink2 }}>
                <span><b style={{ color: T.good }}>{teachingNow}</b> teaching now</span>
                <span><b style={{ color: idle.length ? T.warn : T.ink }}>{idle.length}</b> in school, free</span>
                <span><b style={{ color: uncovered.length ? T.red : T.ink }}>{uncovered.length}</b> classes uncovered</span>
              </div>
              {uncovered.length > 0 && (
                <div style={{ background: 'rgba(226,58,82,0.08)', border: '1px solid rgba(226,58,82,0.3)', borderRadius: 9, padding: '9px 12px', fontSize: 12.5, color: T.ink2, lineHeight: 1.5 }}>
                  <b style={{ color: T.ink }}>Uncovered now:</b> {uncovered.slice(0, 3).map(u => u.cls + ' ' + u.subject + ' (' + (u.teacher || '?') + ' not in)').join('; ')}{uncovered.length > 3 ? '…' : ''}.
                  {idle.length > 0 ? <span> <b style={{ color: T.ink }}>{idle.slice(0, 2).join(', ')}</b> {idle.length === 1 ? 'is' : 'are'} in school and free — reassign to cover?</span> : null}
                </div>
              )}
              {uncovered.length === 0 && idle.length > 0 && (
                <div style={{ fontSize: 12.5, color: T.ink3, lineHeight: 1.5 }}><b style={{ color: T.ink }}>{idle.join(', ')}</b> {idle.length === 1 ? 'is' : 'are'} in school but not teaching this period (free).</div>
              )}
              {uncovered.length === 0 && idle.length === 0 && (
                <div style={{ fontSize: 12.5, color: T.good }}>✓ Every scheduled class has its teacher in. Nothing to action.</div>
              )}
            </div>
          )}
        </div>
      </Card>
    );
  }
