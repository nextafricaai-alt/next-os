  <script>
  (function () {
    try {
      var p = new URLSearchParams(location.search);
      // Resolve THIS app's school from the URL (/school/<slug> or /s/<slug>) or the signed-in tenant.
      // NEVER default to peak-primary — that would make Chrome silently rewrite an installed app to Peak.
      var slug = p.get('s') || p.get('t') || (location.pathname.match(/\/(?:s|school)\/([A-Za-z0-9_-]+)/) || [])[1] || '';
      if (!slug) { try { var _pf = JSON.parse(localStorage.getItem('nextos.profile') || 'null'); slug = (_pf && _pf.tenantId) || ''; } catch (e) {} }
      if (!slug) { try { slug = localStorage.getItem('nextos.lastTenant') || ''; } catch (e) {} }
      if (slug) {
        var ml = document.createElement('link'); ml.rel = 'manifest'; ml.href = '/manifest.php?s=' + encodeURIComponent(slug); document.head.appendChild(ml);
        var ai = document.getElementById('nx-apple-icon'); if (ai) ai.href = WK + '/icon.png?s=' + encodeURIComponent(slug);
      }
      var WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
      /* keep PNG apple-touch-icon (iOS requires PNG, not SVG) */
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
          try { reg.update(); } catch (e) {}
          if (reg.waiting) { try { reg.waiting.postMessage('skipWaiting'); } catch (e) {} }
          reg.addEventListener && reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (nw) nw.addEventListener('statechange', function () { if (nw.state === 'installed') { try { nw.postMessage('skipWaiting'); } catch (e) {} } });
          });
        }).catch(function () {});
      }
      var deferred = null;
      function makeBtn() { if (document.getElementById('nx-os-install')) return document.getElementById('nx-os-install'); var b = document.createElement('button'); b.id = 'nx-os-install'; b.textContent = '\u2913 Install app'; b.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:99999;display:none;background:#00fc8f;color:#062b18;border:0;border-radius:999px;padding:11px 18px;font-family:Inter,system-ui,sans-serif;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 8px 26px rgba(0,252,143,.4)'; b.onclick = function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function () { deferred = null; b.style.display = 'none'; }); }; document.body.appendChild(b); return b; }
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; window.__PEAK_CAN_INSTALL = true; });
      window.__PEAK_INSTALL = function () { if (deferred) { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; window.__PEAK_CAN_INSTALL = false; }); } else { alert('To install: open your browser menu and choose "Install app" / "Add to Home Screen".'); } };
      window.addEventListener('appinstalled', function () { var b = document.getElementById('nx-os-install'); if (b) b.style.display = 'none'; });
    } catch (e) {}
  })();
  </script>

  <script>
    /* Build self-heal: if this cached HTML is older than what the server now serves,
       reload ONCE with a cache-buster so no school is ever stuck on a stale build. */
    window.__BUILD = 'b85';
    (function () {
      try {
        fetch('/build.txt?ts=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : ''; })
          .then(function (srv) {
            srv = (srv || '').trim();
            if (!srv || srv === window.__BUILD) return;
            if (sessionStorage.getItem('nx_selfheal') === srv) return; // already tried this target
            sessionStorage.setItem('nx_selfheal', srv);
            var u = new URL(location.href); u.searchParams.set('cb', srv);
            location.replace(u.toString());
          }).catch(function () {});
      } catch (e) {}
    })();
  </script>
  <div id="root">
    <!-- Loading state (replaced once React mounts) -->
    <div style="min-height:100vh;display:grid;place-items:center;color:#8a91b0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:0.08em;">
      <div style="text-align:center">
        <div id="nx-loading-text">LOADING · NEXT SCHOOL OS</div>

  <!-- Session guard — must run BEFORE React so unauthenticated users get bounced -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/prototypes/schools/peak-primary/session-guard.js?v=4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
  /* NextReceipts — real receipts: save to Supabase, branded PDF, WhatsApp send (free click-to-send). */
  window.NextReceipts = (function(){
    function digits(p){ return String(p||'').replace(/[^0-9]/g,''); }
    function brandName(){ return (window.__BRAND_NAME) || 'School'; }
    function prefix(){ var n=brandName(); return (n.match(/[A-Za-z0-9]/g)||['N']).slice(0,2).join('').toUpperCase(); }
    function fmt(n){ try{ return 'UGX ' + Number(n||0).toLocaleString('en-UG'); }catch(e){ return 'UGX ' + (n||0); } }
    function methodLabel(m){ return ({mtn:'MTN Mobile Money',airtel:'Airtel Money',momo:'Mobile Money',mpesa:'M-Pesa',stanbic:'Bank deposit',bank:'Bank deposit',cash:'Cash',cheque:'Cheque'}[m]) || m || '-'; }
    function hexRgb(h){ h=String(h||'#00FC8F').replace('#',''); if(h.length===3){ h=h.split('').map(function(c){return c+c;}).join(''); } return [parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||200,parseInt(h.slice(4,6),16)||140]; }
    async function nextNo(sb, tenantId){
      var year=new Date().getFullYear(), seq=1;
      try{ var r=await sb.from('receipts').select('id',{count:'exact',head:true}).eq('tenant_id',tenantId); seq=(r.count||0)+1; }catch(e){}
      return prefix()+'-'+year+'-'+String(seq).padStart(5,'0');
    }
    async function issue(opts){
      var sess=window.NextSession||{}; var sb=sess.sb; var prof=sess.profile||{};
      var tenantId=prof.tenantId;
      if(!sb||!tenantId) throw new Error('Not signed in');
      var amount=Number(opts.amount||0);
      var no=await nextNo(sb, tenantId);
      var rec={ tenant_id:tenantId, receipt_no:no, student_id:(opts.studentId||null), student_name:(opts.studentName||null),
        guardian_name:(opts.guardianName||null), guardian_phone:(digits(opts.guardianPhone)||null), amount:amount, currency:'UGX',
        kind:'fees', method:(opts.method||null), reference:(opts.reference||null),
        balance_after:(opts.balanceAfter!=null?Number(opts.balanceAfter):null), term:(opts.term||null),
        issued_by:(prof.fullName||prof.email||null) };
      var res=await sb.from('receipts').insert(rec).select().single();
      if(res.error) throw res.error;
      try {
        var tok=''; try { var sd=await sb.auth.getSession(); tok=(sd&&sd.data&&sd.data.session&&sd.data.session.access_token)||''; } catch(e){}
        if (window.NX_PUSH) window.NX_PUSH.notify({ tenant: tenantId, role: 'head', title: 'Payment received', body: fmt(amount) + ' · ' + (opts.studentName || 'a student'), url: '/', tag: 'pay-' + Date.now() }, tok);
      } catch(e){}
      return res.data;
    }
    function buildPdf(rec){
      var ctor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF; if(!ctor) throw new Error('PDF engine not loaded');
      var doc=new ctor({unit:'pt',format:'a4'}); var W=doc.internal.pageSize.getWidth();
      var c=hexRgb(window.__ACCENT);
      doc.setFillColor(c[0],c[1],c[2]); doc.rect(0,0,W,72,'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.text(brandName(),40,44);
      doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.text('PAYMENT RECEIPT',W-40,44,{align:'right'});
      var y=116;
      function row(label,val,big){
        doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(130,130,130); doc.text(String(label).toUpperCase(),40,y);
        doc.setFont('helvetica',big?'bold':'normal'); doc.setFontSize(big?20:13); doc.setTextColor(25,25,25); doc.text(String(val==null||val===''?'-':val),40,y+18);
        y += big?54:42;
      }
      row('Receipt no.', rec.receipt_no);
      row('Date', new Date(rec.issued_at||Date.now()).toLocaleString());
      row('Student', rec.student_name);
      if(rec.guardian_name) row('Guardian', rec.guardian_name);
      row('Amount received', fmt(rec.amount), true);
      row('Method', methodLabel(rec.method));
      if(rec.reference) row('Reference', rec.reference);
      if(rec.balance_after!=null) row('Balance after', fmt(rec.balance_after));
      row('Issued by', rec.issued_by);
      doc.setDrawColor(220,220,220); doc.line(40,y+4,W-40,y+4);
      doc.setFontSize(9); doc.setTextColor(150,150,150);
      doc.text('Powered by NEXT OS', 40, y+26);
      doc.text(rec.receipt_no, W-40, y+26, {align:'right'});
      return doc;
    }
    function download(rec){ try{ buildPdf(rec).save('Receipt-'+rec.receipt_no+'.pdf'); }catch(e){ if(window.peakToast) window.peakToast('Could not build PDF','error',String(e.message||e)); } }
    function whatsappUrl(rec){
      var msg='Dear '+(rec.guardian_name||'Parent')+', we confirm receipt of '+fmt(rec.amount)+' for '+(rec.student_name||'your child')+' at '+brandName()+'. Receipt '+rec.receipt_no+' ('+new Date(rec.issued_at||Date.now()).toLocaleDateString()+').'+(rec.balance_after!=null?(' Balance: '+fmt(rec.balance_after)+'.'):'')+' Thank you.';
      return 'https://wa.me/'+digits(rec.guardian_phone)+'?text='+encodeURIComponent(msg);
    }
    async function list(){
      var sess=window.NextSession||{}; var sb=sess.sb; var t=(sess.profile||{}).tenantId;
      if(!sb||!t) return [];
      var r=await sb.from('receipts').select('*').eq('tenant_id',t).order('issued_at',{ascending:false}).limit(100);
      return r.data||[];
    }
    return { issue:issue, download:download, whatsappUrl:whatsappUrl, list:list, fmt:fmt };
  })();
  </script>
  <script>
  (function(){
    // Resolve the school we're ACTUALLY opening (never inherit the last login's brand).
    var _bp=new URLSearchParams(location.search);
    var _urlslug=_bp.get('s')||_bp.get('t')||(location.pathname.match(/\/(?:s|school)\/([A-Za-z0-9_-]+)/)||[])[1]||'';
    // Brand must match the DATA we'll show: that's the logged-in tenant. Fall back to URL slug only when not signed in.
    var _prof=null; try{ _prof=JSON.parse(localStorage.getItem('nextos.profile')||'null'); }catch(e){}
    // This app IS a specific school (from the URL). Brand by that; the session guard makes the login match.
    var _bslug=_urlslug || ((_prof && _prof.tenantId) || '');
    var b=null; try{ b=JSON.parse(localStorage.getItem('nextos.brand.'+_bslug)||'null'); }catch(e){}
    // Fetch the authoritative brand for THIS slug; cache per-slug; reload once if we painted the wrong one.
    function _paintName(nm){ try{ window.__BRAND_NAME=nm; document.title=nm+' \u00b7 NEXT School OS'; var _ld=document.getElementById('nx-loading-text'); if(_ld) _ld.textContent='LOADING '+String(nm).toUpperCase()+' \u00b7 NEXT SCHOOL OS'; }catch(e){} }
    if(_bslug){ try{ fetch('https://nextos-sentinel.nextafricaai.workers.dev/brand?s='+encodeURIComponent(_bslug)).then(function(r){return r.ok?r.json():null;}).then(function(nb){
      if(nb && nb.name){ var fresh={name:nb.name,color:nb.primary_color||null,logo:nb.logo_url||null};
        try{ localStorage.setItem('nextos.brand.'+_bslug, JSON.stringify(fresh)); }catch(e){}
        if(fresh.logo) window.__BRAND_LOGO=fresh.logo;
        _paintName(fresh.name);
        try{ if(fresh.color){ var _c=String(fresh.color); if(_c[0]!=='#')_c='#'+_c; if(/^#[0-9a-fA-F]{6}$/.test(_c)){ document.documentElement.style.setProperty('--brand', _c); } } }catch(e){}
      }
    }).catch(function(){}); }catch(e){} }
    if(b && b.color){ var c=String(b.color); if(c[0]!=='#') c='#'+c;
      if(/^#[0-9a-fA-F]{6}$/.test(c)){ window.__ACCENT=c;
        window.__ACCENT_DARK=(function(h){h=h.replace('#','');function d(x){return Math.max(0,Math.round(parseInt(x,16)*0.55)).toString(16).padStart(2,'0');}return '#'+d(h.slice(0,2))+d(h.slice(2,4))+d(h.slice(4,6));})(c);
        var _mix=function(hex,base,amt){var hh=hex.replace('#',''),bs=base.replace('#','');function cc(i){var x=parseInt(hh.substr(i,2),16),d=parseInt(bs.substr(i,2),16);return Math.round(d+(x-d)*amt);}function hx(v){return Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0');}return '#'+hx(cc(0))+hx(cc(2))+hx(cc(4));};
        window.__BG=_mix(c,'#0a0a12',0.10); window.__SURFACE=_mix(c,'#0a0a12',0.18); window.__SURFACE2=_mix(c,'#0a0a12',0.24); window.__SURFACE3=_mix(c,'#0a0a12',0.34);
        try{ document.documentElement.style.background=window.__BG; }catch(e){}
        window.addEventListener('DOMContentLoaded',function(){ try{ document.body.style.background=window.__BG; }catch(e){} });
      }
    }
    if(b && b.logo){ window.__BRAND_LOGO=b.logo; }
    if(b && b.name){ window.__BRAND_NAME=b.name;
      try{ document.title = b.name + ' \u00b7 NEXT School OS'; }catch(e){}
      try{ var _ld=document.getElementById('nx-loading-text'); if(_ld) _ld.textContent='LOADING '+String(b.name).toUpperCase()+' \u00b7 NEXT SCHOOL OS'; }catch(e){}
    } else {
      // No school record for this slug — never fall back to another school's identity.
      try {
        if(_bslug && _bslug!=='peak-primary'){
          var _nm=_bslug.replace(/[-_]+/g,' ').replace(/\b\w/g,function(m){return m.toUpperCase();});
          window.__BRAND_NAME=_nm;
          try{ document.title=_nm+' \u00b7 NEXT School OS'; }catch(e){}
        }
      } catch(e){}
    }
  })();
  </script>

  <script type="text/babel" data-src="role-router.jsx">
/* role-router.jsx
   The doorman of the Schools OS. Reads window.NextSession.profile.role,
   decides which "floor" of the building each user lands on.

   Loaded BEFORE peak-app.jsx so window.PEAK_ROLE exists when App() runs.

   Public API on window.PEAK_ROLE:
     - getRole()              → 'admin' | 'head' | 'bursar' | 'teacher'  (default 'head')
     - getProfile()           → { email, fullName, role, tenantId }      (or fallback)
     - canSeeNavKey(key)      → boolean — should this nav item appear?
     - filterNavItems(items)  → returns the nav array trimmed for current role
     - defaultRouteForRole()  → which screen to land on after login
     - roleLabel()            → human-readable e.g. "Head Teacher", "Bursar"
*/
(function () {
  // ─── Read profile from session (set by login.html / session-guard.js) ─
  function getProfile() {
    if (window.NextSession && window.NextSession.profile) {
      return window.NextSession.profile;
    }
    // Fallback for opening the prototype directly without login (dev)
    try {
      const cached = JSON.parse(localStorage.getItem('nextos.profile') || 'null');
      if (cached) return cached;
    } catch (e) {}
    return {
      email: 'demo@peakprimary.test',
      fullName: 'Demo User',
      role: 'head',
      tenantId: 'peak-primary',
    };
  }

  function getRole() {
    const p = getProfile();
    const r = (p && p.role) ? String(p.role).toLowerCase() : 'head';
    if (r === 'admin' || r === 'head' || r === 'bursar' || r === 'teacher') return r;
    return 'head';
  }

  // ─── Which nav items each role can see ────────────────────────────────
  // Admin + Head: everything
  // Bursar: only finance-relevant screens
  // Teacher: doesn't use the sidebar at all (different shell)
  const ROLE_NAV_WHITELIST = {
    admin:   null, // null = show all
    head:    null,
    bursar:  new Set(['dash', 'fees', 'rep', 'exam', 'finance']),
    teacher: new Set(), // teacher uses its own shell, sidebar not rendered
  };

  function canSeeNavKey(key) {
    const role = getRole();
    const wl = ROLE_NAV_WHITELIST[role];
    if (wl === null) return true;
    return wl.has(key);
  }

  function filterNavItems(items) {
    const role = getRole();
    const wl = ROLE_NAV_WHITELIST[role];
    if (wl === null) return items;
    return items.filter(n => wl.has(n.k));
  }

  // ─── Default landing screen after login ──────────────────────────────
  function defaultRouteForRole() {
    const role = getRole();
    if (role === 'bursar')  return 'fees';
    if (role === 'teacher') return 'teacher-home'; // handled by TeacherShell
    return 'today'; // admin / head land on Today
  }

  // ─── Pretty label for the sidebar profile chip ───────────────────────
  function roleLabel() {
    const role = getRole();
    return ({
      admin:   'Administrator',
      head:    'Head Teacher',
      bursar:  'Bursar',
      teacher: 'Teacher',
    })[role] || 'User';
  }

  // ─── Initials for avatar circle ───────────────────────────────────────
  function initials() {
    const p = getProfile();
    const name = (p && p.fullName) ? p.fullName : (p && p.email) ? p.email : 'U';
    return name.split(/\s+/).filter(Boolean).slice(0, 2)
      .map(w => w[0]).join('').toUpperCase();
  }

  window.PEAK_ROLE = {
    getProfile,
    getRole,
    canSeeNavKey,
    filterNavItems,
    defaultRouteForRole,
    roleLabel,
    initials,
  };
})();

  </script>
  <script type="text/babel" data-src="teacher-view.jsx">
/* teacher-view.jsx
   The Teacher Shell — Patrick / Mary's portal.

   Three live data flows feed the school's central nervous system:
     1. Check In            → teacher_checkins        → Head sees "Staff Today"
     2. Take Roll Call      → student_roll_call       → Head sees attendance live
     3. Log Health/Wellbeing → student_health_records → Head sees Health Watch

   All actions hit Supabase with RLS active — teachers only touch their own
   streams. The school sees everything in real time.

   Exposed as window.TeacherShell. Loaded inline in index.html.
*/
(function () {
  const { useState, useEffect, useMemo, useCallback } = React;

  const T = {
    bg:       (typeof window!=='undefined'&&window.__BG)||'#0a1029',
    surface:  (typeof window!=='undefined'&&window.__SURFACE)||'#141e3c',
    surface2: (typeof window!=='undefined'&&window.__SURFACE2)||'#1a2548',
    surface3: (typeof window!=='undefined'&&window.__SURFACE3)||'#212d56',
    border:   'rgba(255,255,255,0.06)',
    borderStr:'rgba(255,255,255,0.10)',
    ink:      '#f5f6fa',
    ink2:     'rgba(245,246,250,0.85)',
    ink3:     'rgba(245,246,250,0.55)',
    ink4:     'rgba(245,246,250,0.40)',
    red:      '#FF4757',
    green:    (typeof window!=='undefined'&&window.__ACCENT)||'#00FC8F',
    gold:     '#FFB400',
    blue:     '#3B82F6',
    font:     "'Inter', -apple-system, system-ui, sans-serif",
    mono:     "'JetBrains Mono', ui-monospace, monospace",
    serif:    "'Instrument Serif', serif",
  };

  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const isoDate = (d) => (d || new Date()).toISOString().slice(0, 10);
  const tinyToast = (msg, kind) => {
    if (window.peakToast) { window.peakToast(msg, kind || 'info'); return; }
    console.log('[teacher]', msg);
  };

  // ─── Supabase data loader ───────────────────────────────────────────
  async function loadTeacherData() {
    const sess = window.NextSession;
    if (!sess || !sess.sb || !sess.profile) {
      return { error: 'No session. Please sign in again.' };
    }
    const sb = sess.sb;
    const email = sess.profile.email;
    const tenantId = sess.profile.tenantId;
    const today = isoDate();

    const { data: teacher, error: tErr } = await sb
      .from('teachers')
      .select('id, full_name, email, subjects, status')
      .eq('email', email).eq('tenant_id', tenantId)
      .maybeSingle();
    if (tErr || !teacher) {
      return { error: 'Could not find your teacher profile. Ask your administrator.' };
    }

    const { data: assignments } = await sb
      .from('class_assignments')
      .select('id, stream, subject, is_class_teacher')
      .eq('teacher_id', teacher.id);

    const { data: lessons } = await sb
      .from('lesson_plans')
      .select('id, stream, subject, week_of, topic, status')
      .eq('teacher_id', teacher.id)
      .order('week_of', { ascending: true });

    const { data: syllabus } = await sb
      .from('syllabus_coverage')
      .select('stream, subject, topic, planned_week, status')
      .eq('teacher_id', teacher.id);

    const { data: payroll } = await sb
      .from('teacher_payroll')
      .select('id, month, amount, status, paid_at, channel')
      .eq('teacher_id', teacher.id)
      .order('month', { ascending: false })
      .limit(3);

    // Today's check-in (most recent for today)
    const { data: checkins } = await sb
      .from('teacher_checkins')
      .select('id, checked_in_at, checked_out_at, method')
      .eq('teacher_id', teacher.id)
      .gte('checked_in_at', today + 'T00:00:00')
      .order('checked_in_at', { ascending: false })
      .limit(1);

    // Merge the classes the head allocated to this teacher (staff_meta) so roll call has the right streams + the REAL imported students
    let metaClasses = [];
    try {
      const md = await fetch('https://nextos-sentinel.nextafricaai.workers.dev/os-data?kind=staff_meta&tenant=' + encodeURIComponent(tenantId)).then(r => r.json());
      const rec = ((md && md.records) || []).find(x => x.payload && (x.payload.email || '').toLowerCase() === (email || '').toLowerCase());
      metaClasses = (rec && rec.payload && rec.payload.classes) || [];
    } catch (e) {}
    const _assignStreams = new Set((assignments || []).map(a => a.stream));
    const mergedAssignments = (assignments || []).slice();
    metaClasses.forEach(c => { if (!_assignStreams.has(c)) mergedAssignments.push({ id: 'meta-' + c, stream: c, subject: (teacher.subjects && teacher.subjects[0]) || 'Class', is_class_teacher: true }); });
    const _effStreams = mergedAssignments.map(a => a.stream);
    let liveStudents = [];
    if (_effStreams.length) {
      try {
        const { data: sd } = await sb.from('students').select('id, name, stream, guardian_name, guardian_phone').eq('tenant_id', tenantId).in('stream', _effStreams);
        liveStudents = (sd || []).map(s => ({ id: s.id, name: s.name, stream: s.stream, guardian: s.guardian_name, guardianPhone: s.guardian_phone }));
      } catch (e) {}
    }
    try { window.__TEACHER_STUDENTS = liveStudents; } catch (e) {}
    const studentsPool = liveStudents.length ? liveStudents : ((window.PEAK && window.PEAK.students) || []);

    // Today's roll call records (so cards reflect what's been done)
    const streamCodes = mergedAssignments.map(a => a.stream);
    let rollCalls = [];
    if (streamCodes.length > 0) {
      const { data: rc } = await sb
        .from('student_roll_call')
        .select('id, student_id, stream, status, taken_at, roll_date')
        .eq('roll_date', today)
        .in('stream', streamCodes);
      rollCalls = rc || [];
    }

    // Recent health records for students in this teacher's streams
    const allStudents = studentsPool;
    const myStreamsSet = new Set(mergedAssignments.map(a => a.stream));
    const myStudentIds = allStudents.filter(s => myStreamsSet.has(s.stream)).map(s => s.id);
    let healthRecords = [];
    if (myStudentIds.length > 0) {
      const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
      const { data: hr } = await sb
        .from('student_health_records')
        .select('id, student_id, category, severity, description, recorded_at, follow_up_needed, resolved_at')
        .in('student_id', myStudentIds)
        .gte('recorded_at', thirtyDaysAgo)
        .order('recorded_at', { ascending: false });
      healthRecords = hr || [];
    }

    return {
      teacher,
      assignments: mergedAssignments,
      lessons: lessons || [],
      students: studentsPool,
      syllabus: syllabus || [],
      payroll: payroll || [],
      checkin: (checkins && checkins[0]) || null,
      rollCalls,
      healthRecords,
    };
  }

  // ─── Write helpers ──────────────────────────────────────────────────
  async function writeCheckIn(teacherId, tenantId, method) {
    const sb = window.NextSession?.sb;
    if (!sb) return { error: 'No session' };
    const { data, error } = await sb
      .from('teacher_checkins')
      .insert({
        tenant_id: tenantId,
        teacher_id: teacherId,
        method: method || 'manual',
      })
      .select('id, checked_in_at, checked_out_at, method')
      .single();
    return { data, error };
  }

  async function writeCheckOut(checkinId) {
    const sb = window.NextSession?.sb;
    if (!sb) return { error: 'No session' };
    const { data, error } = await sb
      .from('teacher_checkins')
      .update({ checked_out_at: new Date().toISOString() })
      .eq('id', checkinId)
      .select('id, checked_in_at, checked_out_at, method')
      .single();
    return { data, error };
  }

  async function writeRollCall(records) {
    // records = [{ tenant_id, teacher_id, student_id, stream, status, notes? }, ...]
    const sb = window.NextSession?.sb;
    if (!sb) return { error: 'No session' };
    // upsert each row (UNIQUE on student_id, roll_date) so re-saving overwrites
    const { data, error } = await sb
      .from('student_roll_call')
      .upsert(records, { onConflict: 'student_id,roll_date' })
      .select('id, student_id, stream, status');
    return { data, error };
  }

  async function writeHealthRecord(record) {
    const sb = window.NextSession?.sb;
    if (!sb) return { error: 'No session' };
    const { data, error } = await sb
      .from('student_health_records')
      .insert(record)
      .select('id')
      .single();
    return { data, error };
  }

  // ─── Shared atoms ──────────────────────────────────────────────────
  function Card({ title, subtitle, children, accent, action }) {
    return (
      <div style={{
        background: T.surface,
        border: '1px solid ' + T.border,
        borderRadius: 14,
        padding: 22,
        position: 'relative',
        overflow: 'hidden',
      }}>
        {accent && (
          <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: 3, background: accent }} />
        )}
        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 16, gap: 12 }}>
          <div>
            <div style={{ fontSize: 10, fontFamily: T.mono, letterSpacing: 1.5, color: T.ink3, textTransform: 'uppercase', marginBottom: 4 }}>{subtitle}</div>
            <div style={{ fontSize: 18, fontWeight: 600, color: T.ink }}>{title}</div>
          </div>
          {action}
        </div>
        {children}
      </div>
    );
  }

  function Empty({ text }) {
    return (
      <div style={{ padding: '24px 0', textAlign: 'center', color: T.ink4, fontSize: 13, fontStyle: 'italic' }}>
        {text}
      </div>
    );
  }

  // ─── Modal scaffolding ──────────────────────────────────────────────
  function Modal({ title, onClose, children, width }) {
    useEffect(() => {
      const onKey = (e) => { if (e.key === 'Escape') onClose(); };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, [onClose]);
    return (
      <div onClick={onClose} style={{
        position: 'fixed', inset: 0, zIndex: 9000,
        background: 'rgba(5,8,20,0.75)', backdropFilter: 'blur(6px)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        padding: 20,
      }}>
        <div onClick={(e) => e.stopPropagation()} style={{
          width: '100%', maxWidth: width || 560,
          maxHeight: '90vh',
          background: T.surface, border: '1px solid ' + T.borderStr,
          borderRadius: 14, display: 'flex', flexDirection: 'column',
          overflow: 'hidden',
        }}>
          <header style={{
            padding: '16px 22px', borderBottom: '1px solid ' + T.border,
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          }}>
            <div style={{ fontSize: 16, fontWeight: 600 }}>{title}</div>
            <button onClick={onClose} style={{
              background: 'transparent', border: 'none', color: T.ink3,
              fontSize: 20, cursor: 'pointer', lineHeight: 1,
            }}>×</button>
          </header>
          <div style={{ padding: 22, overflow: 'auto', flex: 1 }}>{children}</div>
        </div>
      </div>
    );
  }


  // ─── Nia's intelligence layer ───────────────────────────────────────
  function computeNiaNudges({ teacher, assignments, rollCalls, checkin, healthRecords }) {
    const allStudents = (window.__TEACHER_STUDENTS && window.__TEACHER_STUDENTS.length) ? window.__TEACHER_STUDENTS : ((window.PEAK && window.PEAK.students) || []);
    const nudges = [];
    const myStreams = new Set(assignments.map(a => a.stream));
    const myStudents = allStudents.filter(s => myStreams.has(s.stream));
    const today = new Date();
    const isWeekend = today.getDay() === 0 || today.getDay() === 6;

    // 1. Not checked in yet (weekdays only, before 4pm)
    if (!isWeekend && !checkin && today.getHours() < 16) {
      nudges.push({
        id: 'checkin',
        tone: 'warn',
        icon: '◷',
        title: "You haven't checked in yet today",
        body: 'Tap the green Check In button so your head teacher knows you\'re on campus.',
        action: 'check-in',
      });
    }

    // 2. Roll call not taken for each assigned stream (weekdays only)
    if (!isWeekend) {
      assignments.forEach(a => {
        const taken = rollCalls.filter(rc => rc.stream === a.stream).length;
        const expected = allStudents.filter(s => s.stream === a.stream).length;
        if (expected > 0 && taken < expected) {
          nudges.push({
            id: 'roll-' + a.stream,
            tone: 'warn',
            icon: '☰',
            title: 'Take roll call for ' + a.stream + ' · ' + a.subject,
            body: taken === 0
              ? expected + ' students are waiting.'
              : 'Started (' + taken + '/' + expected + '), finish marking the rest.',
            action: 'roll-call',
            stream: a.stream,
          });
        }
      });
    }

    // 3. At-risk students that need personal attention
    const atRisk = myStudents.filter(s => s.flag === 'risk');
    atRisk.slice(0, 3).forEach(s => {
      nudges.push({
        id: 'risk-' + s.id,
        tone: 'warn',
        icon: '!',
        title: s.name + ' (' + s.stream + ') is showing risk signals',
        body: s.attendanceWk + '% attendance this week. Worth a one-on-one before they slip further.',
        action: 'health',
        student: s,
      });
    });

    // 4. Students with unresolved health concerns — follow up
    const unresolvedHealth = (healthRecords || []).filter(h =>
      h.follow_up_needed && !h.resolved_at
    );
    const seenStudents = new Set();
    unresolvedHealth.slice(0, 2).forEach(h => {
      if (seenStudents.has(h.student_id)) return;
      seenStudents.add(h.student_id);
      const stu = myStudents.find(s => s.id === h.student_id);
      if (!stu) return;
      nudges.push({
        id: 'health-' + h.id,
        tone: 'info',
        icon: '♥',
        title: 'Follow up on ' + stu.name + ' — ' + h.category,
        body: (h.description || '').slice(0, 90) + ((h.description || '').length > 90 ? '…' : ''),
        action: 'health',
        student: stu,
      });
    });

    // 5. Top performers — public praise prompt
    const topPerformers = myStudents.filter(s => s.flag === 'top');
    if (topPerformers.length > 0) {
      const star = topPerformers[Math.floor(Math.random() * topPerformers.length)];
      nudges.push({
        id: 'top-' + star.id,
        tone: 'positive',
        icon: '★',
        title: 'Praise ' + star.name + ' (' + star.stream + ') publicly today',
        body: 'Consistent performer this week — recognition reinforces the habit.',
        action: 'none',
      });
    }

    // If absolutely nothing to nudge about, give an "all clear" message
    if (nudges.length === 0) {
      nudges.push({
        id: 'clear',
        tone: 'positive',
        icon: '✓',
        title: 'All clear — nothing pressing right now',
        body: 'Roll call done, no risk flags, no overdue follow-ups. Keep going.',
        action: 'none',
      });
    }

    return nudges;
  }

  function NiaCoachCard({ data, onTakeRollCall, onLogHealth, onScrollToCheckin }) {
    const nudges = useMemo(
      () => computeNiaNudges(data),
      [data]
    );

    const toneColor = (t) => t === 'warn' ? T.gold : t === 'positive' ? T.green : T.blue;
    const toneBg    = (t) => t === 'warn' ? 'rgba(255,180,0,0.06)'
                          : t === 'positive' ? 'rgba(0,252,143,0.06)'
                          : 'rgba(59,130,246,0.06)';
    const toneBorder = (t) => t === 'warn' ? 'rgba(255,180,0,0.18)'
                            : t === 'positive' ? 'rgba(0,252,143,0.18)'
                            : 'rgba(59,130,246,0.18)';

    const handleClick = (n) => {
      if (n.action === 'check-in' && onScrollToCheckin) onScrollToCheckin();
      else if (n.action === 'roll-call' && onTakeRollCall) onTakeRollCall(n.stream);
      else if (n.action === 'health' && onLogHealth && n.student) onLogHealth(n.student);
    };

    return (
      <div style={{
        gridColumn: '1 / -1',
        background: 'linear-gradient(135deg, rgba(20,30,60,0.92) 0%, rgba(26,37,72,0.92) 100%)',
        border: '1px solid ' + T.borderStr,
        borderRadius: 14, padding: 24,
        position: 'relative', overflow: 'hidden',
      }}>
        {/* Header */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 18 }}>
          <div style={{
            width: 42, height: 42, borderRadius: 12,

  // ─── Nia's interactive check-in popup ─────────────────────────────
  // Slides in from top-right when the dashboard opens if the teacher
  // hasn't checked in yet. Feels like a real notification, not a card.
  function NiaCheckinPopup({ teacher, profile, onCheckedIn }) {
    const [visible, setVisible] = useState(false);
    const [dismissed, setDismissed] = useState(false);
    const [busy, setBusy] = useState(false);
    const [animateIn, setAnimateIn] = useState(false);

    useEffect(() => {
      // Slide in 600ms after mount so it feels intentional, not jarring
      const t1 = setTimeout(() => setVisible(true), 600);
      const t2 = setTimeout(() => setAnimateIn(true), 700);
      return () => { clearTimeout(t1); clearTimeout(t2); };
    }, []);

    if (!visible || dismissed) return null;

    const handleCheckIn = async () => {
      if (busy) return;
      setBusy(true);
      const { data, error } = await writeCheckIn(teacher.id, profile.tenantId, 'manual');
      if (error) {
        setBusy(false);
        tinyToast('Check-in failed: ' + error.message, 'error');
        return;
      }
      // Slide out, then notify parent
      setAnimateIn(false);
      setTimeout(() => {
        setDismissed(true);
        if (onCheckedIn) onCheckedIn(data);
        tinyToast('Checked in. Head teacher notified.', 'success');
      }, 350);
    };

    const handleClose = () => {
      setAnimateIn(false);
      setTimeout(() => setDismissed(true), 350);
    };

    return (
      <div style={{
        position: 'fixed',
        top: 90, right: animateIn ? 24 : -440,
        zIndex: 9500,
        width: 380, maxWidth: 'calc(100vw - 48px)',
        background: 'linear-gradient(135deg, rgba(20,30,60,0.96) 0%, rgba(26,37,72,0.96) 100%)',
        backdropFilter: 'blur(14px)',
        border: '1px solid rgba(0,252,143,0.30)',
        borderRadius: 14,
        padding: 18,
        boxShadow: '0 24px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,252,143,0.10)',
        opacity: animateIn ? 1 : 0,
        transition: 'right 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease',
      }}>
        {/* Top row: Nia badge + label + close */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
          <div style={{
            width: 32, height: 32, borderRadius: 9,
            background: 'rgba(0,252,143,0.18)', color: T.green,
            border: '1px solid rgba(0,252,143,0.4)',
            display: 'grid', placeItems: 'center',
            fontFamily: T.serif, fontSize: 17, fontWeight: 700,
          }}>N</div>
          <div style={{ flex: 1, lineHeight: 1.2 }}>
            <div style={{
              fontSize: 9.5, fontFamily: T.mono, letterSpacing: 1.4,
              color: T.green, fontWeight: 700,
            }}>NIA · LIVE NUDGE</div>
            <div style={{ fontSize: 12, color: T.ink3 }}>from your coach</div>
          </div>
          <button onClick={handleClose} style={{
            background: 'transparent', border: 'none',
            color: T.ink3, fontSize: 22, lineHeight: 1,
            cursor: 'pointer', padding: 0, width: 24, height: 24,
          }}>×</button>
        </div>

        {/* Title + body */}
        <div style={{ marginBottom: 16 }}>
          <div style={{
            fontSize: 16, fontWeight: 600, color: T.ink, marginBottom: 6,
            fontFamily: T.serif, fontStyle: 'italic',
          }}>
            {(profile.fullName ? profile.fullName.split(' ')[0] : 'Teacher')}, don't forget to check in.
          </div>
          <div style={{ fontSize: 12.5, color: T.ink3, lineHeight: 1.5 }}>
            Tap below so your head teacher knows you're on campus. Takes a second.
          </div>
        </div>

        {/* Action button */}
        <button
          onClick={handleCheckIn}
          disabled={busy}
          style={{
            width: '100%',
            background: T.green, color: T.bg, border: 'none',
            padding: '12px', borderRadius: 10,
            fontSize: 13, fontWeight: 700, letterSpacing: 0.3,
            cursor: busy ? 'wait' : 'pointer', fontFamily: T.font,
            opacity: busy ? 0.6 : 1,

          onMouseEnter={(e) => { if (!busy) e.currentTarget.style.transform = 'scale(1.02)'; }}
          onMouseLeave={(e) => { e.currentTarget.style.transform = 'scale(1)'; }}
        >

        {/* Footer */}
        <div style={{
          marginTop: 12, fontSize: 10.5, fontFamily: T.mono,
          color: T.ink4, textAlign: 'center', letterSpacing: 0.6,

  // ─── Card: Check-in Status ──────────────────────────────────────────
  function CheckInCard({ teacher, checkin, onCheckedIn, onCheckedOut, profile }) {
    const [busy, setBusy] = useState(false);

    // State machine: 'out' | 'in' | 'done'
    const state = !checkin ? 'out'
                : checkin.checked_out_at ? 'done'
                : 'in';

    const handleCheckIn = async () => {
      if (busy) return;
      setBusy(true);
      const { data, error } = await writeCheckIn(teacher.id, profile.tenantId, 'manual');
      setBusy(false);
      if (error) { tinyToast('Check-in failed: ' + error.message, 'error'); return; }
      tinyToast('Checked in. Head teacher notified.', 'success');
      if (onCheckedIn) onCheckedIn(data);
    };

    const handleCheckOut = async () => {
      if (busy || !checkin) return;
      // Confirm
      if (!window.confirm("End your day at school? Your head teacher will see you've left.")) return;
      setBusy(true);
      const { data, error } = await writeCheckOut(checkin.id);
      setBusy(false);
      if (error) { tinyToast('Check-out failed: ' + error.message, 'error'); return; }
      tinyToast("Day ended. See you tomorrow.", 'success');
      if (onCheckedOut) onCheckedOut(data);
    };

    const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : null;
    const fmtDuration = (a, b) => {
      const ms = (new Date(b)) - (new Date(a));
      if (ms <= 0) return '';
      const mins = Math.floor(ms / 60000);
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    };

    // Visual tokens per state
    const tokens = {
      out:  { bg: 'rgba(255,180,0,0.12)', border: 'rgba(255,180,0,0.25)', icon: '◷', iconBg: 'rgba(255,180,0,0.18)', iconColor: T.gold },
      in:   { bg: 'rgba(0,252,143,0.10)', border: 'rgba(0,252,143,0.25)', icon: '✓', iconBg: 'rgba(0,252,143,0.18)', iconColor: T.green },
      done: { bg: 'rgba(255,255,255,0.04)', border: T.borderStr, icon: '✓', iconBg: 'rgba(255,255,255,0.08)', iconColor: T.ink3 },
    }[state];

    return (
      <div style={{
        gridColumn: '1 / -1',
        background: 'linear-gradient(135deg, ' + tokens.bg + ' 0%, transparent 100%)',
        border: '1px solid ' + tokens.border,
        borderRadius: 14, padding: 22,
        display: 'flex', alignItems: 'center', gap: 18, flexWrap: 'wrap',
      }}>
        <div style={{
          width: 56, height: 56, borderRadius: 14,
          background: tokens.iconBg,
          display: 'grid', placeItems: 'center',
          fontSize: 26, color: tokens.iconColor,
        }}>{tokens.icon}</div>

        <div style={{ flex: 1, minWidth: 200 }}>
          <div style={{
            fontSize: 10, fontFamily: T.mono, letterSpacing: 1.5,
            color: T.ink3, textTransform: 'uppercase', marginBottom: 4,
          }}>{
            state === 'out'  ? 'NOT CHECKED IN YET' :
            state === 'in'   ? 'CHECKED IN · ON CAMPUS' :
                               'DAY ENDED'
          }</div>
          <div style={{ fontSize: 17, fontWeight: 600, color: T.ink }}>{
            state === 'out'  ? 'Tap below to start your day' :
            state === 'in'   ? 'On campus since ' + fmtTime(checkin.checked_in_at) :
                               'In: ' + fmtTime(checkin.checked_in_at) + '  →  Out: ' + fmtTime(checkin.checked_out_at)
          }</div>
          <div style={{ fontSize: 12, color: T.ink3, marginTop: 4 }}>{
            state === 'out'  ? 'Your head teacher will see your check-in instantly.' :
            state === 'in'   ? 'Head teacher sees a green dot next to your name.' :
                               'Total time today: ' + fmtDuration(checkin.checked_in_at, checkin.checked_out_at)
          }</div>
        </div>

        {state === 'out' && (
          <button onClick={handleCheckIn} disabled={busy} style={{
            background: T.green, color: T.bg, border: 'none',
            padding: '13px 24px', borderRadius: 10,
            fontSize: 14, fontWeight: 700, cursor: busy ? 'wait' : 'pointer',
            fontFamily: T.font, opacity: busy ? 0.6 : 1,
          }}>{busy ? 'Checking in…' : 'Check In Now'}</button>
        )}

        {state === 'in' && (
          <button onClick={handleCheckOut} disabled={busy} style={{
            background: 'transparent', color: T.red,
            border: '1px solid ' + T.red,
            padding: '13px 24px', borderRadius: 10,
            fontSize: 14, fontWeight: 700, cursor: busy ? 'wait' : 'pointer',
            fontFamily: T.font, opacity: busy ? 0.6 : 1,
          }}>{busy ? 'Checking out…' : 'Check Out'}</button>
        )}

        {state === 'done' && (
          <div style={{
            background: 'rgba(255,255,255,0.04)', color: T.ink3,
            padding: '13px 22px', borderRadius: 10,
            fontSize: 12, fontWeight: 600, fontFamily: T.mono, letterSpacing: 0.5,
          }}>SEE YOU TOMORROW</div>
        )}
      </div>
    );
  }

  // ─── Modal: Roll Call ──────────────────────────────────────────────
  function RollCallModal({ stream, teacher, assignments, existingRollCalls, onClose, onSaved, profile }) {
    const allStudents = (window.__TEACHER_STUDENTS && window.__TEACHER_STUDENTS.length) ? window.__TEACHER_STUDENTS : ((window.PEAK && window.PEAK.students) || []);
    const streamStudents = useMemo(
      () => allStudents.filter(s => s.stream === stream),
      [allStudents, stream]
    );

    // Hydrate from existing roll call records for today
    const initialStatuses = useMemo(() => {
      const map = {};
      streamStudents.forEach(s => {
        const existing = existingRollCalls.find(rc => rc.student_id === s.id);
        map[s.id] = existing ? existing.status : 'present';
      });
      return map;
    }, [streamStudents, existingRollCalls]);

    const [statuses, setStatuses] = useState(initialStatuses);
    const [saving, setSaving] = useState(false);
    // Timetable time-gate: only allow this class's roll call during its scheduled period.
    const _prof = profile || (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile()) || {};
    const _email = ((_prof && _prof.email) || '').toLowerCase();
    const _tid = (_prof && _prof.tenantId) || 'peak-primary';
    const [_tt, _setTt] = useState(null);
    useEffect(() => { fetch('https://nextos-sentinel.nextafricaai.workers.dev/os-data?kind=timetable&tenant=' + encodeURIComponent(_tid)).then(r => r.json()).then(d => { const rec = ((d && d.records) || [])[0]; _setTt((rec && rec.payload) || { periods: [], grid: {} }); }).catch(() => _setTt({ periods: [], grid: {} })); }, []);
    const _lessons = _teacherLessonsToday(_tt, _email);
    const _hasTT = _lessons.length > 0;
    const _activeNow = _activeLessonNow(_lessons);
    const _locked = _hasTT && (!_activeNow || _activeNow.cls !== stream);

    const setStatus = (id, status) => setStatuses(prev => ({ ...prev, [id]: status }));

    const counts = useMemo(() => {
      const c = { present: 0, absent: 0, late: 0, excused: 0 };
      Object.values(statuses).forEach(s => { c[s] = (c[s] || 0) + 1; });
      return c;
    }, [statuses]);

    const handleSave = async () => {
      if (saving) return;
      setSaving(true);
      const records = streamStudents.map(s => ({
        tenant_id: profile.tenantId,
        teacher_id: teacher.id,
        student_id: s.id,
        stream: stream,
        status: statuses[s.id] || 'present',
      }));
      const { error } = await writeRollCall(records);
      setSaving(false);
      if (error) {
        tinyToast('Roll call save failed: ' + error.message, 'error');
        return;
      }
      tinyToast(`Roll call for ${stream} saved — head teacher sees it now.`, 'success');
      try {
        const absent = records.filter(r => r.status === 'absent').length;
        if (absent > 0) {
          const sb = window.NextSession && window.NextSession.sb;
          let tok = ''; try { const sd = await sb.auth.getSession(); tok = (sd && sd.data && sd.data.session && sd.data.session.access_token) || ''; } catch (e) {}
          const tid = (profile && profile.tenantId) || (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile().tenantId);
          if (window.NX_PUSH) window.NX_PUSH.notify({ tenant: tid, role: 'head', title: stream + ' roll call', body: absent + ' absent today · marked by ' + ((profile && profile.fullName) || 'a teacher'), url: window.location.pathname, tag: 'rc-' + stream }, tok);
        }
      } catch (e) {}
      onSaved(records);
      onClose();
    };

    const statusBtn = (current, value, label, color) => {
      const active = current === value;
      return (
        <button onClick={(e) => { e.stopPropagation(); }} style={{
          background: active ? color : 'transparent',
          color: active ? T.bg : T.ink3,
          border: '1px solid ' + (active ? color : T.borderStr),
          padding: '5px 10px', borderRadius: 6,
          fontSize: 11, fontWeight: 700, fontFamily: T.mono, letterSpacing: 0.5,
          cursor: 'pointer',
        }}>{label}</button>
      );
    };

    if (_locked) {
      const _nxt = _nextLessonForClass(_lessons, stream);
      return (
        <Modal title={`Roll Call · ${stream}`} onClose={onClose} width={520}>
          <div style={{ padding: 22, textAlign: 'center', color: T.ink2 }}>
            <div style={{ fontSize: 30, marginBottom: 10 }}>{'\uD83D\uDD12'}</div>
            <div style={{ fontSize: 15, fontWeight: 700, color: T.ink, marginBottom: 8 }}>Not this class's time yet</div>
            <div style={{ fontSize: 12.5, color: T.ink3, lineHeight: 1.6 }}>You can only take <b>{stream}</b>'s roll call during its timetabled period{_nxt ? (' — next at ' + _nxt.s + ' (' + _nxt.subject + ')') : ' today'}.{_activeNow ? (' Right now your timetable has you in ' + _activeNow.cls + ' (' + _activeNow.subject + ').') : ''}</div>
            <button onClick={onClose} style={{ marginTop: 16, background: T.green, color: T.bg, border: 'none', borderRadius: 9, padding: '9px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>Got it</button>
          </div>
        </Modal>
      );
    }
    return (
      <Modal title={`Roll Call · ${stream}`} onClose={onClose} width={640}>
        <div style={{
          padding: '12px 14px', background: T.surface2, borderRadius: 10,
          marginBottom: 16, display: 'flex', gap: 18, fontSize: 12, color: T.ink2, fontFamily: T.mono,
        }}>
          <span><span style={{ color: T.green }}>● {counts.present}</span> present</span>
          <span><span style={{ color: T.red }}>● {counts.absent}</span> absent</span>
          <span><span style={{ color: T.gold }}>● {counts.late}</span> late</span>
          <span><span style={{ color: T.blue }}>● {counts.excused}</span> excused</span>
          <span style={{ marginLeft: 'auto', color: T.ink3 }}>{streamStudents.length} students</span>
        </div>

        {streamStudents.length === 0 ? (
          <Empty text={`No students seeded for ${stream} yet.`} />
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {streamStudents.map(s => {
              const current = statuses[s.id] || 'present';
              return (
                <div key={s.id} style={{
                  display: 'flex', alignItems: 'center', gap: 12,
                  padding: '10px 12px', background: T.surface2, borderRadius: 8,
                }}>
                  <span style={{
                    width: 32, height: 32, borderRadius: 999, background: T.surface3,
                    display: 'grid', placeItems: 'center', fontSize: 11, color: T.ink2, fontWeight: 600, flexShrink: 0,
                  }}>{s.name.split(' ').map(n => n[0]).join('').slice(0, 2)}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 500, color: T.ink }}>{s.name}</div>
                    <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono }}>
                      {s.flag === 'risk' && <span style={{ color: T.red }}>AT RISK · </span>}
                      {s.flag === 'top' && <span style={{ color: T.gold }}>TOP · </span>}
                      attendance {s.attendanceWk}%
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 6, flexShrink: 0 }} onClick={(e) => e.stopPropagation()}>
                    <span onClick={() => setStatus(s.id, 'present')}>{statusBtn(current, 'present', 'PRESENT', T.green)}</span>
                    <span onClick={() => setStatus(s.id, 'absent')}>{statusBtn(current, 'absent', 'ABSENT', T.red)}</span>
                    <span onClick={() => setStatus(s.id, 'late')}>{statusBtn(current, 'late', 'LATE', T.gold)}</span>
                    <span onClick={() => setStatus(s.id, 'excused')}>{statusBtn(current, 'excused', 'EXCUSED', T.blue)}</span>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 18 }}>
          <button onClick={onClose} style={{
            background: 'transparent', color: T.ink2,
            border: '1px solid ' + T.borderStr, padding: '10px 18px',
            borderRadius: 8, fontSize: 13, cursor: 'pointer', fontFamily: T.font,
          }}>Cancel</button>
          <button onClick={handleSave} disabled={saving || streamStudents.length === 0} style={{
            background: T.green, color: T.bg, border: 'none',
            padding: '10px 22px', borderRadius: 8, fontSize: 13, fontWeight: 700,
            cursor: saving ? 'wait' : 'pointer', fontFamily: T.font,
            opacity: saving ? 0.6 : 1,
          }}>{saving ? 'Saving…' : 'Save Roll Call'}</button>
        </div>
      </Modal>
    );
  }

  // ─── Card: Today's Classes (with Take Roll Call buttons) ───────────
  // ── Timetable time-gating: a teacher may only roll-call the class they are
  //    timetabled to teach in the CURRENT period (prevents rolling several at once).
  function _nowMins() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function _toMins(hhmm) { const m = String(hhmm || '').match(/(\d{1,2}):(\d{2})/); return m ? (parseInt(m[1], 10) * 60 + parseInt(m[2], 10)) : null; }
  function _teacherLessonsToday(tt, email) {
    const DN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; const d = DN[new Date().getDay()];
    if (d === 'Sat' || d === 'Sun') return [];
    const out = [];
    if (tt && tt.grid) { Object.keys(tt.grid).forEach(cls => { ((tt.grid[cls] || {})[d] || []).forEach((cell, pi) => { if (cell && !cell.brk && cell.subject && (cell.teacherEmail || '').toLowerCase() === email) { const p = (tt.periods || [])[pi] || {}; out.push({ cls: cls, subject: cell.subject, pi: pi, s: p.s, e: p.e, label: p.l }); } }); }); }
    out.sort((a, b) => a.pi - b.pi); return out;
  }
  function _activeLessonNow(lessons) { const n = _nowMins(); return lessons.find(L => { const a = _toMins(L.s), b = _toMins(L.e); return a != null && b != null && n >= a && n < b; }) || null; }
  function _nextLessonForClass(lessons, cls) { const n = _nowMins(); return lessons.filter(L => L.cls === cls && (_toMins(L.s) != null) && _toMins(L.s) > n).sort((a, b) => _toMins(a.s) - _toMins(b.s))[0] || null; }
