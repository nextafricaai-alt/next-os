  <style>
    html, body { margin: 0; padding: 0; background: #0a1029; font-family: 'Inter', -apple-system, system-ui, sans-serif; color: #f5f6fa; -webkit-font-smoothing: antialiased; }

    #root { min-height: 100vh; }
    button { font: inherit; }
    /* Smooth scroll inside panels */
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }
    *::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }

    /* ===== Responsive: full dashboard reflows on tablets & phones ===== */
    @media (max-width: 820px) {
      [style*="height: 900px"] { width: 100% !important; height: auto !important; min-height: 100% !important; overflow: visible !important; }
      [style*="grid-template-columns: 1fr 380px"],
      [style*="grid-template-columns: 1fr 420px"],
      [style*="grid-template-columns: 1fr 460px"],
      [style*="grid-template-columns: 1.4fr 1fr"],
      [style*="grid-template-columns: 1.2fr 1fr"],
      [style*="grid-template-columns: 1.1fr 1fr 1fr"],
      [style*="grid-template-columns: 70px 1fr"] { grid-template-columns: 1fr !important; }
      [style*="grid-template-columns: repeat(5, 1fr)"],
      [style*="grid-template-columns: repeat(4, 1fr)"],
      [style*="grid-template-columns: repeat(3, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; }
      main { padding: 16px 14px 28px !important; }
    }
    @media (max-width: 540px) {
      [style*="grid-template-columns: repeat(5, 1fr)"],
      [style*="grid-template-columns: repeat(4, 1fr)"],
      [style*="grid-template-columns: repeat(3, 1fr)"],
      [style*="grid-template-columns: repeat(2, 1fr)"] { grid-template-columns: 1fr !important; }
    }
    /* ===== Dense record tables -> stacked cards on phones (no sideways scroll) ===== */
    @media (max-width: 640px) {
      [style*="grid-template-columns: 32px 36px 1.8fr 70px 1fr 1.2fr 90px 80px 36px"],
      [style*="grid-template-columns: 50px 60px 80px 1.2fr 100px 1.4fr 100px 80px"],
      [style*="grid-template-columns: 90px 1fr 1.6fr 100px 100px 110px 120px"] {
        display: flex !important; flex-wrap: wrap !important; align-items: center !important;
        gap: 6px 14px !important; padding: 12px 16px !important;
      }
      /* student rows: drop the checkbox + kebab noise on phones */
      [style*="grid-template-columns: 32px 36px 1.8fr 70px 1fr 1.2fr 90px 80px 36px"] > *:first-child,
      [style*="grid-template-columns: 32px 36px 1.8fr 70px 1fr 1.2fr 90px 80px 36px"] > *:last-child { display: none !important; }
      /* let the main text column lead each card on its own line */
      [style*="grid-template-columns: 32px 36px 1.8fr 70px 1fr 1.2fr 90px 80px 36px"] > *:nth-child(3),
      [style*="grid-template-columns: 50px 60px 80px 1.2fr 100px 1.4fr 100px 80px"] > *:nth-child(4),
      [style*="grid-template-columns: 90px 1fr 1.6fr 100px 100px 110px 120px"] > *:nth-child(3) { flex: 1 1 60% !important; min-width: 0 !important; }
    }
  </style>

  <script>
  /* NextReceipts — real receipts: save to Supabase, branded PDF, WhatsApp send (free click-to-send). */
  window.NextReceipts = (function(){
    function digits(p){ return String(p||'').replace(/[^0-9]/g,''); }
    function brandName(){ return (window.__BRAND_NAME) || 'School'; }
    function prefix(){ var n=brandName(); return (n.match(/[A-Za-z0-9]/g)||['N']).slice(0,2).join('').toUpperCase(); }
    function fmt(n){ try{ return 'UGX ' + Number(n||0).toLocaleString('en-UG'); }catch(e){ return 'UGX ' + (n||0); } }
    function methodLabel(m){ return ({mtn:'MTN Mobile Money',airtel:'Airtel Money',momo:'Mobile Money',mpesa:'M-Pesa',stanbic:'Bank deposit',bank:'Bank deposit',cash:'Cash',cheque:'Cheque'}[m]) || m || '-'; }
    function hexRgb(h){ h=String(h||'#00FC8F').replace('#',''); if(h.length===3){ h=h.split('').map(function(c){return c+c;}).join(''); } return [parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||200,parseInt(h.slice(4,6),16)||140]; }
    async function nextNo(sb, tenantId){
      var year=new Date().getFullYear(), seq=1;
      try{ var r=await sb.from('receipts').select('id',{count:'exact',head:true}).eq('tenant_id',tenantId); seq=(r.count||0)+1; }catch(e){}
      return prefix()+'-'+year+'-'+String(seq).padStart(5,'0');
    }
    async function issue(opts){
      var sess=window.NextSession||{}; var sb=sess.sb; var prof=sess.profile||{};
      var tenantId=prof.tenantId;
      if(!sb||!tenantId) throw new Error('Not signed in');
      var amount=Number(opts.amount||0);
      var no=await nextNo(sb, tenantId);
      var rec={ tenant_id:tenantId, receipt_no:no, student_id:(opts.studentId||null), student_name:(opts.studentName||null),
        guardian_name:(opts.guardianName||null), guardian_phone:(digits(opts.guardianPhone)||null), amount:amount, currency:'UGX',
        kind:'fees', method:(opts.method||null), reference:(opts.reference||null),
        balance_after:(opts.balanceAfter!=null?Number(opts.balanceAfter):null), term:(opts.term||null),
        issued_by:(prof.fullName||prof.email||null) };
      var res=await sb.from('receipts').insert(rec).select().single();
      if(res.error) throw res.error;
      return res.data;
    }
    function buildPdf(rec){
      var ctor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF; if(!ctor) throw new Error('PDF engine not loaded');
      var doc=new ctor({unit:'pt',format:'a4'}); var W=doc.internal.pageSize.getWidth();
      var c=hexRgb(window.__ACCENT);
      doc.setFillColor(c[0],c[1],c[2]); doc.rect(0,0,W,72,'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.text(brandName(),40,44);
      doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.text('PAYMENT RECEIPT',W-40,44,{align:'right'});
      var y=116;
      function row(label,val,big){
        doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(130,130,130); doc.text(String(label).toUpperCase(),40,y);
        doc.setFont('helvetica',big?'bold':'normal'); doc.setFontSize(big?20:13); doc.setTextColor(25,25,25); doc.text(String(val==null||val===''?'-':val),40,y+18);
        y += big?54:42;
      }
      row('Receipt no.', rec.receipt_no);
      row('Date', new Date(rec.issued_at||Date.now()).toLocaleString());
      row('Student', rec.student_name);
      if(rec.guardian_name) row('Guardian', rec.guardian_name);
      row('Amount received', fmt(rec.amount), true);
      row('Method', methodLabel(rec.method));
      if(rec.reference) row('Reference', rec.reference);
      if(rec.balance_after!=null) row('Balance after', fmt(rec.balance_after));
      row('Issued by', rec.issued_by);
      doc.setDrawColor(220,220,220); doc.line(40,y+4,W-40,y+4);
      doc.setFontSize(9); doc.setTextColor(150,150,150);
      doc.text('Powered by NEXT OS', 40, y+26);
      doc.text(rec.receipt_no, W-40, y+26, {align:'right'});
      return doc;
    }
    function download(rec){ try{ buildPdf(rec).save('Receipt-'+rec.receipt_no+'.pdf'); }catch(e){ if(window.peakToast) window.peakToast('Could not build PDF','error',String(e.message||e)); } }
    function whatsappUrl(rec){
      var msg='Dear '+(rec.guardian_name||'Parent')+', we confirm receipt of '+fmt(rec.amount)+' for '+(rec.student_name||'your child')+' at '+brandName()+'. Receipt '+rec.receipt_no+' ('+new Date(rec.issued_at||Date.now()).toLocaleDateString()+').'+(rec.balance_after!=null?(' Balance: '+fmt(rec.balance_after)+'.'):'')+' Thank you.';
      return 'https://wa.me/'+digits(rec.guardian_phone)+'?text='+encodeURIComponent(msg);
    }
    async function list(){
      var sess=window.NextSession||{}; var sb=sess.sb; var t=(sess.profile||{}).tenantId;
      if(!sb||!t) return [];
      var r=await sb.from('receipts').select('*').eq('tenant_id',t).order('issued_at',{ascending:false}).limit(100);
      return r.data||[];
    }
    return { issue:issue, download:download, whatsappUrl:whatsappUrl, list:list, fmt:fmt };
  })();
  </script>
  <script>
  (function(){
    var b=null; try{ b=JSON.parse(localStorage.getItem('nextos.brand')||'null'); }catch(e){}
    if(b && b.color){ var c=String(b.color); if(c[0]!=='#') c='#'+c;
      if(/^#[0-9a-fA-F]{6}$/.test(c)){ window.__ACCENT=c;
        window.__ACCENT_DARK=(function(h){h=h.replace('#','');function d(x){return Math.max(0,Math.round(parseInt(x,16)*0.55)).toString(16).padStart(2,'0');}return '#'+d(h.slice(0,2))+d(h.slice(2,4))+d(h.slice(4,6));})(c);
        var _mix=function(hex,base,amt){var hh=hex.replace('#',''),bs=base.replace('#','');function cc(i){var x=parseInt(hh.substr(i,2),16),d=parseInt(bs.substr(i,2),16);return Math.round(d+(x-d)*amt);}function hx(v){return Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0');}return '#'+hx(cc(0))+hx(cc(2))+hx(cc(4));};
        window.__BG=_mix(c,'#0a0a12',0.10); window.__SURFACE=_mix(c,'#0a0a12',0.18); window.__SURFACE2=_mix(c,'#0a0a12',0.24); window.__SURFACE3=_mix(c,'#0a0a12',0.34);
        try{ document.documentElement.style.background=window.__BG; }catch(e){}
        window.addEventListener('DOMContentLoaded',function(){ try{ document.body.style.background=window.__BG; }catch(e){} });
      }
    }
    if(b && b.name){ window.__BRAND_NAME=b.name;
      try{ document.title = b.name + ' \u00b7 NEXT School OS'; }catch(e){}
      try{ var _ld=document.querySelector('#root div'); if(_ld) _ld.textContent='LOADING '+String(b.name).toUpperCase()+' \u00b7 NEXT SCHOOL OS'; }catch(e){}
    }
  })();

  <!-- Role router + teacher shell (INLINED to work over file:// — external src is CORS-blocked) -->
  <script type="text/babel" data-src="role-router.jsx">
/* role-router.jsx
   The doorman of the Schools OS. Reads window.NextSession.profile.role,
   decides which "floor" of the building each user lands on.

   Loaded BEFORE peak-app.jsx so window.PEAK_ROLE exists when App() runs.

   Public API on window.PEAK_ROLE:
     - getRole()              → 'admin' | 'head' | 'bursar' | 'teacher'  (default 'head')
     - getProfile()           → { email, fullName, role, tenantId }      (or fallback)
     - canSeeNavKey(key)      → boolean — should this nav item appear?
     - filterNavItems(items)  → returns the nav array trimmed for current role
     - defaultRouteForRole()  → which screen to land on after login
     - roleLabel()            → human-readable e.g. "Head Teacher", "Bursar"
*/
(function () {
  // ─── Read profile from session (set by login.html / session-guard.js) ─
  function getProfile() {
    if (window.NextSession && window.NextSession.profile) {
      return window.NextSession.profile;
    }
    // Fallback for opening the prototype directly without login (dev)
    try {
      const cached = JSON.parse(localStorage.getItem('nextos.profile') || 'null');
      if (cached) return cached;
    } catch (e) {}
    return {
      email: 'demo@peakprimary.test',
      fullName: 'Demo User',
      role: 'head',
      tenantId: 'peak-primary',
    };
  }

  function getRole() {
    const p = getProfile();
    const r = (p && p.role) ? String(p.role).toLowerCase() : 'head';
    if (r === 'admin' || r === 'head' || r === 'bursar' || r === 'teacher') return r;
    return 'head';
  }

  // ─── Which nav items each role can see ────────────────────────────────
  // Admin + Head: everything
  // Bursar: only finance-relevant screens
  // Teacher: doesn't use the sidebar at all (different shell)
  const ROLE_NAV_WHITELIST = {
    admin:   null, // null = show all
    head:    null,
    bursar:  new Set(['dash', 'fees', 'rep', 'exam']),
    teacher: new Set(), // teacher uses its own shell, sidebar not rendered
  };

  function canSeeNavKey(key) {
    const role = getRole();
    const wl = ROLE_NAV_WHITELIST[role];
    if (wl === null) return true;
    return wl.has(key);
  }

  function filterNavItems(items) {
    const role = getRole();
    const wl = ROLE_NAV_WHITELIST[role];
    if (wl === null) return items;
    return items.filter(n => wl.has(n.k));
  }

  // ─── Default landing screen after login ──────────────────────────────
  function defaultRouteForRole() {
    const role = getRole();
    if (role === 'bursar')  return 'fees';
    if (role === 'teacher') return 'teacher-home'; // handled by TeacherShell
    return 'today'; // admin / head land on Today
  }

  // ─── Pretty label for the sidebar profile chip ───────────────────────
  function roleLabel() {
    const role = getRole();
    return ({
      admin:   'Administrator',
      head:    'Head Teacher',
      bursar:  'Bursar',
      teacher: 'Teacher',
    })[role] || 'User';
  }

  // ─── Initials for avatar circle ───────────────────────────────────────
  function initials() {
    const p = getProfile();
    const name = (p && p.fullName) ? p.fullName : (p && p.email) ? p.email : 'U';
    return name.split(/\s+/).filter(Boolean).slice(0, 2)
      .map(w => w[0]).join('').toUpperCase();
  }

  window.PEAK_ROLE = {
    getProfile,
    getRole,
    canSeeNavKey,
    filterNavItems,
    defaultRouteForRole,
    roleLabel,
    initials,
  };
})();

  </script>
  <script type="text/babel" data-src="teacher-view.jsx">
/* teacher-view.jsx
   The Teacher Shell — Patrick / Mary's portal.

   Three live data flows feed the school's central nervous system:
     1. Check In            → teacher_checkins        → Head sees "Staff Today"
     2. Take Roll Call      → student_roll_call       → Head sees attendance live
     3. Log Health/Wellbeing → student_health_records → Head sees Health Watch

   All actions hit Supabase with RLS active — teachers only touch their own
   streams. The school sees everything in real time.

   Exposed as window.TeacherShell. Loaded inline in index.html.
*/
(function () {
  const { useState, useEffect, useMemo, useCallback } = React;

  const T = {
    bg:       (typeof window!=='undefined'&&window.__BG)||'#0a1029',
    surface:  (typeof window!=='undefined'&&window.__SURFACE)||'#141e3c',
    surface2: (typeof window!=='undefined'&&window.__SURFACE2)||'#1a2548',
    surface3: (typeof window!=='undefined'&&window.__SURFACE3)||'#212d56',
    border:   'rgba(255,255,255,0.06)',
    borderStr:'rgba(255,255,255,0.10)',
    ink:      '#f5f6fa',
    ink2:     'rgba(245,246,250,0.85)',
    ink3:     'rgba(245,246,250,0.55)',
    ink4:     'rgba(245,246,250,0.40)',
    red:      '#FF4757',
    green:    (typeof window!=='undefined'&&window.__ACCENT)||'#00FC8F',
    gold:     '#FFB400',
    blue:     '#3B82F6',
    font:     "'Inter', -apple-system, system-ui, sans-serif",
    mono:     "'JetBrains Mono', ui-monospace, monospace",
    serif:    "'Instrument Serif', serif",
  };

  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const isoDate = (d) => (d || new Date()).toISOString().slice(0, 10);
  const tinyToast = (msg, kind) => {
    if (window.peakToast) { window.peakToast(msg, kind || 'info'); return; }
    console.log('[teacher]', msg);
  };

  // ─── Supabase data loader ───────────────────────────────────────────
  async function loadTeacherData() {
    const sess = window.NextSession;
    if (!sess || !sess.sb || !sess.profile) {
      return { error: 'No session. Please sign in again.' };
    }
    const sb = sess.sb;
    const email = sess.profile.email;
    const tenantId = sess.profile.tenantId;
    const today = isoDate();

    const { data: teacher, error: tErr } = await sb
      .from('teachers')
      .select('id, full_name, email, subjects, status')
      .eq('email', email).eq('tenant_id', tenantId)
      .maybeSingle();
    if (tErr || !teacher) {
      return { error: 'Could not find your teacher profile. Ask your administrator.' };
    }

    const { data: assignments } = await sb
      .from('class_assignments')
      .select('id, stream, subject, is_class_teacher')
      .eq('teacher_id', teacher.id);

    const { data: lessons } = await sb
      .from('lesson_plans')
      .select('id, stream, subject, week_of, topic, status')
      .eq('teacher_id', teacher.id)
      .order('week_of', { ascending: true });

    const { data: syllabus } = await sb
      .from('syllabus_coverage')
      .select('stream, subject, topic, planned_week, status')
      .eq('teacher_id', teacher.id);

    const { data: payroll } = await sb
      .from('teacher_payroll')
      .select('id, month, amount, status, paid_at, channel')
      .eq('teacher_id', teacher.id)
      .order('month', { ascending: false })
      .limit(3);

    // Today's check-in (most recent for today)
    const { data: checkins } = await sb
      .from('teacher_checkins')
      .select('id, checked_in_at, checked_out_at, method')
      .eq('teacher_id', teacher.id)
      .gte('checked_in_at', today + 'T00:00:00')
      .order('checked_in_at', { ascending: false })
      .limit(1);

    // Today's roll call records (so cards reflect what's been done)
    const streamCodes = (assignments || []).map(a => a.stream);
    let rollCalls = [];
    if (streamCodes.length > 0) {
      const { data: rc } = await sb
        .from('student_roll_call')
        .select('id, student_id, stream, status, taken_at, roll_date')
        .eq('roll_date', today)
        .in('stream', streamCodes);
      rollCalls = rc || [];
    }

    // Recent health records for students in this teacher's streams
    const allStudents = (window.PEAK && window.PEAK.students) || [];
    const myStreamsSet = new Set((assignments || []).map(a => a.stream));
    const myStudentIds = allStudents.filter(s => myStreamsSet.has(s.stream)).map(s => s.id);
    let healthRecords = [];
    if (myStudentIds.length > 0) {
      const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
      const { data: hr } = await sb
        .from('student_health_records')
        .select('id, student_id, category, severity, description, recorded_at, follow_up_needed, resolved_at')
        .in('student_id', myStudentIds)
        .gte('recorded_at', thirtyDaysAgo)
        .order('recorded_at', { ascending: false });
      healthRecords = hr || [];
    }

    return {
      teacher,
      assignments: assignments || [],
      lessons: lessons || [],
      syllabus: syllabus || [],
      payroll: payroll || [],
      checkin: (checkins && checkins[0]) || null,
      rollCalls,
      healthRecords,
    };
  }

  // ─── Write helpers ──────────────────────────────────────────────────
  async function writeCheckIn(teacherId, tenantId, method) {
    const sb = window.NextSession?.sb;
    if (!sb) return { error: 'No session' };
    const { data, error } = await sb
      .from('teacher_checkins')
      .insert({
        tenant_id: tenantId,
        teacher_id: teacherId,
        method: method || 'manual',
      })
      .select('id, checked_in_at, checked_out_at, method')
      .single();
    return { data, error };
  }

  async function writeCheckOut(checkinId) {
    const sb = window.NextSession?.sb;
    if (!sb) return { error: 'No session' };
    const { data, error } = await sb
      .from('teacher_checkins')
      .update({ checked_out_at: new Date().toISOString() })
      .eq('id', checkinId)
      .select('id, checked_in_at, checked_out_at, method')
      .single();
    return { data, error };
  }

  async function writeRollCall(records) {
    // records = [{ tenant_id, teacher_id, student_id, stream, status, notes? }, ...]
    const sb = window.NextSession?.sb;
    if (!sb) return { error: 'No session' };
    // upsert each row (UNIQUE on student_id, roll_date) so re-saving overwrites
    const { data, error } = await sb
      .from('student_roll_call')
      .upsert(records, { onConflict: 'student_id,roll_date' })
      .select('id, student_id, stream, status');
    return { data, error };
  }

  async function writeHealthRecord(record) {
    const sb = window.NextSession?.sb;
    if (!sb) return { error: 'No session' };
    const { data, error } = await sb
      .from('student_health_records')
      .insert(record)
      .select('id')
      .single();
    return { data, error };
  }

  // ─── Shared atoms ──────────────────────────────────────────────────
  function Card({ title, subtitle, children, accent, action }) {
    return (
      <div style={{
        background: T.surface,
        border: '1px solid ' + T.border,
        borderRadius: 14,
        padding: 22,
        position: 'relative',
        overflow: 'hidden',
      }}>
        {accent && (
          <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: 3, background: accent }} />
        )}
        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 16, gap: 12 }}>
          <div>
            <div style={{ fontSize: 10, fontFamily: T.mono, letterSpacing: 1.5, color: T.ink3, textTransform: 'uppercase', marginBottom: 4 }}>{subtitle}</div>
            <div style={{ fontSize: 18, fontWeight: 600, color: T.ink }}>{title}</div>
          </div>
          {action}
        </div>

  // ─── Nia's intelligence layer ───────────────────────────────────────
  function computeNiaNudges({ teacher, assignments, rollCalls, checkin, healthRecords }) {
    const nudges = [];
    const allStudents = (window.PEAK && window.PEAK.students) || [];
    const myStreams = new Set(assignments.map(a => a.stream));
    const myStudents = allStudents.filter(s => myStreams.has(s.stream));
    const today = new Date();
    const isWeekend = today.getDay() === 0 || today.getDay() === 6;

    // 1. Not checked in yet (weekdays only, before 4pm)
    if (!isWeekend && !checkin && today.getHours() < 16) {
      nudges.push({
        id: 'checkin',
        tone: 'warn',
        icon: '◷',
        title: "You haven't checked in yet today",
        body: 'Tap the green Check In button so your head teacher knows you\'re on campus.',
        action: 'check-in',
      });
    }

    // 2. Roll call not taken for each assigned stream (weekdays only)
    if (!isWeekend) {
      assignments.forEach(a => {
        const taken = rollCalls.filter(rc => rc.stream === a.stream).length;
        const expected = allStudents.filter(s => s.stream === a.stream).length;
        if (expected > 0 && taken < expected) {
          nudges.push({
            id: 'roll-' + a.stream,
            tone: 'warn',
            icon: '☰',
            title: 'Take roll call for ' + a.stream + ' · ' + a.subject,
            body: taken === 0
              ? expected + ' students are waiting.'
              : 'Started (' + taken + '/' + expected + '), finish marking the rest.',
            action: 'roll-call',
            stream: a.stream,
          });
        }
      });
    }

    // 3. At-risk students that need personal attention
    const atRisk = myStudents.filter(s => s.flag === 'risk');
    atRisk.slice(0, 3).forEach(s => {
      nudges.push({
        id: 'risk-' + s.id,
        tone: 'warn',
        icon: '!',
        title: s.name + ' (' + s.stream + ') is showing risk signals',
        body: s.attendanceWk + '% attendance this week. Worth a one-on-one before they slip further.',
        action: 'health',
        student: s,
      });
    });

    // 4. Students with unresolved health concerns — follow up
    const unresolvedHealth = (healthRecords || []).filter(h =>
      h.follow_up_needed && !h.resolved_at
    );
    const seenStudents = new Set();
    unresolvedHealth.slice(0, 2).forEach(h => {
      if (seenStudents.has(h.student_id)) return;
      seenStudents.add(h.student_id);
      const stu = myStudents.find(s => s.id === h.student_id);
      if (!stu) return;
      nudges.push({
        id: 'health-' + h.id,
        tone: 'info',
        icon: '♥',
        title: 'Follow up on ' + stu.name + ' — ' + h.category,
        body: (h.description || '').slice(0, 90) + ((h.description || '').length > 90 ? '…' : ''),
        action: 'health',
        student: stu,
      });
    });

    // 5. Top performers — public praise prompt
    const topPerformers = myStudents.filter(s => s.flag === 'top');
    if (topPerformers.length > 0) {
      const star = topPerformers[Math.floor(Math.random() * topPerformers.length)];
      nudges.push({
        id: 'top-' + star.id,
        tone: 'positive',
        icon: '★',
        title: 'Praise ' + star.name + ' (' + star.stream + ') publicly today',
        body: 'Consistent performer this week — recognition reinforces the habit.',
        action: 'none',
      });
    }

    // If absolutely nothing to nudge about, give an "all clear" message
    if (nudges.length === 0) {
      nudges.push({
        id: 'clear',
        tone: 'positive',
        icon: '✓',
        title: 'All clear — nothing pressing right now',
        body: 'Roll call done, no risk flags, no overdue follow-ups. Keep going.',
        action: 'none',
      });
    }

    return nudges;
  }

  function NiaCoachCard({ data, onTakeRollCall, onLogHealth, onScrollToCheckin }) {

                }}

              >

                  <span style={{

  // ─── Nia's interactive check-in popup ─────────────────────────────
  // Slides in from top-right when the dashboard opens if the teacher
  // hasn't checked in yet. Feels like a real notification, not a card.
  function NiaCheckinPopup({ teacher, profile, onCheckedIn }) {
    const [visible, setVisible] = useState(false);
    const [dismissed, setDismissed] = useState(false);
    const [busy, setBusy] = useState(false);
    const [animateIn, setAnimateIn] = useState(false);

    useEffect(() => {
      // Slide in 600ms after mount so it feels intentional, not jarring
      const t1 = setTimeout(() => setVisible(true), 600);
      const t2 = setTimeout(() => setAnimateIn(true), 700);
      return () => { clearTimeout(t1); clearTimeout(t2); };
    }, []);

    if (!visible || dismissed) return null;

    const handleCheckIn = async () => {
      if (busy) return;
      setBusy(true);
      const { data, error } = await writeCheckIn(teacher.id, profile.tenantId, 'manual');
      if (error) {
        setBusy(false);
        tinyToast('Check-in failed: ' + error.message, 'error');
        return;
      }
      // Slide out, then notify parent
      setAnimateIn(false);
      setTimeout(() => {
        setDismissed(true);
        if (onCheckedIn) onCheckedIn(data);
        tinyToast('Checked in. Head teacher notified.', 'success');
      }, 350);
    };

    const handleClose = () => {
      setAnimateIn(false);
      setTimeout(() => setDismissed(true), 350);
    };

    return (
      <div style={{
        position: 'fixed',
        top: 90, right: animateIn ? 24 : -440,
        zIndex: 9500,
        width: 380, maxWidth: 'calc(100vw - 48px)',
        background: 'linear-gradient(135deg, rgba(20,30,60,0.96) 0%, rgba(26,37,72,0.96) 100%)',
        backdropFilter: 'blur(14px)',
        border: '1px solid rgba(0,252,143,0.30)',
        borderRadius: 14,
        padding: 18,
        boxShadow: '0 24px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,252,143,0.10)',
        opacity: animateIn ? 1 : 0,
        transition: 'right 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease',
      }}>
        {/* Top row: Nia badge + label + close */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
          <div style={{
            width: 32, height: 32, borderRadius: 9,
            background: 'rgba(0,252,143,0.18)', color: T.green,
            border: '1px solid rgba(0,252,143,0.4)',
            display: 'grid', placeItems: 'center',
            fontFamily: T.serif, fontSize: 17, fontWeight: 700,
          }}>N</div>
          <div style={{ flex: 1, lineHeight: 1.2 }}>
            <div style={{
              fontSize: 9.5, fontFamily: T.mono, letterSpacing: 1.4,
              color: T.green, fontWeight: 700,
            }}>NIA · LIVE NUDGE</div>
            <div style={{ fontSize: 12, color: T.ink3 }}>from your coach</div>
          </div>
          <button onClick={handleClose} style={{
            background: 'transparent', border: 'none',
            color: T.ink3, fontSize: 22, lineHeight: 1,
            cursor: 'pointer', padding: 0, width: 24, height: 24,
          }}>×</button>
        </div>

        {/* Title + body */}
        <div style={{ marginBottom: 16 }}>
          <div style={{
            fontSize: 16, fontWeight: 600, color: T.ink, marginBottom: 6,
            fontFamily: T.serif, fontStyle: 'italic',
          }}>
            {(profile.fullName ? profile.fullName.split(' ')[0] : 'Teacher')}, don't forget to check in.
          </div>
          <div style={{ fontSize: 12.5, color: T.ink3, lineHeight: 1.5 }}>
            Tap below so your head teacher knows you're on campus. Takes a second.
          </div>
        </div>

        {/* Action button */}
        <button
          onClick={handleCheckIn}
          disabled={busy}
          style={{
            width: '100%',
            background: T.green, color: T.bg, border: 'none',
            padding: '12px', borderRadius: 10,
            fontSize: 13, fontWeight: 700, letterSpacing: 0.3,
            cursor: busy ? 'wait' : 'pointer', fontFamily: T.font,

          onMouseLeave={(e) => { e.currentTarget.style.transform = 'scale(1)'; }}
        >
          {busy ? 'Checking in…' : '✓  Check In Now'}

        {/* Footer */}

  // ─── Card: Check-in Status ──────────────────────────────────────────
  function CheckInCard({ teacher, checkin, onCheckedIn, onCheckedOut, profile }) {
    const [busy, setBusy] = useState(false);

    // State machine: 'out' | 'in' | 'done'
    const state = !checkin ? 'out'
                : checkin.checked_out_at ? 'done'
                : 'in';

    const handleCheckIn = async () => {
      if (busy) return;
      setBusy(true);
      const { data, error } = await writeCheckIn(teacher.id, profile.tenantId, 'manual');
      setBusy(false);
      if (error) { tinyToast('Check-in failed: ' + error.message, 'error'); return; }
      tinyToast('Checked in. Head teacher notified.', 'success');
      if (onCheckedIn) onCheckedIn(data);
    };

    const handleCheckOut = async () => {
      if (busy || !checkin) return;
      // Confirm
      if (!window.confirm("End your day at school? Your head teacher will see you've left.")) return;
      setBusy(true);
      const { data, error } = await writeCheckOut(checkin.id);
      setBusy(false);
      if (error) { tinyToast('Check-out failed: ' + error.message, 'error'); return; }
      tinyToast("Day ended. See you tomorrow.", 'success');
      if (onCheckedOut) onCheckedOut(data);
    };

    const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : null;
    const fmtDuration = (a, b) => {
      const ms = (new Date(b)) - (new Date(a));
      if (ms <= 0) return '';
      const mins = Math.floor(ms / 60000);
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    };

    // Visual tokens per state
    const tokens = {
      out:  { bg: 'rgba(255,180,0,0.12)', border: 'rgba(255,180,0,0.25)', icon: '◷', iconBg: 'rgba(255,180,0,0.18)', iconColor: T.gold },
      in:   { bg: 'rgba(0,252,143,0.10)', border: 'rgba(0,252,143,0.25)', icon: '✓', iconBg: 'rgba(0,252,143,0.18)', iconColor: T.green },
      done: { bg: 'rgba(255,255,255,0.04)', border: T.borderStr, icon: '✓', iconBg: 'rgba(255,255,255,0.08)', iconColor: T.ink3 },
    }[state];

    return (
      <div style={{
        gridColumn: '1 / -1',
        background: 'linear-gradient(135deg, ' + tokens.bg + ' 0%, transparent 100%)',
        border: '1px solid ' + tokens.border,
        borderRadius: 14, padding: 22,
        display: 'flex', alignItems: 'center', gap: 18, flexWrap: 'wrap',
      }}>
        <div style={{
          width: 56, height: 56, borderRadius: 14,
          background: tokens.iconBg,
          display: 'grid', placeItems: 'center',
          fontSize: 26, color: tokens.iconColor,
        }}>{tokens.icon}</div>

        <div style={{ flex: 1, minWidth: 200 }}>
          <div style={{
            fontSize: 10, fontFamily: T.mono, letterSpacing: 1.5,
            color: T.ink3, textTransform: 'uppercase', marginBottom: 4,
          }}>{
            state === 'out'  ? 'NOT CHECKED IN YET' :
            state === 'in'   ? 'CHECKED IN · ON CAMPUS' :
                               'DAY ENDED'
          }</div>
          <div style={{ fontSize: 17, fontWeight: 600, color: T.ink }}>{
            state === 'out'  ? 'Tap below to start your day' :
            state === 'in'   ? 'On campus since ' + fmtTime(checkin.checked_in_at) :
                               'In: ' + fmtTime(checkin.checked_in_at) + '  →  Out: ' + fmtTime(checkin.checked_out_at)
          }</div>
          <div style={{ fontSize: 12, color: T.ink3, marginTop: 4 }}>{
            state === 'out'  ? 'Your head teacher will see your check-in instantly.' :
            state === 'in'   ? 'Head teacher sees a green dot next to your name.' :
                               'Total time today: ' + fmtDuration(checkin.checked_in_at, checkin.checked_out_at)
          }</div>
        </div>

        {state === 'out' && (
          <button onClick={handleCheckIn} disabled={busy} style={{
            background: T.green, color: T.bg, border: 'none',
            padding: '13px 24px', borderRadius: 10,
            fontSize: 14, fontWeight: 700, cursor: busy ? 'wait' : 'pointer',
            fontFamily: T.font, opacity: busy ? 0.6 : 1,
          }}>{busy ? 'Checking in…' : 'Check In Now'}</button>
        )}

        {state === 'in' && (
          <button onClick={handleCheckOut} disabled={busy} style={{
            background: 'transparent', color: T.red,
            border: '1px solid ' + T.red,
            padding: '13px 24px', borderRadius: 10,
            fontSize: 14, fontWeight: 700, cursor: busy ? 'wait' : 'pointer',
            fontFamily: T.font, opacity: busy ? 0.6 : 1,
          }}>{busy ? 'Checking out…' : 'Check Out'}</button>
        )}

        {state === 'done' && (
          <div style={{
            background: 'rgba(255,255,255,0.04)', color: T.ink3,
            padding: '13px 22px', borderRadius: 10,
            fontSize: 12, fontWeight: 600, fontFamily: T.mono, letterSpacing: 0.5,
          }}>SEE YOU TOMORROW</div>
        )}
      </div>
    );
  }

  // ─── Modal: Roll Call ──────────────────────────────────────────────
  function RollCallModal({ stream, teacher, assignments, existingRollCalls, onClose, onSaved, profile }) {
    const allStudents = (window.PEAK && window.PEAK.students) || [];
    const streamStudents = useMemo(
      () => allStudents.filter(s => s.stream === stream),
      [allStudents, stream]
    );

    // Hydrate from existing roll call records for today
    const initialStatuses = useMemo(() => {
      const map = {};
      streamStudents.forEach(s => {
        const existing = existingRollCalls.find(rc => rc.student_id === s.id);
        map[s.id] = existing ? existing.status : 'present';
      });
      return map;
    }, [streamStudents, existingRollCalls]);

    const [statuses, setStatuses] = useState(initialStatuses);
    const [saving, setSaving] = useState(false);

    const setStatus = (id, status) => setStatuses(prev => ({ ...prev, [id]: status }));

    const counts = useMemo(() => {
      const c = { present: 0, absent: 0, late: 0, excused: 0 };
      Object.values(statuses).forEach(s => { c[s] = (c[s] || 0) + 1; });
      return c;
    }, [statuses]);

    const handleSave = async () => {
      if (saving) return;
      setSaving(true);
      const records = streamStudents.map(s => ({
        tenant_id: profile.tenantId,
        teacher_id: teacher.id,
        student_id: s.id,
        stream: stream,
        status: statuses[s.id] || 'present',
      }));
      const { error } = await writeRollCall(records);
      setSaving(false);
      if (error) {
        tinyToast('Roll call save failed: ' + error.message, 'error');
        return;
      }
      tinyToast(`Roll call for ${stream} saved — head teacher sees it now.`, 'success');
      onSaved(records);
      onClose();
    };

    const statusBtn = (current, value, label, color) => {
      const active = current === value;
      return (
        <button onClick={(e) => { e.stopPropagation(); }} style={{
          background: active ? color : 'transparent',
          color: active ? T.bg : T.ink3,
          border: '1px solid ' + (active ? color : T.borderStr),
          padding: '5px 10px', borderRadius: 6,
          fontSize: 11, fontWeight: 700, fontFamily: T.mono, letterSpacing: 0.5,
          cursor: 'pointer',
        }}>{label}</button>
      );
    };

    return (
      <Modal title={`Roll Call · ${stream}`} onClose={onClose} width={640}>
        <div style={{
          padding: '12px 14px', background: T.surface2, borderRadius: 10,
          marginBottom: 16, display: 'flex', gap: 18, fontSize: 12, color: T.ink2, fontFamily: T.mono,
        }}>
          <span><span style={{ color: T.green }}>● {counts.present}</span> present</span>
          <span><span style={{ color: T.red }}>● {counts.absent}</span> absent</span>
          <span><span style={{ color: T.gold }}>● {counts.late}</span> late</span>
          <span><span style={{ color: T.blue }}>● {counts.excused}</span> excused</span>
          <span style={{ marginLeft: 'auto', color: T.ink3 }}>{streamStudents.length} students</span>
        </div>

        {streamStudents.length === 0 ? (
          <Empty text={`No students seeded for ${stream} yet.`} />
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {streamStudents.map(s => {
              const current = statuses[s.id] || 'present';
              return (
                <div key={s.id} style={{
                  display: 'flex', alignItems: 'center', gap: 12,
                  padding: '10px 12px', background: T.surface2, borderRadius: 8,
                }}>
                  <span style={{
                    width: 32, height: 32, borderRadius: 999, background: T.surface3,
                    display: 'grid', placeItems: 'center', fontSize: 11, color: T.ink2, fontWeight: 600, flexShrink: 0,
                  }}>{s.name.split(' ').map(n => n[0]).join('').slice(0, 2)}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 500, color: T.ink }}>{s.name}</div>
                    <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono }}>
                      {s.flag === 'risk' && <span style={{ color: T.red }}>AT RISK · </span>}
                      {s.flag === 'top' && <span style={{ color: T.gold }}>TOP · </span>}
                      attendance {s.attendanceWk}%
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 6, flexShrink: 0 }} onClick={(e) => e.stopPropagation()}>
                    <span onClick={() => setStatus(s.id, 'present')}>{statusBtn(current, 'present', 'PRESENT', T.green)}</span>

    const [category, setCategory] = useState('wellbeing');
    const [severity, setSeverity] = useState('low');

    const [actionTaken, setActionTaken] = useState('');

    const handleSave = async () => {
      if (!description.trim()) {
        tinyToast('Please describe the observation.', 'error');
        return;

      setSaving(true);

        tenant_id: profile.tenantId,
        student_id: student.id,
        recorded_by_teacher_id: teacher.id,
        category,
        severity,
        description: description.trim(),
        action_taken: actionTaken.trim() || null,
        follow_up_needed: followUp,

      setSaving(false);
      if (error) {
        tinyToast('Could not save: ' + error.message, 'error');

  function SyllabusCard({ syllabus }) {
    const groups = useMemo(() => {
      const map = {};
      syllabus.forEach(row => {
        const key = row.stream + '|' + row.subject;
        if (!map[key]) map[key] = { stream: row.stream, subject: row.subject, total: 0, covered: 0 };
        map[key].total += 1;
        if (row.status === 'done') map[key].covered += 1;
      });
      return Object.values(map);
    }, [syllabus]);
    return (
      <Card title="Syllabus Coverage" subtitle="TERM PROGRESS" accent={T.gold}>
        {groups.length === 0 ? (
          <Empty text="No syllabus topics tracked yet." />
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            {groups.map((g, i) => {
              const pct = g.total > 0 ? Math.round((g.covered / g.total) * 100) : 0;
              const color = pct >= 75 ? T.green : pct >= 50 ? T.gold : T.red;
              return (
                <div key={i}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                    <span style={{ fontSize: 13, color: T.ink, fontWeight: 500 }}>{g.stream} · {g.subject}</span>
                    <span style={{ fontSize: 12, color, fontFamily: T.mono, fontWeight: 700 }}>{g.covered}/{g.total} · {pct}%</span>
                  </div>
                  <div style={{ height: 6, background: T.surface3, borderRadius: 999, overflow: 'hidden' }}>
                    <div style={{ width: pct + '%', height: '100%', background: color, transition: 'width 0.4s ease' }} />
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </Card>
    );
  }

        </header>

        <main style={{ padding: '32px 32px 60px', maxWidth: 1400, margin: '0 auto' }}>
          <div style={{ marginBottom: 24 }}>
            <h1 style={{ fontSize: 36, fontWeight: 400, margin: 0, fontFamily: T.serif, letterSpacing: '-0.01em' }}>
              {greeting}, {profile.fullName ? profile.fullName.split(' ')[0] : 'Teacher'}
            </h1>
            <p style={{ margin: '8px 0 0', color: T.ink3, fontSize: 14 }}>{"Here's your day at " + ((typeof window!=='undefined'&&window.__BRAND_NAME)||'Peak Primary') + "."}</p>

          {data.loading ? (
            <div style={{ padding: 60, textAlign: 'center', color: T.ink3, fontFamily: T.mono, fontSize: 12, letterSpacing: 0.8 }}>LOADING YOUR DASHBOARD…</div>
          ) : data.error ? (
            <div style={{ padding: 24, background: 'rgba(255,71,87,0.08)', border: '1px solid rgba(255,71,87,0.25)', borderRadius: 12, color: '#FF8a92' }}>{data.error}</div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(380px, 1fr))', gap: 20 }}>
              <CheckInCard teacher={data.teacher} checkin={data.checkin} onCheckedIn={onCheckedIn} onCheckedOut={onCheckedOut} profile={profile} />
              <NiaCoachCard
                data={{ teacher: data.teacher, assignments: data.assignments, rollCalls: data.rollCalls || [], checkin: data.checkin, healthRecords: data.healthRecords || [] }}
                onTakeRollCall={setRollCallStream}
                onLogHealth={setHealthStudent}
                onScrollToCheckin={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
              />
              <TodaysClassesCard assignments={data.assignments} rollCalls={data.rollCalls || []} onTakeRollCall={setRollCallStream} />
              <LessonsCard lessons={data.lessons} />
              <SyllabusCard syllabus={data.syllabus} />
              <StudentsCard assignments={data.assignments} onLogHealth={setHealthStudent} healthRecords={data.healthRecords || []} />
              <PayslipCard payroll={data.payroll} />
            </div>
          )}
        </main>

        {/* Nia's live check-in nudge — only on weekdays, if not yet checked in */}
        {!data.loading && !data.error && data.teacher && !data.checkin &&
         new Date().getDay() !== 0 && new Date().getDay() !== 6 &&
         new Date().getHours() < 17 && (
          <NiaCheckinPopup
            teacher={data.teacher}
            profile={profile}
            onCheckedIn={onCheckedIn}

        {rollCallStream && data.teacher && (
          <RollCallModal
            stream={rollCallStream}

        {healthStudent && data.teacher && (
          <HealthLogModal

            onClose={() => setHealthStudent(null)}

  window.TeacherShell = TeacherShell;
})();

  <script type="text/babel" data-src="head-staff-panel.jsx">
/* head-staff-panel.jsx
   Sarah's view of her staff today.

   Pulls live from Supabase:
     - teachers (everyone on payroll)
     - teacher_checkins (today's check-ins + check-outs)
     - student_roll_call (which classes had roll taken today)
     - student_health_records (recent health notes)

   Status pills:
     ● GREEN  — checked in, still on campus
     ● AMBER  — checked in then out (left for the day)
     ● GRAY   — hasn't checked in today

   Exposed as window.HeadStaffPanel. Loaded inline in index.html.
*/
(function () {
  const { useState, useEffect, useMemo, useCallback } = React;

  const T = {
    bg:       (typeof window!=='undefined'&&window.__BG)||'#0a1029',
    surface:  (typeof window!=='undefined'&&window.__SURFACE)||'#141e3c',
    surface2: (typeof window!=='undefined'&&window.__SURFACE2)||'#1a2548',
    surface3: (typeof window!=='undefined'&&window.__SURFACE3)||'#212d56',
    border:   'rgba(255,255,255,0.06)',
    borderStr:'rgba(255,255,255,0.10)',
    ink:      '#f5f6fa',
    ink2:     'rgba(245,246,250,0.85)',
    ink3:     'rgba(245,246,250,0.55)',
    ink4:     'rgba(245,246,250,0.40)',
    red:      '#FF4757',
    green:    (typeof window!=='undefined'&&window.__ACCENT)||'#00FC8F',
    gold:     '#FFB400',
    blue:     '#3B82F6',
    font:     "'Inter', -apple-system, system-ui, sans-serif",
    mono:     "'JetBrains Mono', ui-monospace, monospace",
    serif:    "'Instrument Serif', serif",
  };

  const isoDate = () => new Date().toISOString().slice(0, 10);
  const fmtTime = (iso) => iso
    ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : '—';
  const fmtDuration = (a, b) => {
    if (!a) return '';
    const end = b ? new Date(b) : new Date();
    const ms = end - new Date(a);
    if (ms <= 0) return '';
    const mins = Math.floor(ms / 60000);
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  };

  async function loadStaffData(tenantId) {
    const sb = window.NextSession?.sb;
    if (!sb) return { error: 'No session' };

    const today = isoDate();

    // Teachers
    const { data: teachers } = await sb
      .from('teachers')
      .select('id, full_name, email, subjects, status')
      .eq('tenant_id', tenantId)
      .order('full_name', { ascending: true });

    // Today's check-ins (latest per teacher)
    const { data: checkins } = await sb
      .from('teacher_checkins')
      .select('id, teacher_id, checked_in_at, checked_out_at, method')
      .eq('tenant_id', tenantId)
      .gte('checked_in_at', today + 'T00:00:00')
      .order('checked_in_at', { ascending: false });

    // Today's roll call records (count per teacher)
    const { data: rollCalls } = await sb
      .from('student_roll_call')
      .select('id, teacher_id, stream, status')
      .eq('tenant_id', tenantId)
      .eq('roll_date', today);

    // Recent health records (last 7 days, per teacher_id)
    const sevenDaysAgo = new Date(Date.now() - 7 * 86400000).toISOString();
    const { data: healthRecs } = await sb
      .from('student_health_records')
      .select('id, recorded_by_teacher_id, recorded_at, follow_up_needed, resolved_at')
      .eq('tenant_id', tenantId)
      .gte('recorded_at', sevenDaysAgo);

    return {
      teachers: teachers || [],
      checkins: checkins || [],
      rollCalls: rollCalls || [],
      healthRecs: healthRecs || [],
    };
  }

  function StaffStatusPill({ status }) {
    const styles = {
      in:   { bg: 'rgba(0,252,143,0.14)',  fg: T.green, dot: T.green, label: 'ON CAMPUS' },
      out:  { bg: 'rgba(255,180,0,0.14)',  fg: T.gold,  dot: T.gold,  label: 'LEFT FOR THE DAY' },
      absent:{ bg: 'rgba(255,255,255,0.06)', fg: T.ink3, dot: T.ink3,  label: 'NOT CHECKED IN' },
    }[status];
    return (
      <span style={{
        display: 'inline-flex', alignItems: 'center', gap: 6,
        background: styles.bg, color: styles.fg,
        padding: '4px 10px', borderRadius: 999,
        fontSize: 10.5, fontFamily: T.mono, fontWeight: 700, letterSpacing: 0.6,
      }}>
        <span style={{
          width: 7, height: 7, borderRadius: 999, background: styles.dot,
          boxShadow: status === 'in' ? '0 0 8px ' + T.green : 'none',
        }} />
        {styles.label}
      </span>
    );
  }

  function HeadStaffPanel({ onNav }) {
    const profile = window.PEAK_ROLE ? window.PEAK_ROLE.getProfile() : { tenantId: 'peak-primary' };
    const [data, setData] = useState({ loading: true });

    const refresh = useCallback(async () => {
      setData(d => ({ ...d, loading: true }));
      const r = await loadStaffData(profile.tenantId);
      setData(Object.assign({}, r, { loading: false }));
    }, [profile.tenantId]);

    useEffect(() => {
      refresh();
      const id = setInterval(refresh, 30000); // poll every 30s — live feel
      return () => clearInterval(id);
    }, [refresh]);

    const enriched = useMemo(() => {
      if (!data.teachers) return [];
      const checkinsByTeacher = {};
      (data.checkins || []).forEach(c => {
        // Keep the most recent per teacher (already ordered desc)
        if (!checkinsByTeacher[c.teacher_id]) checkinsByTeacher[c.teacher_id] = c;
      });
      const rollByTeacher = {};
      (data.rollCalls || []).forEach(r => {
        if (!rollByTeacher[r.teacher_id]) rollByTeacher[r.teacher_id] = new Set();
        rollByTeacher[r.teacher_id].add(r.stream);
      });
      const healthByTeacher = {};
      (data.healthRecs || []).forEach(h => {
        if (!h.recorded_by_teacher_id) return;
        healthByTeacher[h.recorded_by_teacher_id] = (healthByTeacher[h.recorded_by_teacher_id] || 0) + 1;
      });
      return data.teachers.map(t => {
        const c = checkinsByTeacher[t.id];
        const status = !c ? 'absent' : (c.checked_out_at ? 'out' : 'in');
        return {
          ...t,
          status,
          checkin: c,
          streamsRolled: rollByTeacher[t.id] ? Array.from(rollByTeacher[t.id]) : [],
          healthCount: healthByTeacher[t.id] || 0,
        };
      });
    }, [data]);

    const stats = useMemo(() => {
      const total = enriched.length;
      const inNow = enriched.filter(e => e.status === 'in').length;
      const left = enriched.filter(e => e.status === 'out').length;
      const absent = enriched.filter(e => e.status === 'absent').length;
      return { total, inNow, left, absent };
    }, [enriched]);

    return (
      <div style={{
        minHeight: '100vh', background: T.bg, color: T.ink,
        fontFamily: T.font, padding: '32px 36px 60px',
      }}>
        {/* Header */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24, gap: 12, flexWrap: 'wrap' }}>
          <div>
            <div style={{ fontSize: 10.5, fontFamily: T.mono, letterSpacing: 1.5, color: T.ink3 }}>
              STAFF TODAY · {new Date().toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' })}
            </div>
            <h1 style={{
              fontSize: 32, fontWeight: 400, margin: '6px 0 0',
              fontFamily: T.serif, letterSpacing: '-0.01em',
            }}>Who's on campus right now</h1>
          </div>
          <button onClick={refresh} disabled={data.loading} style={{
            background: 'transparent', color: T.ink2,
            border: '1px solid ' + T.borderStr,
            padding: '8px 16px', borderRadius: 8,
            fontSize: 12, cursor: data.loading ? 'wait' : 'pointer', fontFamily: T.font,
          }}>{data.loading ? 'Refreshing…' : '↻ Refresh'}</button>
        </div>

        {/* Stat cards */}
        <div style={{
          display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))',
          gap: 14, marginBottom: 24,
        }}>
          {[
            { label: 'TOTAL TEACHERS', value: stats.total, color: T.ink },
            { label: 'ON CAMPUS NOW',  value: stats.inNow, color: T.green, glow: true },
            { label: 'LEFT FOR DAY',   value: stats.left,  color: T.gold },
            { label: 'NOT CHECKED IN', value: stats.absent,color: T.red },
          ].map((s, i) => (
            <div key={i} style={{
              background: T.surface,
              border: '1px solid ' + T.border,
              borderRadius: 12, padding: 18,
              position: 'relative',
            }}>
              <div style={{ fontSize: 10, fontFamily: T.mono, letterSpacing: 1.5, color: T.ink3, marginBottom: 6 }}>{s.label}</div>
              <div style={{
                fontSize: 34, fontWeight: 700, color: s.color, fontFamily: T.serif,
                textShadow: s.glow ? '0 0 24px rgba(0,252,143,0.4)' : 'none',
              }}>{s.value}</div>
            </div>
          ))}
        </div>

        {/* Staff list */}
        <div style={{
          background: T.surface, border: '1px solid ' + T.border,
          borderRadius: 14, overflow: 'hidden',
        }}>
          <div style={{
            padding: '14px 22px', borderBottom: '1px solid ' + T.border,
            display: 'flex', alignItems: 'center', gap: 10,
            fontSize: 11, fontFamily: T.mono, color: T.ink3, letterSpacing: 1.2,
          }}>
            STAFF DIRECTORY · {enriched.length} TEACHER{enriched.length === 1 ? '' : 'S'}
            <span style={{
              marginLeft: 'auto', fontSize: 10, color: T.ink4,
              display: 'flex', alignItems: 'center', gap: 6,
            }}>
              <span style={{
                width: 6, height: 6, borderRadius: 999, background: T.green,
                animation: 'pulse 2s infinite',
              }} />
              LIVE · UPDATES EVERY 30s
            </span>
          </div>

          {data.loading && enriched.length === 0 ? (
            <div style={{ padding: 48, textAlign: 'center', color: T.ink3, fontFamily: T.mono, fontSize: 11 }}>
              LOADING STAFF…
            </div>
          ) : enriched.length === 0 ? (
            <div style={{ padding: 48, textAlign: 'center', color: T.ink4, fontStyle: 'italic' }}>
              No teachers found for your tenant.
            </div>
          ) : enriched.map(t => (
            <div key={t.id} style={{
              padding: '16px 22px',
              borderBottom: '1px solid ' + T.border,
              display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap',
              background: t.status === 'in' ? 'rgba(0,252,143,0.025)' : 'transparent',
            }}>
              {/* Avatar */}
              <div style={{
                width: 42, height: 42, borderRadius: 999,
                background: t.status === 'in' ? T.green : t.status === 'out' ? T.gold : T.surface3,
                color: t.status === 'in' || t.status === 'out' ? T.bg : T.ink3,
                display: 'grid', placeItems: 'center',
                fontSize: 13, fontWeight: 700, flexShrink: 0,
                boxShadow: t.status === 'in' ? '0 0 16px rgba(0,252,143,0.4)' : 'none',
              }}>{t.full_name.split(' ').map(n => n[0]).join('').slice(0, 2)}</div>

              {/* Name + subjects */}
              <div style={{ flex: 1, minWidth: 200 }}>
                <div style={{ fontSize: 15, fontWeight: 600, color: T.ink, marginBottom: 4 }}>{t.full_name}</div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 11, color: T.ink3, fontFamily: T.mono, flexWrap: 'wrap' }}>
                  <StaffStatusPill status={t.status} />
                  {t.subjects && t.subjects.length > 0 && (
                    <span style={{ letterSpacing: 0.4 }}>{t.subjects.join(' · ')}</span>
                  )}
                </div>
              </div>

              {/* Activity stats */}
              <div style={{ display: 'flex', gap: 18, fontSize: 11, color: T.ink3, fontFamily: T.mono }}>
                {t.checkin && (
                  <div>
                    <div style={{ color: T.ink4, fontSize: 9.5, letterSpacing: 0.8 }}>CHECK IN</div>
                    <div style={{ color: t.status === 'in' ? T.green : T.ink2, fontWeight: 700 }}>{fmtTime(t.checkin.checked_in_at)}</div>
                  </div>
                )}
                {t.checkin && t.checkin.checked_out_at && (
                  <div>
                    <div style={{ color: T.ink4, fontSize: 9.5, letterSpacing: 0.8 }}>CHECK OUT</div>
                    <div style={{ color: T.gold, fontWeight: 700 }}>{fmtTime(t.checkin.checked_out_at)}</div>
                  </div>
                )}
                {t.checkin && (
                  <div>
                    <div style={{ color: T.ink4, fontSize: 9.5, letterSpacing: 0.8 }}>{t.status === 'in' ? 'SO FAR' : 'TIME'}</div>
                    <div style={{ color: T.ink2, fontWeight: 700 }}>

            </div>
          ))}
        </div>

        <style>{`
          @keyframes pulse {

          }
        `}</style>
      </div>
    );
  }

  window.HeadStaffPanel = HeadStaffPanel;
})();

  <script type="text/babel" data-src="head-timetable-panel.jsx">
/* head-timetable-panel.jsx
   Sarah's digital timetable — color-coded by live activity.

   Pulls today's slots + cross-references with teacher_checkins and
   student_roll_call. Each cell gets a status:

     GREEN  — slot has happened or is happening, roll call taken
     ORANGE — slot is now or next, teacher checked in, roll not yet taken
     RED    — slot is past/now, teacher not checked in or roll not taken
     GRAY   — unassigned slot (no teacher), or out-of-school time

   Polls every 30s for live updates.

   Exposed as window.HeadTimetablePanel.
*/
(function () {
  const { useState, useEffect, useMemo, useCallback } = React;

  const T = {
    bg:       (typeof window!=='undefined'&&window.__BG)||'#0a1029',
    surface:  (typeof window!=='undefined'&&window.__SURFACE)||'#141e3c',
    surface2: (typeof window!=='undefined'&&window.__SURFACE2)||'#1a2548',
    surface3: (typeof window!=='undefined'&&window.__SURFACE3)||'#212d56',
    border:   'rgba(255,255,255,0.06)',
    borderStr:'rgba(255,255,255,0.10)',
    ink:      '#f5f6fa',
    ink2:     'rgba(245,246,250,0.85)',
    ink3:     'rgba(245,246,250,0.55)',
    ink4:     'rgba(245,246,250,0.40)',
    red:      '#FF4757',
    green:    (typeof window!=='undefined'&&window.__ACCENT)||'#00FC8F',
    gold:     '#FFB400',
    blue:     '#3B82F6',
    font:     "'Inter', -apple-system, system-ui, sans-serif",
    mono:     "'JetBrains Mono', ui-monospace, monospace",
    serif:    "'Instrument Serif', serif",
  };

  const isoDate = () => new Date().toISOString().slice(0, 10);
  // Postgres day_of_week: 1=Mon, 7=Sun. JS getDay: 0=Sun, 6=Sat. Map.
  const todayDow = () => {
    const js = new Date().getDay();
    return js === 0 ? 7 : js;
  };
  const fmtTime = (t) => {
    // t is "HH:MM:SS" string
    if (!t) return '';
    return t.slice(0, 5);
  };
  const STREAMS = ['P1V','P1P','P2V','P2P','P3V','P3P','P4V','P4P','P5V','P5P','P6V','P6P','P7V','P7P'];

  async function loadTimetable(tenantId) {
    const sb = window.NextSession?.sb;
    if (!sb) return { error: 'No session' };
    const today = isoDate();
    const dow = todayDow();

    // Today's slots, joined with teacher name
    const { data: slots } = await sb
      .from('timetable_slots')
      .select('id, period, start_time, end_time, stream, subject, teacher_id, label')
      .eq('tenant_id', tenantId)
      .eq('day_of_week', dow)
      .order('period', { ascending: true });

    const { data: teachers } = await sb
      .from('teachers')
      .select('id, full_name')
      .eq('tenant_id', tenantId);

    // Today's check-ins (latest per teacher)
    const { data: checkins } = await sb
      .from('teacher_checkins')
      .select('teacher_id, checked_in_at, checked_out_at')
      .eq('tenant_id', tenantId)
      .gte('checked_in_at', today + 'T00:00:00');

    // Today's roll call records
    const { data: rollCalls } = await sb
      .from('student_roll_call')
      .select('teacher_id, stream')
      .eq('tenant_id', tenantId)
      .eq('roll_date', today);

    return {
      slots: slots || [],
      teachers: teachers || [],
      checkins: checkins || [],
      rollCalls: rollCalls || [],
    };
  }

  // Compute slot status given current time + activity
  function computeSlotStatus(slot, ctx) {
    const { now, checkinByTeacher, rollDoneFor } = ctx;

    // Unassigned slot → gray
    if (!slot.teacher_id) return { status: 'free', label: 'UNASSIGNED' };

    // Parse slot times into today's date for comparison
    const [sh, sm] = slot.start_time.split(':').map(Number);
    const [eh, em] = slot.end_time.split(':').map(Number);
    const start = new Date(now); start.setHours(sh, sm, 0, 0);
    const end   = new Date(now); end.setHours(eh, em, 0, 0);

    const teacherIn = checkinByTeacher[slot.teacher_id];
    const rollKey = slot.teacher_id + '|' + slot.stream;
    const rollTaken = rollDoneFor[rollKey];

    const isCurrent  = now >= start && now < end;
    const isPast     = now >= end;
    const isFuture   = now < start;

    if (rollTaken) {
      // Roll has been taken — green regardless of time
      return { status: 'green', label: isCurrent ? 'IN SESSION' : 'DONE' };
    }

    if (isFuture) {
      // Pending — assigned class scheduled later today
      return { status: 'orange', label: 'PENDING' };
    }

    if (isCurrent) {
      if (!teacherIn) return { status: 'red', label: 'TEACHER NOT IN' };
      // Teacher checked in, but no roll yet
      return { status: 'orange', label: 'NO ROLL YET' };
    }

    // Past
    if (!teacherIn)  return { status: 'red', label: 'MISSED · NO TEACHER' };
    return { status: 'red', label: 'MISSED · NO ROLL' };
  }

  const STATUS_TOKENS = {
    green:  { bg: 'rgba(0,252,143,0.16)',  border: 'rgba(0,252,143,0.4)',  fg: '#00FC8F', glow: '0 0 12px rgba(0,252,143,0.25)' },
    orange: { bg: 'rgba(255,180,0,0.16)',  border: 'rgba(255,180,0,0.4)',  fg: '#FFB400', glow: 'none' },
    red:    { bg: 'rgba(255,71,87,0.16)',  border: 'rgba(255,71,87,0.4)',  fg: '#FF4757', glow: '0 0 12px rgba(255,71,87,0.2)' },
    free:   { bg: 'rgba(255,255,255,0.02)', border: 'rgba(255,255,255,0.06)', fg: 'rgba(245,246,250,0.30)', glow: 'none' },
    gray:   { bg: 'rgba(59,130,246,0.08)', border: 'rgba(59,130,246,0.20)', fg: 'rgba(245,246,250,0.55)', glow: 'none' },
  };

  function HeadTimetablePanel() {
    const profile = window.PEAK_ROLE ? window.PEAK_ROLE.getProfile() : { tenantId: 'peak-primary' };
    const [data, setData] = useState({ loading: true });
    const [now, setNow] = useState(new Date());

    const refresh = useCallback(async () => {
      setData(d => ({ ...d, loading: true }));
      const r = await loadTimetable(profile.tenantId);
      setData(Object.assign({}, r, { loading: false }));
    }, [profile.tenantId]);

    useEffect(() => {
      refresh();
      const dataPoll = setInterval(refresh, 30000); // live data every 30s
      const clockTick = setInterval(() => setNow(new Date()), 60000); // tick minute
      return () => { clearInterval(dataPoll); clearInterval(clockTick); };
    }, [refresh]);

    // Build context for status compute
    const ctx = useMemo(() => {
      const checkinByTeacher = {};
      (data.checkins || []).forEach(c => {
        // Teacher is "in" if checked in AND not checked out
        if (!checkinByTeacher[c.teacher_id] || !c.checked_out_at) {
          checkinByTeacher[c.teacher_id] = !c.checked_out_at;
        }
      });
      const rollDoneFor = {};
      (data.rollCalls || []).forEach(r => {
        rollDoneFor[r.teacher_id + '|' + r.stream] = true;
      });
      const teacherById = {};
      (data.teachers || []).forEach(t => { teacherById[t.id] = t.full_name; });
      return { now, checkinByTeacher, rollDoneFor, teacherById };
    }, [data, now]);

    // Build matrix: periods (rows) × streams (cols)
    const matrix = useMemo(() => {
      const byPeriod = {};
      (data.slots || []).forEach(s => {
        if (!byPeriod[s.period]) byPeriod[s.period] = { period: s.period, start_time: s.start_time, end_time: s.end_time, slots: {} };
        byPeriod[s.period].slots[s.stream] = s;
      });
      return Object.values(byPeriod).sort((a, b) => a.period - b.period);
    }, [data]);

    // Stats across all of today's slots
    const stats = useMemo(() => {
      const c = { green: 0, orange: 0, red: 0, free: 0, gray: 0 };
      (data.slots || []).forEach(s => {
        const st = computeSlotStatus(s, ctx);
        c[st.status] = (c[st.status] || 0) + 1;
      });
      return c;
    }, [data, ctx]);

    return (
      <div style={{
        minHeight: '100vh', background: T.bg, color: T.ink,
        fontFamily: T.font, padding: '32px 36px 60px',
      }}>
        {/* Header */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24, gap: 12, flexWrap: 'wrap' }}>
          <div>
            <div style={{ fontSize: 10.5, fontFamily: T.mono, letterSpacing: 1.5, color: T.ink3 }}>
              TIMETABLE · {now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' })} · {now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
            </div>
            <h1 style={{
              fontSize: 32, fontWeight: 400, margin: '6px 0 0',
              fontFamily: T.serif, letterSpacing: '-0.01em',
            }}>Today's classes — live</h1>
          </div>
          <button onClick={refresh} disabled={data.loading} style={{
            background: 'transparent', color: T.ink2,
            border: '1px solid ' + T.borderStr,
            padding: '8px 16px', borderRadius: 8,
            fontSize: 12, cursor: data.loading ? 'wait' : 'pointer', fontFamily: T.font,
          }}>{data.loading ? 'Refreshing…' : '↻ Refresh'}</button>
        </div>

        {/* Legend + stats */}
        <div style={{
          display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))',
          gap: 12, marginBottom: 24,
        }}>
          {[
            { key: 'green',  label: 'IN SESSION / DONE', count: stats.green },
            { key: 'orange', label: 'PENDING / IN PROGRESS', count: stats.orange },
            { key: 'red',    label: 'NEEDS ATTENTION',   count: stats.red },
            { key: 'free',   label: 'OPEN SLOTS',        count: stats.free },
          ].map(s => {
            const tk = STATUS_TOKENS[s.key];
            return (
              <div key={s.key} style={{
                background: tk.bg, border: '1px solid ' + tk.border,
                borderRadius: 12, padding: 14,
                display: 'flex', alignItems: 'center', gap: 12,
              }}>
                <div style={{
                  width: 10, height: 10, borderRadius: 999, background: tk.fg,
                  boxShadow: tk.glow,
                }} />
                <div>
                  <div style={{ fontSize: 9.5, fontFamily: T.mono, letterSpacing: 1, color: T.ink3 }}>{s.label}</div>
                  <div style={{ fontSize: 22, fontWeight: 700, color: tk.fg, fontFamily: T.serif }}>{s.count}</div>
                </div>
              </div>
            );
          })}
        </div>

        {/* The grid */}
        {data.loading && matrix.length === 0 ? (
          <div style={{ padding: 48, textAlign: 'center', color: T.ink3, fontFamily: T.mono, fontSize: 11 }}>
            LOADING TIMETABLE…
          </div>
        ) : matrix.length === 0 ? (
          <div style={{
            padding: 48, textAlign: 'center', color: T.ink4, fontStyle: 'italic',
            background: T.surface, border: '1px solid ' + T.border, borderRadius: 12,
          }}>
            No timetable seeded yet. Run the timetable schema SQL to populate today's slots.
          </div>
        ) : (
          <div style={{
            background: T.surface, border: '1px solid ' + T.border,
            borderRadius: 12, overflow: 'auto',
          }}>
            <table style={{
              width: '100%', borderCollapse: 'separate', borderSpacing: 0,
              minWidth: 1100,
            }}>
              <thead>
                <tr>
                  <th style={{
                    position: 'sticky', left: 0, zIndex: 2,
                    padding: '14px 12px', background: T.surface2,
                    fontSize: 10, fontFamily: T.mono, letterSpacing: 1.2,
                    color: T.ink3, textAlign: 'left', width: 110,
                    borderBottom: '1px solid ' + T.border,
                  }}>PERIOD</th>
                  {STREAMS.map(s => (
                    <th key={s} style={{
                      padding: '14px 6px', background: T.surface2,
                      fontSize: 10.5, fontFamily: T.mono, letterSpacing: 1,
                      color: T.ink3, fontWeight: 700,
                      borderBottom: '1px solid ' + T.border,
                      borderLeft: '1px solid ' + T.border,
                      minWidth: 64,
                    }}>{s}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {matrix.map(row => {
                  // Is this period current?
                  const [sh, sm] = row.start_time.split(':').map(Number);
                  const [eh, em] = row.end_time.split(':').map(Number);
                  const start = new Date(now); start.setHours(sh, sm, 0, 0);
                  const end   = new Date(now); end.setHours(eh, em, 0, 0);
                  const isCurrent = now >= start && now < end;
                  return (
                    <tr key={row.period}>
                      <td style={{
                        position: 'sticky', left: 0, zIndex: 1,
                        padding: '10px 12px', background: isCurrent ? 'rgba(0,252,143,0.06)' : T.surface,
                        borderBottom: '1px solid ' + T.border,
                        fontSize: 12,
                      }}>
                        <div style={{ fontWeight: 700, color: isCurrent ? T.green : T.ink }}>
                          P{row.period}
                          {isCurrent && <span style={{ marginLeft: 6, fontSize: 9, color: T.green, fontFamily: T.mono }}>● NOW</span>}
                        </div>
                        <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, marginTop: 2 }}>
                          {fmtTime(row.start_time)}–{fmtTime(row.end_time)}
                        </div>
                      </td>
                      {STREAMS.map(stream => {
                        const slot = row.slots[stream];
                        if (!slot) {
                          // No slot defined → free
                          const tk = STATUS_TOKENS.free;
                          return (
                            <td key={stream} style={{
                              padding: 4, borderBottom: '1px solid ' + T.border, borderLeft: '1px solid ' + T.border,
                              verticalAlign: 'top',
                            }}>
                              <div style={{
                                background: tk.bg, border: '1px solid ' + tk.border,
                                borderRadius: 6, padding: '8px 6px', textAlign: 'center',
                                color: tk.fg, fontSize: 9, fontFamily: T.mono, letterSpacing: 0.4,
                                minHeight: 50,
                              }}>—</div>
                            </td>
                          );
                        }
                        const st = computeSlotStatus(slot, ctx);
                        const tk = STATUS_TOKENS[st.status];
                        const teacherName = slot.teacher_id ? ctx.teacherById[slot.teacher_id] : null;
                        return (
                          <td key={stream} style={{
                            padding: 4, borderBottom: '1px solid ' + T.border, borderLeft: '1px solid ' + T.border,
                            verticalAlign: 'top',
                          }}>
                            <div
                              title={teacherName ? `${slot.subject} · ${teacherName}` : slot.subject}
                              style={{
                                background: tk.bg,
                                border: '1px solid ' + tk.border,
                                borderRadius: 6, padding: '8px 6px',
                                boxShadow: tk.glow,
                                minHeight: 50,
                              }}
                            >
                              <div style={{
                                fontSize: 10.5, fontWeight: 700, color: tk.fg,
                                fontFamily: T.mono, letterSpacing: 0.5,
                                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                              }}>{slot.subject.slice(0, 7).toUpperCase()}</div>
                              {teacherName && (
                                <div style={{
                                  fontSize: 9.5, color: T.ink3, marginTop: 2,
                                  whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',

                              )}
                              <div style={{
                                fontSize: 8.5, fontFamily: T.mono, color: tk.fg,
                                marginTop: 2, letterSpacing: 0.3,
                              }}>{st.label}</div>
                            </div>
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        <div style={{
          marginTop: 16, fontSize: 10.5, fontFamily: T.mono, color: T.ink4,
          textAlign: 'right', letterSpacing: 0.6,
        }}>LIVE · UPDATES EVERY 30s · CLOCK TICKS EVERY MINUTE</div>
      </div>
    );
  }

  window.HeadTimetablePanel = HeadTimetablePanel;
})();

              borderTop: i ? '1px solid ' + T.border : 'none',
            }}>
              <div>
                <div style={{ fontSize: 13, color: T.ink, fontWeight: 500 }}>{p.who}</div>
                <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, marginTop: 2 }}>{p.d} · {p.ref}{p.note ? ' · ' + p.note : ''}</div>
              </div>
              <div style={{ fontSize: 13.5, fontFamily: T.mono, fontWeight: 600, color: T.good }}>+{D.fmtUGXshort(p.amt)}</div>
            </div>
          ))}
        </div>
      </Phone>
    );
  }

  return { ParentHome, TeacherAI, ParentFees };
})();

  <script type="text/babel" data-src="src/peak-screens.jsx">
/* src/peak-screens.jsx */
/* global React, V4, PEAK */
// Peak Primary · Additional screens
// Attendance · Teachers · Transport · Learning · Reports

window.PEAK_SCREENS = (function () {
  const { useState, useMemo } = React;
  const T = window.V4.T;
  const D = window.PEAK;

  // ─── Shared atoms ─────────────────────────────────────────────────────────
  function Pill({ children, tone = 'neutral' }) {
    const map = {
      neutral: { bg: T.surface2, fg: T.ink2 },
      good:    { bg: T.goodSft,  fg: T.good },
      warn:    { bg: T.warnSft,  fg: T.warn },
      bad:     { bg: T.redSft,   fg: T.redInk },
      brand:   { bg: 'rgba(58,79,156,0.30)', fg: '#a8b4e8' },
      gold:    { bg: 'rgba(232,200,122,0.18)', fg: T.gold },
    }[tone] || { bg: T.surface2, fg: T.ink2 };
    return (
      <span style={{
        display: 'inline-flex', alignItems: 'center', gap: 6,
        padding: '3px 9px', borderRadius: 999, fontSize: 11, fontWeight: 600,
        background: map.bg, color: map.fg, whiteSpace: 'nowrap', fontFamily: T.mono,
      }}>{children}</span>
    );
  }

  function PageHeader({ eyebrow, title, subtitle, actions }) {
    return (
      <header style={{
        padding: '22px 28px 18px', borderBottom: '1px solid ' + T.border,
        display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between',
        background: T.bg,
      }}>
        <div>
          <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', textTransform: 'uppercase', fontWeight: 600, marginBottom: 8 }}>{eyebrow}</div>
          <div style={{ fontSize: 26, fontWeight: 700, color: T.ink, letterSpacing: '-0.02em', lineHeight: 1.05 }}>{title}</div>
