name: Deploy site to Hostinger (FTPS)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'NEXT OS.html'
      - 'client-form.html'
      - 'os-data.jsx'
      - 'os-notify.jsx'
      - 'os-comms.jsx'
      - 'os-childcare.jsx'
      - 'school-onboarding.html'
  workflow_dispatch:

jobs:
  ftps-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Assemble site files
        run: |
          mkdir -p deploy-site
          cp -a web/. deploy-site/
          cp -- 'NEXT OS.html' client-form.html os-data.jsx os-notify.jsx os-comms.jsx os-childcare.jsx school-onboarding.html deploy-site/

      - name: Upload web/ to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy-site/
          server-dir: ${{ secrets.FTP_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
