<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXT — Client Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'Inter', sans-serif; background: #060012; color: #fff; min-height: 100vh; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 16px 60px; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

    .brand {
      display: flex; align-items: center; gap: 10; margin-bottom: 40px;
      font-family: 'Big Shoulders Display', sans-serif; font-size: 22px; font-weight: 800;
      color: #00FC8F; letter-spacing: 0.06em;
    }
    .brand span { color: rgba(255,255,255,0.5); font-size: 14px; font-family: 'Inter', sans-serif; font-weight: 400; margin-left: 8px; }

    .card {
      background: #1A0042; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; width: 100%; max-width: 560px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }
    .card-header {
      padding: 32px 32px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .form-title {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 26px; font-weight: 800; color: #fff; line-height: 1.2; margin-bottom: 10px;
    }
    .form-desc {
      font-size: 14px; color: rgba(255,255,255,0.55); line-height: 1.6;
    }
    .card-body { padding: 28px 32px; }

    .field-group { margin-bottom: 22px; }
    .field-label {
      display: block; font-size: 12px; font-weight: 600;
      color: rgba(255,255,255,0.5); text-transform: uppercase;
      letter-spacing: 0.07em; margin-bottom: 8px;
    }
    .field-label.required::after {
      content: ' *'; color: #FF4757;
    }
    .field-input, .field-select, .field-textarea {
      width: 100%; background: #220055;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 12px 16px;
      color: #fff; font-family: 'Inter', sans-serif; font-size: 14px;
      outline: none; transition: border-color 0.15s;
    }
    .field-input:focus, .field-select:focus, .field-textarea:focus {
      border-color: rgba(0,252,143,0.4);
      box-shadow: 0 0 0 3px rgba(0,252,143,0.08);
    }
    .field-input::placeholder, .field-textarea::placeholder { color: rgba(255,255,255,0.25); }
    .field-textarea { min-height: 100px; resize: vertical; }
    .field-select { appearance: none; cursor: pointer; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='rgba(255,255,255,0.4)' d='M0 0h12L6 8z'/></svg>"); background-repeat: no-repeat; background-position: right 14px center; padding-right: 36px; }
    .field-select option { background: #1A0042; }

    .radio-group { display: flex; flex-direction: column; gap: 10px; }
    .radio-option {
      display: flex; align-items: center; gap: 12;
      background: #220055; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 12px 16px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .radio-option:hover { border-color: rgba(0,252,143,0.3); background: rgba(0,252,143,0.04); }
    .radio-option input { accent-color: #00FC8F; width: 16px; height: 16px; cursor: pointer; }
    .radio-option label { font-size: 14px; color: rgba(255,255,255,0.85); cursor: pointer; }

    .submit-btn {
      width: 100%; background: #00FC8F; color: #060012;
      font-family: 'Inter', sans-serif; font-weight: 700;
      font-size: 15px; border: none; border-radius: 12px;
      padding: 15px; cursor: pointer; margin-top: 8px;
      transition: background 0.15s, transform 0.1s;
    }
    .submit-btn:hover { background: #00CC70; }
    .submit-btn:active { transform: scale(0.99); }
    .submit-btn:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; }

    .error-msg { font-size: 12px; color: #FF4757; margin-top: 5px; }

    .success-state {
      text-align: center; padding: 48px 32px;
    }
    .success-icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(0,252,143,0.12); border: 2px solid rgba(0,252,143,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; margin: 0 auto 24px;
    }
    .success-title {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 26px; font-weight: 800; margin-bottom: 12px;
    }
    .success-sub { font-size: 14px; color: rgba(255,255,255,0.55); line-height: 1.6; }

    .error-state {
      text-align: center; padding: 60px 32px; color: rgba(255,255,255,0.5); font-size: 15px;
    }

    .powered {
      margin-top: 32px; font-size: 12px; color: rgba(255,255,255,0.2);
      font-family: 'DM Mono', monospace; text-align: center;
    }
    .powered a { color: rgba(0,252,143,0.5); text-decoration: none; }
  </style>
</head>
<body>

  <div class="brand">NEXT <span>Client Form</span></div>

  <div class="card" id="app">
    <div style="padding:48px;text-align:center;color:rgba(255,255,255,0.4);font-size:14px;">
      Loading form…
    </div>
  </div>

  <div class="powered">Powered by <a href="https://nextafrica.ai" target="_blank">NEXT Africa</a></div>

  <script>
    const SUPABASE_URL = 'https://llxhvqkkgftqwefmrofn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_wrzbFpPrkhoN4w2KXdUAdw_gnqEQVs9';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let form = null;
    const app = document.getElementById('app');
    const urlParams = new URLSearchParams(window.location.search);
    const formId = urlParams.get('id');

    async function init() {
      if (!formId) {
        showError("Invalid link. Missing form ID.");
        return;
      }

      const { data, error } = await supabase.from('os_forms').select('*').eq('id', formId).single();
      
      if (error || !data) {
        showError("Form not found or has been removed.");
        return;
      }
      
      if (data.status === 'closed') {
        showError("This form is currently closed and not accepting responses.");
        return;
      }

      form = data;
      renderForm();
    }

    function showError(msg) {
      app.innerHTML = '<div class="error-state"><div style="font-size:40px;margin-bottom:16px;">??</div>' + msg + '</div>';
    }

    function renderForm() {
      let html = '<div class="card-header">';
      html += '<div class="form-title">' + escapeHTML(form.title) + '</div>';
      if (form.description) {
        html += '<div class="form-desc">' + escapeHTML(form.description).replace(/\n/g, '<br>') + '</div>';
      }
      html += '</div>';

      html += '<div class="card-body"><form id="main-form">';

      form.fields.forEach(f => {
        const reqStr = f.required ? 'required' : '';
        const reqClass = f.required ? 'required' : '';
        html += '<div class="field-group">';
        html += '<label class="field-label ' + reqClass + '" for="' + f.id + '">' + escapeHTML(f.label) + '</label>';

        if (f.type === 'textarea') {
          html += '<textarea id="' + f.id + '" name="' + f.id + '" class="field-textarea" placeholder="' + escapeHTML(f.placeholder || '') + '" ' + reqStr + '></textarea>';
        }
        else if (f.type === 'select') {
          html += '<select id="' + f.id + '" name="' + f.id + '" class="field-select" ' + reqStr + '>';
          html += '<option value="" disabled selected>' + escapeHTML(f.placeholder || 'Select an option') + '</option>';
          (f.options || []).forEach(o => {
            if (o.trim()) html += '<option value="' + escapeHTML(o) + '">' + escapeHTML(o) + '</option>';
          });
          html += '</select>';
        }
        else if (f.type === 'radio') {
          html += '<div class="radio-group">';
          (f.options || []).forEach((o, i) => {
            if (o.trim()) {
              const rId = f.id + '-' + i;
              html += '<div class="radio-option" onclick="document.getElementById(\'' + rId + '\').click()">';
              html += '<input type="radio" id="' + rId + '" name="' + f.id + '" value="' + escapeHTML(o) + '" ' + reqStr + '>';
              html += '<label for="' + rId + '">' + escapeHTML(o) + '</label>';
              html += '</div>';
            }
          });
          html += '</div>';
        }
        else {
          let inputType = f.type === 'number' || f.type === 'email' || f.type === 'tel' || f.type === 'date' ? f.type : 'text';
          html += '<input type="' + inputType + '" id="' + f.id + '" name="' + f.id + '" class="field-input" placeholder="' + escapeHTML(f.placeholder || '') + '" ' + reqStr + '>';
        }
        html += '<div class="error-msg" id="err-' + f.id + '"></div>';
        html += '</div>';
      });

      html += '<button type="submit" class="submit-btn" id="submit-btn">Submit Response</button>';
      html += '</form></div>';
      
      app.innerHTML = html;

      document.getElementById('main-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerText = 'Submitting...';

        // Clear old errors
        form.fields.forEach(f => {
          document.getElementById('err-' + f.id).innerText = '';
        });

        const formData = new FormData(e.target);
        const answers = {};
        
        for (const f of form.fields) {
          answers[f.id] = formData.get(f.id) || '';
        }

        const { error } = await supabase.from('os_form_responses').insert({
          form_id: form.id,
          answers: answers
        });

        if (error) {
          btn.disabled = false;
          btn.innerText = 'Submit Response';
          showError("There was an error saving your response: " + error.message);
          return;
        }

        showSuccess();
      });
    }

    function showSuccess() {
      app.innerHTML = '<div class="success-state">' +
        '<div class="success-icon">?</div>' +
        '<div class="success-title">Received!</div>' +
        '<div class="success-sub">Your response has been securely sent. You may now close this window.</div>' +
      '</div>';
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    }

    init();
  </script>
</body>
</html>
