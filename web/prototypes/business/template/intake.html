<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Charis Creations — Client Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0D1B2A;
  --card: #1B2838;
  --card2: #243447;
  --border: #2D3F52;
  --orange: #F16623;
  --orange-dim: #F1662333;
  --text: #F1F5F9;
  --muted: #94A3B8;
  --dim: #64748B;
  --green: #10B981;
  --red: #EF4444;
  --amber: #F59E0B;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Montserrat', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 560px; margin: 0 auto; padding: 0 16px 80px; }

/* Header */
.header {
  text-align: center;
  padding: 32px 16px 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
.logo-text { font-size: 13px; font-weight: 900; letter-spacing: 3px; color: var(--orange); margin-bottom: 4px; }
.tagline { font-size: 10px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
.form-title { font-size: 20px; font-weight: 900; margin-top: 16px; }
.form-sub { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.project-badge {
  display: inline-block;
  background: var(--orange-dim);
  color: var(--orange);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
  margin-top: 10px;
}

/* Progress bar */
.progress-bar {
  display: flex;
  gap: 4px;
  padding: 0 4px;
  margin-bottom: 24px;
}
.progress-step {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  transition: background 0.3s;
}
.progress-step.done { background: var(--green); }
.progress-step.active { background: var(--orange); }

/* Steps */
.step { display: none; animation: fadeIn 0.3s ease; }
.step.active { display: block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

.step-header {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 4px;
}
.step-desc {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 20px;
  line-height: 1.5;
}

/* Form elements */
.field { margin-bottom: 16px; }
.field-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.field-label .req { color: var(--orange); }
.field-input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 14px;
  color: var(--text);
  font-family: 'Montserrat', sans-serif;
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.field-input:focus { border-color: var(--orange); }
.field-input::placeholder { color: var(--dim); }
select.field-input { cursor: pointer; }
textarea.field-input { resize: vertical; min-height: 80px; }
.field-hint { font-size: 10px; color: var(--dim); margin-top: 4px; }

/* Row layout */
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 400px) { .row { grid-template-columns: 1fr; } }

/* Section divider */
.section-title {
  font-size: 12px;
  font-weight: 800;
  color: var(--orange);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin: 24px 0 14px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.section-title:first-child { border-top: none; margin-top: 0; padding-top: 0; }

/* Toggle (Yes/No) */
.toggle-group { display: flex; flex-direction: column; gap: 10px; }
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
}
.toggle-label { font-size: 13px; font-weight: 600; flex: 1; padding-right: 12px; }
.toggle-btns { display: flex; gap: 4px; flex-shrink: 0; }
.toggle-btn {
  padding: 6px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--dim);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Montserrat', sans-serif;
  transition: all 0.2s;
}
.toggle-btn.yes.sel { background: #10B98122; color: var(--green); border-color: #10B98144; }
.toggle-btn.no.sel { background: #EF444422; color: var(--red); border-color: #EF444444; }

/* Navigation */
.nav-bar {
  display: flex;
  gap: 10px;
  margin-top: 28px;
}
.btn {
  flex: 1;
  padding: 14px 20px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  font-family: 'Montserrat', sans-serif;
  transition: all 0.2s;
}
.btn-back {
  background: var(--card);
  color: var(--muted);
  border: 1px solid var(--border);
  flex: 0.4;
}
.btn-next {
  background: var(--orange);
  color: white;
}
.btn-next:active { transform: scale(0.98); }
.btn-submit {
  background: var(--green);
  color: white;
}

/* T&Cs */
.tcs-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  max-height: 200px;
  overflow-y: auto;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 16px;
}
.tcs-box h4 { color: var(--text); font-size: 12px; margin: 10px 0 4px; }
.tcs-box h4:first-child { margin-top: 0; }
.tc-check {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  cursor: pointer;
}
.tc-check input {
  width: 20px; height: 20px;
  accent-color: var(--orange);
  flex-shrink: 0;
  margin-top: 2px;
}
.tc-check-text { font-size: 12px; color: var(--muted); line-height: 1.5; }

/* Loading / Error / Success states */
.state-screen {
  text-align: center;
  padding: 80px 20px;
}
.state-icon { font-size: 48px; margin-bottom: 16px; }
.state-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
.state-desc { font-size: 13px; color: var(--muted); line-height: 1.6; }

/* Person row (emergency contacts, vendors) */
.person-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 10px;
}
.person-card .card-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--orange);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}

/* Conditional section visibility */
.cond { display: none; }
.cond.show { display: block; }
</style>
</head>
<body>

<div class="container" id="app">
  <!-- Loading state -->
  <div class="state-screen" id="loading-state">
    <div class="state-icon">⏳</div>
    <div class="state-title">Loading your form...</div>
    <div class="state-desc">Please wait while we prepare your client brief.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  'use strict';

  // ── CONFIG ───────────────────────────────────────────────
  var SUPA_URL  = 'https://vlmcwmjhmenbnymwfkdk.supabase.co';
  var SUPA_KEY  = 'sb_publishable_Q7wTRJK-hCy87Tfy7ROkeA_94Q9HQQw';
  var SB = window.supabase.createClient(SUPA_URL, SUPA_KEY);

  // ── STATE ────────────────────────────────────────────────
  var TOKEN = new URLSearchParams(window.location.search).get('token');
  var INFO = null;     // project info from DB
  var STEP = 0;        // current wizard step
  var DATA = {};       // form data collected so far
  var STEPS = [];      // step definitions (built after INFO loads)
  var SUBMITTED = false;
  var RESUMED = false; // true when we restored answers from a previous session (server draft or localStorage)

  // ── BOOT ─────────────────────────────────────────────────
  async function boot() {
    if (!TOKEN) {
      showError('No form link provided', 'This page requires a valid intake form link from Charis Creations. If you received a link, please try again or contact us on WhatsApp.');
      return;
    }

    try {
      var { data, error } = await SB.rpc('get_intake_info', { p_token: TOKEN });
      if (error) throw error;
      if (!data || !data.project_id) {
        showError('Form not found', 'This link may have expired or already been submitted. Please contact Charis Creations for a new link.');
        return;
      }
      if (data.intake_status === 'complete') {
        showSuccess();
        return;
      }

      INFO = data;
      buildSteps();

      // Restore progress — server draft first (works even on a new device or after
      // the browser cache was cleared), then localStorage on top (same-device
      // continuation, most recent field-level edits win). Neither call blocks the
      // form from opening if it fails — a fresh blank form is still a safe fallback.
      try {
        var draftRes = await SB.rpc('get_intake_draft', { p_token: TOKEN });
        if (draftRes && !draftRes.error && draftRes.data && typeof draftRes.data === 'object') {
          Object.keys(draftRes.data).forEach(function(k) {
            var v = draftRes.data[k];
            if (v !== null && v !== undefined && v !== '') { DATA[k] = v; RESUMED = true; }
          });
        }
      } catch (e) { console.warn('Could not load saved progress from server:', e); }
      if (loadSavedData()) RESUMED = true;

      renderForm();
    } catch (e) {
      console.error(e);
      showError('Connection error', 'Could not connect to the server. Please check your internet connection and try again.');
    }
  }

  // ── BUILD STEPS based on event type ──────────────────────
  function buildSteps() {
    var et = (INFO.event_type || '').toLowerCase();
    STEPS = [
      { id: 'core', title: 'Your Details', desc: 'Please confirm your contact information.', icon: '👤' }
    ];

    if (et.indexOf('kukyala') >= 0) {
      STEPS.push({ id: 'kuk_visit', title: 'The Visit', desc: 'Tell us about the day of the pre-visit.', icon: '🏡' });
      STEPS.push({ id: 'kuk_people', title: 'The People', desc: 'Who should we know before we arrive?', icon: '👥' });
      STEPS.push({ id: 'kuk_story', title: 'The Story', desc: 'Help us capture the visit the way you want it remembered.', icon: '🎬' });
      STEPS.push({ id: 'kuk_practical', title: 'Practical Details', desc: 'A few last things so the day runs smoothly.', icon: '📋' });
    } else if (et === 'wedding' || et === 'introduction') {
      STEPS.push({ id: 'party', title: et === 'introduction' ? 'Couple & Entourage' : 'Wedding Party', desc: 'Tell us about the key people on the day.', icon: '💍' });
      STEPS.push({ id: 'prep', title: 'Preparation', desc: 'Where will the bride and groom get ready?', icon: '👗' });
      STEPS.push({ id: 'ceremony', title: et === 'introduction' ? 'Introduction Ceremony' : 'Ceremony', desc: 'Details about the ceremony venue and programme.', icon: '⛪' });
      if (et === 'wedding') {
        STEPS.push({ id: 'photosession', title: 'Photo Session', desc: 'The couple photo/video session after ceremony.', icon: '📸' });
      }
      STEPS.push({ id: 'reception', title: 'Reception & Vendors', desc: 'Reception details and other vendors on the day.', icon: '🎉' });
    } else if (et === 'studio shoot') {
      STEPS.push({ id: 'studio', title: 'Session Details', desc: 'Help us prepare the studio for your shoot.', icon: '📸' });
    } else if (et.includes('corporate') || et.includes('conference') || et.includes('livestream')) {
      STEPS.push({ id: 'corporate', title: 'Event Details', desc: 'Tell us about the event and what you need.', icon: '🏢' });
    } else {
      // Generic event
      STEPS.push({ id: 'event', title: 'Event Details', desc: 'Tell us about your project.', icon: '📋' });
    }

    STEPS.push({ id: 'permissions', title: 'Social Media & Permissions', desc: 'Help us know how we can share your content.', icon: '📱' });
    STEPS.push({ id: 'final', title: 'Final Details', desc: 'Emergency contacts, notes, and terms.', icon: '✅' });
  }

  // ── RENDER ───────────────────────────────────────────────
  function renderForm() {
    var app = document.getElementById('app');
    var evType = INFO.event_type || 'Event';

    var html = '';
    // Header
    html += '<div class="header">';
    html += '<div class="logo-text">CHARIS CREATIONS</div>';
    html += '<div class="tagline">Bringing Image to Life</div>';
    html += '<div class="form-title">' + evType + ' Client Brief</div>';
    html += '<div class="form-sub">Please fill in the details below so our team can prepare perfectly for your special day.</div>';
    if (INFO.project_ref) html += '<div class="project-badge">' + INFO.project_ref + (INFO.event_date ? ' · ' + INFO.event_date.slice(0, 10) : '') + '</div>';
    html += '</div>';

    if (RESUMED) {
      html += '<div style="background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.35);border-radius:10px;padding:12px 14px;margin:0 0 18px 0;font-size:13px;color:#86efac;line-height:1.5;">👋 Welcome back — we\'ve restored what you already told us. Please review and continue where you left off.</div>';
    }

    // Progress
    html += '<div class="progress-bar">';
    for (var i = 0; i < STEPS.length; i++) {
      var cls = i < STEP ? 'done' : i === STEP ? 'active' : '';
      html += '<div class="progress-step ' + cls + '"></div>';
    }
    html += '</div>';

    // Steps
    for (var s = 0; s < STEPS.length; s++) {
      html += '<div class="step' + (s === STEP ? ' active' : '') + '" id="step-' + STEPS[s].id + '">';
      html += '<div class="step-header">' + STEPS[s].icon + ' ' + STEPS[s].title + '</div>';
      html += '<div class="step-desc">' + STEPS[s].desc + '</div>';
      html += renderStepContent(STEPS[s].id);
      html += renderNav(s);
      html += '</div>';
    }

    app.innerHTML = html;
    attachEvents();
  }

  // ── STEP CONTENT RENDERERS ───────────────────────────────
  function renderStepContent(id) {
    var et = (INFO.event_type || '').toLowerCase();
    switch (id) {
      case 'core': return renderCore();
      case 'kuk_visit': return renderKukyalaVisit();
      case 'kuk_people': return renderKukyalaPeople();
      case 'kuk_story': return renderKukyalaStory();
      case 'kuk_practical': return renderKukyalaPractical();
      case 'party': return renderParty(et);
      case 'prep': return renderPrep(et);
      case 'ceremony': return renderCeremony(et);
      case 'photosession': return renderPhotoSession();
      case 'reception': return renderReception(et);
      case 'studio': return renderStudio();
      case 'corporate': return renderCorporate();
      case 'event': return renderGenericEvent();
      case 'permissions': return renderPermissions();
      case 'final': return renderFinal();
      default: return '';
    }
  }

  function gd(key) { return DATA[key] || ''; }
  function gdb(key) { return DATA[key] === true ? true : DATA[key] === false ? false : null; }

  function inp(key, label, opts) {
    opts = opts || {};
    var type = opts.type || 'text';
    var ph = opts.placeholder || '';
    var hint = opts.hint || '';
    var req = opts.required ? ' <span class="req">*</span>' : '';
    var val = gd(key);
    var tag = type === 'textarea'
      ? '<textarea class="field-input" data-key="' + key + '" placeholder="' + ph + '">' + val + '</textarea>'
      : '<input class="field-input" type="' + type + '" data-key="' + key + '" value="' + val + '" placeholder="' + ph + '"/>';
    return '<div class="field">' +
      '<label class="field-label">' + label + req + '</label>' +
      tag +
      (hint ? '<div class="field-hint">' + hint + '</div>' : '') +
      '</div>';
  }

  function sel(key, label, options, opts) {
    opts = opts || {};
    var req = opts.required ? ' <span class="req">*</span>' : '';
    var val = gd(key);
    var optHtml = '<option value="">Select...</option>';
    options.forEach(function(o) {
      optHtml += '<option' + (val === o ? ' selected' : '') + '>' + o + '</option>';
    });
    return '<div class="field">' +
      '<label class="field-label">' + label + req + '</label>' +
      '<select class="field-input" data-key="' + key + '">' + optHtml + '</select>' +
      '</div>';
  }

  function toggle(key, label) {
    var val = gdb(key);
    return '<div class="toggle-row">' +
      '<div class="toggle-label">' + label + '</div>' +
      '<div class="toggle-btns">' +
        '<button class="toggle-btn yes' + (val === true ? ' sel' : '') + '" data-key="' + key + '" data-val="true">Yes</button>' +
        '<button class="toggle-btn no' + (val === false ? ' sel' : '') + '" data-key="' + key + '" data-val="false">No</button>' +
      '</div>' +
    '</div>';
  }

  function personCard(prefix, title, fields) {
    var h = '<div class="person-card"><div class="card-title">' + title + '</div>';
    h += '<div class="row">';
    fields.forEach(function(f) {
      h += inp(prefix + '_' + f.key, f.label, f.opts || {});
    });
    h += '</div></div>';
    return h;
  }

  // ── CORE ─────────────────────────────────────────────────
  function renderCore() {
    DATA.core_name = DATA.core_name || INFO.client_name || '';
    DATA.core_phone = DATA.core_phone || INFO.client_phone || '';
    DATA.core_email = DATA.core_email || INFO.client_email || '';
    DATA.core_location = DATA.core_location || INFO.location || '';
    DATA.core_date = DATA.core_date || (INFO.event_date ? INFO.event_date.slice(0,10) : '');

    return inp('core_name', 'Your Full Name', { required: true, placeholder: 'e.g. David Mugisha' }) +
      '<div class="row">' +
        inp('core_phone', 'Phone (WhatsApp)', { required: true, type: 'tel', placeholder: '+256 7XX XXX XXX' }) +
        inp('core_email', 'Email Address', { required: true, type: 'email', placeholder: 'your@email.com' }) +
      '</div>' +
      inp('core_location', 'Event / Shoot Location', { required: true, placeholder: 'Full address of main venue' }) +
      '<div class="row">' +
        inp('core_date', 'Event Date', { required: true, type: 'date' }) +
        inp('core_time', 'Event Start Time', { required: true, type: 'time', hint: 'What time should our crew arrive?' }) +
      '</div>' +
      sel('core_referral', 'How did you hear about us?', ['Instagram', 'WhatsApp', 'Facebook', 'TikTok', 'Website', 'Referral from a friend', 'Google', 'Walk-in', 'Repeat Client', 'Other']) +
      personCard('coord', 'Who Should Our Crew Contact on the Day?', [
        { key: 'name', label: 'Name', opts: { placeholder: 'e.g. Wedding planner, family member, coordinator' } },
        { key: 'phone', label: 'Phone', opts: { type: 'tel', placeholder: '+256...' } }
      ]) +
      '<div class="field-hint" style="font-size:10px;margin:-8px 0 12px 0;">This person will be our go-to if we need directions, schedule changes, or any help on the day.</div>';
  }

  // ── KUKYALA (PRE-VISIT) ──────────────────────────────────
  function renderKukyalaVisit() {
    return inp('kuk_ssenga_area', "Ssenga's Home — Area / Neighbourhood", { required: true, placeholder: 'e.g. Ntinda, Mukono' }) +
      inp('kuk_ssenga_pin', 'Map Pin / Directions Link', { placeholder: 'Google Maps link, or clear directions', hint: 'A map pin helps our crew arrive on time, every time' }) +
      inp('kuk_arrival_time', 'What time should our crew arrive?', { required: true, type: 'time' }) +
      '<div class="row">' +
        sel('kuk_guests_groom', "Expected Guests — Man's Side", ['Just him', '2–5', '6–10', '11–15', '15+']) +
        sel('kuk_guests_total', 'Expected Total Attendance', ['Under 10', '10–20', '20–30', '30–50', '50+']) +
      '</div>';
  }

  function renderKukyalaPeople() {
    return personCard('kuk_ssenga', "Ssenga (Paternal Auntie)", [
        { key: 'name', label: 'Name', opts: { required: true, placeholder: "Ssenga's full name" } },
        { key: 'phone', label: 'Phone', opts: { type: 'tel', placeholder: '+256...' } }
      ]) +
      personCard('kuk_spokesperson', 'Family Spokesperson (if any)', [
        { key: 'name', label: 'Name', opts: { placeholder: 'If someone will speak on behalf of the family' } },
        { key: 'phone', label: 'Phone', opts: { type: 'tel', placeholder: '+256...' } }
      ]) +
      '<div class="row">' +
        inp('kuk_woman_name', "Bride-to-be's Full Name", { required: true, placeholder: 'Full name' }) +
        inp('kuk_man_name', "Groom-to-be's Full Name", { required: true, placeholder: 'Full name' }) +
      '</div>' +
      '<div class="field-hint" style="margin:-6px 0 16px 0;">Your main contact for the day is already captured in Step 1 — no need to repeat it here.</div>';
  }

  function renderKukyalaStory() {
    return inp('kuk_flow', 'Brief Flow / Schedule of the Visit', { type: 'textarea', placeholder: 'e.g. Arrival & greeting, introductions, sharing a meal, informal conversation, departure', hint: 'A rough order of how the visit will unfold' }) +
      inp('kuk_must_capture', 'Must-Capture Moments', { type: 'textarea', placeholder: 'What moments MUST be captured? e.g. First greeting at the gate, the couple together, the Ssenga\'s blessing' }) +
      inp('kuk_do_not_film', 'Anyone or anything we should NOT film?', { type: 'textarea', placeholder: 'List names, moments, or private conversations to avoid', hint: 'For privacy or family reasons — we respect all requests' }) +
      inp('kuk_dress_code', 'Dress Code / Colours', { placeholder: 'e.g. Traditional wear, family colours, casual smart' });
  }

  function renderKukyalaPractical() {
    return inp('kuk_hm_vendor', 'Hair & Makeup Artist (if booked)', { placeholder: 'Name of your MUA, if you have one' }) +
      '<div class="field-hint" style="color:var(--orange);font-size:11px;margin:-6px 0 16px 0;">💡 Leave this blank and Charis Artistry — our in-house hair & makeup team — will reach out with a free camera-test trial.</div>' +
      '<div class="field-hint" style="margin-bottom:16px;">Parking, access notes, emergency contacts, and our Terms & Conditions are covered in the next steps.</div>';
  }

  // ── WEDDING PARTY ────────────────────────────────────────
  function renderParty(et) {
    var isIntro = et === 'introduction';
    // Init counts
    if (DATA.bm_count === undefined) DATA.bm_count = 2;
    if (DATA.gm_count === undefined) DATA.gm_count = 2;

    var h = '<div class="row">' +
      inp('party_bride', "Bride's Full Name", { required: true, placeholder: 'Full name' }) +
      inp('party_groom', "Groom's Full Name", { required: true, placeholder: 'Full name' }) +
    '</div>' +
    '<div class="row">' +

  // ── EVENTS ───────────────────────────────────────────────
  function attachEvents() {
    // Auto-save on input change
    document.querySelectorAll('.field-input').forEach(function(el) {
      el.addEventListener('input', function() {
        DATA[el.dataset.key] = el.value;
        autoSave();
      });
      el.addEventListener('change', function() {
        DATA[el.dataset.key] = el.value;
        autoSave();
        updateConditionals();
      });
    });

    // Toggle buttons
    document.querySelectorAll('.toggle-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var key = btn.dataset.key;
        var val = btn.dataset.val === 'true';
        DATA[key] = val;
        // Update UI
        var row = btn.closest('.toggle-row') || btn.closest('.toggle-btns');
        row.querySelectorAll('.toggle-btn').forEach(function(b) { b.classList.remove('sel'); });
        btn.classList.add('sel');
        autoSave();
        updateConditionals();
      });
    });

    // Group shot checkboxes
    document.querySelectorAll('input[type="checkbox"][data-key]').forEach(function(cb) {
      cb.addEventListener('change', function() {
        DATA[cb.dataset.key] = cb.checked;
        autoSave();
      });
    });

    // T&C checkbox
    var tcBox = document.getElementById('tc-accept');
    if (tcBox) {
      tcBox.addEventListener('change', function() {
        DATA.tc_accepted = tcBox.checked;
        autoSave();
      });
    }

    updateConditionals();
  }

  // ── AUTO-SAVE (localStorage + server draft) ──────────────
  // Two tiers: localStorage fires fast (500ms) for instant same-device resume;
  // the server draft fires slower (2.5s, debounced) so typing doesn't spam the
  // network, but it's what lets "send me the link again" actually resume her
  // progress instead of starting blank — same device or not.
  var _saveTimer = null;
  var _serverSaveTimer = null;
  function autoSave() {
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(function() {
      try { localStorage.setItem('charis_intake_' + TOKEN, JSON.stringify(DATA)); } catch(e) {}
    }, 500);

    clearTimeout(_serverSaveTimer);
    _serverSaveTimer = setTimeout(function() {
      SB.rpc('save_intake_draft', { p_token: TOKEN, p_draft: DATA }).catch(function(e) {
        console.warn('Could not sync progress to server (will retry on next edit):', e);
      });
    }, 2500);
  }
  // Merges (not replaces) into DATA, since a server draft may already have been
  // loaded first — whichever wrote a field most recently should win, and
  // localStorage on the same device is the freshest source. Returns true if
  // anything was found, so boot() knows whether to show the "welcome back" banner.
  function loadSavedData() {
    try {
      var saved = localStorage.getItem('charis_intake_' + TOKEN);
      if (saved) {
        var parsed = JSON.parse(saved);
        Object.keys(parsed).forEach(function(k) { DATA[k] = parsed[k]; });
        return true;
      }
    } catch(e) {}
    return false;
  }

  // ── NAVIGATION ───────────────────────────────────────────
  function nextStep() {
    // Collect current values from DOM
    collectCurrentStep();
    if (STEP < STEPS.length - 1) {
      STEP++;
      renderForm();
      window.scrollTo(0, 0);
    }
  }

  function prevStep() {
    collectCurrentStep();
    if (STEP > 0) {
      STEP--;
      renderForm();
      window.scrollTo(0, 0);
    }
  }

  function collectCurrentStep() {
    document.querySelectorAll('.step.active .field-input').forEach(function(el) {
      if (el.dataset.key) DATA[el.dataset.key] = el.value;
    });
    var tc = document.getElementById('tc-accept');
    if (tc) DATA.tc_accepted = tc.checked;
  }

  // ── SUBMIT ───────────────────────────────────────────────
  async function submitForm() {
    if (SUBMITTED) return;
    collectCurrentStep();

    // Validate required
    if (!DATA.core_name || !DATA.core_phone) {
      alert('Please fill in your name and phone number (Step 1).');
      return;
    }
    if (!DATA.tc_accepted) {
      alert('Please read and accept the Terms & Conditions to submit.');
      return;
    }

    SUBMITTED = true;

    // Build structured payload
    var payload = {
      client: {
        name: DATA.core_name,
        phone: DATA.core_phone,
        email: DATA.core_email,
        referralSource: DATA.core_referral
      },
      permissions: {
        instagram: DATA.perm_instagram || false,
        tiktok: DATA.perm_tiktok || false,
        website: DATA.perm_website || false,
        marketing: DATA.perm_marketing || false,
        canTag: DATA.perm_tag || false,
        clientInstagram: DATA.perm_client_ig || '',
        clientTikTok: DATA.perm_client_tiktok || '',
        mustHaveShots: DATA.perm_must_shots || '',
        songPreference: DATA.perm_song || '',
        doNotFilm: DATA.perm_do_not_film || ''
      },
      party: {},
      prep: {},
      ceremony: {},
      reception: {},
      vendors: {},
      emergency: [],
      coordinator: { name: DATA.coord_name || '', phone: DATA.coord_phone || '' },
      notes: DATA.final_notes || '',
      parking: DATA.final_parking || '',
      termsAccepted: true,
      termsAcceptedAt: new Date().toISOString(),
      submittedAt: new Date().toISOString()
    };

    // Collect all DATA keys into appropriate sections
    Object.keys(DATA).forEach(function(k) {
      if (k.startsWith('party_')) payload.party[k] = DATA[k];
      if (k.startsWith('prep_')) payload.prep[k] = DATA[k];
      if (k.startsWith('cer_')) payload.ceremony[k] = DATA[k];
      if (k.startsWith('ps_')) payload.ceremony[k] = DATA[k];
      if (k.startsWith('rec_')) payload.reception[k] = DATA[k];
      if (k.startsWith('kuk_')) payload.kukyala = payload.kukyala || {}; if (k.startsWith('kuk_')) payload.kukyala[k] = DATA[k];
      if (k.startsWith('stu_')) payload.studio = payload.studio || {}; if (k.startsWith('stu_')) payload.studio[k] = DATA[k];
      if (k.startsWith('corp_')) payload.corporate = payload.corporate || {}; if (k.startsWith('corp_')) payload.corporate[k] = DATA[k];
      if (k.startsWith('gen_')) payload.generic = payload.generic || {}; if (k.startsWith('gen_')) payload.generic[k] = DATA[k];
    });

    // Emergency contacts
    for (var i = 1; i <= 4; i++) {
      var n = DATA['em' + i + '_name'], p = DATA['em' + i + '_phone'], r = DATA['em' + i + '_rel'];
      if (n || p) payload.emergency.push({ name: n || '', phone: p || '', relationship: r || '' });
    }

    // Vendors
    ['rec_dj', 'rec_decor', 'rec_mua', 'prep_mua'].forEach(function(prefix) {
      var vn = DATA[prefix + '_name'], vp = DATA[prefix + '_phone'];
      if (vn || vp) payload.vendors[prefix] = { name: vn || '', phone: vp || '' };
    });
    if (DATA.rec_caterer) payload.vendors.caterer = DATA.rec_caterer;

    // Bridesmaids array (with Instagram)
    var bmCount = parseInt(DATA.bm_count) || 0;
    payload.party.bridesmaids = [];
    for (var i = 0; i < bmCount; i++) {
      var bmn = DATA['bm_'+i+'_name'], bmp = DATA['bm_'+i+'_phone'], bmig = DATA['bm_'+i+'_ig'];
      if (bmn || bmp || bmig) payload.party.bridesmaids.push({ name: bmn||'', phone: bmp||'', instagram: bmig||'' });
    }
    // Groomsmen array
    var gmCount = parseInt(DATA.gm_count) || 0;
    payload.party.groomsmen = [];
    for (var j = 0; j < gmCount; j++) {
      var gmn = DATA['gm_'+j+'_name'], gmp = DATA['gm_'+j+'_phone'], gmig = DATA['gm_'+j+'_ig'];
      if (gmn || gmp || gmig) payload.party.groomsmen.push({ name: gmn||'', phone: gmp||'', instagram: gmig||'' });
    }
    // MOH and Best Man Instagram
    if (DATA.party_moh_ig)       payload.party.mohInstagram = DATA.party_moh_ig;
    if (DATA.party_bm_ig)        payload.party.bestManInstagram = DATA.party_bm_ig;
    if (DATA.party_flower_girl)  payload.party.flowerGirl = DATA.party_flower_girl;
    if (DATA.party_peg_boy)      payload.party.pegBoy = DATA.party_peg_boy;
    payload.permissions.uploadOnline = DATA.perm_upload_online || false;
    // Group shots (collect ticked ones)
    var groupShotLabels = ['Bride & Groom only','Full bridal party (all bridesmaids & groomsmen)','Bridesmaids with bride','Groomsmen with groom','Bride with her parents','Groom with his parents','Bride with her siblings','Groom with his siblings','Both families together','All parents together','Bride with all her family','Groom with all his family','Flower girls & ring bearers','Church / Religious leaders','Couple with closest friends','Couple with children (if any)'];
    payload.groupShots = groupShotLabels.filter(function(_, idx) { return DATA['ps_group_' + idx]; });
    if (DATA.ps_extra_groups) payload.groupShotsExtra = DATA.ps_extra_groups;
    // Key moments
    payload.reception = payload.reception || {};
    payload.reception.firstDance = DATA.rec_first_dance || '';
    payload.reception.cakeCutting = DATA.rec_cake_cut || '';
    payload.reception.speeches = DATA.rec_speeches || '';
    payload.reception.sendOff = DATA.rec_send_off || '';
    payload.reception.surprise = DATA.rec_surprise || false;
    payload.reception.surpriseDesc = DATA.rec_surprise_desc || '';
    // Delivery
    payload.delivery = { preference: DATA.final_delivery_how || '', deadline: DATA.final_delivery_deadline || '' };
    // Partner name from party
    if (DATA.party_bride) payload.party.brideName = DATA.party_bride;
    if (DATA.party_groom) payload.party.groomName = DATA.party_groom;

    try {
      var { data, error } = await SB.rpc('submit_intake', { p_token: TOKEN, p_data: payload });
      if (error) throw error;
      if (data && data.success) {
        try { localStorage.removeItem('charis_intake_' + TOKEN); } catch(e) {}
        showSuccess();
      } else {
        SUBMITTED = false;
        alert((data && data.error) || 'Submission failed. Please try again.');
      }
    } catch (e) {
      SUBMITTED = false;
      console.error(e);
      alert('Connection error. Please check your internet and try again.');
    }
  }

  // ── BRIDESMAID / GROOMSMAN ADD & REMOVE ──────────────────
  function refreshPartyList(listId, renderFn, countKey) {
    collectCurrentStep();
    var el = document.getElementById(listId);
    if (!el) return;
    el.innerHTML = renderFn();
    attachListeners(el);
  }

  // ── PUBLIC API for onclick handlers ──────────────────────
  window._intake = {
    next: nextStep,
    prev: prevStep,
    submit: submitForm,
    addBridesmaid: function() {
      collectCurrentStep();
      DATA.bm_count = (parseInt(DATA.bm_count) || 0) + 1;
      refreshPartyList('bm-list', renderBridesmaidsCards, 'bm_count');
    },
    removeBridesmaid: function(idx) {
      collectCurrentStep();
      var count = parseInt(DATA.bm_count) || 0;
      for (var i = idx; i < count - 1; i++) {
        DATA['bm_' + i + '_name']  = DATA['bm_' + (i+1) + '_name']  || '';
        DATA['bm_' + i + '_phone'] = DATA['bm_' + (i+1) + '_phone'] || '';
        DATA['bm_' + i + '_ig']    = DATA['bm_' + (i+1) + '_ig']    || '';
      }
      delete DATA['bm_' + (count-1) + '_name'];
      delete DATA['bm_' + (count-1) + '_phone'];
      delete DATA['bm_' + (count-1) + '_ig'];
      DATA.bm_count = Math.max(0, count - 1);
      refreshPartyList('bm-list', renderBridesmaidsCards, 'bm_count');
    },
    addGroomsman: function() {
      collectCurrentStep();
      DATA.gm_count = (parseInt(DATA.gm_count) || 0) + 1;
      refreshPartyList('gm-list', renderGroomsmenCards, 'gm_count');
    },
    removeGroomsman: function(idx) {
      collectCurrentStep();
      var count = parseInt(DATA.gm_count) || 0;
      for (var i = idx; i < count - 1; i++) {
        DATA['gm_' + i + '_name']  = DATA['gm_' + (i+1) + '_name']  || '';
        DATA['gm_' + i + '_phone'] = DATA['gm_' + (i+1) + '_phone'] || '';
        DATA['gm_' + i + '_ig']    = DATA['gm_' + (i+1) + '_ig']    || '';
      }
      delete DATA['gm_' + (count-1) + '_name'];
      delete DATA['gm_' + (count-1) + '_phone'];
      delete DATA['gm_' + (count-1) + '_ig'];
      DATA.gm_count = Math.max(0, count - 1);
      refreshPartyList('gm-list', renderGroomsmenCards, 'gm_count');
    }
  };

  // ── GO ───────────────────────────────────────────────────
  boot();

})();
</script>
