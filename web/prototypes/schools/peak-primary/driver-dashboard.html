<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F17">
  <title>Driver App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0B0F17; color: #F9FAFB; font-family: Inter, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; }
    button:disabled { opacity: .55; cursor: default !important; }
    button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid #00FC8F; outline-offset: 2px; }
    #nx-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 9999; max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 12px; font: 600 13.5px Inter, sans-serif; background: #1F2937; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.5); display: none; }
    .leaflet-container { background: #0B0F17; }
  </style>
  <!-- Pinned versions (audit B1/C8) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <!-- Staff sign-in check (audit C2): no driver app without a verified driver/head account. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/prototypes/schools/peak-primary/session-guard.js?v=5"></script>
</head>
<body>
  <div id="root"></div>
  <div id="nx-toast" role="status" aria-live="polite"></div>
  <script>
    window.peakToast = function (msg, kind) {
      var el = document.getElementById('nx-toast');
      el.textContent = msg;
      el.style.background = kind === 'error' ? '#7F1D1D' : kind === 'success' ? '#065F46' : '#1F2937';
      el.style.display = 'block';
      clearTimeout(window.__nxToastT);
      window.__nxToastT = setTimeout(function () { el.style.display = 'none'; }, 4000);
    };
  </script>
  <script type="text/babel" src="/prototypes/schools/peak-primary/driver-app.jsx?v=1"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<window.DriverRoot />);
  </script>
</body>
</html>
