  /* Dashboard colour control — change the school's accent; saves to the tenant + reloads */
  (function(){
    function init(){
      var sess = window.NextSession || null;
      var prof = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile()) || (sess && sess.profile) || null;
      if(!document.body){ return setTimeout(init,300); }
      if(!prof || !prof.tenantId){ return setTimeout(init,500); }
      return; /* theme colour now lives in Account -> Settings */
      var cur=(window.__ACCENT)||'#00FC8F';
      var mob = window.matchMedia('(max-width:640px)').matches;
      var wrap=document.createElement('div'); wrap.id='nx-theme-ctrl';
      wrap.style.cssText='position:fixed;right:14px;z-index:99999;bottom:'+(mob?86:16)+'px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-family:Inter,system-ui,sans-serif';
      var panel=document.createElement('div');
      panel.style.cssText='display:none;align-items:center;gap:8px;background:#141e3c;border:1px solid #212d56;border-radius:30px;padding:8px 12px;font-size:12px;color:#aab2d5;box-shadow:0 8px 24px rgba(0,0,0,.45)';
      var lbl=document.createElement('span'); lbl.textContent='Dashboard colour';
      var inp=document.createElement('input'); inp.type='color'; inp.value=cur;
      inp.style.cssText='width:30px;height:30px;border:none;background:none;cursor:pointer;padding:0;border-radius:6px';
      var sv=document.createElement('button'); sv.textContent='Apply'; sv.disabled=true;
      sv.style.cssText='background:'+cur+';color:#04210f;border:none;border-radius:20px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:12px;opacity:.5';
      panel.appendChild(lbl); panel.appendChild(inp); panel.appendChild(sv);
      var tog=document.createElement('button'); tog.type='button'; tog.setAttribute('aria-label','Dashboard colour');
      tog.style.cssText='width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:'+cur+';cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1';
      tog.textContent='🎨';
      tog.addEventListener('click',function(){ panel.style.display=(panel.style.display==='flex')?'none':'flex'; });
      var chosen=cur;
      inp.addEventListener('input',function(){ chosen=inp.value; sv.disabled=false; sv.style.opacity='1'; sv.style.background=chosen; tog.style.background=chosen; });
      sv.addEventListener('click',async function(){
        if(sv.disabled) return; sv.textContent='Saving…'; sv.disabled=true;
        try{
          var b={}; try{ b=JSON.parse(localStorage.getItem('nextos.brand')||'{}'); }catch(e){}
          b.color=chosen; if(!b.name && window.__BRAND_NAME) b.name=window.__BRAND_NAME;
          localStorage.setItem('nextos.brand', JSON.stringify(b));
          if(sess && sess.sb && prof.tenantId){ await sess.sb.from('tenants').update({ primary_color: chosen }).eq('id', prof.tenantId); }
        }catch(e){}
        location.reload();
      });
      wrap.appendChild(panel); wrap.appendChild(tog);
      document.body.appendChild(wrap);
    }
    if(document.readyState!=='loading') init(); else document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
  <script>
  (function () {
    function roleLabel(r) { r = (r || '').toLowerCase(); return ({ head: 'Head Teacher', teacher: 'Teacher', bursar: 'Bursar', admin: 'Administrator', director: 'Director' })[r] || ''; }
    function brand() { try { var b = JSON.parse(localStorage.getItem('nextos.brand') || 'null'); if (b && b.name) return b; } catch (e) {} return { name: (window.__BRAND_NAME) || 'your school', color: '#00fc8f' }; }
    function show() {
      try { if (sessionStorage.getItem('nextos.welcome') !== '1') return; } catch (e) { return; }
      try { sessionStorage.removeItem('nextos.welcome'); } catch (e) {}
      var prof = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile()) || {};
      var first = (prof.fullName ? String(prof.fullName).split(' ')[0] : '');
      var role = roleLabel(prof.role);
      var b = brand(); var school = b.name; var color = b.color || '#00fc8f';
      var line = 'Welcome' + (role ? (' ' + role) : '') + (first ? (' ' + first) : '');
      var ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 35%,#0f1f3a,#05080f);opacity:0;transition:opacity .5s ease;font-family:Inter,system-ui,sans-serif';
      ov.innerHTML = '<div style="font-family:ui-monospace,monospace;letter-spacing:4px;color:' + color + ';font-size:12px;margin-bottom:18px">' + String(school).toUpperCase() + ' \u00b7 NEXT SCHOOL OS</div>'
        + '<div style="font-size:42px;font-weight:800;color:#eef1fb;line-height:1.12;max-width:720px">' + line + '</div>'
        + '<div style="font-size:21px;color:#aab2d5;margin-top:12px">to ' + school + ' OS</div>'
        + '<div style="margin-top:28px;width:160px;height:3px;border-radius:3px;background:#1a2342;overflow:hidden"><div id="nxwb" style="height:100%;width:0;background:' + color + ';transition:width 2.1s linear"></div></div>';
      document.body.appendChild(ov);
      requestAnimationFrame(function () { ov.style.opacity = '1'; var w = document.getElementById('nxwb'); if (w) w.style.width = '100%'; });
      setTimeout(function () { ov.style.opacity = '0'; }, 2300);
      setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); }, 2900);
    }
    var tries = 0;
    (function wait() { tries++; var ready = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile() && window.PEAK_ROLE.getProfile().fullName); if (ready || tries > 25) show(); else setTimeout(wait, 160); })();
  })();
  </script>
