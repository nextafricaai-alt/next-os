    const fmt = (n) => 'UGX ' + Number(n || 0).toLocaleString();
    const latest = (payroll || [])[0];
    if (!latest) return null;
    const monthDeductions = (deductions || []).filter(d => d.month === latest.month);
    const totalDeducted = monthDeductions.reduce((a, d) => a + Number(d.amount || 0), 0);
    const expected = Number(latest.amount || 0) - totalDeducted;
    const hasPenalty = totalDeducted > 0;
    return (
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12,
        padding: '16px 20px', borderRadius: 12, marginBottom: 20,
        background: hasPenalty ? 'linear-gradient(135deg, rgba(255,71,87,0.10) 0%, ' + T.surface2 + ' 100%)' : 'linear-gradient(135deg, rgba(0,252,143,0.08) 0%, ' + T.surface2 + ' 100%)',
        border: '1px solid ' + (hasPenalty ? 'rgba(255,71,87,0.30)' : 'rgba(0,252,143,0.25)'),
      }}>
        <div>
          <div style={{ fontSize: 10, fontFamily: T.mono, letterSpacing: 1, color: T.ink3, textTransform: 'uppercase', marginBottom: 4 }}>Expected Monthly Salary</div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
            <span style={{ fontSize: 30, fontWeight: 700, fontFamily: T.serif, color: hasPenalty ? T.red : T.green }}>{fmt(expected)}</span>
            {hasPenalty && <span style={{ fontSize: 13, color: T.ink3, textDecoration: 'line-through' }}>{fmt(latest.amount)}</span>}
          </div>
        </div>
        {hasPenalty && (
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: T.red }}>−{fmt(totalDeducted)} in penalties</div>
            <div style={{ fontSize: 10.5, color: T.ink3, marginTop: 2 }}>{monthDeductions.length} deduction{monthDeductions.length > 1 ? 's' : ''} this month — see Payslip below</div>
          </div>
        )}
      </div>
    );
  }

  function TeacherShell() {
    const [data,           setData]           = useState({ loading: true });
    const [rollCallStream, setRollCallStream]  = useState(null); // stream string
    const [rollCallSlot,   setRollCallSlot]    = useState(null); // timetable slot object
    const [inProgressStream, setInProgressStream] = useState(null); // tracks open but unsaved roll
    const [healthStudent,  setHealthStudent]   = useState(null);
    const [messageStudent, setMessageStudent]  = useState(null);

    const profile = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile()) || { fullName: 'Teacher', role: 'teacher' };
    const initials = (window.PEAK_ROLE && window.PEAK_ROLE.initials()) || 'T';

    const refresh = useCallback(() => {
      loadTeacherData().then(d => setData(Object.assign({}, d, { loading: false })));
    }, []);
    useEffect(() => { refresh(); }, [refresh]);

    // ── Real-time subscription: update roll calls when DB changes ─────────────────
    useEffect(() => {
      const sb = window.NextSession?.sb;
      if (!sb) return;
      const tenantId = profile.tenantId || 'kabs-lily-junior-school-and-kindercare-centre';
      const today = new Date().toISOString().split('T')[0];
      // Unique per mount: a fixed channel name means a second mount (e.g. a
      // fast remount) tries to .on() a channel that's already subscribed,
      // which Supabase throws on and crashes the render entirely.
      const channel = sb.channel('teacher-roll-call-rt-' + Math.random().toString(36).slice(2))
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'student_roll_call',
          filter: `tenant_id=eq.${tenantId}`,
        }, (payload) => {
          // On any change, refresh the roll call data
          refresh();
        })
        .subscribe();
      // Fallback poll — postgres_changes only fires for tables added to
      // Supabase's realtime publication (see
      // cloudflare-worker/supabase-enable-realtime.sql, not yet run in
      // production as of this writing). Without it this subscription is
      // silently a no-op, so this keeps cross-teacher visibility current
      // within 30s regardless.
      const poll = setInterval(refresh, 30000);
      return () => { sb.removeChannel(channel); clearInterval(poll); };
    }, []);

    // ── Open roll call: enforce period lock and one-at-a-time rule ────────────────
    const handleOpenRollCall = useCallback((stream, slot) => {
      const ps = slot ? getPeriodStatus(slot) : 'active';
      if (ps === 'locked') {
        tinyToast(`🔒 Roll call for ${stream} is locked until ${formatTime(slot && slot.start_time)}`, 'error');
        return;
      }
      if (ps === 'past') {
        tinyToast(`🔒 Roll call for ${stream} closed — that class period has ended.`, 'error');
        return;
      }
      if (inProgressStream && inProgressStream !== stream) {
        tinyToast(`Finish the roll call for ${inProgressStream} first before starting a new one.`, 'error');
        return;
      }
      setRollCallStream(stream);
      setRollCallSlot(slot || null);
      setInProgressStream(stream); // mark as in-progress
    }, [inProgressStream]);

    const signOut = async () => {
      if (window.NextSession && window.NextSession.signOut) await window.NextSession.signOut();
      else window.location.href = 'login.html';
    };

    const onCheckedIn  = (checkin) => setData(prev => ({ ...prev, checkin }));
    const onCheckedOut = (checkin) => setData(prev => ({ ...prev, checkin }));
    const onRollCallSaved = (newRecords) => {
      // Update local roll call state (merge by student_id + period_number)
      const updated = [
        ...(data.rollCalls || []).filter(rc =>
          !newRecords.find(nr => nr.student_id === rc.student_id && nr.period_number === rc.period_number)
        ),
        ...newRecords,
      ];
      setData(prev => ({ ...prev, rollCalls: updated }));
      setInProgressStream(null); // roll call completed — unlock

      // ★ Nia Memory: record this attendance observation
      if (window.NIA_MEMORY && typeof window.NIA_MEMORY.write === 'function') {
        const total   = newRecords.length;
        const present = newRecords.filter(r => r.status === 'present').length;
        const absent  = newRecords.filter(r => r.status === 'absent').length;
        const late    = newRecords.filter(r => r.status === 'late').length;
        const rate    = total > 0 ? (present / total) : 1;
        const stream  = newRecords[0] && newRecords[0].stream;
        const tenantId = (window.NextSession?.profile?.tenantId) || 'kabs-lily-junior-school-and-kindercare-centre';
        const isLow = rate < 0.88;
        window.NIA_MEMORY.write(
          tenantId,
          isLow ? 'attendance_dip' : 'attendance_ok',
          { stream, total, present, absent, late, rate: Math.round(rate * 100) / 100, day: new Date().getDay(), weekOfTerm: 6 },
          isLow ? 'warn' : 'info',
          `${stream} roll call: ${present}/${total} present (${Math.round(rate * 100)}%) on ${new Date().toDateString()}`
        );
        if (window.NIA_MEMORY.getInsight) {
          const insight = window.NIA_MEMORY.getInsight(tenantId, 'attendance');
          if (insight && window.NEXT_OS && window.NEXT_OS.notify) {
            window.NEXT_OS.notify({
              severity: isLow ? 'warn' : 'info',
              title: 'Nia · ' + stream + ' roll call recorded',
              body: insight,
              source: 'Nia · School Coach',
            });
          }
        }
      }
    };

    const greeting = (() => {
      const h = new Date().getHours();
      if (h < 12) return 'Good morning';
      if (h < 17) return 'Good afternoon';
      return 'Good evening';
    })();

    const SchoolBadgeStrip = window.SchoolBadgeStrip;
    const schoolName = (window.SCHOOL_BRAND && window.SCHOOL_BRAND.name)
      || (typeof window.getOSActiveTenant === 'function' ? window.getOSActiveTenant().replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : 'Your School');

    return (
      <div style={{ minHeight: '100vh', background: T.bg, color: T.ink, fontFamily: T.font }}>
        {SchoolBadgeStrip && <SchoolBadgeStrip pageName="TEACHER PORTAL" />}
        <header style={{
          padding: '20px 32px', borderBottom: '1px solid ' + T.border,
          display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap',
          background: 'rgba(10,16,41,0.6)', backdropFilter: 'blur(10px)',
          position: 'sticky', top: 0, zIndex: 10,
        }}>
          <div style={{
            width: 38, height: 38, borderRadius: 10,
            background: 'linear-gradient(135deg, #00FC8F, #1B9B6F)',
            display: 'grid', placeItems: 'center', flexShrink: 0,
            fontFamily: T.serif, fontSize: 20, fontWeight: 700, color: T.bg,
          }}>{(schoolName.match(/[A-Za-z0-9]/g) || ['S'])[0]}</div>
          <div style={{ flex: 1, lineHeight: 1.15, minWidth: 140 }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: T.ink }}>{schoolName}</div>
            <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: 0.6 }}>{'TEACHER PORTAL · ' + (window.getSchoolCalendarLabel ? window.getSchoolCalendarLabel().termWeekStr.replace('Term ', 'T').replace(' · Week ', ' · WK') : 'T2')}</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ width: 34, height: 34, borderRadius: 999, background: T.gold, color: T.bg, display: 'grid', placeItems: 'center', fontSize: 12, fontWeight: 700 }}>{initials}</div>
            <div style={{ lineHeight: 1.2 }}>
              <div style={{ fontSize: 13, fontWeight: 600 }}>{profile.fullName}</div>
              <div style={{ fontSize: 10.5, color: T.ink3 }}>Teacher</div>
            </div>
            <button onClick={signOut} style={{ background: 'transparent', border: '1px solid ' + T.borderStr, color: T.ink2, padding: '7px 14px', borderRadius: 8, cursor: 'pointer', fontSize: 12, fontFamily: T.font }}>Sign out</button>
          </div>
        </header>

        <main style={{ padding: '32px 32px 60px', maxWidth: 1400, margin: '0 auto' }}>
          <div style={{ marginBottom: 24 }}>
            <h1 style={{ fontSize: 36, fontWeight: 400, margin: 0, fontFamily: T.serif, letterSpacing: '-0.01em' }}>
              {greeting}, {profile.fullName ? profile.fullName.split(' ')[0] : 'Teacher'}
            </h1>
            <p style={{ margin: '8px 0 0', color: T.ink3, fontSize: 14 }}>Here's your day at {schoolName}.</p>
          </div>

          {!data.loading && !data.error && <ExpectedSalaryBanner payroll={data.payroll} deductions={data.deductions} />}

          {data.loading ? (
            <div style={{ padding: 60, textAlign: 'center', color: T.ink3, fontFamily: T.mono, fontSize: 12, letterSpacing: 0.8 }}>LOADING YOUR DASHBOARD…</div>
          ) : data.error ? (
            <div style={{ padding: 24, background: 'rgba(255,71,87,0.08)', border: '1px solid rgba(255,71,87,0.25)', borderRadius: 12, color: '#FF8a92' }}>{data.error}</div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(380px, 1fr))', gap: 20 }}>
              <CheckInCard teacher={data.teacher} checkin={data.checkin} onCheckedIn={onCheckedIn} onCheckedOut={onCheckedOut} profile={profile} />
              <NiaCoachCard
                data={{
                  teacher: data.teacher,
                  assignments: data.assignments,
                  rollCalls: data.rollCalls || [],
                  checkin: data.checkin,
                  healthRecords: data.healthRecords || [],
                  streamStudents: data.streamStudents || [],
                  todaySlots: data.todaySlots || [],
                }}
                onTakeRollCall={(stream) => handleOpenRollCall(stream, (data.todaySlots || []).find(sl => sl.stream === stream) || (data.todaySlots || [])[0])}
                onLogHealth={setHealthStudent}
                onScrollToCheckin={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
              />
              <TodaysClassesCard
                assignments={data.assignments}
                rollCalls={data.rollCalls || []}
                todaySlots={data.todaySlots || []}
                streamStudents={data.streamStudents || []}
                onTakeRollCall={handleOpenRollCall}
                inProgressStream={inProgressStream}
              />
              <LessonsCard
                lessons={data.lessons}
                assignments={data.assignments}
                teacherId={data.teacher && data.teacher.id}
                tenantId={profile.tenantId || 'kabs-lily-junior-school-and-kindercare-centre'}
                onChanged={refresh}
              />
              <SyllabusCard syllabus={data.syllabus} onChanged={refresh} />
              <TeacherExamsCard exams={data.exams} assignments={data.assignments} students={data.myStudents} teacherId={data.teacher && data.teacher.id} tenantId={profile.tenantId || 'kabs-lily-junior-school-and-kindercare-centre'} onChanged={refresh} />
              <StudentsCard assignments={data.assignments} onLogHealth={setHealthStudent} onMessage={setMessageStudent} healthRecords={data.healthRecords || []} />
              <PayslipCard payroll={data.payroll} deductions={data.deductions} />
              <TeacherLogCard teacher={data.teacher} />
            </div>
          )}
        </main>

        {/* Nia's live check-in nudge — only on weekdays, if not yet checked in */}
        {!data.loading && !data.error && data.teacher && !data.checkin &&
         new Date().getDay() !== 0 && new Date().getDay() !== 6 &&
         new Date().getHours() < 17 && (
          <NiaCheckinPopup
            teacher={data.teacher}
            profile={profile}
            onCheckedIn={onCheckedIn}
          />
        )}

        {rollCallStream && data.teacher && (
          <RollCallModal
            stream={rollCallStream}
            slot={rollCallSlot}
            teacher={data.teacher}
            existingRollCalls={(data.rollCalls || []).filter(rc => rc.stream === rollCallStream)}
            onClose={() => { setRollCallStream(null); setRollCallSlot(null); setInProgressStream(null); }}
            onSaved={onRollCallSaved}
            profile={profile}
            allStreamStudents={data.streamStudents || []}
          />
        )}

        {healthStudent && data.teacher && (
          <HealthLogModal
            student={healthStudent}
            teacher={data.teacher}
            onClose={() => setHealthStudent(null)}
            onSaved={() => tinyToast('Note saved.', 'success')}
            profile={profile}
          />
        )}

        {messageStudent && data.teacher && (
          <MessageParentModal
            student={messageStudent}
            teacher={data.teacher}
            tenantId={profile.tenantId || 'kabs-lily-junior-school-and-kindercare-centre'}
            onClose={() => setMessageStudent(null)}
          />
        )}
      </div>
    );
  }

  window.TeacherShell = TeacherShell;
})();

</script>
  <script type="text/babel" data-src="head-staff-panel.jsx">
/* head-staff-panel.jsx
   Sarah's view of her staff today.

   Pulls live from Supabase:
     - teachers (everyone on payroll)
     - teacher_checkins (today's check-ins + check-outs)
     - student_roll_call (which classes had roll taken today)
     - student_health_records (recent health notes)

   Status pills:
     ● GREEN  — checked in, still on campus
     ● AMBER  — checked in then out (left for the day)
     ● GRAY   — hasn't checked in today

   Exposed as window.HeadStaffPanel. Loaded inline in index.html.
*/
(function () {
  const { useState, useEffect, useMemo, useCallback } = React;

  const T = {
    bg:       '#0a1029',
    surface:  '#141e3c',
    surface2: '#1a2548',
    surface3: '#212d56',
    border:   'rgba(255,255,255,0.06)',
    borderStr:'rgba(255,255,255,0.10)',
    ink:      '#f5f6fa',
    ink2:     'rgba(245,246,250,0.85)',
    ink3:     'rgba(245,246,250,0.55)',
    ink4:     'rgba(245,246,250,0.40)',
    red:      '#FF4757',
    green:    '#00FC8F',
    gold:     '#FFB400',
    blue:     '#3B82F6',
    font:     "'Inter', -apple-system, system-ui, sans-serif",
    mono:     "'JetBrains Mono', ui-monospace, monospace",
    serif:    "'Instrument Serif', serif",
  };

  const isoDate = () => new Date().toISOString().slice(0, 10);
  const fmtTime = (iso) => iso
    ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : '—';
  const fmtDuration = (a, b) => {
    if (!a) return '';
    const end = b ? new Date(b) : new Date();
    const ms = end - new Date(a);
    if (ms <= 0) return '';
    const mins = Math.floor(ms / 60000);
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  };
  // Matches the 07:15 cutoff in teacher-view.jsx's applyLateCheckInPenalty —
  // any check-in after this triggers the standing 2,000 UGX payroll deduction.
  const isLateCheckin = (iso) => {
    if (!iso) return false;
    const dt = new Date(iso);
    return dt.getHours() > 7 || (dt.getHours() === 7 && dt.getMinutes() > 15);
  };

  const KABS_STAFF_ROSTER = [
    { id: 't1', full_name: 'Tr. Harriet (Ule Harriet)', phone: '0701647582', classAssigned: 'Primary One (P.1)', subjects: ['Luganda', 'LIT 1'], salary: 300000 },
    { id: 't2', full_name: 'Tr. Christine (Ikubu Christine)', phone: '0771791911', classAssigned: 'Primary Two (P.2)', subjects: ['English', 'LIT 2'], salary: 380000 },
    { id: 't3', full_name: 'Tr. Jane (Nalukenge Jane)', phone: '0750845160', classAssigned: 'Primary Three (P.3)', subjects: ['Religious Education', 'Math'], salary: 350000 },
    { id: 't4', full_name: 'Tr. Elijah (Elijja Weiswa)', phone: '—', classAssigned: 'Primary Four (P.4)', subjects: ['Math'], salary: 300000 },
    { id: 't5', full_name: 'Tr. Esther (Ayuto Esther)', phone: '0778787509', classAssigned: 'Primary Five (P.5)', subjects: ['SST', 'Science'], salary: 330000 },
    { id: 't6', full_name: 'Tr. Ronnie (Ssemakula Ronnie)', phone: '0754972846 / 0788241295', classAssigned: 'Primary Six (P.6)', subjects: ['Science', 'Math'], salary: 350000 },
    { id: 't7', full_name: 'Tr. Paul (Paul Ongaria)', phone: '0780742619', classAssigned: 'Primary Seven (P.7)', subjects: ['English', 'Religious Education'], salary: 330000 },
    { id: 't8', full_name: 'Tr. Sam (Bunya Samuel)', phone: '0772555001', classAssigned: 'Primary Seven (P.7)', subjects: ['SST', 'Religious Education'], salary: 350000 },
    { id: 't9', full_name: 'Tr. Joyce (Joyce Kabali)', phone: '0782204110 / 0705185361', classAssigned: 'Primary Three & Four (P.3 & P.4)', subjects: ['English', 'LIT 2'], salary: 320000 },
    { id: 't10', full_name: 'Tr. Jus', phone: '0770001122', classAssigned: 'Baby Class', subjects: ['Learning Area 1 & 4'], salary: 280000 },
    { id: 't11', full_name: 'Tr. Jemie (Jemima)', phone: '0700002233', classAssigned: 'Middle Class', subjects: ['Learning Area 1 & 4'], salary: 280000 },
    { id: 't12', full_name: 'Tr. Mayira', phone: '0750003344', classAssigned: 'Top Class', subjects: ['Learning Area 2 & 5'], salary: 290000 },
  ];

  async function loadStaffData(tenantId) {
    const sb = window.NextSession?.sb;
    const today = isoDate();

    if (!sb) {
      return {
        teachers: KABS_STAFF_ROSTER,
        checkins: KABS_STAFF_ROSTER.map(t => ({ id: 'c-' + t.id, teacher_id: t.id, checked_in_at: today + 'T07:45:00Z', method: 'qr' })),
        rollCalls: [],
        healthRecs: []
      };
    }

    const { data: teachers } = await sb
      .from('teachers')
      .select('id, full_name, email, subjects, status, salary:monthly_salary, phone')
      .eq('tenant_id', tenantId)
      .order('full_name', { ascending: true });

    const { data: checkins } = await sb
      .from('teacher_checkins')
      .select('id, teacher_id, checked_in_at, checked_out_at, method')
      .eq('tenant_id', tenantId)
      .gte('checked_in_at', today + 'T00:00:00')
      .order('checked_in_at', { ascending: false });

    const { data: rollCalls } = await sb
      .from('student_roll_call')
      .select('id, teacher_id, stream, status')
      .eq('tenant_id', tenantId)
      .eq('roll_date', today);

    const { data: syllabus } = await sb
      .from('syllabus_coverage')
      .select('id, teacher_id, stream, subject, topic, planned_week, completed_week, status')
      .eq('tenant_id', tenantId);

    const { data: pastDeductions } = await sb
      .from('payroll_deductions')
      .select('teacher_id, reference_id')
      .eq('tenant_id', tenantId)
      .eq('reason', 'syllabus_incomplete');

    const sevenDaysAgo = new Date(Date.now() - 7 * 86400000).toISOString();
    const { data: healthRecs } = await sb
      .from('student_health_records')
      .select('id, recorded_by_teacher_id, recorded_at, follow_up_needed, resolved_at')
      .eq('tenant_id', tenantId)
      .gte('recorded_at', sevenDaysAgo);

    return {
      teachers: (teachers && teachers.length > 0) ? teachers : KABS_STAFF_ROSTER,
      checkins: checkins || [],
      rollCalls: rollCalls || [],
      healthRecs: healthRecs || [],
      syllabus: syllabus || [],
      pastSyllabusDeductions: pastDeductions || [],
    };
  }

  // This app has no real term-calendar/current-week clock anywhere yet, so
  // "overdue" can't be computed against a true today's-date-to-week mapping
  // without risking a false positive that wrongly flags someone. Instead
  // this uses each teacher's OWN pace as the yardstick: a topic planned for
  // week N is flagged once that same teacher has already completed a topic
  // 2+ weeks ahead of it — i.e. they've clearly moved on without covering
  // it, by their own demonstrated progress, not a guessed calendar date.
  function findOverdueSyllabus(syllabusRows, pastDeductions) {
    const byTeacher = {};
    (syllabusRows || []).forEach(r => { (byTeacher[r.teacher_id] = byTeacher[r.teacher_id] || []).push(r); });
    const deductedRefs = new Set((pastDeductions || []).map(d => String(d.reference_id)));
    const out = [];
    Object.keys(byTeacher).forEach(teacherId => {
      const rows = byTeacher[teacherId];
      const furthestDone = rows.filter(r => r.status === 'done' && r.completed_week != null)
        .reduce((mx, r) => Math.max(mx, r.completed_week), 0);
      if (!furthestDone) return;
      rows.forEach(r => {
        if (r.status === 'done') return;
        if (r.planned_week == null) return;
        if (furthestDone - r.planned_week >= 2 && !deductedRefs.has(String(r.id))) {
          out.push({ teacherId: Number(teacherId), topic: r });
        }
      });
    });
    return out;
  }

  // ─── Nia Predictive Intelligence Card ─────────────────────────────
  // Appears at the top of the staff panel, powered by Nia's memory.
  // Shows today's pattern-based intelligence: who's likely to be absent,
  // which classes are at attendance risk, what Nia observed this week.
  function NiaPredictiveCard({ tenantId, enriched, stats }) {
    const [patterns, setPatterns] = useState(null);
    const [insight, setInsight] = useState(null);

    useEffect(() => {
      if (!window.NIA_MEMORY) return;
      try {
        const p = window.NIA_MEMORY.getPatterns(tenantId);
        setPatterns(p);
        const i = window.NIA_MEMORY.getInsight(tenantId, 'staff absence pattern');
        setInsight(i);
      } catch (_) { /* silent */ }
    }, [tenantId, enriched.length]);

    // Risk-flag absent teachers based on memory patterns
    const absentTeachers = enriched.filter(t => t.status === 'absent');
    const memoryInsights = patterns && patterns.insights ? patterns.insights.slice(0, 2) : [];
    const hasMemory = patterns && (patterns.observations || 0) >= 3;

    return (
      <div style={{
        background: 'linear-gradient(135deg, rgba(0,252,143,0.05) 0%, rgba(14,22,52,0.95) 100%)',
        border: '1px solid rgba(0,252,143,0.18)',
        borderRadius: 14, padding: 22, marginBottom: 24,
        position: 'relative', overflow: 'hidden',
      }}>
        {/* Glow accent */}
        <div style={{
          position: 'absolute', top: -20, right: -20, width: 120, height: 120,
          borderRadius: '50%', background: 'rgba(0,252,143,0.07)',
          filter: 'blur(30px)', pointerEvents: 'none',
        }} />

        {/* Header */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
          <div style={{
            width: 38, height: 38, borderRadius: 10,
            background: 'rgba(0,252,143,0.15)', color: T.green,
            display: 'grid', placeItems: 'center',
            fontFamily: T.serif, fontSize: 20, fontWeight: 700,
            border: '1px solid rgba(0,252,143,0.3)',
            boxShadow: '0 0 16px rgba(0,252,143,0.15)',
          }}>N</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 9.5, fontFamily: T.mono, letterSpacing: 1.5, color: T.green, fontWeight: 700 }}>
              NIA · {hasMemory ? 'PATTERN INTELLIGENCE' : 'MONITORING MODE'}
            </div>
            <div style={{ fontSize: 15, fontWeight: 600, color: T.ink, marginTop: 2 }}>
              {stats.absent === 0
                ? 'Full house — all staff accounted for'
                : stats.absent + ' teacher' + (stats.absent === 1 ? '' : 's') + ' not yet checked in'
              }
            </div>
          </div>
          {hasMemory && (
            <span style={{
              fontSize: 9.5, fontFamily: T.mono, letterSpacing: 1, color: T.green,
              background: 'rgba(0,252,143,0.1)', border: '1px solid rgba(0,252,143,0.2)',
              padding: '4px 10px', borderRadius: 999,
            }}>◆ MEMORY ACTIVE</span>
          )}
        </div>

        {/* Intelligence rows */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>

          {/* Live absent teachers */}
          {absentTeachers.slice(0, 3).map(t => (
            <div key={t.id} style={{
              display: 'flex', alignItems: 'center', gap: 12,
              padding: '10px 14px',
              background: 'rgba(255,180,0,0.07)',
              border: '1px solid rgba(255,180,0,0.18)',
              borderRadius: 10,
            }}>
              <span style={{
                width: 28, height: 28, borderRadius: 8,
                background: T.gold, color: T.bg,
                display: 'grid', placeItems: 'center',
                fontSize: 13, fontWeight: 700, flexShrink: 0,
              }}>◦</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T.ink }}>{t.full_name} — not checked in</div>
                <div style={{ fontSize: 11.5, color: T.ink3, marginTop: 2 }}>
                  {t.streamsRolled.length === 0
                    ? 'No roll call taken yet today.'
                    : t.streamsRolled.join(', ') + ' roll call done.'}
                </div>
              </div>
            </div>
          ))}

          {/* Memory-powered insights */}
          {memoryInsights.map((ins, i) => (
            <div key={i} style={{
              display: 'flex', alignItems: 'flex-start', gap: 12,
              padding: '10px 14px',
              background: 'rgba(59,130,246,0.07)',
              border: '1px solid rgba(59,130,246,0.15)',
              borderRadius: 10,
            }}>
              <span style={{
                width: 28, height: 28, borderRadius: 8,
                background: T.blue, color: T.bg,
                display: 'grid', placeItems: 'center',
                fontSize: 11, fontWeight: 700, flexShrink: 0,
              }}>◆</span>
              <div>
                <div style={{ fontSize: 10, fontFamily: T.mono, letterSpacing: 1, color: T.blue, marginBottom: 3 }}>NIA PATTERN</div>
                <div style={{ fontSize: 12.5, color: T.ink2, lineHeight: 1.5 }}>{ins}</div>
              </div>
            </div>
          ))}

          {/* All-clear or baseline message */}
          {absentTeachers.length === 0 && memoryInsights.length === 0 && (
            <div style={{
              display: 'flex', alignItems: 'center', gap: 12,
              padding: '10px 14px',
              background: 'rgba(0,252,143,0.06)',
              border: '1px solid rgba(0,252,143,0.14)',
              borderRadius: 10,
            }}>
              <span style={{ color: T.green, fontSize: 18 }}>✓</span>
              <div style={{ fontSize: 12.5, color: T.ink3, lineHeight: 1.5 }}>
                {hasMemory
                  ? 'All clear. No unusual patterns today based on ' + patterns.observations + ' past observations.'
                  : 'Nia is watching. Patterns build after a few days of check-in data.'}
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  function StaffStatusPill({ status }) {
    const styles = {
      in:   { bg: 'rgba(0,252,143,0.14)',  fg: T.green, dot: T.green, label: 'ON CAMPUS' },
      out:  { bg: 'rgba(255,180,0,0.14)',  fg: T.gold,  dot: T.gold,  label: 'LEFT FOR THE DAY' },
      absent:{ bg: 'rgba(255,255,255,0.06)', fg: T.ink3, dot: T.ink3,  label: 'NOT CHECKED IN' },
    }[status];
    return (
      <span style={{
        display: 'inline-flex', alignItems: 'center', gap: 6,
        background: styles.bg, color: styles.fg,
        padding: '4px 10px', borderRadius: 999,
        fontSize: 10.5, fontFamily: T.mono, fontWeight: 700, letterSpacing: 0.6,
      }}>
        <span style={{
          width: 7, height: 7, borderRadius: 999, background: styles.dot,
          boxShadow: status === 'in' ? '0 0 8px ' + T.green : 'none',
        }} />
        {styles.label}
      </span>
    );
  }

  // ─── Syllabus delay audit ──────────────────────────────────────────
  // Surfaces topics a teacher has fallen behind on (see findOverdueSyllabus)
  // so the head can review and, if they agree, apply the same 2,000 UGX
  // payroll_deductions penalty used for late check-ins — deliberately a
  // one-click human decision, not a silent auto-deduction, since there's
  // no reliable term-week clock to safely automate this against.
  function SyllabusAuditCard({ overdue, teachersById, tenantId, onApplied }) {
    const [busyId, setBusyId] = useState(null);
    if (!overdue || overdue.length === 0) return null;

    const apply = async (item) => {
      const sb = window.NextSession?.sb;
      if (!sb) return;
      setBusyId(item.topic.id);
      const month = new Date(); month.setDate(1);
      const { error } = await sb.from('payroll_deductions').insert({
        tenant_id: tenantId,
        teacher_id: item.teacherId,
        month: month.toISOString().slice(0, 10),
        amount: 2000,
        reason: 'syllabus_incomplete',
        reference_id: String(item.topic.id),
        notes: `"${item.topic.topic}" (planned week ${item.topic.planned_week}) still not covered — applied by head teacher.`,
      });
      setBusyId(null);
      if (error) { window.peakToast && window.peakToast('Could not apply deduction: ' + error.message, 'error'); return; }
      window.peakToast && window.peakToast('Deduction applied.', 'success');
      if (onApplied) onApplied();
    };

    return (
      <div style={{
        background: 'rgba(255,180,0,0.06)', border: '1px solid rgba(255,180,0,0.25)',
        borderRadius: 14, padding: 20, marginBottom: 24,
      }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: T.gold, marginBottom: 4 }}>⚠ Syllabus falling behind</div>
        <div style={{ fontSize: 11.5, color: T.ink3, marginBottom: 14 }}>
          These teachers have topics they've clearly moved past without marking complete. Review before applying — this deducts real pay.
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {overdue.map((item, i) => {
            const t = teachersById[item.teacherId];
            return (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 12px', background: T.surface2, borderRadius: 9 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: T.ink }}>{(t && t.full_name) || 'Teacher #' + item.teacherId}</div>
                  <div style={{ fontSize: 11.5, color: T.ink3, marginTop: 2 }}>{item.topic.stream} · {item.topic.subject} — "{item.topic.topic}" (planned week {item.topic.planned_week})</div>
                </div>
                <button
                  onClick={() => apply(item)}
                  disabled={busyId === item.topic.id}
                  style={{
                    background: 'rgba(255,71,87,0.12)', color: T.red, border: '1px solid rgba(255,71,87,0.3)',
                    padding: '7px 12px', borderRadius: 8, fontSize: 11.5, fontWeight: 700, fontFamily: T.font,
                    cursor: busyId === item.topic.id ? 'wait' : 'pointer', whiteSpace: 'nowrap',
                  }}
                >{busyId === item.topic.id ? 'Applying…' : 'Apply UGX 2,000 deduction'}</button>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  function HeadStaffPanel({ onNav }) {
    const profile = window.PEAK_ROLE ? window.PEAK_ROLE.getProfile() : { tenantId: 'peak-primary' };
    const [data, setData] = useState({ loading: true });

    const refresh = useCallback(async () => {
      setData(d => ({ ...d, loading: true }));
      const r = await loadStaffData(profile.tenantId);
      setData(Object.assign({}, r, { loading: false }));
    }, [profile.tenantId]);

    useEffect(() => {
      refresh();
      const id = setInterval(refresh, 30000); // fallback poll every 30s
      return () => clearInterval(id);
    }, [refresh]);

    // ── Real-time WebSocket push: instant update when any teacher takes roll call or checks in ──
    useEffect(() => {
      const sb = window.NextSession?.sb;
      if (!sb) return;
      const tenantId = profile.tenantId || 'kabs-lily-junior-school-and-kindercare-centre';

      // Unique per mount — a fixed channel name crashes the render if two
      // mounts overlap (Supabase throws adding .on() to an already-
      // subscribed channel of the same topic name).
      const channel = sb.channel('head-staff-rt-' + tenantId + '-' + Math.random().toString(36).slice(2))
        // Student roll call saved → refresh attendance live
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'student_roll_call',
          filter: `tenant_id=eq.${tenantId}`,
        }, () => { refresh(); })
        // Teacher check-in / check-out → refresh staff status live
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'teacher_checkins',
          filter: `tenant_id=eq.${tenantId}`,
        }, () => { refresh(); })
        // Teacher notes on students → refresh health watch
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'student_notes',
          filter: `tenant_id=eq.${tenantId}`,
        }, () => { refresh(); })
        .subscribe();

      return () => { try { sb.removeChannel(channel); } catch (_) {} };
    }, [profile.tenantId]);

    const enriched = useMemo(() => {
      if (!data.teachers) return [];
      const checkinsByTeacher = {};
      (data.checkins || []).forEach(c => {
        // Keep the most recent per teacher (already ordered desc)
        if (!checkinsByTeacher[c.teacher_id]) checkinsByTeacher[c.teacher_id] = c;
      });
      const rollByTeacher = {};
      (data.rollCalls || []).forEach(r => {
        if (!rollByTeacher[r.teacher_id]) rollByTeacher[r.teacher_id] = new Set();
        rollByTeacher[r.teacher_id].add(r.stream);
      });
      const healthByTeacher = {};
      (data.healthRecs || []).forEach(h => {
        if (!h.recorded_by_teacher_id) return;
        healthByTeacher[h.recorded_by_teacher_id] = (healthByTeacher[h.recorded_by_teacher_id] || 0) + 1;
      });
      return data.teachers.map(t => {
        const c = checkinsByTeacher[t.id];
        const status = !c ? 'absent' : (c.checked_out_at ? 'out' : 'in');
        return {
          ...t,
          status,
          checkin: c,
          streamsRolled: rollByTeacher[t.id] ? Array.from(rollByTeacher[t.id]) : [],
          healthCount: healthByTeacher[t.id] || 0,
        };
      });
    }, [data]);

    const stats = useMemo(() => {
      const total = enriched.length;
      const inNow = enriched.filter(e => e.status === 'in').length;
      const left = enriched.filter(e => e.status === 'out').length;
      const absent = enriched.filter(e => e.status === 'absent').length;
      return { total, inNow, left, absent };
    }, [enriched]);

    const overdueSyllabus = useMemo(
      () => findOverdueSyllabus(data.syllabus, data.pastSyllabusDeductions),
      [data.syllabus, data.pastSyllabusDeductions]
    );
    const teachersById = useMemo(() => {
      const m = {}; (data.teachers || []).forEach(t => { m[t.id] = t; }); return m;
    }, [data.teachers]);

    const SchoolBadgeStrip = window.SchoolBadgeStrip;

    return (
      <div style={{
        minHeight: '100vh', background: T.bg, color: T.ink,
        fontFamily: T.font, padding: '32px 36px 60px',
      }}>
        {SchoolBadgeStrip && <SchoolBadgeStrip pageName="STAFF & CAMPUS" />}
        {/* Header */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24, gap: 12, flexWrap: 'wrap' }}>
          <div>
            <div style={{ fontSize: 10.5, fontFamily: T.mono, letterSpacing: 1.5, color: T.ink3 }}>
              STAFF TODAY · {new Date().toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' })}
            </div>
            <h1 style={{
              fontSize: 32, fontWeight: 400, margin: '6px 0 0',
              fontFamily: T.serif, letterSpacing: '-0.01em',
            }}>Who's on campus right now</h1>
          </div>
          <div style={{ display: 'flex', gap: 10 }}>
            <button onClick={() => window.open(window.peakSchoolLink ? window.peakSchoolLink('join-staff') : './staff-hr-form.html', '_blank')} style={{
              background: 'rgba(59,130,246,0.12)', color: T.blue,
              border: '1px solid rgba(59,130,246,0.3)',
              padding: '8px 16px', borderRadius: 8,
              fontSize: 12, cursor: 'pointer', fontFamily: T.font, fontWeight: 600,
            }}>Share Staff HR Form 🔗</button>
            <button onClick={refresh} disabled={data.loading} style={{
              background: 'transparent', color: T.ink2,
              border: '1px solid ' + T.borderStr,
              padding: '8px 16px', borderRadius: 8,
              fontSize: 12, cursor: data.loading ? 'wait' : 'pointer', fontFamily: T.font,
            }}>{data.loading ? 'Refreshing…' : '↻ Refresh'}</button>
          </div>
        </div>

        {/* Nia Predictive Intelligence */}
        <NiaPredictiveCard tenantId={profile.tenantId} enriched={enriched} stats={stats} />

        {/* Syllabus Audit — overdue coverage + payroll deduction trigger */}
        <SyllabusAuditCard overdue={overdueSyllabus} teachersById={teachersById} tenantId={profile.tenantId} onApplied={refresh} />

        {/* Stat cards */}
        <div style={{
          display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))',
          gap: 14, marginBottom: 24,
        }}>
          {[
            { label: 'TOTAL TEACHERS', value: stats.total, color: T.ink },
            { label: 'ON CAMPUS NOW',  value: stats.inNow, color: T.green, glow: true },
            { label: 'LEFT FOR DAY',   value: stats.left,  color: T.gold },
            { label: 'NOT CHECKED IN', value: stats.absent,color: T.red },
          ].map((s, i) => (
            <div key={i} style={{
              background: T.surface,
              border: '1px solid ' + T.border,
              borderRadius: 12, padding: 18,
              position: 'relative',
            }}>
              <div style={{ fontSize: 10, fontFamily: T.mono, letterSpacing: 1.5, color: T.ink3, marginBottom: 6 }}>{s.label}</div>
              <div style={{
                fontSize: 34, fontWeight: 700, color: s.color, fontFamily: T.serif,
                textShadow: s.glow ? '0 0 24px rgba(0,252,143,0.4)' : 'none',
              }}>{s.value}</div>
            </div>
          ))}
        </div>

        {/* Staff list */}
        <div style={{
          background: T.surface, border: '1px solid ' + T.border,
          borderRadius: 14, overflow: 'hidden',
        }}>
          <div style={{
            padding: '14px 22px', borderBottom: '1px solid ' + T.border,
            display: 'flex', alignItems: 'center', gap: 10,
            fontSize: 11, fontFamily: T.mono, color: T.ink3, letterSpacing: 1.2,
          }}>
            STAFF DIRECTORY · {enriched.length} TEACHER{enriched.length === 1 ? '' : 'S'}
            <span style={{
              marginLeft: 'auto', fontSize: 10, color: T.ink4,
              display: 'flex', alignItems: 'center', gap: 6,
            }}>
              <span style={{
                width: 6, height: 6, borderRadius: 999, background: T.green,
                animation: 'pulse 2s infinite',
              }} />
              LIVE · UPDATES EVERY 30s
            </span>
          </div>

          {data.loading && enriched.length === 0 ? (
            <div style={{ padding: 48, textAlign: 'center', color: T.ink3, fontFamily: T.mono, fontSize: 11 }}>
              LOADING STAFF…
            </div>
          ) : enriched.length === 0 ? (
            <div style={{ padding: 48, textAlign: 'center', color: T.ink4, fontStyle: 'italic' }}>
              No teachers found for your tenant.
            </div>
          ) : enriched.map(t => (
            <div key={t.id} style={{
              padding: '16px 22px',
              borderBottom: '1px solid ' + T.border,
              display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap',
              background: t.status === 'in' ? 'rgba(0,252,143,0.025)' : 'transparent',
            }}>
              {/* Avatar */}
              <div style={{
                width: 42, height: 42, borderRadius: 999,
                background: t.status === 'in' ? T.green : t.status === 'out' ? T.gold : T.surface3,
                color: t.status === 'in' || t.status === 'out' ? T.bg : T.ink3,
                display: 'grid', placeItems: 'center',
                fontSize: 13, fontWeight: 700, flexShrink: 0,
                boxShadow: t.status === 'in' ? '0 0 16px rgba(0,252,143,0.4)' : 'none',
              }}>{t.full_name.split(' ').map(n => n[0]).join('').slice(0, 2)}</div>

              {/* Name + subjects + salary */}
              <div style={{ flex: 1, minWidth: 220 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4 }}>
                  <span style={{ fontSize: 15, fontWeight: 600, color: T.ink }}>{t.full_name}</span>
                  {t.salary && (
                    <span style={{ fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 999, backgroundColor: 'rgba(0,252,143,0.12)', color: T.green, border: '1px solid rgba(0,252,143,0.25)', fontFamily: T.mono }}>
                      UGX {Number(t.salary).toLocaleString()}/mo
                    </span>
                  )}
                  {t.classAssigned && (
                    <span style={{ fontSize: 11, fontWeight: 600, padding: '2px 8px', borderRadius: 999, backgroundColor: 'rgba(59,130,246,0.12)', color: T.blue, fontFamily: T.mono }}>
                      {t.classAssigned}
                    </span>
                  )}
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 11, color: T.ink3, fontFamily: T.mono, flexWrap: 'wrap' }}>
                  <StaffStatusPill status={t.status} />
                  {t.phone && t.phone !== '—' && <span style={{ color: T.gold }}>📞 {t.phone}</span>}
                  {t.subjects && t.subjects.length > 0 && (
                    <span style={{ letterSpacing: 0.4 }}>{t.subjects.join(' · ')}</span>
                  )}
                </div>
              </div>

              {/* Activity stats */}
              <div style={{ display: 'flex', gap: 18, fontSize: 11, color: T.ink3, fontFamily: T.mono }}>
                {t.checkin && (
                  <div>
                    <div style={{ color: T.ink4, fontSize: 9.5, letterSpacing: 0.8 }}>CHECK IN</div>
                    <div style={{ color: t.status === 'in' ? T.green : T.ink2, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 6 }}>
                      {fmtTime(t.checkin.checked_in_at)}
                      {isLateCheckin(t.checkin.checked_in_at) && (
                        <span title="After the 07:15 cutoff — UGX 2,000 late penalty applied" style={{ fontSize: 9.5, fontWeight: 700, padding: '1px 6px', borderRadius: 999, backgroundColor: 'rgba(255,180,0,0.15)', color: T.gold, border: '1px solid rgba(255,180,0,0.3)' }}>
                          LATE
                        </span>
                      )}
                    </div>
                  </div>
                )}
                {t.checkin && t.checkin.checked_out_at && (
                  <div>
                    <div style={{ color: T.ink4, fontSize: 9.5, letterSpacing: 0.8 }}>CHECK OUT</div>
                    <div style={{ color: T.gold, fontWeight: 700 }}>{fmtTime(t.checkin.checked_out_at)}</div>
                  </div>
                )}
                {t.checkin && (
                  <div>
                    <div style={{ color: T.ink4, fontSize: 9.5, letterSpacing: 0.8 }}>{t.status === 'in' ? 'SO FAR' : 'TIME'}</div>
                    <div style={{ color: T.ink2, fontWeight: 700 }}>
                      {fmtDuration(t.checkin.checked_in_at, t.checkin.checked_out_at) || '—'}
                    </div>
                  </div>
                )}
                <div>
                  <div style={{ color: T.ink4, fontSize: 9.5, letterSpacing: 0.8 }}>ROLL CALLS</div>
                  <div style={{ color: t.streamsRolled.length > 0 ? T.green : T.ink3, fontWeight: 700 }}>
                    {t.streamsRolled.length > 0 ? t.streamsRolled.join(', ') : '—'}
                  </div>
                </div>
                <div>
                  <div style={{ color: T.ink4, fontSize: 9.5, letterSpacing: 0.8 }}>HEALTH (7d)</div>
                  <div style={{ color: t.healthCount > 0 ? T.blue : T.ink3, fontWeight: 700 }}>
                    {t.healthCount > 0 ? t.healthCount + ' notes' : '—'}
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>

        <style>{`
          @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
          }
        `}</style>
      </div>
    );
  }

  window.HeadStaffPanel = HeadStaffPanel;
})();

</script>
  <script type="text/babel" data-src="head-timetable-panel.jsx">
/* head-timetable-panel.jsx
   Sarah's digital timetable — color-coded by live activity.

   Pulls today's slots + cross-references with teacher_checkins and
   student_roll_call. Each cell gets a status:

     GREEN  — slot has happened or is happening, roll call taken
     ORANGE — slot is now or next, teacher checked in, roll not yet taken
     RED    — slot is past/now, teacher not checked in or roll not taken
     GRAY   — unassigned slot (no teacher), or out-of-school time

   Polls every 30s for live updates.

   Exposed as window.HeadTimetablePanel.
*/
(function () {
  const { useState, useEffect, useMemo, useCallback } = React;

  const T = {
    bg:       (typeof window!=='undefined'&&window.__BG)||'#0a1029',
    surface:  (typeof window!=='undefined'&&window.__SURFACE)||'#141e3c',
    surface2: (typeof window!=='undefined'&&window.__SURFACE2)||'#1a2548',
    surface3: (typeof window!=='undefined'&&window.__SURFACE3)||'#212d56',
    border:   'rgba(255,255,255,0.06)',
    borderStr:'rgba(255,255,255,0.10)',
    ink:      '#f5f6fa',
    ink2:     'rgba(245,246,250,0.85)',
    ink3:     'rgba(245,246,250,0.55)',
    ink4:     'rgba(245,246,250,0.40)',
    red:      '#FF4757',
    green:    (typeof window!=='undefined'&&window.__ACCENT)||'#00FC8F',
    gold:     '#FFB400',
    blue:     '#3B82F6',
    font:     "'Inter', -apple-system, system-ui, sans-serif",
    mono:     "'JetBrains Mono', ui-monospace, monospace",
    serif:    "'Instrument Serif', serif",
  };

  const isoDate = () => new Date().toISOString().slice(0, 10);
  // Postgres day_of_week: 1=Mon, 7=Sun. JS getDay: 0=Sun, 6=Sat. Map.
  const todayDow = () => {
    const js = new Date().getDay();
    return js === 0 ? 7 : js;
  };
  const fmtTime = (t) => {
    // t is "HH:MM:SS" string
    if (!t) return '';
    return t.slice(0, 5);
  };
  function getTimetableStreams() { var c = (window.SCHOOL_CONFIG && window.SCHOOL_CONFIG.classes) || []; return (c && c.length) ? c : ['P1V','P1P','P2V','P2P','P3V','P3P','P4V','P4P','P5V','P5P','P6V','P6P','P7V','P7P']; }
  const STREAMS = getTimetableStreams();

  async function loadTimetable(tenantId) {
    const sb = window.NextSession?.sb;
    if (!sb) return { error: 'No session' };
    const today = isoDate();
    const dow = todayDow();

    // Today's slots, joined with teacher name
    const { data: slots } = await sb
      .from('timetable_slots')
      .select('id, period, start_time, end_time, stream, subject, teacher_id, label')
      .eq('tenant_id', tenantId)
      .eq('day_of_week', dow)
      .order('period', { ascending: true });

    const { data: teachers } = await sb
      .from('teachers')
      .select('id, full_name')
      .eq('tenant_id', tenantId);

    // Today's check-ins (latest per teacher)
    const { data: checkins } = await sb
      .from('teacher_checkins')
      .select('teacher_id, checked_in_at, checked_out_at')
      .eq('tenant_id', tenantId)
      .gte('checked_in_at', today + 'T00:00:00');

    // Today's roll call records
    const { data: rollCalls } = await sb
      .from('student_roll_call')
      .select('teacher_id, stream')
      .eq('tenant_id', tenantId)
      .eq('roll_date', today);

    return {
      slots: slots || [],
      teachers: teachers || [],
      checkins: checkins || [],
      rollCalls: rollCalls || [],
    };
  }

  // Compute slot status given current time + activity
  function computeSlotStatus(slot, ctx) {
    const { now, checkinByTeacher, rollDoneFor } = ctx;

    // Unassigned slot → gray
    if (!slot.teacher_id) return { status: 'free', label: 'UNASSIGNED' };

    // Parse slot times into today's date for comparison
    const [sh, sm] = slot.start_time.split(':').map(Number);
    const [eh, em] = slot.end_time.split(':').map(Number);
    const start = new Date(now); start.setHours(sh, sm, 0, 0);
    const end   = new Date(now); end.setHours(eh, em, 0, 0);

    const teacherIn = checkinByTeacher[slot.teacher_id];
    const rollKey = slot.teacher_id + '|' + slot.stream;
    const rollTaken = rollDoneFor[rollKey];

    const isCurrent  = now >= start && now < end;
    const isPast     = now >= end;
    const isFuture   = now < start;

    if (rollTaken) {
      // Roll has been taken — green regardless of time
      return { status: 'green', label: isCurrent ? 'IN SESSION' : 'DONE' };
    }

    if (isFuture) {
      // Pending — assigned class scheduled later today
      return { status: 'orange', label: 'PENDING' };
    }

    if (isCurrent) {
      if (!teacherIn) return { status: 'red', label: 'TEACHER NOT IN' };
      // Teacher checked in, but no roll yet
      return { status: 'orange', label: 'NO ROLL YET' };
    }

    // Past
    if (!teacherIn)  return { status: 'red', label: 'MISSED · NO TEACHER' };
    return { status: 'red', label: 'MISSED · NO ROLL' };
  }

  const STATUS_TOKENS = {
    green:  { bg: 'rgba(0,252,143,0.16)',  border: 'rgba(0,252,143,0.4)',  fg: '#00FC8F', glow: '0 0 12px rgba(0,252,143,0.25)' },
    orange: { bg: 'rgba(255,180,0,0.16)',  border: 'rgba(255,180,0,0.4)',  fg: '#FFB400', glow: 'none' },
    red:    { bg: 'rgba(255,71,87,0.16)',  border: 'rgba(255,71,87,0.4)',  fg: '#FF4757', glow: '0 0 12px rgba(255,71,87,0.2)' },
    free:   { bg: 'rgba(255,255,255,0.02)', border: 'rgba(255,255,255,0.06)', fg: 'rgba(245,246,250,0.30)', glow: 'none' },
    gray:   { bg: 'rgba(59,130,246,0.08)', border: 'rgba(59,130,246,0.20)', fg: 'rgba(245,246,250,0.55)', glow: 'none' },
  };

  function HeadTimetablePanel() {
    const profile = window.PEAK_ROLE ? window.PEAK_ROLE.getProfile() : { tenantId: 'peak-primary' };
    const [data, setData] = useState({ loading: true });
    const [now, setNow] = useState(new Date());

    const refresh = useCallback(async () => {
      setData(d => ({ ...d, loading: true }));
      const r = await loadTimetable(profile.tenantId);
      setData(Object.assign({}, r, { loading: false }));
    }, [profile.tenantId]);

    useEffect(() => {
      refresh();
      const dataPoll = setInterval(refresh, 30000); // live data every 30s
      const clockTick = setInterval(() => setNow(new Date()), 60000); // tick minute
      return () => { clearInterval(dataPoll); clearInterval(clockTick); };
    }, [refresh]);

    // Build context for status compute
    const ctx = useMemo(() => {
      const checkinByTeacher = {};
      (data.checkins || []).forEach(c => {
        // Teacher is "in" if checked in AND not checked out
        if (!checkinByTeacher[c.teacher_id] || !c.checked_out_at) {
          checkinByTeacher[c.teacher_id] = !c.checked_out_at;
        }
      });
      const rollDoneFor = {};
      (data.rollCalls || []).forEach(r => {
        rollDoneFor[r.teacher_id + '|' + r.stream] = true;
      });
      const teacherById = {};
      (data.teachers || []).forEach(t => { teacherById[t.id] = t.full_name; });
      return { now, checkinByTeacher, rollDoneFor, teacherById };
    }, [data, now]);

    // Build matrix: periods (rows) × streams (cols)
    const matrix = useMemo(() => {
      const byPeriod = {};
      (data.slots || []).forEach(s => {
        if (!byPeriod[s.period]) byPeriod[s.period] = { period: s.period, start_time: s.start_time, end_time: s.end_time, slots: {} };
        byPeriod[s.period].slots[s.stream] = s;
      });
      return Object.values(byPeriod).sort((a, b) => a.period - b.period);
    }, [data]);

    // Stats across all of today's slots
    const stats = useMemo(() => {
      const c = { green: 0, orange: 0, red: 0, free: 0, gray: 0 };
      (data.slots || []).forEach(s => {
        const st = computeSlotStatus(s, ctx);
        c[st.status] = (c[st.status] || 0) + 1;
      });
      return c;
    }, [data, ctx]);

    return (
      <div style={{
        minHeight: '100vh', background: T.bg, color: T.ink,
        fontFamily: T.font, padding: '32px 36px 60px',
      }}>
        {/* Header */}

          <div>
            <div style={{ fontSize: 10.5, fontFamily: T.mono, letterSpacing: 1.5, color: T.ink3 }}>
              TIMETABLE · {now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' })} · {now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
            </div>
            <h1 style={{
              fontSize: 32, fontWeight: 400, margin: '6px 0 0',
              fontFamily: T.serif, letterSpacing: '-0.01em',
            }}>Today's classes — live</h1>
          </div>
          <button onClick={refresh} disabled={data.loading} style={{
            background: 'transparent', color: T.ink2,
            border: '1px solid ' + T.borderStr,
            padding: '8px 16px', borderRadius: 8,
            fontSize: 12, cursor: data.loading ? 'wait' : 'pointer', fontFamily: T.font,
          }}>{data.loading ? 'Refreshing…' : '↻ Refresh'}</button>
        </div>

        {/* Legend + stats */}
        <div style={{
          display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))',
          gap: 12, marginBottom: 24,
        }}>
          {[
            { key: 'green',  label: 'IN SESSION / DONE', count: stats.green },
            { key: 'orange', label: 'PENDING / IN PROGRESS', count: stats.orange },
            { key: 'red',    label: 'NEEDS ATTENTION',   count: stats.red },
            { key: 'free',   label: 'OPEN SLOTS',        count: stats.free },
          ].map(s => {
            const tk = STATUS_TOKENS[s.key];
            return (
              <div key={s.key} style={{
                background: tk.bg, border: '1px solid ' + tk.border,
                borderRadius: 12, padding: 14,
                display: 'flex', alignItems: 'center', gap: 12,
              }}>
                <div style={{
                  width: 10, height: 10, borderRadius: 999, background: tk.fg,
                  boxShadow: tk.glow,
                }} />
                <div>
                  <div style={{ fontSize: 9.5, fontFamily: T.mono, letterSpacing: 1, color: T.ink3 }}>{s.label}</div>
                  <div style={{ fontSize: 22, fontWeight: 700, color: tk.fg, fontFamily: T.serif }}>{s.count}</div>
                </div>
              </div>
            );
          })}
        </div>

        {/* The grid */}
        {data.loading && matrix.length === 0 ? (
          <div style={{ padding: 48, textAlign: 'center', color: T.ink3, fontFamily: T.mono, fontSize: 11 }}>
            LOADING TIMETABLE…
          </div>
        ) : matrix.length === 0 ? (
          <div style={{
            padding: 48, textAlign: 'center', color: T.ink4, fontStyle: 'italic',
            background: T.surface, border: '1px solid ' + T.border, borderRadius: 12,
          }}>
            No timetable seeded yet. Run the timetable schema SQL to populate today's slots.
          </div>
        ) : (
          <div style={{
            background: T.surface, border: '1px solid ' + T.border,
            borderRadius: 12, overflow: 'auto',
          }}>
            <table style={{
              width: '100%', borderCollapse: 'separate', borderSpacing: 0,
              minWidth: 1100,
            }}>
              <thead>
                <tr>
                  <th style={{
                    position: 'sticky', left: 0, zIndex: 2,
                    padding: '14px 12px', background: T.surface2,
                    fontSize: 10, fontFamily: T.mono, letterSpacing: 1.2,
                    color: T.ink3, textAlign: 'left', width: 110,
                    borderBottom: '1px solid ' + T.border,
                  }}>PERIOD</th>
                  {getTimetableStreams().map(s => (
                    <th key={s} style={{
                      padding: '14px 6px', background: T.surface2,
                      fontSize: 10.5, fontFamily: T.mono, letterSpacing: 1,
                      color: T.ink3, fontWeight: 700,
                      borderBottom: '1px solid ' + T.border,
                      borderLeft: '1px solid ' + T.border,
                      minWidth: 64,
                    }}>{s}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {matrix.map(row => {
                  // Is this period current?
                  const [sh, sm] = row.start_time.split(':').map(Number);
                  const [eh, em] = row.end_time.split(':').map(Number);
                  const start = new Date(now); start.setHours(sh, sm, 0, 0);
                  const end   = new Date(now); end.setHours(eh, em, 0, 0);
                  const isCurrent = now >= start && now < end;
                  return (
                    <tr key={row.period}>
                      <td style={{
                        position: 'sticky', left: 0, zIndex: 1,
                        padding: '10px 12px', background: isCurrent ? 'rgba(0,252,143,0.06)' : T.surface,
                        borderBottom: '1px solid ' + T.border,
                        fontSize: 12,
                      }}>
                        <div style={{ fontWeight: 700, color: isCurrent ? T.green : T.ink }}>
                          P{row.period}
                          {isCurrent && <span style={{ marginLeft: 6, fontSize: 9, color: T.green, fontFamily: T.mono }}>● NOW</span>}
                        </div>
                        <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, marginTop: 2 }}>
                          {fmtTime(row.start_time)}–{fmtTime(row.end_time)}
                        </div>
                      </td>
                      {STREAMS.map(stream => {
                        const slot = row.slots[stream];
                        if (!slot) {
                          // No slot defined → free
                          const tk = STATUS_TOKENS.free;
                          return (
                            <td key={stream} style={{
                              padding: 4, borderBottom: '1px solid ' + T.border, borderLeft: '1px solid ' + T.border,
                              verticalAlign: 'top',
                            }}>
                              <div style={{
                                background: tk.bg, border: '1px solid ' + tk.border,
                                borderRadius: 6, padding: '8px 6px', textAlign: 'center',
                                color: tk.fg, fontSize: 9, fontFamily: T.mono, letterSpacing: 0.4,
                                minHeight: 50,
                              }}>—</div>
                            </td>
                          );
                        }
                        const st = computeSlotStatus(slot, ctx);
                        const tk = STATUS_TOKENS[st.status];
                        const teacherName = slot.teacher_id ? ctx.teacherById[slot.teacher_id] : null;
                        return (
                          <td key={stream} style={{
                            padding: 4, borderBottom: '1px solid ' + T.border, borderLeft: '1px solid ' + T.border,
                            verticalAlign: 'top',
                          }}>
                            <div
                              title={teacherName ? `${slot.subject} · ${teacherName}` : slot.subject}
                              style={{
                                background: tk.bg,
                                border: '1px solid ' + tk.border,
                                borderRadius: 6, padding: '8px 6px',
                                boxShadow: tk.glow,
                                minHeight: 50,
                              }}
                            >
                              <div style={{
                                fontSize: 10.5, fontWeight: 700, color: tk.fg,
                                fontFamily: T.mono, letterSpacing: 0.5,
                                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                              }}>{slot.subject.slice(0, 7).toUpperCase()}</div>
                              {teacherName && (
                                <div style={{
                                  fontSize: 9.5, color: T.ink3, marginTop: 2,
                                  whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                                }}>{teacherName.split(' ')[0]}</div>
                              )}
                              <div style={{
                                fontSize: 8.5, fontFamily: T.mono, color: tk.fg,
                                marginTop: 2, letterSpacing: 0.3,
                              }}>{st.label}</div>
                            </div>
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        <div style={{
          marginTop: 16, fontSize: 10.5, fontFamily: T.mono, color: T.ink4,
          textAlign: 'right', letterSpacing: 0.6,
        }}>LIVE · UPDATES EVERY 30s · CLOCK TICKS EVERY MINUTE</div>
      </div>
    );
  }

  window.HeadTimetablePanel = HeadTimetablePanel;
})();

  </script>

  // Real-time replacement for the "Thursday · 14 May 2026 · Term 2 · Week 6"
  // strings that were pasted as static text at build time and never
  // updated — every dashboard kept showing that exact date forever.
  // Term-start assumption (no academic-calendar config exists anywhere in
  // this codebase to read a real one from): Term 2 2026 began Mon 4 May
  // 2026, a ~14-week term. Adjust TERM_START/TERM_LABEL below once School
  // Setup exposes a real term calendar.
  window.getSchoolCalendarLabel = function () {
    var now = new Date();
    var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    var dateStr = days[now.getDay()] + ' · ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
    var TERM_START = new Date(2026, 4, 4);
    var TERM_END = new Date(2026, 7, 15);
    var term = 'Term 2', week = null;
    if (now < TERM_START) { term = 'Term 1'; }
    else if (now > TERM_END) { term = 'Term 3'; }
    else { week = Math.floor((now - TERM_START) / (7 * 24 * 3600 * 1000)) + 1; }
    var termWeekStr = term + (week ? (' · Week ' + week) : '');
    return { dateStr: dateStr, termWeekStr: termWeekStr, full: dateStr + ' · ' + termWeekStr };
  };

  // Clean, tenant-aware /school/<slug>/<page> links for anything shared
  // outside the app (enrollment form, HR form) — never the raw internal
  // ./... path, which is a shared
  // multi-tenant deploy directory, not something a parent or applicant at
  // a real school should ever see. Requires the matching .htaccess rewrite
  // (already added for /enroll and /join-staff).
  window.peakSchoolLink = function (page) {
    var tenantId = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile().tenantId) ||
      (typeof window.getOSActiveTenant === 'function' ? window.getOSActiveTenant() : 'kabs-lily-junior-school-and-kindercare-centre');
    return window.location.origin + '/school/' + encodeURIComponent(tenantId) + '/' + page;
  };
  </script>

  const threads = [];

  const buses = [];

  // ─── Global search (real: students, teachers, screens) ─────────────────────
  function GlobalSearch() {
    const [q, setQ] = React.useState('');
    const [open, setOpen] = React.useState(false);
    const term = q.trim().toLowerCase();
    // window.PEAK.students/teachers only ever get populated by whichever
    // individual screen the user happens to be on triggering its own load —
    // GlobalSearch lives in the always-visible TopBar, so it needs to
    // guarantee that load itself instead of hoping some other screen did it
    // first (that's why searching for a real student/teacher right after
    // landing on "Today" returned nothing).
    React.useEffect(() => {
      try {
        const tenantId = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile().tenantId) || (typeof window.getOSActiveTenant === 'function' ? window.getOSActiveTenant() : null);
        if (!tenantId || !window.peakStore) return;
        if (!(window.PEAK && window.PEAK.studentsLive) && window.peakStore.loadStudents) window.peakStore.loadStudents(tenantId);
        if (!(window.PEAK && window.PEAK.teachersLive) && window.peakStore.loadTeachers) window.peakStore.loadTeachers(tenantId);
      } catch (e) {}
    }, []);
    const SCREENS = [['dash', 'Dashboard'], ['stud', 'Students'], ['attn', 'Attendance'], ['fees', 'Fees'], ['comm', 'Communications'], ['teach', 'Teachers'], ['trans', 'Transport'], ['learn', 'Learning'], ['rep', 'Reports'], ['finance', 'Finance'], ['timetable', 'Timetable'], ['today', 'Today']];
    let results = [];
    if (term) {
      const DD = window.PEAK || {};
      const feeKw = /owe|owing|overdue|balance|arrear|fees|debt|unpaid|outstanding/.test(term);
      (DD.students || []).forEach(st => { if ((st.name + ' ' + (st.guardian || '') + ' ' + (st.stream || '')).toLowerCase().indexOf(term) >= 0) results.push({ type: 'Student', label: st.name, sub: (st.stream || '') + (st.guardian ? (' · ' + st.guardian) : ''), run: () => window.peakOpenProfile && window.peakOpenProfile(st) }); });
      (DD.teachers || []).forEach(t => { if ((t.name + ' ' + ((t.subjects || []).join(' ')) + ' ' + (t.role || '')).toLowerCase().indexOf(term) >= 0) results.push({ type: 'Teacher', label: t.name, sub: ((t.subjects || []).join(', ')) || t.role || 'Teacher', run: () => window.peakNav && window.peakNav('teach') }); });
      // Fees — a named student's balance, or fee keywords list everyone owing
      (DD.students || []).forEach(st => { const bal = Number(st.balance) || 0; const named = (st.name || '').toLowerCase().indexOf(term) >= 0; if ((feeKw && bal > 0) || (named && bal > 0)) results.push({ type: 'Fee', label: st.name + ' — UGX ' + bal.toLocaleString() + ' due', sub: (st.stream || '') + ' · open Fees', run: () => window.peakNav && window.peakNav('fees') }); });
      // Messages — parent threads by parent, child or last message
      (DD.threads || []).forEach(th => { if ((th.name + ' ' + (th.child || '') + ' ' + (th.last || '')).toLowerCase().indexOf(term) >= 0) results.push({ type: 'Message', label: th.name, sub: (th.child ? (th.child + ' · ') : '') + (th.last || ''), run: () => window.peakNav && window.peakNav('comm') }); });
      SCREENS.forEach(([k, l]) => { if (l.toLowerCase().indexOf(term) >= 0) results.push({ type: 'Open', label: l, sub: 'Go to ' + l, run: () => window.peakNav && window.peakNav(k) }); });
      // de-dup identical labels, cap
      const seen = {}; results = results.filter(r => { const key = r.type + '|' + r.label; if (seen[key]) return false; seen[key] = 1; return true; }).slice(0, 12);
    }
    const go = (r) => { setOpen(false); setQ(''); try { r.run(); } catch (e) {} };
    return (
      <div style={{ position: 'relative', width: 340 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 14px', borderRadius: 10, background: T.surface, border: '1px solid ' + T.border }}>
          <span style={{ color: T.ink3, fontSize: 14 }}>{'\u2315'}</span>
          <input value={q} placeholder="Search students, teachers, fees, messages…" onChange={e => { setQ(e.target.value); setOpen(true); }} onFocus={() => setOpen(true)} onBlur={() => setTimeout(() => setOpen(false), 160)} onKeyDown={e => { if (e.key === 'Enter' && results[0]) go(results[0]); if (e.key === 'Escape') setOpen(false); }} style={{ border: 'none', outline: 'none', background: 'transparent', flex: 1, fontSize: 13, color: T.ink, fontFamily: T.font }} />
          <span style={{ fontSize: 10, color: T.ink3, fontFamily: T.mono, border: '1px solid ' + T.border, borderRadius: 5, padding: '2px 6px' }}>{'\u2318K'}</span>
        </div>
        {open && term ? (
          <div style={{ position: 'absolute', top: 'calc(100% + 6px)', left: 0, right: 0, background: T.surface, border: '1px solid ' + T.border, borderRadius: 10, boxShadow: '0 12px 30px rgba(0,0,0,0.4)', zIndex: 300, overflow: 'hidden', maxHeight: 360, overflowY: 'auto' }}>
            {results.length === 0 ? <div style={{ padding: '12px 14px', color: T.ink3, fontSize: 12.5 }}>No matches for “{q}”.</div> :
              results.map((r, i) => (
                <div key={i} onMouseDown={() => go(r)} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 14px', cursor: 'pointer', borderTop: i ? '1px solid ' + T.border : 'none' }}>
                  <span style={{ fontSize: 9.5, fontFamily: T.mono, color: T.ink3, border: '1px solid ' + T.border, borderRadius: 5, padding: '2px 6px', minWidth: 54, textAlign: 'center' }}>{r.type}</span>
                  <div style={{ minWidth: 0 }}><div style={{ fontSize: 13, color: T.ink, fontWeight: 600 }}>{r.label}</div><div style={{ fontSize: 11, color: T.ink3 }}>{r.sub}</div></div>
                </div>
              ))}
          </div>
        ) : null}
      </div>
    );
  }

  // ─── attendance heat grid ─────────────────────────────────────────────────
  function AttendanceGrid() {
    const cellFor = (pct) => {
      if (pct >= 95) return { bg: 'rgba(61,214,140,0.20)', border: 'rgba(61,214,140,0.40)', fg: T.good };
      if (pct >= 88) return { bg: 'rgba(255,181,61,0.16)', border: 'rgba(255,181,61,0.35)', fg: T.warn };
      return { bg: 'rgba(226,58,82,0.18)', border: 'rgba(226,58,82,0.40)', fg: T.redInk };
    };
    const CLASS_ORDER = ['Primary Seven', 'Primary Six', 'Primary Five', 'Primary Four', 'Primary Three', 'Primary Two', 'Primary One', 'Top Class', 'Middle Class', 'Baby Class'];
    const _studs = (window.PEAK && window.PEAK.students) || [];
    const _cfg = window.SCHOOL_CONFIG || {};
    const _cfgCls = (_cfg.classes && _cfg.classes.length) ? _cfg.classes.slice() : [];
    const _studCls = Array.from(new Set(_studs.map(function (x) { return x.stream || x.class; }).filter(Boolean)));
    const _rawClasses = _cfgCls.length ? _cfgCls : _studCls;
    const _classes = _rawClasses.sort((a, b) => {
      const ia = CLASS_ORDER.indexOf(a);
      const ib = CLASS_ORDER.indexOf(b);
      return (ia !== -1 ? ia : 99) - (ib !== -1 ? ib : 99);
    });
    const _hasRoster = _studs.length > 0;
    const _rows = _classes.map(function (cls) {
      const inC = _studs.filter(function (x) { return (x.stream || x.class) === cls; });
      const wa = inC.filter(function (x) { return x.attendanceWk != null; });
      const pct = wa.length ? Math.round(wa.reduce(function (a, x) { return a + x.attendanceWk; }, 0) / wa.length) : null;
      return { cls: cls, total: inC.length, pct: pct };
    });
    return (
      <Card title="Attendance by class" subtitle={_hasRoster ? (_classes.length + ' classes · from your roster') : 'No roster yet'} action={
        <div style={{ display: 'flex', gap: 12, fontSize: 11, color: T.ink3, alignItems: 'center' }}>

  function _liveSignals() {

    const atRisk = studs.filter(s => s.flag === 'risk' || (s.attendanceWk != null && s.attendanceWk < 70));
    const noPhone = studs.filter(s => !s.guardianPhone);
    const absent = Number(k.absentToday) || 0;
    const nav = (scr) => { if (window.peakNav) window.peakNav(scr); };
    const askNia = (q) => { if (window.PEAK_ASKNEXT) window.PEAK_ASKNEXT.open(q); };
    return { studs, overdue, overdueTotal, atRisk, noPhone, absent, nav, askNia, hasData: studs.length > 0 };
