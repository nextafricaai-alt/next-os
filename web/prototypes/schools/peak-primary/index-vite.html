  // ─── AI assistant card ────────────────────────────────────────────────────
  // Live "who is in school vs who is teaching right now" — Nia spots idle staff + uncovered classes.
  function StaffNowCard() {
    const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
    const tn = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile().tenantId) || 'peak-primary';
    const [tt, setTt] = React.useState(null);
    const [staff, setStaff] = React.useState(null);
    const [teachers, setTeachers] = React.useState([]);
    const [, force] = React.useReducer(n => n + 1, 0);
    React.useEffect(() => {
      const load = () => {
        fetch(WK + '/os-data?kind=timetable&tenant=' + encodeURIComponent(tn)).then(r => r.json()).then(d => { const rec = ((d && d.records) || [])[0]; setTt((rec && rec.payload) || { periods: [], grid: {} }); }).catch(() => setTt({ periods: [], grid: {} }));
        fetch(WK + '/staff-status?tenant=' + encodeURIComponent(tn)).then(r => r.json()).then(d => setStaff((d && d.staff) || [])).catch(() => setStaff([]));
        fetch(WK + '/teachers?tenant=' + encodeURIComponent(tn)).then(r => r.ok ? r.json() : null).then(d => setTeachers((d && d.teachers) || [])).catch(() => {});
        // Fire a live no-show check (server dedups one alert per period) so the head gets pushed even before the cron runs.
        fetch(WK + '/attendance-watch?tenant=' + encodeURIComponent(tn)).catch(() => {});
      };
      load(); const iv = setInterval(() => force(), 60000); const lv = setInterval(load, 300000); return () => { clearInterval(iv); clearInterval(lv); };
    }, []);
    if (tt === null || staff === null) return null;
    const DN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; const day = DN[new Date().getDay()];
    const toM = (h) => { const m = String(h || '').match(/(\d{1,2}):(\d{2})/); return m ? (parseInt(m[1], 10) * 60 + parseInt(m[2], 10)) : null; };
    const nowM = (new Date()).getHours() * 60 + (new Date()).getMinutes();
    const periods = (tt && tt.periods) || [];
    let curIdx = -1, curPeriod = null;
    periods.forEach((p, i) => { const a = toM(p.s), b = toM(p.e); if (a != null && b != null && nowM >= a && nowM < b) { curIdx = i; curPeriod = p; } });
    const presentNames = new Set((staff || []).filter(s => /in at/i.test(s.status || '') && !/checked out/i.test(s.status || '')).map(s => (s.name || '').toLowerCase()));
    let uncovered = [], idle = [], teachingNow = 0;
    const weekday = day !== 'Sat' && day !== 'Sun';
    if (curIdx >= 0 && tt && tt.grid && weekday) {
      const teachingEmails = new Set();
      Object.keys(tt.grid).forEach(cls => { const cell = ((tt.grid[cls] || {})[day] || [])[curIdx]; if (cell && cell.subject && cell.teacherEmail) {
        teachingEmails.add((cell.teacherEmail || '').toLowerCase());
        const tName = ((teachers || []).find(t => (t.email || '').toLowerCase() === (cell.teacherEmail || '').toLowerCase()) || {}).full_name || '';
        const present = tName && presentNames.has(tName.toLowerCase());
        if (!present) uncovered.push({ cls: cls, subject: cell.subject, teacher: tName || cell.teacherEmail });
      } });
      (teachers || []).forEach(t => { const nm = (t.full_name || '').toLowerCase(); const em = (t.email || '').toLowerCase(); if (presentNames.has(nm)) { if (teachingEmails.has(em)) teachingNow++; else idle.push(t.full_name); } });
    }
    const hasTT = periods.length > 0 && Object.keys((tt && tt.grid) || {}).length > 0;
    return (
      <Card pad={0} style={{ marginTop: 14 }}>
        <div style={{ padding: 18 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
            <span style={{ width: 26, height: 26, borderRadius: 7, background: T.red, color: '#fff', display: 'grid', placeItems: 'center', fontFamily: T.mono, fontSize: 10.5, fontWeight: 700 }}>AI</span>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13.5, fontWeight: 600 }}>Staff right now {curPeriod ? <span style={{ color: T.ink3, fontWeight: 400 }}>· Period {curPeriod.l} ({curPeriod.s}–{curPeriod.e})</span> : null}</div>
              <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono }}>live · check-ins vs timetable</div>
            </div>
          </div>
          {!hasTT ? (
            <div style={{ fontSize: 12.5, color: T.ink3, lineHeight: 1.5 }}>Build the timetable (Timetable → Generate) so Nia can tell who should be teaching each period.</div>
          ) : !weekday ? (
            <div style={{ fontSize: 12.5, color: T.ink3 }}>Weekend — no lessons scheduled.</div>
          ) : curIdx < 0 ? (
            <div style={{ fontSize: 12.5, color: T.ink3 }}>No lesson period in session right now (break or before/after school).</div>
          ) : (
            <div style={{ display: 'grid', gap: 10 }}>
              <div style={{ display: 'flex', gap: 16, fontSize: 12, color: T.ink2 }}>
                <span><b style={{ color: T.good }}>{teachingNow}</b> teaching now</span>
                <span><b style={{ color: idle.length ? T.warn : T.ink }}>{idle.length}</b> in school, free</span>
                <span><b style={{ color: uncovered.length ? T.red : T.ink }}>{uncovered.length}</b> classes uncovered</span>
              </div>
              {uncovered.length > 0 && (
                <div style={{ background: 'rgba(226,58,82,0.08)', border: '1px solid rgba(226,58,82,0.3)', borderRadius: 9, padding: '9px 12px', fontSize: 12.5, color: T.ink2, lineHeight: 1.5 }}>
                  <b style={{ color: T.ink }}>Uncovered now:</b> {uncovered.slice(0, 3).map(u => u.cls + ' ' + u.subject + ' (' + (u.teacher || '?') + ' not in)').join('; ')}{uncovered.length > 3 ? '…' : ''}.
                  {idle.length > 0 ? <span> <b style={{ color: T.ink }}>{idle.slice(0, 2).join(', ')}</b> {idle.length === 1 ? 'is' : 'are'} in school and free — reassign to cover?</span> : null}
                </div>
              )}
              {uncovered.length === 0 && idle.length > 0 && (
                <div style={{ fontSize: 12.5, color: T.ink3, lineHeight: 1.5 }}><b style={{ color: T.ink }}>{idle.join(', ')}</b> {idle.length === 1 ? 'is' : 'are'} in school but not teaching this period (free).</div>
              )}
              {uncovered.length === 0 && idle.length === 0 && (
                <div style={{ fontSize: 12.5, color: T.good }}>✓ Every scheduled class has its teacher in. Nothing to action.</div>
              )}
            </div>
          )}
        </div>
      </Card>
    );
  }

      if (lower.includes('middle')) return 'Middle Class';
      if (lower.includes('top')) return 'Top Class';

      if (lower.includes('four') || lower === 'p4' || lower === 'p.4' || lower.includes('primary 4') || lower.includes('primary four')) return 'Primary Four';

          const sClass = s.stream || s.class || '';

          return sNorm === filterNorm || sClass.toLowerCase().includes(streamFilter.toLowerCase()) || streamFilter.toLowerCase().includes(sClass.toLowerCase());

        if (feesFilter === 'overdue') {
          r = r.filter(s => (s.balance || 0) > 0 || s.fees === 'overdue' || s.fees === 'partial');

          r = r.filter(s => (s.balance || 0) <= 0 || s.fees === 'paid');
        } else if (feesFilter === 'partial') {
          r = r.filter(s => (s.balance || 0) > 0 && ((s.paidAmount || 0) > 0 || s.fees === 'partial'));
        }
      }
      if (sort === 'name') r.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      if (sort === 'risk') r.sort((a, b) => (a.attendanceWk == null ? 101 : a.attendanceWk) - (b.attendanceWk == null ? 101 : b.attendanceWk));
      if (sort === 'fees') r.sort((a, b) => (b.balance || 0) - (a.balance || 0));
      if (sort === 'recent') r.sort((a, b) => (a.lastSeen || '').localeCompare(b.lastSeen || ''));
      return r;

    const classOpts = useMemo(() => {

        { id: 'Primary Five', label: 'Primary Five (P5)' },
        { id: 'Primary Six', label: 'Primary Six (P6)' },
        { id: 'Primary Seven', label: 'Primary Seven (P7)' }
      ];
      // Collect any extra classes from roster
      const extra = new Set();
      studs.forEach(s => {
        const c = s.stream || s.class;
        if (c) extra.add(c);
      });
      return standard;

                  <button onClick={() => window.open(window.peakSchoolLink ? window.peakSchoolLink('enroll') : './student-enrollment-form.html', '_blank')} style={{ background: 'rgba(0,252,143,0.12)', border: '1px solid rgba(0,252,143,0.25)', color: T.green, padding: '6px 12px', borderRadius: 7, fontSize: 12, cursor: 'pointer', fontWeight: 600 }}>Share Enrollment Form 🔗</button>
                  <button style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, padding: '6px 12px', borderRadius: 7, fontSize: 12, cursor: 'pointer' }}>Generate report</button>
                  <button onClick={() => window.peakExportRoster && window.peakExportRoster()} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, padding: '6px 12px', borderRadius: 7, fontSize: 12, cursor: 'pointer' }}>Export CSV</button>
                </div>

                <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono }}>{rows.filter(s => s.flag === 'risk').length} at-risk in current view</div>

            {drawerOpen && <Drawer s={selected} onClose={() => setDrawerOpen(false)} onOpenProfile={onOpenProfile} />}

  }

  return { Students };
})();

  <script type="text/babel" data-src="src/v4-profile.jsx">
/* src/v4-profile.jsx */
/* global React, PEAK, V4 */
// Peak Dark · Student profile deep dive
// Student profile — loads the real child by id.

const PD_Profile = (function () {
  const T = window.V4.T;
  const D = window.PEAK || window.PEAK_FALLBACK;
  const { useState } = React;

  function Rail({ active, onNav }) {
    const items = [
      { k: 'dash', glyph: '◫' }, { k: 'today', glyph: '◉' },
      { k: 'stud', glyph: '☰' }, { k: 'attn', glyph: '◐' },
      { k: 'fees', glyph: '⌗' }, { k: 'comm', glyph: '◊' }, { k: 'teach', glyph: '◇' },
    ];
    return (
      <aside style={{
        width: 72, background: T.bg, borderRight: '1px solid ' + T.border,
        display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '14px 0', flexShrink: 0,
      }}>
        <div style={{ width: 40, height: 40, borderRadius: 10, background: '#fff', display: 'grid', placeItems: 'center', marginBottom: 18 }}>
          <img src="./assets/peak-logo.png" alt="" style={{ width: 34, height: 34, objectFit: 'contain' }} />
        </div>
        {items.map(n => {
          const a = active === n.k;
          return (
            <button key={n.k} onClick={() => onNav && onNav(n.k)} style={{
              width: 48, height: 44, borderRadius: 10, border: 'none',
              background: a ? T.surface2 : 'transparent', color: a ? T.red : T.ink3,
              fontSize: 18, cursor: 'pointer', marginBottom: 4, position: 'relative',
              display: 'grid', placeItems: 'center',
            }}>
              {a && <span style={{ position: 'absolute', left: -8, top: 10, bottom: 10, width: 3, background: T.red, borderRadius: 999 }} />}
              {n.glyph}
            </button>
          );
        })}
        <div style={{ flex: 1 }} />
        <div style={{ width: 32, height: 32, borderRadius: 999, background: T.gold, color: T.bg, display: 'grid', placeItems: 'center', fontSize: 11, fontWeight: 700 }}>SM</div>
      </aside>
    );
  }

  function Pill({ children, tone }) {
    const map = {
      good: { bg: T.goodSft, fg: T.good },
      warn: { bg: T.warnSft, fg: T.warn },
      bad:  { bg: T.redSft,  fg: T.redInk },
      brand:{ bg: 'rgba(58,79,156,0.30)', fg: '#a8b4e8' },
      neutral: { bg: T.surface2, fg: T.ink2 },
    }[tone];
    return <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11, fontWeight: 600,
      padding: '3px 9px', borderRadius: 999, background: map.bg, color: map.fg,
      fontFamily: T.mono, letterSpacing: '0.02em',
    }}>{children}</span>;
  }

  function Card({ children, title, eyebrow, action, pad = 20 }) {
    return (
      <div style={{ background: T.surface, border: '1px solid ' + T.border, borderRadius: 12, padding: pad }}>
        {(title || eyebrow) && (
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 14 }}>
            <div>
              {eyebrow && <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', fontWeight: 600, marginBottom: 4 }}>{eyebrow}</div>}
              {title && <div style={{ fontSize: 14, color: T.ink, fontWeight: 600 }}>{title}</div>}
            </div>
            {action}
          </div>
        )}
        {children}
      </div>
    );
  }

  function ProfileNotes({ studentId }) {
    const [notes, setNotes] = React.useState(null);
    React.useEffect(() => {
      const sb = window.NextSession && window.NextSession.sb;
      if (!sb || studentId == null) { setNotes([]); return; }
      let live = true;
      sb.from('student_health_records').select('id, category, severity, description, recorded_at, follow_up_needed, resolved_at').eq('student_id', studentId).order('recorded_at', { ascending: false }).limit(50).then(function (r) { if (live) setNotes((r && r.data) || []); }).catch(function () { if (live) setNotes([]); });
      return function () { live = false; };
    }, [studentId]);
    const catColor = function (c) { return ({ illness: T.red, injury: T.gold, wellbeing: T.blue, behavior: T.green, behaviour: T.green }[c] || T.ink3); };
    const fmt = function (d) { try { return new Date(d).toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' \u00b7 ' + new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
    return (
      <Card eyebrow="NOTES & LOGS" title="Teacher notes" action={<Pill tone="brand">{notes ? notes.length : '\u2026'}</Pill>}>
        {notes === null ? <div style={{ color: T.ink3, fontSize: 12.5 }}>Loading\u2026</div> :
          notes.length === 0 ? <div style={{ color: T.ink3, fontSize: 12.5, lineHeight: 1.5 }}>No notes logged for this student yet. When a teacher logs a wellbeing, behaviour or health note, it appears here automatically.</div> : (
            <div style={{ display: 'grid', gap: 10, maxHeight: 300, overflow: 'auto' }}>
              {notes.map(function (h, i) { return (
                <div key={h.id || i} style={{ borderLeft: '3px solid ' + catColor(h.category), background: T.bg, borderRadius: 8, padding: '10px 12px', opacity: h.resolved_at ? 0.6 : 1 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8 }}>
                    <span style={{ fontSize: 10, fontFamily: T.mono, color: catColor(h.category), textTransform: 'uppercase', fontWeight: 700 }}>{h.category}{h.severity ? (' \u00b7 ' + h.severity) : ''}</span>
                    <span style={{ fontSize: 10, color: T.ink4, fontFamily: T.mono }}>{fmt(h.recorded_at)}</span>
                  </div>
                  <div style={{ fontSize: 12.5, color: T.ink2, marginTop: 5, lineHeight: 1.45 }}>{h.description}</div>
                  {(h.follow_up_needed && !h.resolved_at) ? <div style={{ fontSize: 10.5, color: T.gold, marginTop: 4 }}>\u2691 follow-up needed</div> : (h.resolved_at ? <div style={{ fontSize: 10.5, color: T.good, marginTop: 4 }}>\u2713 resolved</div> : null)}
                </div>
              ); })}
            </div>
          )}
      </Card>
    );
  }

  // ── More actions: transfer class/stream, change combination (A-level), edit ──
  function StudentActionsMenu({ stu, onUpdated }) {
    const [open, setOpen] = React.useState(false);
    const [modal, setModal] = React.useState(null);   // 'transfer' | 'combo' | 'edit'
    const [busy, setBusy] = React.useState(false);
    const cfg = window.SCHOOL_CONFIG || {};
    const classes = cfg.classes || [];
    const combos = cfg.combinations || [];
    const vocab = cfg.vocab || {};
    const unit = (vocab.unit || 'Class');
    const isALevel = combos.length > 0 && /s5|s6|year|senior\s*5|senior\s*6/i.test(stu.stream || '');
    const sb = window.NextSession && window.NextSession.sb;
    const [val, setVal] = React.useState({ stream: stu.stream || '', combination: stu.combination || '', name: stu.name || '', guardian: stu.guardian || '', phone: stu.guardianPhone || '', age: stu.age || '' });
    React.useEffect(() => { setVal({ stream: stu.stream || '', combination: stu.combination || '', name: stu.name || '', guardian: stu.guardian || '', phone: stu.guardianPhone || '', age: stu.age || '' }); }, [stu.id]);

    const apply = async (dbFields, localApply, label) => {
      if (!sb || stu.id == null) { window.peakToast && window.peakToast('Not connected to the database', 'info', 'Sign in to the school to make changes.'); return; }
      setBusy(true);
      try {
        const r = await sb.from('students').update(dbFields).eq('id', stu.id);
        if (r && r.error) throw r.error;
        localApply();
        if (window.peakStore && window.peakStore.notify) { try { window.peakStore.notify(); } catch (e) {} }
        window.peakToast && window.peakToast(label, 'success', stu.name);
        setModal(null); setOpen(false);
        if (onUpdated) onUpdated();
      } catch (e) { window.peakToast && window.peakToast('Could not update', 'info', String((e && e.message) || e)); }
      setBusy(false);
    };

    const ov = { position: 'fixed', inset: 0, zIndex: 9200, background: 'rgba(5,8,22,0.72)', backdropFilter: 'blur(6px)', display: 'grid', placeItems: 'center', padding: 20 };
    const card = { width: '100%', maxWidth: 440, background: T.surface, border: '1px solid ' + T.border, borderRadius: 16, padding: 22, color: T.ink, fontFamily: T.font };
    const inp = { width: '100%', background: T.bg, border: '1px solid ' + T.border, borderRadius: 9, padding: '10px 12px', fontSize: 13, color: T.ink, fontFamily: T.font, outline: 'none', boxSizing: 'border-box' };
    const lbl = { fontSize: 11, color: T.ink3, fontFamily: T.mono, marginBottom: 5 };
    const item = (label, sub, fn) => <button onClick={fn} style={{ display: 'block', width: '100%', textAlign: 'left', background: 'transparent', border: 'none', borderBottom: '1px solid ' + T.border, padding: '11px 14px', cursor: 'pointer', color: T.ink }}><div style={{ fontSize: 13, fontWeight: 600 }}>{label}</div><div style={{ fontSize: 11, color: T.ink3, marginTop: 2 }}>{sub}</div></button>;

    return (
      <div style={{ position: 'relative', display: 'inline-block' }}>
        <button onClick={() => setOpen(v => !v)} style={{ background: 'transparent', color: T.ink3, border: 'none', padding: '9px 12px', fontSize: 16, cursor: 'pointer' }}>{'\u22EF'}</button>
        {open && (
          <div style={{ position: 'absolute', right: 0, top: '100%', marginTop: 4, width: 250, background: T.surface, border: '1px solid ' + T.border, borderRadius: 12, boxShadow: '0 14px 34px rgba(0,0,0,0.5)', zIndex: 50, overflow: 'hidden' }}>
            {item('Transfer ' + unit.toLowerCase(), 'Move to another ' + unit.toLowerCase() + ' / stream', () => { setVal(v => ({ ...v, stream: stu.stream || (classes[0] || '') })); setModal('transfer'); })}
            {isALevel && item('Change combination', 'A-Level subject combination', () => { setVal(v => ({ ...v, combination: stu.combination || '' })); setModal('combo'); })}
            {item('Edit details', 'Name, age, guardian, phone', () => { setVal({ stream: stu.stream || '', combination: stu.combination || '', name: stu.name || '', guardian: stu.guardian || '', phone: stu.guardianPhone || '', age: stu.age || '' }); setModal('edit'); })}
            <button onClick={() => setOpen(false)} style={{ display: 'block', width: '100%', textAlign: 'left', background: 'transparent', border: 'none', padding: '10px 14px', cursor: 'pointer', color: T.ink3, fontSize: 12.5 }}>Cancel</button>
          </div>
        )}

        {modal === 'transfer' && (
          <div style={ov} onClick={() => setModal(null)}>
            <div style={card} onClick={e => e.stopPropagation()}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 4 }}>Transfer {stu.name}</div>
              <div style={{ fontSize: 12.5, color: T.ink3, marginBottom: 16 }}>Currently in <b>{stu.stream || '—'}</b>. Choose the new {unit.toLowerCase()}.</div>
              <div style={lbl}>{unit.toUpperCase()} / STREAM</div>
              <select style={inp} value={val.stream} onChange={e => setVal(v => ({ ...v, stream: e.target.value }))}>
                {(classes.length ? classes : [stu.stream]).map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 18 }}>
                <button onClick={() => setModal(null)} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 9, padding: '9px 16px', fontSize: 13, cursor: 'pointer' }}>Cancel</button>
                <button onClick={() => apply({ stream: val.stream }, () => { stu.stream = val.stream; }, 'Transferred to ' + val.stream)} disabled={busy || val.stream === stu.stream} style={{ background: T.red, color: '#fff', border: 'none', borderRadius: 9, padding: '9px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>{busy ? 'Saving…' : 'Transfer'}</button>
              </div>
            </div>
          </div>
        )}

        {modal === 'combo' && (
          <div style={ov} onClick={() => setModal(null)}>
            <div style={card} onClick={e => e.stopPropagation()}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 4 }}>Change combination</div>
              <div style={{ fontSize: 12.5, color: T.ink3, marginBottom: 16 }}>{stu.name} · {stu.stream}. Current: <b>{stu.combination || '— none —'}</b></div>
              <div style={lbl}>A-LEVEL COMBINATION</div>
              <select style={inp} value={val.combination} onChange={e => setVal(v => ({ ...v, combination: e.target.value }))}>
                <option value="">— none —</option>
                {combos.map(c => <option key={c.name} value={c.name}>{c.name}{(c.subjects && c.subjects.length) ? (' · ' + c.subjects.join('/')) : ''}</option>)}
              </select>
              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 18 }}>
                <button onClick={() => setModal(null)} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 9, padding: '9px 16px', fontSize: 13, cursor: 'pointer' }}>Cancel</button>
                <button onClick={() => apply({ combination: val.combination || null }, () => { stu.combination = val.combination; }, 'Combination set to ' + (val.combination || 'none'))} disabled={busy} style={{ background: T.red, color: '#fff', border: 'none', borderRadius: 9, padding: '9px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>{busy ? 'Saving…' : 'Save'}</button>
              </div>
            </div>
          </div>
        )}

        {modal === 'edit' && (
          <div style={ov} onClick={() => setModal(null)}>
            <div style={card} onClick={e => e.stopPropagation()}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 16 }}>Edit {stu.name}</div>
              <div style={{ display: 'grid', gap: 12 }}>
                <label><div style={lbl}>FULL NAME</div><input style={inp} value={val.name} onChange={e => setVal(v => ({ ...v, name: e.target.value }))} /></label>
                <label><div style={lbl}>AGE</div><input style={inp} type="number" value={val.age} onChange={e => setVal(v => ({ ...v, age: e.target.value }))} placeholder="e.g. 10" /></label>
                <label><div style={lbl}>GUARDIAN NAME</div><input style={inp} value={val.guardian} onChange={e => setVal(v => ({ ...v, guardian: e.target.value }))} /></label>
                <label><div style={lbl}>GUARDIAN PHONE</div><input style={inp} value={val.phone} onChange={e => setVal(v => ({ ...v, phone: e.target.value }))} placeholder="+256 7..." /></label>
              </div>
              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 18 }}>
                <button onClick={() => setModal(null)} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 9, padding: '9px 16px', fontSize: 13, cursor: 'pointer' }}>Cancel</button>
                <button onClick={() => apply({ name: val.name.trim(), age: val.age ? Number(val.age) : null, guardian_name: val.guardian.trim(), guardian_phone: val.phone.replace(/[^0-9+]/g, '') }, () => { stu.name = val.name.trim(); stu.age = val.age ? Number(val.age) : null; stu.guardian = val.guardian.trim(); stu.guardianPhone = val.phone.trim(); }, 'Details updated')} disabled={busy || !val.name.trim()} style={{ background: T.red, color: '#fff', border: 'none', borderRadius: 9, padding: '9px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>{busy ? 'Saving…' : 'Save changes'}</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  function Profile({ embed = false, onNav, onBack, studentId } = {}) {
    const [tab, setTab] = useState('Overview');
    const [, _forceP] = React.useReducer(n => n + 1, 0);
    const tabs = ['Overview','Attendance','Academics','Behaviour','Fees','Comms'];

    // Opening a profile directly (deep link, or before the Students screen
    // has loaded its roster) could hit window.PEAK.students while it's

  return { Profile };
})();

// Peak Dark · Fees · reconciliation

const PD_Fees = (function () {
  const T = window.V4.T;

  const { useState } = React;

  function Rail({ active, onNav }) {

        <div style={{ flex: 1 }} />
        <div style={{ width: 32, height: 32, borderRadius: 999, background: T.gold, color: T.bg, display: 'grid', placeItems: 'center', fontSize: 11, fontWeight: 700 }}>SM</div>
      </aside>
    );
  }

  function Pill({ children, tone }) {
    const map = {
      good: { bg: T.goodSft, fg: T.good },
      warn: { bg: T.warnSft, fg: T.warn },
      bad:  { bg: T.redSft,  fg: T.redInk },
      brand:{ bg: 'rgba(58,79,156,0.30)', fg: '#a8b4e8' },
      neutral: { bg: T.surface2, fg: T.ink2 },
    }[tone];
    return <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11, fontWeight: 600,
      padding: '3px 9px', borderRadius: 999, background: map.bg, color: map.fg,
      fontFamily: T.mono, letterSpacing: '0.02em',
    }}>{children}</span>;
  }

  function Fees({ embed = false, onNav, onRecordPayment } = {}) {
    const { useState, useEffect } = React;
    const [, force] = useState(0);
    const [tab, setTab] = useState('accounts');
    const [searchTerm, setSearchTerm] = useState('');
    const [selectedStream, setSelectedStream] = useState('');
    const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
    const tenant = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile().tenantId) || 'peak-primary';

    // Live store: real students + balances
    useEffect(() => { if (window.peakStore && window.peakStore.subscribe) return window.peakStore.subscribe(() => force(x => x + 1)); }, []);
    useEffect(() => { try { if (window.peakStore && window.peakStore.loadStudents && !(window.PEAK && window.PEAK.studentsLive)) window.peakStore.loadStudents(tenant); } catch (e) {} }, []);

    // Fee structure (per-class termly fee + requirements) — saved per school
    const [fs, setFs] = useState(null);
    const [fsId, setFsId] = useState(null);
    const [fsBusy, setFsBusy] = useState(false);
    const [fsSaved, setFsSaved] = useState(false);
    useEffect(() => {
      fetch(WK + '/os-data?kind=fee_structure&tenant=' + encodeURIComponent(tenant)).then(r => r.json()).then(d => {
        const rec = ((d && d.records) || [])[0];
        if (rec) { setFsId(rec.id); setFs((rec.payload && rec.payload.classes) || []); window.__FEE_STRUCTURE = rec.payload; }
        else setFs([]);
      }).catch(() => setFs([]));
    }, []);

    const students = (window.PEAK && window.PEAK.students) || [];
    const live = !!(window.PEAK && window.PEAK.studentsLive);
    const fmt = (n) => 'UGX ' + (Number(n) || 0).toLocaleString();
    const classKey = (stream) => { const m = String(stream || '').match(/^([A-Za-z]*\s*\d+)/); return m ? m[1].replace(/\s+/g, '').toUpperCase() : String(stream || '').toUpperCase(); };
    const feeForStream = (stream) => { if (!fs || !fs.length) return 0; const k = classKey(stream); const row = fs.find(r => classKey(r.name) === k); return row ? (Number(row.fee) || 0) : 0; };

    const withBal = students.filter(s => Number(s.balance) > 0).sort((a, b) => (Number(b.balance) || 0) - (Number(a.balance) || 0));
    const outstanding = students.reduce((a, s) => a + (Number(s.balance) || 0), 0);
    const expected = (fs && fs.length) ? students.reduce((a, s) => a + feeForStream(s.stream), 0) : 0;
    const collected = expected > 0 ? Math.max(0, expected - outstanding) : 0;
    const collectionPct = expected > 0 ? Math.round((collected / expected) * 100) : null;
    const arrears = withBal.length;

    const displayList = (!searchTerm && !selectedStream) 
      ? withBal 
      : students.filter(s => {
          let m = true;
          if (searchTerm) m = m && String(s.name || '').toLowerCase().includes(searchTerm.toLowerCase());
          if (selectedStream) m = m && s.stream === selectedStream;
          return m;
        }).sort((a, b) => (Number(b.balance) || 0) - (Number(a.balance) || 0));

    const remind = (s) => { const ph = String(s.guardianPhone || '').replace(/[^0-9]/g, ''); const msg = 'Dear ' + (s.guardian || 'Parent') + ', a gentle reminder regarding ' + (s.name || 'your child') + "'s school fees balance of " + fmt(s.balance) + ' at ' + ((window.__BRAND_NAME) || 'our school') + '. Thank you.'; if (ph) window.open('https://wa.me/' + ph + '?text=' + encodeURIComponent(msg), '_blank'); else window.peakToast && window.peakToast('No guardian phone on file', 'info', 'Add a phone number for ' + (s.name || 'this learner') + ' to send a reminder.'); };
    const recordPay = (s) => { if (onRecordPayment) return onRecordPayment(s); window.peakModal && window.peakModal.open(React.createElement(window.PEAK_FORMS.RecordPayment, { store: window.peakStore, defaultStudentId: s && s.id, defaultAmount: s && s.balance })); };

    // Fee-structure editing
    const suggestClasses = () => {
      const keys = []; students.forEach(s => { const k = classKey(s.stream); if (k && keys.indexOf(k) < 0) keys.push(k); });
      keys.sort();
      const rows = keys.map(k => { const ex = (fs || []).find(r => classKey(r.name) === k); return ex || { name: k, fee: '', requirements: '' }; });
      setFs(rows.length ? rows : [{ name: '', fee: '', requirements: '' }]);
    };
    const setRow = (i, key, val) => { const next = (fs || []).slice(); next[i] = { ...next[i], [key]: val }; setFs(next); };
    const addRow = () => setFs([...(fs || []), { name: '', fee: '', requirements: '' }]);
    const delRow = (i) => setFs((fs || []).filter((_, j) => j !== i));
    const saveFs = () => {
      setFsBusy(true);
      const clean = (fs || []).filter(r => String(r.name || '').trim()).map(r => ({ name: String(r.name).trim().toUpperCase(), fee: Number(r.fee) || 0, requirements: String(r.requirements || '').trim() }));
      const payload = { classes: clean, currency: 'UGX', per: 'term', updatedAt: new Date().toISOString() };
      const body = fsId ? { kind: 'fee_structure', tenant: tenant, record: payload, id: fsId } : { kind: 'fee_structure', tenant: tenant, record: payload };
      fetch(WK + '/os-data/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json()).then(res => {
        setFsBusy(false); if (res && res.record && res.record.id) setFsId(res.record.id);
        window.__FEE_STRUCTURE = payload; setFs(clean.length ? clean : []); setFsSaved(true); setTimeout(() => setFsSaved(false), 1800);
        window.peakToast && window.peakToast('Fee structure saved', 'success', 'Nia and the Fees view now use it.');
      }).catch(() => setFsBusy(false));
    };

/* src/v4-broadcast.jsx */
/* global React, PEAK, V4 */
// Peak Dark · Broadcast composer
// Director composes a parent message — AI helps with audience, drafting, translation, send timing.

// ─── Registration approval queue ────────────────────────────────────────
// student-enrollment-form.html and staff-hr-form.html POST here via the
// worker's /registrations/* routes (see cloudflare-worker/
// supabase-registration-requests.sql — new table, service-role only, no
// anon RLS policy since submissions can carry NIN/bank details). This is
// the Headteacher-facing approval step: on Approve, the worker itself
// provisions the real students/teachers row (+ class_assignments for
// teachers), with dedup/smart-merge against existing records.
function RegistrationApprovalCard() {
  const T = window.V4.T;
  const { useState, useEffect } = React;
  const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
  const [requests, setRequests] = useState([]);
  const [loading, setLoading] = useState(true);
  const [busyId, setBusyId] = useState(null);
  const [previewReq, setPreviewReq] = useState(null);

  const tenant = () => (typeof window.getOSActiveTenant === 'function' ? window.getOSActiveTenant() : 'kabs-lily-junior-school-and-kindercare-centre');
  const profile = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile()) || {};

  const load = () => {
    fetch(WK + '/registrations/list?tenant=' + encodeURIComponent(tenant()) + '&status=pending')
      .then(r => r.json()).then(out => { setRequests(out.requests || []); setLoading(false); })
      .catch(() => setLoading(false));
  };
  useEffect(() => { load(); }, []);

  useEffect(() => {
    const sb = window.NextSession && window.NextSession.sb;
    if (!sb) return;
    const ch = sb.channel('reg-approval-' + Math.random().toString(36).slice(2))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'registration_requests', filter: 'tenant_id=eq.' + tenant() }, () => {
        load();
        window.peakToast && window.peakToast('New registration submitted — review below.', 'info');
      })
      .subscribe();
    const poll = setInterval(load, 20000); // fallback if realtime publication hasn't been enabled for this table yet
    return () => { try { sb.removeChannel(ch); } catch (e) {} clearInterval(poll); };
  }, []);

  const approve = async (id) => {
    setBusyId(id);
    try {
      const res = await fetch(WK + '/registrations/approve', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, reviewedBy: profile.fullName || 'Head Teacher' }),
      });
      const out = await res.json();
      if (out.error) { window.peakToast && window.peakToast('Could not approve: ' + out.error, 'error'); }
      else {
        window.peakToast && window.peakToast(
          out.action === 'merged' ? 'Matched an existing record — no duplicate created.' : 'Approved — profile & dashboard access created.',
          'success'
        );
        load();
        if (previewReq && previewReq.id === id) setPreviewReq(null);
      }
    } catch (e) { window.peakToast && window.peakToast('Could not reach the school system.', 'error'); }
    setBusyId(null);
  };

  const reject = async (id) => {
    setBusyId(id);
    try {
      await fetch(WK + '/registrations/reject', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, reviewedBy: profile.fullName || 'Head Teacher' }),
      });
      window.peakToast && window.peakToast('Registration rejected.', 'info');
      load();
      if (previewReq && previewReq.id === id) setPreviewReq(null);
    } catch (e) {}
    setBusyId(null);
  };

  if (!loading && requests.length === 0) return null; // nothing pending — stay out of the way

  return (
    <div style={{ margin: '0 24px 20px', background: T.surface, border: '1px solid rgba(226,58,82,0.35)', borderRadius: 12, padding: 18 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
        <span style={{ fontSize: 13, fontWeight: 700, color: T.ink }}>📋 Pending Registrations</span>
        {requests.length > 0 && <span style={{ fontSize: 11, fontWeight: 700, background: T.red, color: '#fff', borderRadius: 999, padding: '2px 8px' }}>{requests.length}</span>}
      </div>
      {loading ? (
        <div style={{ fontSize: 12.5, color: T.ink3 }}>Loading…</div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {requests.map(r => {
            const p = r.payload || {};
            const name = r.type === 'student' ? p.name : p.full_name;
            const sub = r.type === 'student'
              ? (p.stream || 'no class specified') + (p.guardian ? ' · Guardian: ' + p.guardian : '')
              : (p.position || 'Teacher') + (p.classAssigned ? ' · ' + p.classAssigned : '') + (p.salary ? ' · UGX ' + p.salary : '');
            return (
              <div key={r.id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 12px', background: T.surface2 || T.bg, borderRadius: 9 }}>
                <span style={{ fontSize: 16 }}>{r.type === 'student' ? '🎒' : '🧑‍🏫'}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: T.ink }}>{name || 'Unnamed'} <span style={{ fontSize: 10.5, color: T.ink3, fontWeight: 400 }}>· {r.type}</span></div>
                  <div style={{ fontSize: 11, color: T.ink3, marginTop: 2 }}>{sub}</div>
                </div>
                <button onClick={() => setPreviewReq(r)} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink, padding: '6px 12px', borderRadius: 7, fontSize: 11.5, cursor: 'pointer', fontWeight: 600 }}>View</button>
                <button onClick={() => reject(r.id)} disabled={busyId === r.id} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink3, padding: '6px 12px', borderRadius: 7, fontSize: 11.5, cursor: busyId === r.id ? 'wait' : 'pointer', fontWeight: 600 }}>Reject</button>
                <button onClick={() => approve(r.id)} disabled={busyId === r.id} style={{ background: T.good || '#00FC8F', border: 'none', color: T.bg || '#0A1029', padding: '6px 14px', borderRadius: 7, fontSize: 11.5, cursor: busyId === r.id ? 'wait' : 'pointer', fontWeight: 700 }}>{busyId === r.id ? '…' : 'Approve'}</button>
              </div>
            );
          })}
        </div>
      )}

      {/* Preview Modal */}
      {previewReq && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.85)', backdropFilter: 'blur(4px)', zIndex: 9999, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
          <div style={{ background: T.bg, border: '1px solid ' + T.border, borderRadius: 16, width: '100%', maxWidth: 540, maxHeight: '85vh', display: 'flex', flexDirection: 'column', overflow: 'hidden', boxShadow: '0 24px 48px rgba(0,0,0,0.5)' }}>
            
            {/* Header */}
            <div style={{ padding: '16px 24px', borderBottom: '1px solid ' + T.border, display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: T.surface }}>
              <div>
                <div style={{ fontSize: 16, fontWeight: 700, color: T.ink }}>Registration Details</div>
                <div style={{ fontSize: 12, color: T.ink3, marginTop: 2 }}>{previewReq.type === 'student' ? 'Student Enrollment' : 'Staff HR Form'}</div>
              </div>
              <button onClick={() => setPreviewReq(null)} style={{ background: 'transparent', border: 'none', color: T.ink3, fontSize: 24, cursor: 'pointer', lineHeight: 1 }}>&times;</button>
            </div>
            
            {/* Body */}
            <div style={{ padding: 24, overflowY: 'auto', flex: 1 }}>
              {previewReq.type === 'student' && previewReq.payload.photoDataUrl && (
                <div style={{ marginBottom: 20 }}>
                  <img src={previewReq.payload.photoDataUrl} alt="Photo" style={{ width: 80, height: 80, borderRadius: 12, objectFit: 'cover', border: '1px solid ' + T.border }} />
                </div>
              )}
              
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px 24px' }}>
                {Object.entries(previewReq.payload).map(([k, v]) => {
                  if (k === 'photoDataUrl') return null; // handled above
                  const displayKey = k.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase()); // naive camelCase to Title Case
                  return (
                    <div key={k} style={{ gridColumn: (v && v.length > 40) ? 'span 2' : 'span 1' }}>
                      <div style={{ fontSize: 10.5, fontWeight: 700, color: T.ink3, textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 4 }}>{displayKey}</div>
                      <div style={{ fontSize: 13.5, color: T.ink, lineHeight: 1.4, wordBreak: 'break-word' }}>{v || <span style={{ color: T.ink3, fontStyle: 'italic' }}>Not provided</span>}</div>
                    </div>
                  );
                })}
              </div>
            </div>
            
            {/* Footer */}
            <div style={{ padding: '16px 24px', borderTop: '1px solid ' + T.border, display: 'flex', justifyContent: 'flex-end', gap: 12, background: T.surface2 || T.surface }}>
              <button onClick={() => reject(previewReq.id)} disabled={busyId === previewReq.id} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink3, padding: '8px 16px', borderRadius: 8, fontSize: 13, cursor: busyId === previewReq.id ? 'wait' : 'pointer', fontWeight: 600 }}>Reject</button>
              <button onClick={() => approve(previewReq.id)} disabled={busyId === previewReq.id} style={{ background: T.good || '#00FC8F', border: 'none', color: T.bg || '#0A1029', padding: '8px 20px', borderRadius: 8, fontSize: 13, cursor: busyId === previewReq.id ? 'wait' : 'pointer', fontWeight: 700 }}>{busyId === previewReq.id ? 'Processing…' : 'Approve'}</button>
            </div>

          </div>
        </div>
      )}
    </div>
  );
}
window.RegistrationApprovalCard = RegistrationApprovalCard;

const PD_Broadcast = (function () {
  const T = window.V4.T;
  const D = window.PEAK || window.PEAK_FALLBACK;
  const { useState } = React;

  function Rail({ active, onNav }) {
    const items = [
      { k: 'dash', glyph: '◫' }, { k: 'today', glyph: '◉' },

      }}>

        </div>
        {items.map(n => {

              {n.glyph}
            </button>
          );
        })}
        <div style={{ flex: 1 }} />
        <div style={{ width: 32, height: 32, borderRadius: 999, background: T.gold, color: T.bg, display: 'grid', placeItems: 'center', fontSize: 11, fontWeight: 700 }}>SM</div>
      </aside>
    );
  }

  function Pill({ children, tone }) {
    const map = {
      good: { bg: T.goodSft, fg: T.good },
      warn: { bg: T.warnSft, fg: T.warn },
      bad:  { bg: T.redSft,  fg: T.redInk },
      brand:{ bg: 'rgba(58,79,156,0.30)', fg: '#a8b4e8' },
      neutral: { bg: T.surface2, fg: T.ink2 },
    }[tone];
    return <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11, fontWeight: 600,
      padding: '3px 9px', borderRadius: 999, background: map.bg, color: map.fg,
      fontFamily: T.mono, letterSpacing: '0.02em',
    }}>{children}</span>;
  }

  function Toggle({ on, onChange, label }) {
    return (
      <button onClick={() => onChange(!on)} style={{
        display: 'flex', alignItems: 'center', gap: 10, padding: '8px 12px', borderRadius: 9,
        background: on ? 'rgba(226,58,82,0.10)' : T.surface, border: '1px solid ' + (on ? 'rgba(226,58,82,0.40)' : T.border),
        color: T.ink, fontSize: 12, cursor: 'pointer', fontFamily: T.font, fontWeight: 500,
      }}>
        <span style={{
          width: 28, height: 16, borderRadius: 999, background: on ? T.red : T.surface2,
          position: 'relative', flexShrink: 0, transition: 'background 0.15s',
        }}>
          <span style={{
            position: 'absolute', top: 2, left: on ? 14 : 2, width: 12, height: 12, borderRadius: 999,
            background: '#fff', transition: 'left 0.15s',
          }} />
        </span>
        {label}
      </button>
    );
  }

  function Broadcast({ embed = false, onNav } = {}) {
    const { useState, useMemo, useEffect } = React;
    const school = (window.peakSchoolName && window.peakSchoolName()) || 'the school';
    const studs = (window.PEAK && window.PEAK.students) || [];
    const streams = Array.from(new Set(studs.map(s => s.stream).filter(Boolean))).sort();

    const [view, setView] = useState('broadcast');
    const [logs, setLogs] = useState([]);
    const [loadingLogs, setLoadingLogs] = useState(false);
    
    const loadLogs = async () => {
      setLoadingLogs(true);
      const tenant = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile().tenantId) || 'kabs-lily-junior-school-and-kindercare-centre';
      const sb = window.NextSession?.sb;
      if (sb) {
        const { data, error } = await sb.from('teacher_logs')
          .select('*')
          .eq('tenant_id', tenant)
          .order('recorded_at', { ascending: false });
        if (error) {
          console.error("Error fetching teacher logs:", error);
        }
        if (data) {
          setLogs(data.map(x => Object.assign({ _id: x.id }, x)));
        }
      }
      setLoadingLogs(false);
    };
    useEffect(() => { if (view === 'suggestions') loadLogs(); }, [view]);

    const [aud, setAud] = useState('overdue');
    const [stream, setStream] = useState(streams[0] || '');
    const [tpl, setTpl] = useState('overdue');
    const [edited, setEdited] = useState(null); // null = use template
    const [idx, setIdx] = useState(0);
    const [started, setStarted] = useState(false);
    const [logged, setLogged] = useState(false);
    const [lang, setLang] = useState('en'); // en | lg | both
    const [lgBase, setLgBase] = useState('');
    const [lgFor, setLgFor] = useState('');
    const [translating, setTranslating] = useState(false);

    const phoneOk = (s) => (String(s.guardianPhone || '').replace(/[^0-9]/g, '').length >= 9);

    const recipients = useMemo(() => {
      if (aud === 'overdue') return studs.filter(s => (Number(s.balance) || 0) > 0);
      if (aud === 'risk') return studs.filter(s => s.flag === 'risk' || (s.attendanceWk != null && s.attendanceWk < 70));
      if (aud === 'stream') return studs.filter(s => s.stream === stream);
      return studs.slice();
    }, [aud, stream, studs]);
    const reachable = recipients.filter(phoneOk);
    const noPhone = recipients.filter(s => !phoneOk(s));

    const AUDIENCES = [
      { k: 'overdue', l: 'Fees outstanding', sub: 'guardians whose child owes a balance' },
      { k: 'risk', l: 'At-risk learners', sub: 'low attendance or flagged' },
      { k: 'stream', l: 'One class', sub: 'pick a stream below' },
      { k: 'all', l: 'All guardians', sub: 'whole school' },
    ];
    const TEMPLATES = {
      overdue: 'Dear {{guardian}}, a gentle reminder that {{child}} ({{class}}) has a school-fees balance of UGX {{balance}}. Kindly clear it when you are able. Webale nnyo. — {{school}}',
      absent: 'Good morning {{guardian}}. {{child}} ({{class}}) has not been marked present today. Please let us know if all is well. — {{school}}',
      notice: 'Dear {{guardian}}, a notice from {{school}} regarding {{child}} ({{class}}): ',
      reports: 'Dear {{guardian}}, {{child}}’s ({{class}}) report is ready. Kindly visit the school to collect it. — {{school}}',
    };
    const baseMsg = (edited != null) ? edited : (TEMPLATES[tpl] || TEMPLATES.overdue);
    const fill = (s) => baseMsg
      .replace(/{{\s*guardian\s*}}/g, s.guardian || 'Parent')
      .replace(/{{\s*child\s*}}/g, (String(s.name || '').split(' ')[0]) || s.name || 'your child')
      .replace(/{{\s*class\s*}}/g, s.stream || '')
      .replace(/{{\s*balance\s*}}/g, (Number(s.balance) || 0).toLocaleString())
      .replace(/{{\s*school\s*}}/g, school);
    const fillLg = (s) => String(lgBase || '')
      .replace(/{{\s*guardian\s*}}/g, s.guardian || 'Parent')
      .replace(/{{\s*child\s*}}/g, (String(s.name || '').split(' ')[0]) || s.name || 'your child')
      .replace(/{{\s*class\s*}}/g, s.stream || '')
      .replace(/{{\s*balance\s*}}/g, (Number(s.balance) || 0).toLocaleString())
      .replace(/{{\s*school\s*}}/g, school);
    const lgReady = lgBase && lgFor === baseMsg;
    const finalMsg = (s) => {
      const en = fill(s);
      if (lang === 'en' || !lgReady) return en;
      const lg = fillLg(s);
      if (lang === 'lg') return lg;
      return en + '\n\n' + lg;
    };
    const translate = async () => {
      setTranslating(true);
      try {
        const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
        const r = await fetch(WK + '/translate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: baseMsg, lang: 'Luganda' }) }).then(r => r.json());
        if (r && r.text) { setLgBase(r.text); setLgFor(baseMsg); }
        else window.peakToast && window.peakToast('Could not translate', 'info', (r && r.error) || 'Try again in a moment.');
      } catch (e) { window.peakToast && window.peakToast('Translation failed', 'info', String(e && e.message || e)); }
      setTranslating(false);
    };

    const logBroadcast = (n) => {
      if (logged) return; setLogged(true);
      try {
        const WK = 'https://nextos-sentinel.nextafricaai.workers.dev';
        const prof = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile()) || {};
        fetch(WK + '/os-data/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'comm_log', tenant: prof.tenantId || '', record: { audience: aud, stream: aud === 'stream' ? stream : null, count: n, channel: 'whatsapp', message: baseMsg, by: (prof.fullName || prof.email || ''), at: new Date().toISOString() } }) }).catch(() => {});
      } catch (e) {}
    };
    const sendNext = () => {
      if (idx >= reachable.length) return;
      const s = reachable[idx];
      const ph = String(s.guardianPhone || '').replace(/[^0-9]/g, '');
      if (ph) window.peakWhatsApp(ph, finalMsg(s));
      if (idx === 0) logBroadcast(reachable.length);
      setStarted(true); setIdx(idx + 1);
    };
    const copyNumbers = () => {
      const nums = reachable.map(s => String(s.guardianPhone || '').replace(/[^0-9]/g, '')).filter(Boolean).join(', ');
      try { navigator.clipboard.writeText(nums); window.peakToast && window.peakToast('Numbers copied', 'success', reachable.length + ' guardian numbers · paste into a WhatsApp broadcast list'); } catch (e) { window.prompt('Copy these numbers:', nums); }
    };
    const resetRun = () => { setIdx(0); setStarted(false); setLogged(false); };

    const card = { background: T.surface, border: '1px solid ' + T.border, borderRadius: 12, padding: 18 };
    const done = started && idx >= reachable.length;
    const current = reachable[idx];

    return (
      <div style={{ width: embed ? '100%' : 1200, height: embed ? '100%' : 900, display: 'flex', flexDirection: 'column', background: T.bg, color: T.ink, fontFamily: T.font, fontSize: 13, overflow: 'auto' }}>
        <header style={{ padding: '22px 28px 16px', borderBottom: '1px solid ' + T.border }}>
          <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.08em', fontWeight: 600, marginBottom: 8 }}>COMMUNICATIONS</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
            <button onClick={() => setView('broadcast')} style={{ background: 'transparent', border: 'none', padding: 0, fontSize: 24, fontWeight: 700, letterSpacing: '-0.02em', cursor: 'pointer', color: view === 'broadcast' ? T.ink : T.ink3 }}>Message guardians</button>
            <button onClick={() => setView('suggestions')} style={{ background: 'transparent', border: 'none', padding: 0, fontSize: 24, fontWeight: 700, letterSpacing: '-0.02em', cursor: 'pointer', color: view === 'suggestions' ? T.ink : T.ink3 }}>Suggestion Box & Logs</button>
          </div>
          {view === 'broadcast' && <div style={{ fontSize: 13, color: T.ink3, marginTop: 4, maxWidth: 640 }}>Pick who to reach, write the message once, and send each guardian a personalised WhatsApp. Numbers come straight from your real student roster.</div>}
          {view === 'suggestions' && <div style={{ fontSize: 13, color: T.ink3, marginTop: 4, maxWidth: 640 }}>Daily logs and suggestions submitted by teachers from their dashboard.</div>}
        </header>

        {view === 'broadcast' ? (
          <>
            {window.RegistrationApprovalCard && <div style={{ paddingTop: 20 }}><window.RegistrationApprovalCard /></div>}

            <div style={{ padding: 24, display: 'grid', gridTemplateColumns: embed ? '1fr 1fr' : '1fr 1fr', gap: 18, alignItems: 'start' }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <div style={card}>
              <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 10 }}>1 &middot; Who are you reaching?</div>
              <div style={{ display: 'grid', gap: 8 }}>
                {AUDIENCES.map(a => {
                  const on = aud === a.k;
                  return (
                    <button key={a.k} onClick={() => { setAud(a.k); resetRun(); }} style={{ textAlign: 'left', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10, padding: '10px 12px', borderRadius: 10, border: '1px solid ' + (on ? T.red : T.border), background: on ? 'rgba(226,58,82,0.08)' : 'transparent', color: T.ink, cursor: 'pointer' }}>
                      <span><span style={{ fontSize: 13, fontWeight: 600 }}>{a.l}</span><span style={{ display: 'block', fontSize: 11, color: T.ink3 }}>{a.sub}</span></span>
                      <span style={{ fontSize: 13, fontWeight: 700, color: on ? T.red : T.ink3, fontFamily: 'ui-monospace,monospace' }}>{a.k === 'stream' ? (studs.filter(s => s.stream === stream).length) : (a.k === 'overdue' ? studs.filter(s => (Number(s.balance) || 0) > 0).length : a.k === 'risk' ? studs.filter(s => s.flag === 'risk' || (s.attendanceWk != null && s.attendanceWk < 70)).length : studs.length)}</span>
                    </button>
                  );
                })}
                {aud === 'stream' && (
                  <select value={stream} onChange={e => { setStream(e.target.value); resetRun(); }} style={{ marginTop: 4, width: '100%', background: T.bg, border: '1px solid ' + T.border, borderRadius: 9, padding: '9px 11px', fontSize: 13, color: T.ink, outline: 'none' }}>
                    {streams.length === 0 ? <option value="">No classes yet</option> : streams.map(st => <option key={st} value={st}>{st} ({studs.filter(s => s.stream === st).length})</option>)}
                  </select>
                )}
              </div>
            </div>

            <div style={card}>
              <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 10 }}>2 &middot; The message</div>
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}>
                {[['overdue', 'Fee reminder'], ['absent', 'Absent today'], ['notice', 'Notice'], ['reports', 'Report ready']].map(o => (
                  <button key={o[0]} onClick={() => { setTpl(o[0]); setEdited(null); }} style={{ border: '1px solid ' + (tpl === o[0] && edited == null ? T.red : T.border), background: 'transparent', color: tpl === o[0] && edited == null ? T.red : T.ink2, borderRadius: 999, padding: '5px 11px', fontSize: 12, cursor: 'pointer' }}>{o[1]}</button>
                ))}
              </div>
              <textarea value={baseMsg} onChange={e => setEdited(e.target.value)} style={{ width: '100%', minHeight: 120, background: T.bg, border: '1px solid ' + T.border, borderRadius: 9, padding: 11, fontSize: 13, color: T.ink, fontFamily: T.font, outline: 'none', lineHeight: 1.5 }} />
              <div style={{ fontSize: 10.5, color: T.ink4, fontFamily: T.mono, marginTop: 6 }}>Variables: {'{{guardian}} {{child}} {{class}} {{balance}} {{school}}'} — filled per guardian.</div>
              <div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid ' + T.border }}>
                <div style={{ fontSize: 10.5, color: T.ink3, fontFamily: T.mono, letterSpacing: '0.04em', marginBottom: 7 }}>LANGUAGE</div>
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center' }}>
                  {[['en', 'English'], ['lg', 'Luganda'], ['both', 'Both']].map(o => (
                    <button key={o[0]} onClick={() => { setLang(o[0]); if (o[0] !== 'en' && lgFor !== baseMsg && !translating) translate(); }} style={{ border: '1px solid ' + (lang === o[0] ? T.red : T.border), background: 'transparent', color: lang === o[0] ? T.red : T.ink2, borderRadius: 999, padding: '5px 12px', fontSize: 12, cursor: 'pointer' }}>{o[1]}</button>
                  ))}
                  {lang !== 'en' && (translating
                    ? <span style={{ fontSize: 11.5, color: T.ink3 }}>Translating…</span>
                    : (lgFor === baseMsg
                      ? <span style={{ fontSize: 11.5, color: T.good }}>✓ Luganda ready</span>
                      : <button onClick={translate} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 8, padding: '5px 11px', fontSize: 11.5, cursor: 'pointer' }}>↻ Translate to Luganda</button>))}
                </div>
                {lang !== 'en' && lgReady && <div style={{ marginTop: 8, fontSize: 11.5, color: T.ink3, lineHeight: 1.5, background: T.bg, border: '1px solid ' + T.border, borderRadius: 8, padding: '8px 10px', whiteSpace: 'pre-wrap' }}>{lgBase}</div>}
                {lang !== 'en' && lgFor !== baseMsg && !translating && <div style={{ marginTop: 6, fontSize: 10.5, color: T.warn }}>You edited the message — re-translate to refresh the Luganda version.</div>}
              </div>
            </div>
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <div style={card}>
              <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 10 }}>3 &middot; Send</div>
              <div style={{ display: 'flex', gap: 16, marginBottom: 14, flexWrap: 'wrap' }}>
                <div><div style={{ fontSize: 9.5, color: T.ink4, fontFamily: T.mono }}>RECIPIENTS</div><div style={{ fontSize: 20, fontWeight: 700 }}>{recipients.length}</div></div>
                <div><div style={{ fontSize: 9.5, color: T.ink4, fontFamily: T.mono }}>REACHABLE ON WHATSAPP</div><div style={{ fontSize: 20, fontWeight: 700, color: T.good }}>{reachable.length}</div></div>
                <div><div style={{ fontSize: 9.5, color: T.ink4, fontFamily: T.mono }}>NO PHONE ON FILE</div><div style={{ fontSize: 20, fontWeight: 700, color: noPhone.length ? T.warn : T.ink3 }}>{noPhone.length}</div></div>
              </div>

              {reachable.length === 0 ? (
                <div style={{ fontSize: 12.5, color: T.ink3 }}>No guardians with a phone number in this group yet. Add guardian phones under Students, then come back.</div>
              ) : done ? (
                <div style={{ textAlign: 'center', padding: '8px 0' }}>
                  <div style={{ fontSize: 28 }}>{'✓'}</div>
                  <div style={{ fontSize: 14, fontWeight: 700, marginTop: 4 }}>All {reachable.length} opened in WhatsApp</div>
                  <div style={{ fontSize: 12, color: T.ink3, marginTop: 4 }}>Each guardian got a personalised message. Logged to your message history.</div>
                  <button onClick={resetRun} style={{ marginTop: 12, background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 9, padding: '8px 16px', fontSize: 12.5, cursor: 'pointer' }}>Start again</button>
                </div>
              ) : (
                <div>
                  <div style={{ fontSize: 12, color: T.ink3, marginBottom: 8 }}>WhatsApp opens one chat at a time. Tap below for each guardian {'—'} the message is pre-filled, just press send in WhatsApp.</div>
                  {current && (
                    <div style={{ background: T.bg, border: '1px solid ' + T.border, borderRadius: 10, padding: 12, marginBottom: 10 }}>
                      <div style={{ fontSize: 12.5, fontWeight: 600 }}>{current.guardian || 'Parent'} <span style={{ color: T.ink3, fontWeight: 400 }}>{'·'} guardian of {current.name} ({current.stream})</span></div>
                      <div style={{ fontSize: 11.5, color: T.ink2, marginTop: 6, lineHeight: 1.5, whiteSpace: 'pre-wrap' }}>{finalMsg(current)}</div>
                    </div>
                  )}
                  <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                    <button onClick={sendNext} style={{ background: '#00a884', color: '#fff', border: 'none', borderRadius: 9, padding: '10px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>Open WhatsApp → {current ? (current.guardian || current.name) : ''} ({idx + 1}/{reachable.length})</button>
                    {started && idx < reachable.length && <button onClick={() => setIdx(idx + 1)} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink3, borderRadius: 9, padding: '10px 14px', fontSize: 12.5, cursor: 'pointer' }}>Skip</button>}
                    <button onClick={copyNumbers} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 9, padding: '10px 14px', fontSize: 12.5, cursor: 'pointer' }}>Copy all numbers</button>
                  </div>
                  <div style={{ height: 5, background: T.border, borderRadius: 999, marginTop: 12, overflow: 'hidden' }}><div style={{ width: (reachable.length ? (idx / reachable.length * 100) : 0) + '%', height: '100%', background: T.good }} /></div>
                </div>
              )}
            </div>

            <div style={card}>
              <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 8 }}>Recipients</div>
              <div style={{ maxHeight: 220, overflow: 'auto', border: '1px solid ' + T.border, borderRadius: 9 }}>
                {recipients.length === 0 ? <div style={{ padding: 12, color: T.ink4, fontSize: 12.5 }}>No one in this group.</div> : recipients.map((s, i) => {
                  const ok = phoneOk(s);
                  return (
                    <div key={s.id || i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8, padding: '8px 11px', borderBottom: i < recipients.length - 1 ? '1px solid ' + T.border : 'none' }}>
                      <div style={{ minWidth: 0 }}><div style={{ fontSize: 12.5, color: T.ink, fontWeight: 500, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.guardian || 'Parent'} <span style={{ color: T.ink4 }}>{'·'} {s.name}</span></div><div style={{ fontSize: 10.5, color: T.ink4, fontFamily: 'ui-monospace,monospace' }}>{s.stream || ''} {ok ? ('· ' + s.guardianPhone) : '· no phone'}</div></div>
                      {ok ? <button onClick={() => window.peakWhatsApp(String(s.guardianPhone || '').replace(/[^0-9]/g, ''), finalMsg(s))} style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.ink2, borderRadius: 7, padding: '4px 10px', fontSize: 11, cursor: 'pointer', flexShrink: 0 }}>Open</button> : <span style={{ fontSize: 10.5, color: T.warn, flexShrink: 0 }}>add phone</span>}
                    </div>
                  );
                })}
              </div>
              {noPhone.length > 0 && <div style={{ fontSize: 11, color: T.warn, marginTop: 8 }}>{noPhone.length} guardian{noPhone.length === 1 ? '' : 's'} in this group have no phone on file {'—'} add their number under Students to reach them.</div>}
            </div>
          </div>
        </div>
        </>
        ) : (
          <div style={{ padding: 24 }}>
            <div style={{ maxWidth: 800 }}>
              <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 16 }}>
                <button onClick={loadLogs} disabled={loadingLogs} style={{ background: 'transparent', border: '1px solid ' + T.borderStr, padding: '5px 12px', borderRadius: 6, fontSize: 11, fontWeight: 700, cursor: loadingLogs ? 'default' : 'pointer', color: T.ink2, opacity: loadingLogs ? 0.6 : 1 }}>
                  {loadingLogs ? 'Refreshing...' : 'Refresh Logs'}
                </button>
              </div>
              {logs.length === 0 ? (
                 <div style={{ fontSize: 13, color: T.ink3, textAlign: 'center', padding: 40, border: '1px dashed ' + T.border, borderRadius: 12 }}>No logs or suggestions from teachers yet.</div>
              ) : logs.map(l => (
                 <div key={l._id} style={{ padding: 18, background: T.surface, border: '1px solid ' + T.border, borderRadius: 12, marginBottom: 12 }}>
                   <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                     <div style={{ fontWeight: 600, fontSize: 14 }}>{l.teacher_name || 'Teacher'}</div>
                     <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono }}>{l.recorded_at ? new Date(l.recorded_at).toLocaleString() : ''}</div>
                   </div>
                   <div style={{ fontSize: 13, color: T.ink, whiteSpace: 'pre-wrap', lineHeight: 1.5 }}>{l.message}</div>
                 </div>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  }

  return { Broadcast };
})();

window.PD_Broadcast = PD_Broadcast;

  </script>
  <script type="text/babel" data-src="src/v4-mobile.jsx">
/* src/v4-mobile.jsx */
/* global React, PEAK, V4 */
// Peak Dark · mobile companions — parent + teacher, same brand language as V4 desktop

const PD_M = (function () {
  const T = window.V4.T;
  const D = window.PEAK || window.PEAK_FALLBACK;

  // Phone shell -------------------------------------------------------------
  function Phone({ children, statusInk = T.ink }) {
    return (
      <div style={{ width: 390, height: 780, position: 'relative', display: 'flex' }}>
        <div style={{
          position: 'absolute', inset: 0, borderRadius: 44,
          background: '#000', padding: 6, boxShadow: '0 28px 60px rgba(0,0,0,0.45)',
        }}>
          <div style={{
            position: 'relative', width: '100%', height: '100%', borderRadius: 38,
            background: T.bg, overflow: 'hidden', display: 'flex', flexDirection: 'column',
          }}>
            <div style={{
              position: 'absolute', top: 8, left: '50%', transform: 'translateX(-50%)',
              width: 100, height: 26, background: '#000', borderRadius: 999, zIndex: 5,
            }} />
            <div style={{
              padding: '14px 26px 10px', display: 'flex', justifyContent: 'space-between', alignItems: 'center',
              fontSize: 13, fontWeight: 600, color: statusInk, fontFamily: '-apple-system, system-ui',
              position: 'relative', zIndex: 4,
            }}>
              <span>9:41</span>
              <div style={{ display: 'flex', gap: 5, alignItems: 'center', fontSize: 11 }}>
                <span>●●●●</span><span>📶</span><span>🔋</span>
              </div>
            </div>
            {children}
          </div>
        </div>
      </div>
    );
  }

  // ─── M · Parent home ──────────────────────────────────────────────────────
  function ParentHome() {

  <script type="text/babel" data-src="src/nia-feed.jsx">
/* NIA_FEED + NiaBell — reliable in-OS notification centre (localStorage, no push dependency) with Nia's friendly, encouraging, suggestive messages. */
(function () {
  const T = window.V4.T;
  function tenant() { try { return (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile().tenantId) || 'peak-primary'; } catch (e) { return 'peak-primary'; } }
  function KEY() { return 'nia.feed.' + tenant(); }
  function load() { try { return JSON.parse(localStorage.getItem(KEY()) || '[]'); } catch (e) { return []; } }
  function save(list) { try { localStorage.setItem(KEY(), JSON.stringify(list.slice(0, 60))); } catch (e) {} }
  const FEED = {
    list: load,
    unread: function () { return load().filter(n => !n.read).length; },
    markAllRead: function () { var l = load().map(n => Object.assign({}, n, { read: true })); save(l); try { window.dispatchEvent(new CustomEvent('nia:feed')); } catch (e) {} },
    post: function (item) {
      var l = load();
      if (item.key) { var now = Date.now(); var dup = l.find(n => n.key === item.key && (now - (n.ts || 0)) < 20 * 3600 * 1000); if (dup) return; }
      l.unshift(Object.assign({ id: 'n' + Date.now() + Math.random().toString(36).slice(2, 6), ts: Date.now(), read: false }, item));
      save(l);
      try { window.dispatchEvent(new CustomEvent('nia:feed')); } catch (e) {}
      if (item.toast !== false && window.peakToast) window.peakToast(item.title, item.level === 'alert' ? 'info' : 'success', item.body);
    }
  };
  window.NIA_FEED = FEED;

  const { useState, useEffect } = React;
  function NiaBell() {
    const [open, setOpen] = useState(false);
    const [, force] = useState(0);
    useEffect(() => { const h = () => force(x => x + 1); window.addEventListener('nia:feed', h); return () => window.removeEventListener('nia:feed', h); }, []);
    const items = FEED.list();
    const unread = items.filter(n => !n.read).length;
    const toggle = () => { const nx = !open; setOpen(nx); if (nx && unread) setTimeout(() => FEED.markAllRead(), 600); };
    const levelColor = (lv) => lv === 'win' ? (T.green || '#00c389') : lv === 'alert' ? T.warn : (T.gold || '#d8a200');
    const ago = (ts) => { const m = Math.round((Date.now() - ts) / 60000); if (m < 1) return 'now'; if (m < 60) return m + 'm'; const h = Math.round(m / 60); if (h < 24) return h + 'h'; return Math.round(h / 24) + 'd'; };
    const btnRef = React.useRef(null);
    const [pos, setPos] = useState(null);
    useEffect(() => {
      if (!open) return;
      const place = () => {
        const r = btnRef.current && btnRef.current.getBoundingClientRect(); if (!r) return;
        const vw = window.innerWidth, vh = window.innerHeight, W = Math.min(340, vw - 20);
        let left = r.left; if (left + W > vw - 10) left = r.right - W; if (left < 10) left = 10;
        const top = Math.min(r.bottom + 8, vh - 80);
        setPos({ left: Math.round(left), top: Math.round(top), width: W, maxHeight: Math.round(vh - top - 16) });
      };
      place(); window.addEventListener('resize', place); window.addEventListener('scroll', place, true);
      return () => { window.removeEventListener('resize', place); window.removeEventListener('scroll', place, true); };
    }, [open]);
    return (
      <div style={{ position: 'relative' }}>
        <button ref={btnRef} onClick={toggle} title="Nia's notifications" style={{ width: 34, height: 34, borderRadius: 9, background: T.surface, border: '1px solid ' + T.border, color: T.ink2, fontSize: 15, cursor: 'pointer', position: 'relative' }}>
          🔔{unread > 0 && <span style={{ position: 'absolute', top: -5, right: -5, minWidth: 16, height: 16, padding: '0 4px', borderRadius: 999, background: T.red, color: '#fff', fontSize: 10, fontWeight: 800, display: 'grid', placeItems: 'center', fontFamily: T.mono }}>{unread > 9 ? '9+' : unread}</span>}
        </button>
        {open && pos && (
          <>
            <div onClick={() => setOpen(false)} style={{ position: 'fixed', inset: 0, zIndex: 600 }} />

  window.peakPhoneFor = function (x) { return x.guardianPhone || ('0702341' + ((x.id * 17) % 1000)); };

  window.peakExportRoster = function () { var s = window.peakRoster(); window.peakExportCSV('students-' + (((window.__BRAND_NAME) || 'school') + '').replace(/\s+/g, '_') + '.csv', ['Name', 'Stream', 'Guardian', 'Phone', 'Fees', 'Balance (UGX)', 'Attendance %', 'Standing'], s.map(function (x) { return [x.name, x.stream || '', x.guardian || '', x.guardianPhone || '', x.fees || '', x.balance || 0, (x.attendanceWk != null ? x.attendanceWk : ''), x.flag === 'risk' ? 'At-risk' : (x.flag === 'top' ? 'Top' : 'OK')]; })); window.peakToast && window.peakToast('Roster exported', 'success', s.length + ' students - CSV downloaded.'); };

      doc.setFontSize(18); doc.setFont(undefined, 'bold'); doc.text(brand, 105, 18, { align: 'center' });

      doc.setDrawColor(200); doc.line(14, 31, 196, 31); var y = 45;
      [['Name', stu.name || '-'], ['Class / Stream', stu.stream || '-'], ['Guardian', stu.guardian || '-'], ['Phone', stu.guardianPhone || stu.phone || '-'], ['Fees status', stu.fees || '-'], ['Balance', stu.balance ? ('UGX ' + Number(stu.balance).toLocaleString()) : '0'], ['Weekly attendance', (stu.attendanceWk != null ? stu.attendanceWk + '%' : '-')], ['Last seen', stu.lastSeen || '-'], ['Standing', stu.flag === 'risk' ? 'At-risk' : (stu.flag === 'top' ? 'Top performer' : 'OK')]].forEach(function (r) { doc.setFont(undefined, 'bold'); doc.text(r[0] + ':', 14, y); doc.setFont(undefined, 'normal'); doc.text(String(r[1]), 75, y); y += 9; });
      doc.setFontSize(9); doc.setTextColor(120); doc.text('Generated by NEXT OS - Nia - ' + new Date().toLocaleDateString(), 14, 285);
      doc.save((stu.name || 'student').replace(/\s+/g, '_') + '_summary.pdf');

    } catch (e) { window.peakToast && window.peakToast('Could not generate', 'info', String(e.message || e)); }
  };

  <script>
  /* Broken school-logo fallback -> branded initials icon (handles missing assets/peak-logo.png) */
  (function(){
