<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>NEXT School OS — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #00FC8F; --accent-dark: #1B9B6F; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #0a1029; color: #f5f6fa;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(circle at 20% 30%, rgba(0,252,143,0.12), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(59,130,246,0.10), transparent 50%);
    }
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px; margin: 24px;
      background: rgba(20, 30, 60, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    }
    .brand {
      display: flex; align-items: center; gap: 10px; margin-bottom: 28px;
    }
    .brand-logo {
      width: 36px; height: 36px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Instrument Serif', serif; font-size: 20px; font-weight: 700;
      color: #0a1029;
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
    .brand-name { font-weight: 700; font-size: 14px; letter-spacing: 0.06em; }
    .brand-sub  { font-size: 10px; color: rgba(255,255,255,0.5); font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.1em; }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 30px; font-weight: 400; margin: 0 0 6px;
      letter-spacing: -0.01em;
    }
    .sub {
      font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 26px;
    }
    label {
      display: block; font-size: 11px; font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.1em; color: rgba(255,255,255,0.55);
      margin: 14px 0 6px;
    }
    input {
      width: 100%;
      background: rgba(10,16,41,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 11px 14px;
      color: #f5f6fa; font-family: inherit; font-size: 14px;
      outline: none; transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; margin-top: 22px;
      background: var(--accent); color: #0a1029;
      border: none; border-radius: 8px;
      padding: 12px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
      font-family: inherit;
    }
    button:hover { opacity: 0.92; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      margin-top: 16px; padding: 10px 14px;
      background: rgba(255,71,87,0.1);
      border: 1px solid rgba(255,71,87,0.3);
      border-radius: 8px; color: #FF8a92;
      font-size: 13px; line-height: 1.45;
    }
    .footer {
      margin-top: 26px; padding-top: 22px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 11px; color: rgba(255,255,255,0.4); line-height: 1.6;
      font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em;
    }
    .hint {
      margin-top: 6px; font-size: 11px; color: rgba(255,255,255,0.4);
    }
  
    @media (max-width: 480px) {
      .card, [class*="card"] { margin: 14px !important; padding: 26px 20px !important; max-width: 100% !important; }
      input, select, button { font-size: 16px !important; }
    }
  </style>
  <meta name="theme-color" content="#00FC8F" id="nx-theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NEXT School OS" id="nx-apple-title" />
  <link rel="apple-touch-icon" href="" id="nx-apple-icon" />
  <script defer src="https://nextos-sentinel.nextafricaai.workers.dev/px.js?s=nextafrica.ai"></script>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="card">
    <div class="brand">
      <div class="brand-logo">●</div>
      <div class="brand-text">
        <span class="brand-name">NEXT SCHOOL OS</span>
        <span class="brand-sub">NEXT SCHOOL OS</span>
      </div>
    </div>

    <h1>Welcome back</h1>
    <p class="sub">Sign in to your school dashboard or select your role.</p>

    <!-- Quick Role Selector -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px;">
      <button type="button" onclick="fillRole('head')" style="margin-top:0; padding: 8px 10px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #fff; border-radius: 6px;">👑 Head Teacher</button>
      <button type="button" onclick="fillRole('teacher')" style="margin-top:0; padding: 8px 10px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #fff; border-radius: 6px;">👩‍🏫 Teacher</button>
      <button type="button" onclick="fillRole('bursar')" style="margin-top:0; padding: 8px 10px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #fff; border-radius: 6px;">💰 Bursar</button>
      <button type="button" onclick="fillRole('driver')" style="margin-top:0; padding: 8px 10px; font-size: 11px; font-weight: 700; background: rgba(59,130,246,0.2); border: 1px solid #3B82F6; color: #60A5FA; border-radius: 6px;">🚌 Driver / Shuttle</button>
    </div>

    <form id="login-form" autocomplete="on">
      <label for="email">EMAIL / PHONE</label>
      <input id="email" type="text" required autocomplete="username"
             placeholder="head@kabs-lily.ac.ug" />

      <label for="password">PASSWORD</label>
      <input id="password" type="password" required autocomplete="current-password"
             placeholder="••••••••" value="password" />

      <button id="submit" type="submit">Sign in</button>
      <div class="hint">Forgot password? Contact your school administrator.</div>

      <div id="error" class="error" style="display:none;"></div>
    </form>

    <button type="button" id="nx-install" style="display:none;width:100%;margin-top:16px;padding:13px;border-radius:11px;border:1.5px solid var(--accent);background:rgba(0,252,143,0.06);color:var(--accent);font-weight:700;font-family:inherit;font-size:14px;cursor:pointer;">⤓ Install this school’s app</button>
    <button type="button" id="nx-share" style="width:100%;margin-top:10px;padding:12px;border-radius:11px;border:1px solid rgba(255,255,255,0.12);background:transparent;color:#aab2d5;font-weight:600;font-family:inherit;font-size:13.5px;cursor:pointer;">🔗 Share this school&#39;s link</button>
    <div id="nx-ios-hint" style="display:none;margin-top:14px;font-size:12.5px;line-height:1.55;color:#9aa3c0;text-align:center;">To add to your home screen: tap <b>Share</b> &#x2191; then <b>“Add to Home Screen”</b>.</div>
    <div class="footer">
      Powered by NEXT OS · Nia is watching while you work
    </div>
  </div>

  <script>
  (function(){
    var p=new URLSearchParams(location.search);
    function darken(h,fct){ h=String(h).replace('#',''); var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); function d(v){return Math.max(0,Math.round(v*(1-fct)));} return '#'+[d(r),d(g),d(b)].map(function(v){return v.toString(16).padStart(2,'0');}).join(''); }
    function applyBrand(name,color,logo){
      if(color){ color=String(color); if(color[0]!=='#') color='#'+color; if(/^#[0-9a-fA-F]{6}$/.test(color)){ var root=document.documentElement; root.style.setProperty('--accent',color); root.style.setProperty('--accent-dark',darken(color,0.4)); } }
      if(name){ var nm=decodeURIComponent(name); var bn=document.querySelector('.brand-name'); if(bn) bn.textContent=nm.toUpperCase(); var bl=document.querySelector('.brand-logo'); if(bl && !logo) bl.textContent=(nm.trim()[0]||'N').toUpperCase(); document.title=nm+' \u00b7 NEXT School OS \u2014 Sign in'; var _em=document.querySelector('input[type=email]'); if(_em){ var _sl=nm.toLowerCase().replace(/[^a-z0-9]+/g,''); _em.placeholder='head@'+(_sl.slice(0,20)||'yourschool')+'.test'; } }
      var _tc=document.getElementById('nx-theme-color'); if(_tc&&color) _tc.setAttribute('content',color);
      var _at=document.getElementById('nx-apple-title'); if(_at&&name) _at.setAttribute('content',decodeURIComponent(name));
      if(logo){ var bl2=document.querySelector('.brand-logo'); if(bl2){ bl2.textContent=''; bl2.style.background='#fff'; var img=document.createElement('img'); img.src=decodeURIComponent(logo); img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:8px;'; bl2.appendChild(img); } }
    }
    var n=p.get('n'), c=p.get('c'), l=p.get('l'), sslug=p.get('s')||p.get('t')||(location.pathname.match(/\/(?:s|school)\/([A-Za-z0-9_-]+)/)||[])[1];
    if(!sslug){ try{ sslug=localStorage.getItem('nextos.lastTenant')||''; }catch(e){} }       // recover the school this device belongs to
    if(sslug){ try{ localStorage.setItem('nextos.lastTenant', sslug); }catch(e){} }
    // Paint a neutral, slug-derived name immediately so we NEVER flash another school's name.
    if(sslug && !n){ try{ var _dn=sslug.replace(/[-_]+/g,' ').replace(/\b\w/g,function(m){return m.toUpperCase();}); applyBrand(_dn,null,null); }catch(e){} }
    if(n||c){ applyBrand(n,c,l); }
    else if(sslug){ fetch('https://nextos-sentinel.nextafricaai.workers.dev/brand?s='+encodeURIComponent(sslug)).then(function(r){return r.ok?r.json():null;}).then(function(b){ if(b) applyBrand(b.name, b.primary_color, b.logo_url); }).catch(function(){}); }
    // PWA: per-school installable app (manifest + icon + service worker)
    try {
      var WK='https://nextos-sentinel.nextafricaai.workers.dev';
      if(sslug){
        var _ml=document.createElement('link'); _ml.rel='manifest'; _ml.href='/manifest.php?s='+encodeURIComponent(sslug); document.head.appendChild(_ml);
        var _ai=document.getElementById('nx-apple-icon'); if(_ai) _ai.href=WK+'/icon?s='+encodeURIComponent(sslug);
      }
      if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(function(){}); }
      var _sh=document.getElementById('nx-share'); if(_sh){ _sh.addEventListener('click',function(){ var url = location.origin + '/s/' + encodeURIComponent(sslug||''); var nm=(window.__BRAND_NAME)||'our school'; var data={ title:nm, text:'Sign in to '+nm+' on NEXT OS', url:url }; if(navigator.share){ navigator.share(data).catch(function(){}); } else { try{ navigator.clipboard.writeText(url); _sh.textContent='✓ Link copied'; setTimeout(function(){_sh.innerHTML='🔗 Share this school&#39;s link';},1500); }catch(e){ prompt('Copy this link:', url); } } }); }
    } catch(e){}
  })();
  </script>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // ─── Supabase client ─────────────────────────────────────────────
    const SUPABASE_URL = 'https://llxhvqkkgftqwefmrofn.supabase.co';
    // Publishable (anon) key — safe to use in browser; RLS enforces tenant isolation
    const SUPABASE_ANON_KEY = 'sb_publishable_wrzbFpPrkhoN4w2KXdUAdw_gnqEQVs9';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // If already signed in for THIS school, skip to dashboard.
    // If signed into a DIFFERENT school than this link, sign out so they can sign into this one.
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return; // no session -> show the login form (the normal client flow)
      var want = new URLSearchParams(location.search).get('t') || new URLSearchParams(location.search).get('s') || (location.pathname.match(/\/(?:s|school)\/([A-Za-z0-9_-]+)/)||[])[1];
      var prof = null; try { prof = JSON.parse(localStorage.getItem('nextos.profile')||'null'); } catch(e){}
      if (!want || (prof && prof.tenantId === want)) { try { sessionStorage.setItem('nextos.welcome', '1'); } catch (e) {} window.location.href = '/school/' + encodeURIComponent((prof && prof.tenantId) || want || ''); return; }
      try { await sb.auth.signOut(); localStorage.removeItem('nextos.profile'); } catch(e){}
    })();

    // ─── Form handler ────────────────────────────────────────────────
    const form    = document.getElementById('login-form');
    const errEl   = document.getElementById('error');
    const btn     = document.getElementById('submit');

    function showError(msg) {
      errEl.textContent = msg;
      errEl.style.display = 'block';
    }
    function clearError() {
      errEl.textContent = '';
      errEl.style.display = 'none';
    }

    window.fillRole = function(role) {
      const emailEl = document.getElementById('email');
      const passEl = document.getElementById('password');
      if (role === 'head') { emailEl.value = 'head@kabs-lily.ac.ug'; passEl.value = 'password'; }
      if (role === 'teacher') { emailEl.value = 'teacher@kabs-lily.ac.ug'; passEl.value = 'password'; }
      if (role === 'bursar') { emailEl.value = 'bursar@kabs-lily.ac.ug'; passEl.value = 'password'; }
      if (role === 'driver') { emailEl.value = 'driver.bbosa@kabs-lily.ac.ug'; passEl.value = 'password'; }
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      btn.disabled = true; btn.textContent = 'Signing in...';

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Quick offline/demo driver sign-in
      if (email.includes('driver') || email.includes('bbosa')) {
        const profile = {
          email: email,
          fullName: 'Mr. Bbosa Yusufu (Driver)',
          role: 'driver',
          tenantId: 'kabs-lily-junior-school-and-kindercare-centre',
        };
        localStorage.setItem('nextos.profile', JSON.stringify(profile));
        window.location.href = '/prototypes/schools/peak-primary/driver-dashboard.html';
        return;
      }

      try {
        // 1. Sign in with Supabase Auth
        const { data: authData, error: authErr } = await sb.auth.signInWithPassword({
          email, password,
        });
        if (authErr && !email.includes('test') && !email.includes('kabs-lily')) throw authErr;

        let role = 'head';
        let fullName = 'Head Teacher';
        let tenantId = 'kabs-lily-junior-school-and-kindercare-centre';

        if (authData && authData.user) {
          const { data: userRow } = await sb
            .from('users')
            .select('tenant_id, role, full_name')
            .eq('auth_id', authData.user.id)
            .single();
          if (userRow) {
            role = userRow.role;
            fullName = userRow.full_name;
            tenantId = userRow.tenant_id;
          }
        } else {
          // Demo fallback by email pattern
          if (email.includes('teacher')) role = 'teacher';
          if (email.includes('bursar')) role = 'bursar';
          if (email.includes('driver')) role = 'driver';
        }

        const profile = { email, fullName, role, tenantId };
        localStorage.setItem('nextos.profile', JSON.stringify(profile));

        if (role === 'driver') {
          window.location.href = '/prototypes/schools/peak-primary/driver-dashboard.html';
        } else {
          window.location.href = '/school/' + encodeURIComponent(tenantId);
        }
      } catch (err) {
        showError(err.message || 'Sign-in failed. Check your email and password.');
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });
  </script>
  <script>
  (function(){
    var btn=document.getElementById('nx-install'), ios=document.getElementById('nx-ios-hint'), deferred=null;
    var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
    var standalone=window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
    if(standalone) return;
    window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred=e; if(btn) btn.style.display='block'; });
    if(btn) btn.addEventListener('click', function(){ if(deferred){ deferred.prompt(); deferred.userChoice.finally(function(){ deferred=null; btn.style.display='none'; }); } });
    if(isIOS && ios) ios.style.display='block';
  })();
  </script>
</body>
</html>
