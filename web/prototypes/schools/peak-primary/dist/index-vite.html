  <script>
    /* Safety net for the school-data screens (Students/Teachers/Attendance/etc):
       every one of them reads its data via `const D = window.PEAK || window.PEAK_FALLBACK;`.
       window.PEAK itself is assigned later by a very large inline script — if
       that ever fails to run before a screen renders (slow parse, a later
       edit introducing a real error, etc.) every D.students/.teachers/.streams
       access would throw "Cannot read properties of undefined" and crash the
       whole page. This has to be defined in its own tiny, plain (non-Babel)
       script at the very top of <body>, BEFORE window.PEAK's own script, so
       it exists no matter what happens to that later block. */
    window.PEAK_FALLBACK = {
      streams: [], students: [], teachers: [], buses: [], subjects: [], reports: [],
      kpis: {}, alerts: [], streamAttendance: [], trend7: [], feesWeek: [], threads: [],
      broadcasts: [], aiSuggestions: [],
      fmtUGX: function (n) { return 'UGX ' + (Number(n) || 0).toLocaleString(); },
      fmtUGXshort: function (n) { return 'UGX ' + (Number(n) || 0).toLocaleString(); },
    };
  </script>
  <script>
    /* Build self-heal: if this cached HTML is older than what the server now serves,
       reload ONCE with a cache-buster so no school is ever stuck on a stale build. */
    window.__BUILD = 'b110';
    (function () {
      try {
        fetch('/build.txt?ts=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : ''; })
          .then(function (srv) {
            srv = (srv || '').trim();
            if (!srv || srv === window.__BUILD) return;
            if (sessionStorage.getItem('nx_selfheal') === srv) return; // already tried this target
            sessionStorage.setItem('nx_selfheal', srv);
            var u = new URL(location.href); u.searchParams.set('cb', srv);
            location.replace(u.toString());
          }).catch(function () {});
      } catch (e) {}
    })();
  </script>

  /* Nia's identity guard — notices if THIS page is branded for the wrong school and reports it.
     This is the watcher Hudson asked for: "I'm seeing the bare-foot app but a Peak login." */
  (function(){
    try {
      var bp = new URLSearchParams(location.search);
      var slug = bp.get('s') || bp.get('t') || (location.pathname.match(/\/(?:s|school)\/([A-Za-z0-9_-]+)/)||[])[1] || '';
      if(!slug){ try{ var pf=JSON.parse(localStorage.getItem('nextos.profile')||'null'); slug=(pf&&pf.tenantId)||''; }catch(e){} }
      if(!slug){ try{ slug=localStorage.getItem('nextos.lastTenant')||''; }catch(e){} }
      if(!slug) return;
      var WK='https://nextos-sentinel.nextafricaai.workers.dev';
      // After the UI has had time to paint, compare the authoritative brand with what's shown.
      setTimeout(function(){
        fetch(WK+'/brand?s='+encodeURIComponent(slug)).then(function(r){return r.ok?r.json():null;}).then(function(b){

            // Mismatch: auto-correct the view first, then tell Nia.
            try{ window.__BRAND_NAME=b.name; document.title=b.name+' \u00b7 NEXT School OS'; }catch(e){}
            try{ fetch(WK+'/watch/signal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ tenant:slug, type:'brand_mismatch', severity:'high', page:location.pathname, detail:'Page showed "'+(window.__BRAND_NAME||'')+'" but this is '+b.name+'. Likely a stale cached file — purge cache.' })}); }catch(e){}

  // Real-time replacement for the "Thursday · 14 May 2026 · Term 2 · Week 6"
  // strings that were pasted as static text at build time and never
  // updated — every dashboard kept showing that exact date forever.
  // Term-start assumption (no academic-calendar config exists anywhere in
  // this codebase to read a real one from): Term 2 2026 began Mon 4 May
  // 2026, a ~14-week term. Adjust TERM_START/TERM_LABEL below once School
  // Setup exposes a real term calendar.
  window.getSchoolCalendarLabel = function () {
    var now = new Date();
    var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    var dateStr = days[now.getDay()] + ' · ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
    var TERM_START = new Date(2026, 4, 4);
    var TERM_END = new Date(2026, 7, 15);
    var term = 'Term 2', week = null;
    if (now < TERM_START) { term = 'Term 1'; }
    else if (now > TERM_END) { term = 'Term 3'; }
    else { week = Math.floor((now - TERM_START) / (7 * 24 * 3600 * 1000)) + 1; }
    var termWeekStr = term + (week ? (' · Week ' + week) : '');
    return { dateStr: dateStr, termWeekStr: termWeekStr, full: dateStr + ' · ' + termWeekStr };
  };

  // outside the app (enrollment form, HR form) — never the raw internal

      doc.setDrawColor(200); doc.line(14, 31, 196, 31); var y = 45;
      [['Name', stu.name || '-'], ['Class / Stream', stu.stream || '-'], ['Guardian', stu.guardian || '-'], ['Phone', stu.guardianPhone || stu.phone || '-'], ['Fees status', stu.fees || '-'], ['Balance', stu.balance ? ('UGX ' + Number(stu.balance).toLocaleString()) : '0'], ['Weekly attendance', (stu.attendanceWk != null ? stu.attendanceWk + '%' : '-')], ['Last seen', stu.lastSeen || '-'], ['Standing', stu.flag === 'risk' ? 'At-risk' : (stu.flag === 'top' ? 'Top performer' : 'OK')]].forEach(function (r) { doc.setFont(undefined, 'bold'); doc.text(r[0] + ':', 14, y); doc.setFont(undefined, 'normal'); doc.text(String(r[1]), 75, y); y += 9; });
      doc.setFontSize(9); doc.setTextColor(120); doc.text('Generated by NEXT OS - Nia - ' + new Date().toLocaleDateString(), 14, 285);

    } catch (e) { window.peakToast && window.peakToast('Could not generate', 'info', String(e.message || e)); }

  window.peakSaveAssignment = function (a) { try { var key = 'nextos.assignments.' + ((window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile().tenantId) || 'peak-primary'); var arr = []; try { arr = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {} arr.unshift(Object.assign({ id: Date.now(), created: new Date().toISOString() }, a)); localStorage.setItem(key, JSON.stringify(arr.slice(0, 200))); } catch (e) {} };

  <script>
  /* Broken school-logo fallback -> branded initials icon (handles missing assets/peak-logo.png) */
  (function(){
    function brandIcon(){
      var nm=(window.__BRAND_NAME)||'NEXT'; var col=(window.__ACCENT)||'#00FC8F';
      var init=((''+nm).match(/[A-Za-z0-9]/g)||['N']).slice(0,2).join('').toUpperCase();
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" rx="14" fill="'+col+'"/><text x="50%" y="55%" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#0a1029" text-anchor="middle" dominant-baseline="central">'+init+'</text></svg>';
      return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
    }
    window.addEventListener('error', function(e){
      var t=e.target;
      if(t && t.tagName==='IMG' && /peak-logo/.test(t.getAttribute('src')||'') && !t.dataset.nxFallback){
        t.dataset.nxFallback='1'; t.src=brandIcon();
      }
    }, true);
  })();

  /* Dashboard colour control — change the school's accent; saves to the tenant + reloads */
  (function(){
    function init(){
      var sess = window.NextSession || null;
      var prof = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile()) || (sess && sess.profile) || null;
      if(!document.body){ return setTimeout(init,300); }
      if(!prof || !prof.tenantId){ return setTimeout(init,500); }
      return; /* theme colour now lives in Account -> Settings */
      var cur=(window.__ACCENT)||'#00FC8F';
      var mob = window.matchMedia('(max-width:640px)').matches;
      var wrap=document.createElement('div'); wrap.id='nx-theme-ctrl';
      wrap.style.cssText='position:fixed;right:14px;z-index:99999;bottom:'+(mob?86:16)+'px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-family:Inter,system-ui,sans-serif';
      var panel=document.createElement('div');
      panel.style.cssText='display:none;align-items:center;gap:8px;background:#141e3c;border:1px solid #212d56;border-radius:30px;padding:8px 12px;font-size:12px;color:#aab2d5;box-shadow:0 8px 24px rgba(0,0,0,.45)';
      var lbl=document.createElement('span'); lbl.textContent='Dashboard colour';
      var inp=document.createElement('input'); inp.type='color'; inp.value=cur;
      inp.style.cssText='width:30px;height:30px;border:none;background:none;cursor:pointer;padding:0;border-radius:6px';
      var sv=document.createElement('button'); sv.textContent='Apply'; sv.disabled=true;
      sv.style.cssText='background:'+cur+';color:#04210f;border:none;border-radius:20px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:12px;opacity:.5';
      panel.appendChild(lbl); panel.appendChild(inp); panel.appendChild(sv);
      var tog=document.createElement('button'); tog.type='button'; tog.setAttribute('aria-label','Dashboard colour');
      tog.style.cssText='width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:'+cur+';cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1';
      tog.textContent='🎨';
      tog.addEventListener('click',function(){ panel.style.display=(panel.style.display==='flex')?'none':'flex'; });
      var chosen=cur;
      inp.addEventListener('input',function(){ chosen=inp.value; sv.disabled=false; sv.style.opacity='1'; sv.style.background=chosen; tog.style.background=chosen; });
      sv.addEventListener('click',async function(){
        if(sv.disabled) return; sv.textContent='Saving…'; sv.disabled=true;
        try{
          var b={}; try{ b=JSON.parse(localStorage.getItem('nextos.brand')||'{}'); }catch(e){}
          b.color=chosen; if(!b.name && window.__BRAND_NAME) b.name=window.__BRAND_NAME;
          localStorage.setItem('nextos.brand', JSON.stringify(b));
          if(sess && sess.sb && prof.tenantId){ await sess.sb.from('tenants').update({ primary_color: chosen }).eq('id', prof.tenantId); }
        }catch(e){}
        location.reload();
      });
      wrap.appendChild(panel); wrap.appendChild(tog);
      document.body.appendChild(wrap);
    }
    if(document.readyState!=='loading') init(); else document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
  <script>
  (function () {
    function roleLabel(r) { r = (r || '').toLowerCase(); return ({ head: 'Head Teacher', teacher: 'Teacher', bursar: 'Bursar', admin: 'Administrator', director: 'Director' })[r] || ''; }
    function brand() { try { var b = JSON.parse(localStorage.getItem('nextos.brand') || 'null'); if (b && b.name) return b; } catch (e) {} return { name: (window.__BRAND_NAME) || 'your school', color: '#00fc8f' }; }
    function show() {
      try { if (sessionStorage.getItem('nextos.welcome') !== '1') return; } catch (e) { return; }
      try { sessionStorage.removeItem('nextos.welcome'); } catch (e) {}
      var ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05080f;opacity:0;transition:opacity .3s ease;';

      ov.innerHTML = logoHtml;
      document.body.appendChild(ov);
      requestAnimationFrame(function () { ov.style.opacity = '1'; });
      setTimeout(function () { ov.style.opacity = '0'; }, 800);
      setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); }, 1100);
    }
    var tries = 0;
    (function wait() { tries++; var ready = (window.PEAK_ROLE && window.PEAK_ROLE.getProfile && window.PEAK_ROLE.getProfile() && window.PEAK_ROLE.getProfile().fullName); if (ready || tries > 25) show(); else setTimeout(wait, 160); })();
  })();
  </script>
