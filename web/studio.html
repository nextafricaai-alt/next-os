<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NEXT Studio</title>
<style>
  :root{ --bg:#0a0f24; --panel:#111a36; --panel2:#0d1430; --line:#26315a; --ink:#eef1fb; --ink2:#aab2d5; --ink3:#7e88b0; --mint:#00fc8f; --accent:#3b82f6; --gold:#ffb400; --danger:#ff4757; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif}
  #top{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:nowrap}
  #top input#url{flex:1;min-width:90px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 11px;font-size:13px}
  #top button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
  #top button.publish{background:var(--gold);color:#3a2a00;border:none;font-weight:700}
  #top button.on{background:var(--accent);color:#fff;border:none}
  #brand{font-weight:800;letter-spacing:.04em;color:var(--mint);margin-right:4px;font-size:14px}
  #device button{padding:8px 9px}
  #main{display:flex;height:calc(100% - 54px)}
  #tools{width:240px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel2);overflow:auto;padding-bottom:30px}
  .ph{padding:13px 14px 5px;font-size:10px;font-family:ui-monospace,monospace;color:var(--ink3);text-transform:uppercase;letter-spacing:.12em}
  .fld{padding:3px 14px;display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:11px;color:var(--ink2)}
  .fld select,.fld input[type=number],.fld input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 9px;font-size:13px;width:100%}
  .row{display:flex;gap:6px;padding:5px 14px}
  .row button{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:8px 0;font-size:12.5px;cursor:pointer}
  .row button.act{background:var(--accent);color:#fff;border-color:var(--accent)}
  .row button.danger{border-color:rgba(255,71,87,.5);color:#ff8a96}
  .fld input[type=color]{width:100%;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--bg);cursor:pointer;padding:2px}
  #selInfo{margin:6px 14px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--ink3);font-family:ui-monospace,monospace;min-height:30px}
  #canvasWrap{flex:1;position:relative;background:#0f1530;overflow:auto}
  #frame{width:100%;height:100%;border:0;background:#fff;display:block}
  #drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:14px;background:var(--bg);text-align:center;padding:20px}
  #side{width:312px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  #sideHead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
  #chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .msg{font-size:13px;line-height:1.5;border-radius:12px;padding:10px 12px;max-width:92%;white-space:pre-wrap;word-wrap:break-word}
  .me{align-self:flex-end;background:var(--accent);color:#fff}
  .nia{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
  #quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
  #quick button{font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:5px 10px;cursor:pointer}
  .applybtn{display:block;margin:2px 0 10px;align-self:flex-start;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(124,58,237,.35)}
  .applybtn:disabled{background:#16a34a;box-shadow:none;cursor:default}
  #composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  #composer textarea{flex:1;resize:none;height:42px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px;font-size:13px;font-family:inherit}
  #composer button{background:var(--mint);color:#062b18;border:none;border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer}

  #rail{position:fixed;left:0;top:0;bottom:0;width:62px;background:#0a1024;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;z-index:50}
  #rail .rlogo{font-weight:900;color:var(--mint);font-size:18px;margin-bottom:8px}
  #rail button{width:48px;height:48px;border-radius:12px;background:transparent;border:1px solid transparent;color:var(--ink2);font-size:19px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1}
  #rail button span{font-size:8px;letter-spacing:.02em;text-transform:uppercase}
  #rail button:hover{color:var(--ink);background:var(--panel)}
  #rail button.on{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border-color:transparent}
  #top, #main{margin-left:62px}
  #modeFrames{position:fixed;left:62px;right:0;top:0;bottom:0;z-index:30;display:none}
  #modeFrames.show{display:block}
  #modeFrames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
  #modeFrames iframe.show{display:block}
  body.mode-website #modeFrames{display:none}
  body.mode-website #top, body.mode-website #main{display:flex}
  body:not(.mode-website) #top .web-only{display:none !important}

</style>
</head>
<body class="mode-website">
  <div id="rail">
    <div class="rlogo">N</div>
    <button id="m-website" class="on" title="Website editor">&#127760;<span>Site</span></button>
    <button id="m-graphics" title="Create graphics from scratch">&#127912;<span>Graphics</span></button>
    <button id="m-intel" title="Nia Intelligence — analyze a site, build a CMS/OS">&#129504;<span>Intel</span></button>
  </div>
  <div id="modeFrames"><iframe id="gfxFrame" data-src="/graphics.html"></iframe><iframe id="intelFrame" data-src="/nia-intel.html"></iframe></div>
  <div id="top">
    <span id="brand">NEXT Studio</span>
    <input class="web-only" id="url" placeholder="https://nextafrica.ai" />
    <button class="web-only" id="load">Load</button>
    <button class="web-only" id="edit" class="on">Edit: on</button>
    <button class="web-only" id="undo" title="Undo">↶</button>
    <button class="web-only" id="redo" title="Redo">↷</button>
    <span class="web-only" id="device" style="display:flex;gap:4px"><button data-w="0" class="on">🖥</button><button data-w="900">▭</button><button data-w="430">▯</button></span>
    <button class="web-only" id="export">Export</button>
    <button class="web-only" id="publish" class="publish">Publish live</button>
  </div>
  <div id="main">
    <div id="tools">
      <div class="ph">Page</div>
      <div class="fld"><select id="pageSel"><option>Load a site…</option></select></div>

      <div class="ph">Typography</div>
      <div class="fld"><label>Font</label><select id="fontSel"></select></div>
      <div class="fld"><label>Size (px)</label><input id="fontSize" type="number" min="8" max="200" /></div>
      <div class="fld"><label>Weight</label><select id="fontWeight"><option value="">—</option><option>300</option><option>400</option><option>500</option><option>600</option><option>700</option><option>800</option></select></div>
      <div class="fld"><label>Line height</label><input id="lineH" type="number" step="0.1" min="0.8" max="3" /></div>
      <div class="fld"><label>Letter spacing (px)</label><input id="letterS" type="number" step="0.5" min="-3" max="20" /></div>
      <div class="row"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button></div>
      <div class="ph">Align</div>
      <div class="row" id="alignRow"><button data-align="left">Left</button><button data-align="center">Center</button><button data-align="right">Right</button></div>

      <div class="ph">Colour</div>
      <div class="fld"><label>Text</label><input id="textColor" type="color" value="#111111" /></div>
      <div class="fld"><label>Background</label><input id="bgColor" type="color" value="#ffffff" /></div>

      <div class="ph">Box</div>
      <div class="fld"><label>Padding (px)</label><input id="padBox" type="number" min="0" max="200" /></div>
      <div class="fld"><label>Margin (px)</label><input id="marBox" type="number" min="0" max="200" /></div>
      <div class="fld"><label>Corner radius (px)</label><input id="radBox" type="number" min="0" max="200" /></div>

      <div class="ph">Link</div>
      <div class="fld"><label>URL (selected link)</label><input id="linkUrl" type="text" placeholder="https://…" /></div>

      <div class="ph">Insert</div>
      <div class="row"><button id="insImg">＋ Image</button></div>
      <div class="row"><button data-add="h2">+ Heading</button><button data-add="p">+ Text</button><button data-add="btn">+ Button</button></div>

      <div class="ph">Element</div>
      <div class="row"><button id="dupEl">Duplicate</button><button id="delEl" class="danger">Delete</button></div>
      <div class="row"><button id="upEl">↑ Move</button><button id="downEl">↓ Move</button></div>

      <div class="ph">Selected</div>
      <div id="selInfo">Click any element on the page to edit it.</div>
    </div>
    <div id="canvasWrap">
      <iframe id="frame" title="Editor canvas"></iframe>
      <div id="drop">Enter a URL above and press Load.</div>
    </div>
    <div id="side">
      <div id="sideHead"><span id="dot"></span><b>Nia</b> <span style="color:var(--ink3);font-size:12px">· design director</span></div>
      <div id="chat"></div>
      <div id="quick">
        <button data-q="I'm about to build/redesign this page. Give me a tight design plan: concept/direction, layout, type scale, colour palette with hex, and the key sections.">Plan a build</button>
        <button data-q="Take over and redesign the hero / top section to an Awwwards-level standard — hierarchy, type, colour, spacing — and apply the changes directly.">Take over hero</button>
        <button data-q="Do a full design polish across the page: fix hierarchy, type pairing and sizes, colour and contrast, and spacing rhythm. Apply the changes.">Polish it</button>
        <button data-q="Suggest a better font pairing and exact sizes for this page, then apply them.">Fonts</button>
        <button data-q="Review this page and list the top 3 things to fix, with specifics.">Review</button>
      </div>
      <div id="composer"><textarea id="msg" placeholder="Ask Nia, or describe a change…"></textarea><button id="send">Ask</button></div>
    </div>
  </div>

<script>
(function(){
  var WK='https://nextos-sentinel.nextafricaai.workers.dev';
  var $=function(id){return document.getElementById(id);};
  var frame=$('frame'), editing=true, loadedUrl='', siteName='', currentEl=null;
  var params=new URLSearchParams(location.search);
  if(params.get('url')) $('url').value=params.get('url');
  siteName=params.get('name')||''; var pid=params.get('pid')||'';
  var FONTS=['(default)','Inter','Poppins','Montserrat','Roboto','Open Sans','Lato','Raleway','Oswald','Playfair Display','Lora','Merriweather','Nunito','Work Sans','DM Sans'];

  function originOf(u){ try{return new URL(u).origin;}catch(e){return '';} }
  function doc(){ try{return frame.contentDocument||frame.contentWindow.document;}catch(e){return null;} }
  function hex(c){ try{ var m=(c||'').match(/\d+/g); if(!m) return null; return '#'+m.slice(0,3).map(function(n){return ('0'+(+n).toString(16)).slice(-2);}).join(''); }catch(e){ return null; } }

  (function(){ var sel=$('fontSel'); FONTS.forEach(function(f){ var o=document.createElement('option'); o.value=(f==='(default)'?'':f); o.textContent=f; sel.appendChild(o); }); })();
  function loadFontInDoc(font){ if(!font) return; var d=doc(); if(!d) return; var id='nxf-'+font.replace(/\W+/g,''); if(d.getElementById(id)) return; var l=d.createElement('link'); l.id=id; l.rel='stylesheet'; l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(font)+':wght@300;400;500;600;700;800&display=swap'; (d.head||d.documentElement).appendChild(l); }

  // ── history ──
  var hist=[], hi=-1, snapT=null, lastSnap=0;
  function snapshot(){ var d=doc(); if(!d||!d.body) return; clearEditMarks(); var html=d.body.innerHTML; if(hist[hi]===html) return; hist=hist.slice(0,hi+1); hist.push(html); if(hist.length>60) hist.shift(); hi=hist.length-1; }
  function snapThrottle(){ var n=Date.now(); if(n-lastSnap>450){ snapshot(); lastSnap=n; } }
  function restore(html){ var d=doc(); if(!d) return; currentEl=null; d.body.innerHTML=html; $('selInfo').textContent='Click any element to edit it.'; }
  function undo(){ if(hi>0){ hi--; restore(hist[hi]); } }
  function redo(){ if(hi<hist.length-1){ hi++; restore(hist[hi]); } }
  function clearEditMarks(){ var d=doc(); if(!d) return; var s=d.querySelector('.nx-sel'); if(s) s.classList.remove('nx-sel'); }

  function loadPage(u){ if(!u) return; loadedUrl=u; $('url').value=u; $('drop').textContent='Loading '+u+' …'; $('drop').style.display='flex'; fetch(WK+'/fetch-page?url='+encodeURIComponent(u)).then(function(r){return r.text();}).then(function(html){ $('drop').style.display='none'; frame.srcdoc=html; }).catch(function(e){ $('drop').textContent='Could not load: '+e.message; }); }
  function loadPages(u){ var o=originOf(u); if(!o) return; fetch(WK+'/site-pages?url='+encodeURIComponent(u)).then(function(r){return r.json();}).then(function(d){ var sel=$('pageSel'); sel.innerHTML=''; (d.pages||[]).forEach(function(p){ var o2=document.createElement('option'); o2.value=p.url; o2.textContent=p.name||p.path; sel.appendChild(o2); }); sel.value=loadedUrl; }).catch(function(){}); }
  $('pageSel').onchange=function(){ loadPage($('pageSel').value); };

  function setEdit(on){ var d=doc(); if(!d) return; editing=on; $('edit').textContent='Edit: '+(on?'on':'off'); $('edit').classList.toggle('on',on); try{ d.designMode=on?'on':'off'; }catch(e){} var id='nx-edit-style', ex=d.getElementById(id); if(on&&!ex){ var st=d.createElement('style'); st.id=id; st.textContent='*{ -webkit-user-select:text !important; user-select:text !important } body{caret-color:#00b56a} .nx-sel{outline:2px solid #00fc8f !important; outline-offset:1px} img:hover{outline:2px solid rgba(0,252,143,.9)!important;cursor:pointer!important}'; (d.head||d.documentElement).appendChild(st); } else if(!on&&ex){ ex.remove(); } try{ $('canvasWrap').style.boxShadow=on?'inset 0 0 0 3px var(--mint)':'none'; }catch(e){} }

  function selectEl(el){ var d=doc(); if(!d||!el||!el.style) return; clearEditMarks(); currentEl=el; if(el.classList) el.classList.add('nx-sel'); var cs=frame.contentWindow.getComputedStyle(el);
    $('fontSize').value=parseInt(cs.fontSize)||'';
    var fam=(cs.fontFamily||'').split(',')[0].replace(/["']/g,'').trim(); var opt=Array.prototype.filter.call($('fontSel').options,function(o){return o.value.toLowerCase()===fam.toLowerCase();})[0]; $('fontSel').value=opt?opt.value:'';
    $('fontWeight').value=(['300','400','500','600','700','800'].indexOf(cs.fontWeight)>=0?cs.fontWeight:'');
    $('lineH').value=(parseFloat(cs.lineHeight)&&parseFloat(cs.fontSize))?(parseFloat(cs.lineHeight)/parseFloat(cs.fontSize)).toFixed(1):'';
    $('letterS').value=(cs.letterSpacing&&cs.letterSpacing!=='normal')?parseFloat(cs.letterSpacing):'';
    var tc=hex(cs.color); if(tc) $('textColor').value=tc; var bc=hex(cs.backgroundColor); if(bc&&cs.backgroundColor.indexOf('rgba(0, 0, 0, 0)')<0) $('bgColor').value=bc;
    $('padBox').value=parseInt(cs.paddingTop)||''; $('marBox').value=parseInt(cs.marginTop)||''; $('radBox').value=parseInt(cs.borderTopLeftRadius)||'';
    var a=el.tagName==='A'?el:(el.closest&&el.closest('a')); $('linkUrl').value=a?(a.getAttribute('href')||''):'';
    var tag=el.tagName.toLowerCase(); var txt=(el.textContent||'').trim().slice(0,38); $('selInfo').textContent='<'+tag+'>'+(txt?' · "'+txt+'"':(el.tagName==='IMG'?' · image':'')); }

  frame.addEventListener('load', function(){ var d=doc(); if(!d) return;
    d.addEventListener('click', function(ev){ if(!editing) return; var t=ev.target; if(t&&t.tagName==='IMG'){ ev.preventDefault(); ev.stopPropagation(); currentEl=t; swapImage(t); return; } if(t&&t.nodeType===1){ selectEl(t); } var a=t&&t.closest&&t.closest('a'); if(a) ev.preventDefault(); }, true);
    d.addEventListener('input', function(){ clearTimeout(snapT); snapT=setTimeout(snapshot,500); });
    setTimeout(function(){ setEdit(true); hist=[]; hi=-1; snapshot(); tagDom(); }, 70);
  });

  function exec(cmd,val){ var d=doc(); if(!d) return; snapThrottle(); try{ frame.contentWindow.focus(); d.execCommand(cmd,false,val||null); }catch(e){} }

  $('fontSel').onchange=function(){ var f=$('fontSel').value; if(f) loadFontInDoc(f); if(currentEl){ snapThrottle(); currentEl.style.fontFamily=f?("'"+f+"', sans-serif"):''; } };
  $('fontSize').oninput=function(){ if(currentEl&&$('fontSize').value){ snapThrottle(); currentEl.style.fontSize=parseInt($('fontSize').value)+'px'; } };
  $('fontWeight').onchange=function(){ if(currentEl&&$('fontWeight').value){ snapThrottle(); currentEl.style.fontWeight=$('fontWeight').value; } };
  $('lineH').oninput=function(){ if(currentEl&&$('lineH').value){ snapThrottle(); currentEl.style.lineHeight=$('lineH').value; } };
  $('letterS').oninput=function(){ if(currentEl&&$('letterS').value!==''){ snapThrottle(); currentEl.style.letterSpacing=parseFloat($('letterS').value)+'px'; } };
  $('textColor').oninput=function(){ if(currentEl){ snapThrottle(); currentEl.style.color=$('textColor').value; } };
  $('bgColor').oninput=function(){ if(currentEl){ snapThrottle(); currentEl.style.backgroundColor=$('bgColor').value; } };
  $('padBox').oninput=function(){ if(currentEl&&$('padBox').value!==''){ snapThrottle(); currentEl.style.padding=parseInt($('padBox').value)+'px'; } };
  $('marBox').oninput=function(){ if(currentEl&&$('marBox').value!==''){ snapThrottle(); currentEl.style.margin=parseInt($('marBox').value)+'px'; } };
  $('radBox').oninput=function(){ if(currentEl&&$('radBox').value!==''){ snapThrottle(); currentEl.style.borderRadius=parseInt($('radBox').value)+'px'; } };
  $('linkUrl').onchange=function(){ if(!currentEl) return; var a=currentEl.tagName==='A'?currentEl:(currentEl.closest&&currentEl.closest('a')); if(a){ snapshot(); a.setAttribute('href',$('linkUrl').value); } };
  Array.prototype.forEach.call(document.querySelectorAll('[data-cmd]'),function(b){ b.onclick=function(){ exec(b.getAttribute('data-cmd')); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-align]'),function(b){ b.onclick=function(){ var a=b.getAttribute('data-align'); if(currentEl){ snapThrottle(); currentEl.style.textAlign=a; } else exec('justify'+a.charAt(0).toUpperCase()+a.slice(1)); Array.prototype.forEach.call(document.querySelectorAll('[data-align]'),function(x){x.classList.toggle('act',x===b);}); }; });

  $('dupEl').onclick=function(){ if(currentEl&&currentEl.parentNode){ snapshot(); var c=currentEl.cloneNode(true); if(c.classList) c.classList.remove('nx-sel'); currentEl.parentNode.insertBefore(c,currentEl.nextSibling); selectEl(c); } };
  $('delEl').onclick=function(){ if(currentEl&&currentEl.parentNode){ snapshot(); currentEl.parentNode.removeChild(currentEl); currentEl=null; $('selInfo').textContent='Deleted. Click another element.'; } };
  $('upEl').onclick=function(){ if(currentEl&&currentEl.previousElementSibling){ snapshot(); currentEl.parentNode.insertBefore(currentEl,currentEl.previousElementSibling); } };
  $('downEl').onclick=function(){ if(currentEl&&currentEl.nextElementSibling){ snapshot(); currentEl.parentNode.insertBefore(currentEl.nextElementSibling,currentEl); } };
  Array.prototype.forEach.call(document.querySelectorAll('[data-add]'),function(b){ b.onclick=function(){ var d=doc(); if(!d) return; snapshot(); var k=b.getAttribute('data-add'); var el; if(k==='btn'){ el=d.createElement('a'); el.href='#'; el.textContent='Button'; el.style.cssText='display:inline-block;padding:12px 24px;background:#00b56a;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;margin:8px 0'; } else { el=d.createElement(k); el.textContent=(k==='h2'?'New heading':'New text — click to edit.'); el.style.margin='10px 0'; } if(currentEl&&currentEl.parentNode){ currentEl.parentNode.insertBefore(el,currentEl.nextSibling); } else { d.body.appendChild(el); } selectEl(el); }; });

  function swapImage(img){ var url=window.prompt('New image URL (Cancel to upload from your computer):', img.src||''); if(url){ snapshot(); img.src=url; return; } var inp=doc().createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=function(){ var f=inp.files[0]; if(!f) return; var rd=new FileReader(); rd.onload=function(){ snapshot(); img.src=rd.result; }; rd.readAsDataURL(f); }; inp.click(); }
  $('insImg').onclick=function(){ var d=doc(); if(!d){ alert('Load a page first.'); return; } if(currentEl&&currentEl.tagName==='IMG'){ swapImage(currentEl); return; } var url=window.prompt('Image URL to insert (Cancel to upload):',''); if(url){ insertImg(url); return; } var inp=d.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=function(){ var f=inp.files[0]; if(!f) return; var rd=new FileReader(); rd.onload=function(){ insertImg(rd.result); }; rd.readAsDataURL(f); }; inp.click(); };
  function insertImg(src){ var d=doc(); snapshot(); var img=d.createElement('img'); img.src=src; img.style.maxWidth='100%'; if(currentEl&&currentEl.parentNode){ currentEl.parentNode.insertBefore(img,currentEl.nextSibling); } else { d.body.appendChild(img); } selectEl(img); }

  $('undo').onclick=undo; $('redo').onclick=redo;
  Array.prototype.forEach.call(document.querySelectorAll('#device button'),function(b){ b.onclick=function(){ var w=b.getAttribute('data-w'); frame.style.width=(w==='0'?'100%':w+'px'); frame.style.margin=(w==='0'?'0':'0 auto'); Array.prototype.forEach.call(document.querySelectorAll('#device button'),function(x){x.classList.toggle('on',x===b);}); }; });

  function currentHtml(){ var d=doc(); if(!d) return ''; clearEditMarks(); var es=d.getElementById('nx-edit-style'); if(es) es.remove(); var h='<!doctype html>\n'+d.documentElement.outerHTML; h=h.replace(/<base[^>]*>/i,''); h=h.replace(/\sclass="nx-sel"/g,''); if(es&&editing) setEdit(true); return h; }
  function exportHtml(){ var d=doc(); if(!d){ alert('Load a page first.'); return; } var blob=new Blob([currentHtml()],{type:'text/html'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(siteName?siteName.replace(/[^a-z0-9]+/gi,'-').toLowerCase():'page')+'-edited.html'; a.click(); }

  function guessPath(u){ try{ var p=new URL(u).pathname; if(p==='/'||p==='') return 'index.html'; p=p.replace(/^\//,''); if(p.endsWith('/')) return p+'index.html'; if(/\.html?$/i.test(p)) return p; return p+'/index.html'; }catch(e){ return 'index.html'; } }
  function normRepo(r){ return String(r||'').trim().replace(/^https?:\/\/github\.com\//i,'').replace(/^github\.com\//i,'').replace(/\.git$/i,'').replace(/^\/+|\/+$/g,''); }
  function pmKey(){ return 'nextos.projectmeta.'+pid; }
  function projMeta(){ if(!pid) return null; try{ return JSON.parse(localStorage.getItem(pmKey())||'null'); }catch(e){ return null; } }
  function saveProj(m){ if(!pid) return; try{ localStorage.setItem(pmKey(), JSON.stringify(m)); }catch(e){} }
  function repoKey(){ return 'nxstudio.repo.'+originOf(loadedUrl); }
  function getRepoCfg(){ var m=projMeta(); if(m&&m.repo) return {repo:m.repo,branch:m.branch||'main',pathMap:m.pathMap||{}}; try{ var c=JSON.parse(localStorage.getItem(repoKey())||'null'); if(c){ c.pathMap=c.pathMap||{}; } return c; }catch(e){ return null; } }
  function publish(){
    var d=doc(); if(!d){ alert('Load a page first.'); return; }
    var cfg=getRepoCfg();
    if(!cfg||!cfg.repo){
      var repo=window.prompt('GitHub repo (owner/name OR full URL):'); if(!repo) return; repo=normRepo(repo);
      var branch=window.prompt('Branch:','main')||'main';
      cfg={repo:repo.trim(),branch:branch.trim(),pathMap:{}};
      if(pid){ var m=projMeta()||{}; m.repo=cfg.repo; m.branch=cfg.branch; m.pathMap=m.pathMap||{}; saveProj(m); }
      else { try{ localStorage.setItem(repoKey(),JSON.stringify(cfg)); }catch(e){} }
    }
    var pn=''; try{ pn=new URL(loadedUrl).pathname; }catch(e){ pn=loadedUrl; }
    var path=(cfg.pathMap&&cfg.pathMap[pn])||null;
    if(!path){ path=window.prompt('File path in the repo for THIS page (remembered after this):', guessPath(loadedUrl)); if(!path) return;
      if(pid){ var mm=projMeta()||{}; mm.repo=cfg.repo; mm.branch=cfg.branch; mm.pathMap=mm.pathMap||{}; mm.pathMap[pn]=path; saveProj(mm); }
      else { var cc=getRepoCfg()||cfg; cc.pathMap=cc.pathMap||{}; cc.pathMap[pn]=path; try{ localStorage.setItem(repoKey(),JSON.stringify(cc)); }catch(e){} }
    }
    cfg.repo=normRepo(cfg.repo); addMsg('Publishing '+path+' to '+cfg.repo+' ('+cfg.branch+')…','nia');
    fetch(WK+'/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repo:cfg.repo,branch:cfg.branch,path:path,html:currentHtml(),message:'Edit via NEXT Studio'})})
      .then(function(r){return r.json();}).then(function(res){ if(res.ok){ addMsg('✓ Published to '+res.repo+' / '+res.path+'. Live in under a minute once the deploy runs.','nia'); } else { addMsg('Publish failed: '+(res.error||'unknown'),'nia'); if(/404|not found|repo/i.test(res.error||'')){ if(pid){ var z=projMeta()||{}; delete z.repo; saveProj(z); } else { try{ localStorage.removeItem(repoKey()); }catch(e){} } } } })
      .catch(function(e){ addMsg('Publish error: '+e.message,'nia'); }); }

  var history=[]; var SYS="You are Nia, NEXT's design director and front-end engineer — a world-class master of graphic design, web design, brand identity, and product/OS interface design. You think at the level of award-winning Awwwards, Dribbble and Behance work and translate that taste into clean, buildable web pages.\n\nYOUR DESIGN MASTERY: visual hierarchy; layout and grid systems (12-col, bento, split, asymmetric); typographic scale and pairing (modular scale, display vs body, 1.25-1.5 ratios); colour theory and accessible contrast (WCAG AA, 60/30/10 rule, tints/shades); spacing rhythm and generous whitespace (8pt system); balance, alignment and Gestalt; purposeful motion and micro-interactions; art direction and imagery; brand consistency; and conversion-focused UX. You know current directions (large expressive type, bento grids, tasteful glassmorphism, soft depth, editorial layouts, motion on scroll) and timeless fundamentals. For OS/admin interfaces you know dashboards, information density, data tables, nav patterns and clarity under load.\n\nHOW YOU WORK IN NEXT STUDIO:\n- When Hudson starts to build or redesign, FIRST propose a tight PLAN: concept/direction, layout, type scale, colour palette (give hex), and the key sections — before changing anything.\n- Be decisive and specific: exact fonts, px sizes, hex colours, spacing — never vague.\n- You have HANDS ON THE CANVAS. When Hudson asks you to make a change, says \\\"take over\\\", \\\"do it\\\", \\\"fix this\\\" or \\\"improve this\\\", you EDIT the page directly by returning an actions block (see ACTIONS). Apply real changes, don't just describe them.\n- Reference the aesthetic of top sources (Awwwards / Dribbble / editorial brands) by naming the pattern to apply. You cannot browse them live; if Hudson shares a reference URL or image, emulate its direction.\n- After acting, say in one line what you changed and why.\n\nACTIONS — to edit the live page, include ONE fenced code block labelled actions containing a JSON array. Target elements by their #id from the PAGE MAP. Each action is one of:\n{\\\"op\\\":\\\"text\\\",\\\"id\\\":12,\\\"value\\\":\\\"New headline\\\"}\n{\\\"op\\\":\\\"style\\\",\\\"id\\\":12,\\\"styles\\\":{\\\"fontFamily\\\":\\\"'Poppins', sans-serif\\\",\\\"fontSize\\\":\\\"54px\\\",\\\"fontWeight\\\":\\\"800\\\",\\\"color\\\":\\\"#0a0a0a\\\",\\\"background\\\":\\\"#fff\\\",\\\"textAlign\\\":\\\"center\\\",\\\"padding\\\":\\\"24px\\\",\\\"margin\\\":\\\"0 0 16px\\\",\\\"borderRadius\\\":\\\"14px\\\",\\\"letterSpacing\\\":\\\"-0.02em\\\",\\\"lineHeight\\\":\\\"1.05\\\"}}\n{\\\"op\\\":\\\"image\\\",\\\"id\\\":7,\\\"src\\\":\\\"https://...\\\"}\nUse camelCase CSS keys. Only include actions you actually intend to apply. Keep prose short and put the real edits in the actions block.\n\nNEXT voice: direct, warm, expert, no jargon.";
  function addMsg(t,c){ var d=document.createElement('div'); d.className='msg '+c; d.textContent=t; $('chat').appendChild(d); $('chat').scrollTop=$('chat').scrollHeight; return d; }
  function pageContext(){ var d=doc(); if(!d) return ''; var t=d.title||''; var heads=Array.prototype.slice.call(d.querySelectorAll('h1,h2,h3')).slice(0,12).map(function(h){return h.tagName+': '+h.textContent.trim();}).join('\n'); var body=(d.body?d.body.innerText:'').replace(/\s+/g,' ').trim().slice(0,2400); return ('URL: '+loadedUrl+'\nTitle: '+t+'\nHeadings:\n'+heads+'\n\nText excerpt:\n'+body).slice(0,3400); }
  function tagDom(){ var d=doc(); if(!d) return; try{ Array.prototype.forEach.call(d.querySelectorAll('[data-nia-id]'),function(e){e.removeAttribute('data-nia-id');}); }catch(e){} var els=d.querySelectorAll('h1,h2,h3,h4,h5,p,a,button,img,li,blockquote,figcaption'); var i=0; Array.prototype.forEach.call(els,function(el){ if(el.tagName!=='IMG'){ var t=(el.textContent||'').trim(); if(!t) return; } el.setAttribute('data-nia-id', String(i++)); }); }
  function domMap(){ var d=doc(); if(!d) return ''; var out=[]; Array.prototype.forEach.call(d.querySelectorAll('[data-nia-id]'),function(el){ var id=el.getAttribute('data-nia-id'); var tag=el.tagName.toLowerCase(); if(tag==='img'){ out.push('#'+id+' <img> '+((el.getAttribute('src')||'').slice(0,46))); } else { var t=(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,64); out.push('#'+id+' <'+tag+'> '+t); } }); return out.slice(0,90).join('\n'); }
  function parseActions(txt){ var re=/```(?:actions|json)?\s*([\s\S]*?)```/gi,m; while((m=re.exec(txt))){ try{ var j=JSON.parse(m[1].trim()); if(Array.isArray(j)&&j.length&&j[0]&&j[0].op) return j; }catch(e){} } return null; }
  function applyActions(acts){ var d=doc(); if(!d) return 0; snapshot(); var n=0; acts.forEach(function(a){ var el; try{ el=d.querySelector('[data-nia-id="'+a.id+'"]'); }catch(e){} if(!el) return; try{ if(a.op==='text'&&a.value!=null){ el.textContent=a.value; n++; } else if(a.op==='style'&&a.styles){ Object.keys(a.styles).forEach(function(k){ try{ el.style[k]=a.styles[k]; }catch(e){} }); n++; } else if(a.op==='image'&&a.src){ if(el.tagName==='IMG'){ el.src=a.src; } else { var im=el.querySelector&&el.querySelector('img'); if(im) im.src=a.src; else el.style.backgroundImage="url('"+a.src+"')"; } n++; } }catch(e){} }); snapshot(); return n; }
  function ask(text){ if(!text) return; addMsg(text,'me'); history.push({role:'user',content:text}); var th=addMsg('thinking\u2026','nia'); tagDom(); var sys=SYS+'\n\nPAGE MAP (target elements by #id):\n'+domMap()+'\n\nCURRENT PAGE CONTEXT:\n'+pageContext(); fetch(WK+'/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sys,messages:history})}).then(function(r){return r.json();}).then(function(data){ var txt=''; if(data&&data.content&&data.content.length){ txt=data.content.filter(function(c){return c.type==='text';}).map(function(c){return c.text;}).join(''); } else if(data&&data.error){ txt='Error: '+data.error; } else { txt=typeof data==='string'?data:JSON.stringify(data).slice(0,300); } var acts=parseActions(txt); var disp=txt.replace(/```(?:actions|json)?[\s\S]*?```/gi,'').replace(/\n{3,}/g,'\n\n').trim(); th.textContent=disp||txt||'(no reply)'; history.push({role:'assistant',content:txt}); if(acts&&acts.length){ var b=document.createElement('button'); b.className='applybtn'; b.textContent='\u2728 Apply Nia\u2019s changes ('+acts.length+')'; b.onclick=function(){ var n=applyActions(acts); b.textContent='\u2713 Applied '+n+' change'+(n===1?'':'s'); b.disabled=true; }; th.parentNode.insertBefore(b, th.nextSibling); $('chat').scrollTop=$('chat').scrollHeight; } }).catch(function(e){ th.textContent='Could not reach Nia: '+e.message; }); }

  $('load').onclick=function(){ var u=$('url').value.trim(); loadedUrl=u; loadPage(u); loadPages(u); };
  $('url').addEventListener('keydown',function(e){ if(e.key==='Enter') $('load').click(); });
  $('edit').onclick=function(){ setEdit(!editing); };
  $('export').onclick=exportHtml; $('publish').onclick=publish;
  function setMode(m){ document.body.className='mode-'+m; var mf=$('modeFrames'); ['website','graphics','intel'].forEach(function(x){ var b=$('m-'+x); if(b) b.classList.toggle('on', x===m); }); if(m==='website'){ mf.classList.remove('show'); } else { mf.classList.add('show'); var fr = m==='graphics'?$('gfxFrame'):$('intelFrame'); if(fr && !fr.src){ fr.src=fr.getAttribute('data-src'); } $('gfxFrame').classList.toggle('show', m==='graphics'); $('intelFrame').classList.toggle('show', m==='intel'); } }
  $('m-website').onclick=function(){ setMode('website'); };
  $('m-graphics').onclick=function(){ setMode('graphics'); };
  $('m-intel').onclick=function(){ setMode('intel'); };
  (function(){ var qp=new URLSearchParams(location.search); var im=qp.get('mode'); if(im==='graphics'||im==='intel'){ setMode(im); } })();
  $('send').onclick=function(){ var v=$('msg').value.trim(); if(v){ ask(v); $('msg').value=''; } };
  $('msg').addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); $('send').click(); } });
  Array.prototype.forEach.call(document.querySelectorAll('#quick button'),function(b){ b.onclick=function(){ ask(b.getAttribute('data-q')); }; });
  document.addEventListener('keydown',function(e){ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); } });

  addMsg('Hi Hudson — load a page, click any element, and the left panel becomes its editing tools: font, size, weight, line-height, colours, spacing, corners, links, plus add/duplicate/delete blocks and device preview. Undo with Ctrl+Z. Ask me for design help anytime.','nia');
  if($('url').value){ var u=$('url').value.trim(); loadedUrl=u; loadPage(u); loadPages(u); }
})();
