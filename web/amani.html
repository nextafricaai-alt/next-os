<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Amani OS</title>
  
  <link rel="icon" type="image/png" href="uploads/NEXT Favicon Transperent Logo@3x.png">
  <link rel="apple-touch-icon" href="uploads/NEXT Favicon Transperent Logo@3x.png">
  
  <link rel="manifest" href="amani-manifest.json">
  <meta name="theme-color" content="#00FC8F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Amani">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://jsmpeg.com/jsmpeg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-deepest: #F4F7FB; /* Soft baby blue/grey */
      --bg-deep: #FFFFFF;
      --bg-primary: #FFFFFF;
      --bg-elevated: #FFFFFF;
      --bg-surface: #FFFFFF;
      --bg-hover: #F8FAFC;
      --border-subtle: rgba(0,0,0,0.04);
      --border-default: rgba(0,0,0,0.08);
      --border-active: rgba(6,214,160,0.4);
      --text-primary: #334155;
      --text-secondary: #64748B;
      --text-tertiary: #94A3B8;
      --text-inverse: #FFFFFF;
      --mint: #06D6A0; /* Playful Teal */
      --mint-dim: #05B586;
      --mint-glow: rgba(6,214,160,0.15);
      --mint-glow-strong: rgba(6,214,160,0.3);
      --emerald: #118AB2; /* Playful Blue */
      --emerald-dim: #0E7496;
      --gold: #FFD166; /* Sunny Yellow */
      --gold-dim: #E0B554;
      --gold-glow: rgba(255,209,102,0.2);
      --danger: #EF476F; /* Coral Pink */
      --warning: #F78C6B;
      --info: #118AB2;
      --font-display: 'Fredoka', sans-serif;
      --font-body: 'Nunito', sans-serif;
      --font-mono: 'DM Mono', monospace;
      --radius-sm: 16px;
      --radius-md: 24px;
      --radius-lg: 32px;
      --radius-pill: 9999px;
      --shadow-soft: 0 12px 24px -6px rgba(0, 0, 0, 0.04), 0 8px 12px -4px rgba(0, 0, 0, 0.02);
      --shadow-float: 0 20px 32px -8px rgba(0, 0, 0, 0.08), 0 12px 16px -4px rgba(0, 0, 0, 0.04);
    }
    body { 
      font-family: var(--font-body); 
      background-color: var(--bg-deepest); 
      color: var(--text-primary); 
      margin: 0; 
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(255, 209, 102, 0.15) 0%, transparent 40%), 
        radial-gradient(circle at 90% 90%, rgba(6, 214, 160, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(239, 71, 111, 0.08) 0%, transparent 60%);
      background-attachment: fixed;
    }
    #root { min-height: 100vh; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.4); } 70% { transform: scale(1.02); box-shadow: 0 0 0 6px rgba(255, 71, 87, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React & Babel -->
  <script src="vendor/react.development.js"></script>
  <script src="vendor/react-dom.development.js"></script>
  <script src="vendor/babel.min.js"></script>

  <!-- Shared components required by os-childcare.jsx -->
  <script type="text/babel">
    const useWindowSize = () => {
      const [size, setSize] = React.useState([window.innerWidth, window.innerHeight]);
      React.useEffect(() => {
        const handleResize = () => setSize([window.innerWidth, window.innerHeight]);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);
      return size;
    };
  </script>

  <!-- Load Amani OS Component -->
  <script type="text/babel" src="os-childcare.jsx"></script>

  <!-- Mount Component -->
  <script type="text/babel">
    const renderApp = () => {
      if (window.ChildcareOSPage) {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<window.ChildcareOSPage onNavigate={() => {}} />);
      } else {
        setTimeout(renderApp, 50);
      }
    };
    renderApp();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
