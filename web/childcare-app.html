<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charis Childcare OS</title>
  <link rel="icon" type="image/png" href="../../uploads/NEXT Favicon Transperent Logo@3x.png">
  <link rel="manifest" href="amani-manifest.json">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-deepest: #060012;
      --bg-deep: #0A001A;
      --bg-primary: #140035;
      --bg-elevated: #1A0042;
      --bg-surface: #220055;
      --bg-hover: #2A0068;
      --border-subtle: rgba(255,255,255,0.06);
      --border-default: rgba(255,255,255,0.1);
      --border-active: rgba(0,252,143,0.3);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255,255,255,0.65);
      --text-tertiary: rgba(255,255,255,0.4);
      --text-inverse: #140035;
      --mint: #00FC8F;
      --font-display: 'Big Shoulders Display', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }
    html { font-family: var(--font-body); background: var(--bg-deepest); color: var(--text-primary); }
    body { min-height: 100vh; overflow-x: hidden; padding: 40px; }
    
    /* Simulate the NEXT OS container constraints for the standalone app */
    #root {
      max-width: 1200px;
      margin: 0 auto;
    }
  </style>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Load the shared Childcare UI component -->
  <script type="text/babel" src="./os-childcare.jsx"></script>

  <script type="text/babel">
    // Wait for the component to attach to window
    setTimeout(() => {
      const ChildcareOSPage = window.ChildcareOSPage;
      if (ChildcareOSPage) {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        // We pass a dummy onNavigate to prevent crashes when clicking "Talk to Nia"
        root.render(<ChildcareOSPage onNavigate={() => alert("Nia chat would open here in the full platform.")} />);
      } else {
        document.getElementById('root').innerHTML = '<div style="color:red">Failed to load ChildcareOSPage component.</div>';
      }
    }, 100);

    // PWA Install Button Logic
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Expose globally so React can bind a button to it
      window.triggerPWAInstall = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            console.log('User accepted the install prompt');
          }
          deferredPrompt = null;
        } else {
          alert('Install prompt is not available yet, or app is already installed.');
        }
      };
      
      // Dispatch an event so React knows it's installable
      window.dispatchEvent(new Event('pwa-installable'));
    });
  </script>
</body>
</html>
