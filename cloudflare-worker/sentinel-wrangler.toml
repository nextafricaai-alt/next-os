name = "nextos-sentinel"
main = "sentinel-worker.js"
compatibility_date = "2025-01-01"
account_id = "b5aecdced030bf84d0a1fb6dcec80e09"
keep_vars = true   # do NOT delete dashboard vars/secrets on deploy

[ai]
binding = "AI"

[triggers]
# Times are UTC. Uganda is UTC+3, so subtract 3 hours from the local time.
crons = [
  "30 3 * * *",     # Morning brief: 6:30 AM EAT (Mon-Sun)
  "0 6,9,12 * * 1-5",  # Pulse checks: 9am, noon, 3pm EAT, Mon-Fri
  "*/5 5-12 * * 1-5",  # School-hours watcher: lesson reminders every 5 min + no-show check every 15 min, Mon-Fri
  "*/30 * * * *",     # System health heartbeat: every 30 min, 24/7
  "0 15 * * 5",     # Weekly wrap: Friday 6pm EAT
]

[[kv_namespaces]]
binding = "BRIEFS_KV"
# Run: wrangler kv namespace create BRIEFS_KV --config sentinel-wrangler.toml
# Then paste the returned id below:
id = "268488c90a1c4aabaf8e37b1d8922b73"
